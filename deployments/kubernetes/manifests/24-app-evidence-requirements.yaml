# Evidence Requirements Service — 03-microservices.md §8.6.
#
# Namespace zoiko-governance: this is the seventh and final Governance
# Platform service (§5.1), so it belongs with policy/authorization/workflow
# rather than in a domain namespace.
#
# Two deliberate notes for whoever applies this:
#
#  1. readinessProbe targets /readyz, not /healthz. Most manifests in this
#     directory point readiness at /healthz, which only proves the process is
#     alive — it will report Ready while Postgres is unreachable. This service
#     exposes a real /readyz that pings the pool, so readiness uses it. If the
#     rest of the directory is normalised later, normalise toward this.
#  2. DOCUMENT_VAULT_SERVICE_URL below assumes a document-vault-svc Service in
#     zoiko-evidence. As of 2026-07-27 no manifest for that service exists in
#     this directory (it is one of several services with a compose entry but no
#     K8s manifest), so this value will NXDOMAIN until one is added. Stated
#     rather than left to be discovered at runtime: on a K8s deployment, every
#     SUPPORTING_DOCUMENT verification will fail closed (503) until then.
apiVersion: v1
kind: Service
metadata:
  name: evidence-requirements-svc
  namespace: zoiko-governance
  labels:
    app: evidence-requirements-svc
spec:
  ports:
  - port: 8130
    targetPort: 8130
    name: http
  selector:
    app: evidence-requirements-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-requirements-svc
  namespace: zoiko-governance
  labels:
    app: evidence-requirements-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evidence-requirements-svc
  template:
    metadata:
      labels:
        app: evidence-requirements-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: evidence-requirements-svc
        image: evidence-requirements-svc:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8130
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: PORT
          value: "8130"
        - name: DB_HOST
          value: "postgres.zoiko-infra.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "evidence_requirements"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: DB_SSLMODE
          value: "disable"
        - name: KAFKA_BROKERS
          value: "kafka.zoiko-infra.svc.cluster.local:9092"
        - name: KAFKA_GROUP_ID
          value: "evidence-requirements-svc"
        - name: KAFKA_EVENTS_TOPIC
          value: "zoiko.evidence-requirements.events"
        # In-cluster DNS names. Config defaults are the compose short names,
        # which would NXDOMAIN inside K8s — override explicitly here.
        - name: AUTHZ_SERVICE_URL
          value: "http://authorization-svc.zoiko-governance.svc.cluster.local:8089"
        # See note 2 in the header comment: no manifest for this Service
        # exists yet.
        - name: DOCUMENT_VAULT_SERVICE_URL
          value: "http://document-vault-svc.zoiko-evidence.svc.cluster.local:8094"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.zoiko-infra.svc.cluster.local:4318"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8130
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8130
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
