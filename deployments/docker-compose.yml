  # ── goods-service-receipt-svc (Port: 8157) ───────────────────────────────
  # AP-04 of the Procurement/Expenses/Accounts Payable baseline — Goods/
  # Service Receipt. The missing three-way-match link between
  # purchase-order-svc (AP-03) and invoice-approval-svc (AP-05/06). Two
  # scope decisions were made because the upstream data the spec assumes
  # doesn't exist: purchase-order-svc has no PO-line/quantity model and only
  # ISSUED/CLOSED statuses (no CANCELLED), so over-receipt tolerance is
  # enforced at the aggregate-amount level against the PO's own
  # total_amount, not per line — see internal/domain's package doc. GRNI
  # accounting posts a real, idempotent journal entry to general-ledger-svc
  # (correlation_id = receipt_id) but is deliberately best-effort: any
  # posting failure is recorded as a visible EXCEPTION accounting event and
  # never blocks or reverses the underlying receipt confirmation, matching
  # the spec's own stated failure semantics verbatim.
  goods-service-receipt-svc:
    build:
      context: ../services/goods-service-receipt-svc
      dockerfile: Dockerfile
    container_name: goods-service-receipt-svc
    mem_limit: 256m
