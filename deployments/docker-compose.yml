  # list has no Authorize/Reject command — those belong to AP-10, a
  # distinct, unbuilt service — so this only ever reaches FROZEN.
  # UPDATE: both source types now go through one unified AP-08 client,
  # replacing the original direct calls to accounts-payable-svc and
  # expense-claim-svc — neither is called from this service anymore. This
  # closes a real parity gap: either source type now gets the same
  # ExceptionRef hold-override path from AP-08's own IsHeld/IsDisputed
  # fields, not just AP_INVOICE as before. supplier-financial-profile-svc's
  # real ON_HOLD status remains an ADDITIONAL, supplier-level hold signal
  # for AP_INVOICE items specifically (AP-08 only knows about one payable
  # at a time, not the supplier's overall standing) and its updated_at is
  # the only staleness signal (no version column exists) — both checked
  # live again at Freeze time, not just at selection time.
  # tax-determination-svc's real endpoint computes withholding, never
  # inferred. BNK account/cash availability has no live endpoint anywhere
  # in this codebase (checked directly) — PayingBankAccountRef is an
  # opaque, caller-supplied reference, same doctrine as AP-01's
  # PayeeReference. FreezePaymentProposal requires a principal distinct
  # from the proposal's own preparer via authorization-svc's dynamic
  # own-object SoD layer — the fourth reuse of that feature this session.
  payment-proposal-svc:
    build:
      context: ../services/payment-proposal-svc
      dockerfile: Dockerfile
    container_name: payment-proposal-svc
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8159:8159"
    environment:
      PORT: "8159"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/payment_proposal?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.payment-proposal.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
      PAYABLE_OPEN_ITEM_SERVICE_URL: "http://payable-open-item-svc:8164"
      SUPPLIER_PROFILE_SERVICE_URL: "http://supplier-financial-profile-svc:8156"
      TAX_DETERMINATION_SERVICE_URL: "http://tax-determination-svc:8126"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
      payable-open-item-svc:
        condition: service_healthy
      supplier-financial-profile-svc:
        condition: service_healthy
      tax-determination-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # ── payment-authorization-svc (Port: 8160) ───────────────────────────────
  # AP-10 of the Procurement/Expenses/Accounts Payable baseline — Payment
  # Authorization. The first real consumer of payment-proposal-svc's FROZEN
  # state and GetFingerprint endpoint (both built specifically last session
  # so a real downstream authorization step could exist). Re-verifies the
  # proposal's fingerprint and each payee's identity live at BOTH approval
  # and consumption time — later checkpoints than AP-09 ever had the chance
  # to check — moving to INVALIDATED on any mismatch. policy-svc's real
  # APPROVAL_THRESHOLD evaluation is reused as AP-10's own delegated
  # signing limit; a signer without PAYMENT_AUTHORIZE_HIGHVALUE cannot
  # approve a payment policy-svc flags as requiring escalation.
  # RequestPaymentAuthorization/ApprovePayment both require a principal
  # distinct from the proposal's own preparer via authorization-svc's
  # dynamic own-object SoD layer — the fifth reuse of that feature this
  # session. ConsumePaymentAuthorization has no real caller yet (AP-11
  # "Payment Run" does not exist), but is implemented fully and honestly,
  # including its replay protection, so it is ready the moment AP-11 exists.
  payment-authorization-svc:
    build:
      context: ../services/payment-authorization-svc
      dockerfile: Dockerfile
    container_name: payment-authorization-svc
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8160:8160"
    environment:
      PORT: "8160"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/payment_authorization?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.payment-authorization.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
      PAYMENT_PROPOSAL_SERVICE_URL: "http://payment-proposal-svc:8159"
      SUPPLIER_PROFILE_SERVICE_URL: "http://supplier-financial-profile-svc:8156"
      POLICY_SERVICE_URL: "http://policy-svc:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
      payment-proposal-svc:
        condition: service_healthy
      supplier-financial-profile-svc:
        condition: service_healthy
      policy-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # ── payment-run-svc (Port: 8161) ─────────────────────────────────────────
  # AP-11 of the Procurement/Expenses/Accounts Payable baseline — Payment
  # Run. IMPORTANT SCOPE NOTE: a direct search of this entire codebase
  # (banking-connector-svc, bank-reconciliation-svc, treasury-svc) found no
  # real endpoint anywhere that initiates an outbound payment to an
  # external bank/provider, and no real webhook/callback receiver for a
  # provider's status response — confirmed with the user before building
  # this service at all rather than fabricating a fake bank integration.
  # UPDATE: this gap is now half-closed. SubmitPaymentRun really hands every
  # instruction to BNK-06 (PrepareAttempt+SubmitAttempt) and records the
  # canonical execution record with BNK-07 (RecordPaymentStatus) before
  # transitioning the run itself — the first real caller of either service
  # anywhere in this codebase. PollInstructionStatus (new) then reconciles
  # from BNK-07's own real GetPaymentStatus, rather than only accepting a
  # caller's word for it (ReconcilePaymentRunStatus, kept as a deliberate
  # manual-override path). What's still honestly stubbed: BNK-06's own
  # Provider Adapter behind that call — no real bank/PSP network call
  # exists anywhere in this codebase; see payment-initiation-adapter-svc's
  # own package doc. What else IS real: this is also the FIRST real caller
  # of payment-authorization-svc's ConsumeAuthorization anywhere in this
  # codebase (a gap AP-10 itself documented as having no caller yet),
  # cross-tenant payables are blocked for real via a live AP-10 lookup on
  # every authorization named, and idempotency (replay-after-timeout,
  # replayed-provider-event) is enforced via genuine database uniqueness
  # constraints throughout.
  payment-run-svc:
    build:
      context: ../services/payment-run-svc
      dockerfile: Dockerfile
    container_name: payment-run-svc
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8161:8161"
    environment:
      PORT: "8161"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/payment_run?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.payment-run.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
      PAYMENT_AUTHORIZATION_SERVICE_URL: "http://payment-authorization-svc:8160"
      PAYMENT_INITIATION_ADAPTER_URL: "http://payment-initiation-adapter-svc:8162"
      PAYMENT_STATUS_SERVICE_URL: "http://payment-status-svc:8163"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
      payment-authorization-svc:
        condition: service_healthy
      payment-initiation-adapter-svc:
        condition: service_healthy
      payment-status-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # ── payment-initiation-adapter-svc (Port: 8162) ──────────────────────────
  # BNK-06 of the Banking, Cash & Treasury baseline — Payment Initiation
  # Adapter. The Banking spec names "Provider Adapter" as a dependency but
  # never gives it its own contract anywhere — it is the genuinely
  # pluggable point where a real bank/PSP integration would be
  # implemented. This service defines that boundary as a real Go interface
  # and ships a real, clearly-labeled StubProviderAdapter behind it —
  # deterministic, never disguised as a real bank connection. What IS real:
  # durable-attempt-before-network-call by construction, structural
  # impossibility of "provider timeout triggers new payment ID" (retry
  # reuses the same attempt/idempotency key), and immutable authorized
  # fields once prepared.
  payment-initiation-adapter-svc:
    build:
      context: ../services/payment-initiation-adapter-svc
      dockerfile: Dockerfile
    container_name: payment-initiation-adapter-svc
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8162:8162"
    environment:
      PORT: "8162"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/payment_initiation_adapter?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.payment-initiation.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # ── payment-status-svc (Port: 8163) ──────────────────────────────────────
  # BNK-07 of the Banking, Cash & Treasury baseline — Payment Status &
  # Confirmation. Unlike BNK-06, this service's central capability IS fully
  # real: a genuine HMAC-SHA256 signature-verified webhook receiver at
  # POST /bnk07/webhooks/provider-callback. There is no real bank/PSP
  # sending callbacks in this environment, but the receiving side's
  # security, ordering (a governed final state can never regress — only
  # RecordReturn may move SETTLED to RETURNED) and idempotency (a real
  # database uniqueness constraint on payment_id+provider_event_ref) logic
  # is exactly what a real provider integration would need. Swapping in a
  # real provider means pointing its webhook config at this endpoint and
  # sharing its signing secret via WEBHOOK_SHARED_SECRET below — nothing
  # else changes. WEBHOOK_SHARED_SECRET's default is dev-only and must be
  # replaced before any real provider is ever connected.
  payment-status-svc:
    build:
      context: ../services/payment-status-svc
      dockerfile: Dockerfile
    container_name: payment-status-svc
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8163:8163"
    environment:
      PORT: "8163"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/payment_status?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.payment-status.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
      WEBHOOK_SHARED_SECRET: "dev-only-shared-secret-replace-before-any-real-integration"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # ── metric-registry-svc (Port: 8149) ────────────────────────────────────
  # doc7 §27 REP-01 / backlog item 35: versioned report_metric_definitions
  # — defines what an executive metric IS and MEANS; never computes or
  # stores metric values itself.
  metric-registry-svc:
    build:
      context: ../services/metric-registry-svc
      dockerfile: Dockerfile
    container_name: metric-registry-svc
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8149:8149"
    environment:
      PORT: "8149"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/metric_registry?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.metric-registry.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # ── source-authority-svc (Port: 8150) ───────────────────────────────────
  # doc7 §D1-D3, §K1 / backlog item 36: source_authority_maps (versioned
  # precedence per field family) + append-only normalized_facts. Resolve
  # returns the highest-precedence current fact, or Ambiguous=true if two
  # equally-ranked sources disagree — never guesses (§D2).
  source-authority-svc:
    build:
      context: ../services/source-authority-svc
      dockerfile: Dockerfile
    container_name: source-authority-svc
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8150:8150"
    environment:
      PORT: "8150"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/source_authority?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.source-authority.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

volumes:
  postgres_data:
