  # ── privacy-consent-svc (Port: 8152) ─────────────────────────────────────
  # PRV-02 of ZS-SVC-W-001 — Notice, Consent & Preference Evidence Service.
  # Owns notices/notice_versions (DRAFT -> APPROVED -> PUBLISHED, with
  # SUPERSEDED as a side effect of publishing a successor and WITHDRAWN as
  # a direct action) and four append-only evidence logs (presentation
  # receipts, consent receipts, withdrawal receipts, preference
  # assertions). Every consent's purpose_id is checked against a live call
  # to privacy-purpose-registry-svc — see PURPOSE_REGISTRY_URL below.
  privacy-consent-svc:
    build:
      context: ../services/privacy-consent-svc
