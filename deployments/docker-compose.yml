  # ── privacy-decision-svc (Port: 8153) ────────────────────────────────────
  # PRV-03 of ZS-SVC-W-001 — Purpose Binding & Runtime Data-Use Decision
  # Service. The full spec names five outcomes (PERMIT/RESTRICT/BLOCK/
  # REVIEW_REQUIRED/INDETERMINATE); this version only ever produces
  # PERMIT/BLOCK/INDETERMINATE — RESTRICT and REVIEW_REQUIRED need a PDC
  # (jurisdiction-specific lawful-basis) rules engine that doesn't exist
  # anywhere in this codebase, same gap already documented on PRV-01.
  # What it DOES check is real: activity ACTIVE + purpose PUBLISHED in
  # PRV-01, the proposed purpose actually bound to that activity (PRV-C01,
  # purpose limitation), and two opt-in caller-declared checks — consent
  # GRANTED in PRV-02 (PRV-C04) and no blocking legal hold in
  # retention-registry-svc (using the caller's own real record_class,
  # never an invented one). Any unreachable dependency fails the whole
  # decision closed as INDETERMINATE.
  privacy-decision-svc:
    build:
      context: ../services/privacy-decision-svc
      dockerfile: Dockerfile
    container_name: privacy-decision-svc
    mem_limit: 256m
    cpus: "0.5"
    ports:
