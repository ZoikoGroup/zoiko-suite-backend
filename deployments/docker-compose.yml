      DB_PASSWORD: zoiko_app_password
      DB_SSLMODE: disable
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.evidence.events"
      GOVERNANCE_DECISION_LOG_SERVICE_URL: "http://governance-svc:8083"
