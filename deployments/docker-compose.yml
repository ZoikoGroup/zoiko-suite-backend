    environment:
      PORT: "8153"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/privacy_decision?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
