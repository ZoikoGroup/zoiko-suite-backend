      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_SSLMODE: disable
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.evidence-requirements.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
      DOCUMENT_VAULT_SERVICE_URL: "http://document-vault-svc:8094"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
      document-vault-svc:
        condition: service_healthy
    healthcheck:
