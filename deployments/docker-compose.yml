      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.expense-claim.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
      EMPLOYEE_MASTER_SERVICE_URL: "http://employee-master-svc:8108"
      DOCUMENT_VAULT_SERVICE_URL: "http://document-vault-svc:8094"
      TAX_DETERMINATION_SERVICE_URL: "http://tax-determination-svc:8126"
      POLICY_SERVICE_URL: "http://policy-svc:8085"
      PAYABLE_OPEN_ITEM_SERVICE_URL: "http://payable-open-item-svc:8164"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
      employee-master-svc:
        condition: service_healthy
      document-vault-svc:
        condition: service_healthy
      tax-determination-svc:
        condition: service_healthy
      policy-svc:
        condition: service_healthy
      payable-open-item-svc:
        condition: service_healthy
