      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/goods_service_receipt?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.goods-service-receipt.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
      PURCHASE_ORDER_SERVICE_URL: "http://purchase-order-svc:8129"
      GENERAL_LEDGER_SERVICE_URL: "http://general-ledger-svc:8098"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
      purchase-order-svc:
        condition: service_healthy
      general-ledger-svc:
        condition: service_healthy
