      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # ── privacy-rights-svc (Port: 8154) ──────────────────────────────────────
  # PRV-04 of ZS-SVC-W-001 — Data Rights, Complaint & Disclosure Control
  # Service. Owns ONLY the privacy meaning and evidence of a rights
  # request (case intake, identity-assurance evidence, discovery-manifest
  # evidence, closure/outcome) — per the spec's own §14.1 ownership line,
  # long-running task/deadline/approval orchestration belongs to
  # workflow-svc ("WFC") and search/correction/export/erasure belongs to
  # each domain service's own adapter, neither of which this service
  # performs. wfc_process_ref is an optional, caller-supplied field, never
  # created by this service — workflow-svc's real CreateWorkflow contract
  # requires naming a concrete approver per stage up front, which this
  # service has no legitimate way to know at intake. The one substantive
  # rule enforced is the spec's own DISCLOSURE GATE (§15.2): a request can
  # only close as FULFILLED if identity has been verified AND at least
  # one discovery manifest was recorded.
  privacy-rights-svc:
    build:
      context: ../services/privacy-rights-svc
      dockerfile: Dockerfile
    container_name: privacy-rights-svc
    mem_limit: 256m
    cpus: "0.5"
