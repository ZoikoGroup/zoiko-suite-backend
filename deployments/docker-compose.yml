      DB_SSLMODE: disable
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.accounts-receivable.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
      LEDGER_SERVICE_URL: "http://general-ledger-svc:8098"
      # Every write reconciles its legal_entity_id against the caller's verified
      # tenant here, and fails closed if this is unreachable.
      TENANT_REGISTRY_URL: "http://tenant-entity-registry-svc:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
      general-ledger-svc:
        condition: service_healthy
      # The compose KEY is `tenant-svc`; `tenant-entity-registry-svc` is only its
      # container_name. depends_on takes the key, while TENANT_REGISTRY_URL above
      # takes the container name because that is what resolves in DNS — so the two
      # spellings are both correct and are not interchangeable. Same trap as
      # jurisdiction-svc / jurisdiction-rules-svc.
      tenant-svc:
        condition: service_healthy
    healthcheck:
      # readyz, not healthz. Liveness answers 200 whenever the process is up, so a
      # service whose database is gone reports healthy to `docker ps` and to every
      # depends_on waiting on it — the shape that had clause-template-svc,
      # obligation-tracking-svc and corporate-actions-svc all looking healthy while
      # returning 500 to every read. Readiness checks the pool.
      #
      # Every gap-closed service in this file now points at /readyz. The rest still
      # point at /healthz: changing those is a platform-wide decision and belongs
      # with whoever owns them.
      test: ["CMD", "/healthcheck", "http://localhost:8101/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

