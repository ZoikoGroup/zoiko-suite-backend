      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/privacy_rights?sslmode=disable"
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_EVENTS_TOPIC: "zoiko.privacy-rights.events"
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      authorization-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  # ── privacy-transfer-svc (Port: 8155) ────────────────────────────────────
  # PRV-05 of ZS-SVC-W-001 — Processor, Subprocessor & Transfer Privacy
  # Control. The last of the domain's five services. TransferMechanism is
  # a directly-registered record (a real legal/compliance reviewer enters
  # the mechanism, validity window and evidence), NOT a resolved PDC
  # catalogue entry — no PDC exists anywhere in this codebase, same gap
  # already documented on PRV-01/PRV-03. Whether a DPIA/TIA is required
  # is an opt-in, caller-declared input to transfer-decision evaluation,
  # never inferred. §17.2's fail-closed rule is encoded literally: a
  # missing/expired/rejected assessment or an expired mechanism returns
  # BLOCKED or REVIEW_REQUIRED — never a silent AUTHORIZED. CONDITIONAL
  # (the fourth TransferAuthorization value, needing machine-enforceable
  # transfer conditions) is defined in the wire contract but never
  # produced, same reasoning as PRV-03's RESTRICT.
  privacy-transfer-svc:
    build:
      context: ../services/privacy-transfer-svc
      dockerfile: Dockerfile
    container_name: privacy-transfer-svc
    mem_limit: 256m
    cpus: "0.5"
