  # Decision Support Service — 03-microservices.md §15.5. Provides governed
  # recommendations at approval/oversight points; previously unbuilt, and
  # the spec lists no owned objects or events for it at all. Scope chosen:
  # recommendations are grounded in real historical precedent, computed
  # from a synchronous call to governance-decision-log-svc's real decision
  # history rather than an invented heuristic. Per doctrine §15,
  # intelligence/reporting services fail degraded, not destructive — an
