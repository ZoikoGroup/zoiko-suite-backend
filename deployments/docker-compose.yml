  # ── privacy-purpose-registry-svc (Port: 8151) ───────────────────────────
  # PRV-01 of ZS-SVC-W-001 (Privacy/Consent/Purpose/Data Rights Control).
  # Owns the purpose registry and processing-activity registry/lifecycle
  # (DRAFT -> VALIDATED -> SUBMITTED -> APPROVED -> ACTIVE, with
  # reject/suspend/retire branches). All five ZS-SVC-W-001 services are
  # now built: consent (PRV-02, privacy-consent-svc), the runtime
  # purpose-binding decision (PRV-03, privacy-decision-svc), data
  # rights/complaints (PRV-04, privacy-rights-svc), and processor/
  # transfer control (PRV-05, privacy-transfer-svc below).
  privacy-purpose-registry-svc:
