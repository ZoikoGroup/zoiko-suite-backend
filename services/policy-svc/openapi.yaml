    CreateAttestationRequest:
      type: object
      required: [statement, statement_version, subject_ref, period_start, period_end, signer_role]
      properties:
        attestation_id: {type: string, format: uuid}
        statement: {type: string}
        statement_version: {type: string}
        subject_ref: {type: string}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        signer_role: {type: string}
        evidence_refs: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}

    Attestation:
      type: object
      properties:
        attestation_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid, nullable: true}
        statement: {type: string}
        statement_version: {type: string}
        subject_ref: {type: string}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        signer_principal_id: {type: string}
        signer_role: {type: string}
        signed_at: {type: string, format: date-time}
        evidence_refs: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}
        attestation_status: {type: string}
        revocation_reason: {type: string}
        created_at: {type: string, format: date-time}
        created_by_principal_id: {type: string}

    ImpactAnalysis:
      type: object
      required: [summary, affected_periods, closed_history_unchanged]
      properties:
        summary: {type: string}
        affected_periods: {type: string, enum: [FUTURE_ONLY, OPEN_PERIODS]}
        closed_history_unchanged: {type: boolean, description: 'Must be true: a policy change never restates a closed period.'}
        retroactive_justification: {type: string, description: 'Required when the version takes effect before it is drafted.'}
        notes: {type: string}

    RuleMapping:
      type: object
      required: [ref_kind, ref, ref_version, rationale]
      properties:
        mapping_no: {type: integer, minimum: 1}
        ref_kind: {type: string, description: 'What is depended on: JURISDICTION_PACK, ACCOUNTING_RULE, POLICY_VERSION, ...'}
        ref: {type: string, description: 'For POLICY_VERSION, the id of a version that exists.'}
        ref_version: {type: string, description: 'The version depended on, pinned.'}
        rationale: {type: string}
        maps_to: {type: string}
        depends_on_version_id: {type: string, format: uuid}

    DraftAccountingPolicyRequest:
      type: object
      required: [policy_domain, framework, semantic_version, framework_source, policy_text_ref, impact_analysis, effective_from, rationale]
      properties:
        policy_domain: {type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$'}
        framework: {type: string, description: 'For example IFRS or US_GAAP.'}
        book_id: {type: string, format: uuid, nullable: true, description: 'Omit for every book.'}
        jurisdiction_id: {type: string, format: uuid, nullable: true, description: 'Omit for every jurisdiction.'}
        legal_entity_id: {type: string, format: uuid, nullable: true}
        semantic_version: {type: string, example: 2.1.0}
        precedence: {type: integer, minimum: 0, maximum: 1000, default: 0, description: 'Between equally specific policies that could both apply. Without it such a pair is ambiguous.'}
        framework_source: {type: string, description: 'The standard and paragraph the policy comes from.'}
        policy_text_ref: {type: string, description: 'The approved policy text or rule reference.'}
        rule_mappings:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/RuleMapping'}
        impact_analysis: {$ref: '#/components/schemas/ImpactAnalysis'}
        effective_from: {type: string, format: date-time}
        effective_to: {type: string, format: date-time, nullable: true}
        rationale: {type: string}

    AccountingApplicability:
      type: object
      properties:
        policy_id: {type: string, format: uuid}
        policy_domain: {type: string}
        framework: {type: string}
        book_id: {type: string, format: uuid, nullable: true}
        jurisdiction_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}

    AccountingVersionDetails:
      type: object
      properties:
        semantic_version: {type: string}
        precedence: {type: integer}
        framework_source: {type: string}
        policy_text_ref: {type: string}
        impact_analysis: {$ref: '#/components/schemas/ImpactAnalysis'}

    AccountingPolicyVersion:
      description: A policy version with its accounting content. Every PolicyVersion field is present.
      allOf:
        - $ref: '#/components/schemas/PolicyVersion'
        - type: object
          required: [policy_code, applicability, details, rule_mappings]
          properties:
            policy_code: {type: string}
            applicability: {$ref: '#/components/schemas/AccountingApplicability'}
            details: {$ref: '#/components/schemas/AccountingVersionDetails'}
            rule_mappings:
              type: array
              items: {$ref: '#/components/schemas/RuleMapping'}

    AccountingPin:
      type: object
      description: What a consumer persists with a calculation or posting, so it can be explained and reproduced.
      required: [policy_id, policy_version_id, version_number, semantic_version, artifact_digest, row_version]
      properties:
        policy_id: {type: string, format: uuid}
        policy_version_id: {type: string, format: uuid}
        version_number: {type: integer}
        semantic_version: {type: string}
        artifact_digest: {type: string, description: 'Digest of the version content, covering applicability, details and mappings.'}
        row_version: {type: integer}

    AccountingVersionSummary:
      type: object
      properties:
        pin: {$ref: '#/components/schemas/AccountingPin'}
        policy_domain: {type: string}
        framework: {type: string}
        book_id: {type: string, format: uuid, nullable: true}
        jurisdiction_id: {type: string, format: uuid, nullable: true}
        legal_entity_id: {type: string, format: uuid, nullable: true}
        scope_type: {type: string}
        precedence: {type: integer}
        version_status: {type: string}
        effective_from: {type: string, format: date-time}
        effective_to: {type: string, format: date-time, nullable: true}

    ResolvedAccountingPolicy:
      type: object
      required: [status, blocks_calculation, policy_domain, as_of, known_at, pin, policy]
      properties:
        status: {type: string, enum: [RESOLVED]}
        blocks_calculation: {type: boolean, enum: [false]}
        policy_domain: {type: string}
        as_of: {type: string, format: date-time}
        known_at: {type: string, format: date-time}
        pin: {$ref: '#/components/schemas/AccountingPin'}
        policy: {$ref: '#/components/schemas/AccountingPolicyVersion'}

    AccountingResolution:
      type: object
      required: [status, blocks_calculation, policy_domain, as_of, known_at]
      properties:
        status: {type: string, enum: [RESOLVED, NOT_APPLICABLE, CONFLICTED]}
        blocks_calculation: {type: boolean, description: 'True unless exactly one version governs.'}
        policy_domain: {type: string}
        as_of: {type: string, format: date-time}
        known_at: {type: string, format: date-time}
        pin: {$ref: '#/components/schemas/AccountingPin'}
        selected: {$ref: '#/components/schemas/AccountingVersionSummary'}
        conflicting:
          type: array
          items: {$ref: '#/components/schemas/AccountingVersionSummary'}
        trace:
          type: array
          items:
            type: object
            properties:
              policy_version_id: {type: string}
              policy_id: {type: string}
              policy_code: {type: string}
              version_number: {type: integer}
              scope_type: {type: string}
              version_status: {type: string}
              governs: {type: boolean}
              reason: {type: string}
              policy_domain: {type: string}
              book_id: {type: string, nullable: true}
              jurisdiction_id: {type: string, nullable: true}
              semantic_version: {type: string}
              precedence: {type: integer}

    AccountingLifecycleRequest:
      type: object
      properties:
        expected_version: {type: integer, description: 'The version''s row_version, or send it as If-Match.'}
        reason_code: {type: string, description: 'Required for emergency-suspend and review-suspension.'}
        reason: {type: string}
        approval_reference: {type: string}
        outcome: {type: string, enum: [UPHELD, OVERTURNED], description: 'Required for review-suspension.'}
        supersedes_version_id: {type: string, format: uuid, description: 'Required for supersede: the active version it replaces.'}

    ImpactVersionRef:
      type: object
      properties:
        policy_version_id: {type: string, format: uuid}
        policy_id: {type: string, format: uuid}
        policy_domain: {type: string}
        semantic_version: {type: string}
        version_status: {type: string}
        precedence: {type: integer}
        book_id: {type: string, format: uuid, nullable: true}
        jurisdiction_id: {type: string, format: uuid, nullable: true}
        legal_entity_id: {type: string, format: uuid, nullable: true}
        effective_from: {type: string, format: date-time}
        effective_to: {type: string, format: date-time, nullable: true}

    AccountingImpact:
      type: object
      required: [version, retroactive, ambiguous_with, depended_on_by, activation_blockers]
      properties:
        version: {$ref: '#/components/schemas/AccountingPolicyVersion'}
        retroactive: {type: boolean, description: 'The version takes effect before it was drafted.'}
        would_supersede: {$ref: '#/components/schemas/ImpactVersionRef'}
        predecessor_governs_until: {type: string, format: date-time}
        pending_schedule: {$ref: '#/components/schemas/ImpactVersionRef'}
        ambiguous_with:
          type: array
          items: {$ref: '#/components/schemas/ImpactVersionRef'}
        depended_on_by:
          type: array
          items: {$ref: '#/components/schemas/ImpactVersionRef'}
        activation_blockers:
          type: array
          items: {type: string}
