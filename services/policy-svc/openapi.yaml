        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateControlTestDefinitionRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlTestDefinition'}
        '200':
          description: Replay of the same request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlTestDefinition'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /v1/control-test-definitions/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [controls]
      operationId: getControlTestDefinition
      responses:
