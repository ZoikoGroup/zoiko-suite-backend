          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attestation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    gatewayIdentity:
      type: apiKey
      in: header
      name: X-Principal-Id
      description: Set by the gateway from a verified identity envelope, with X-Tenant-Id.

  parameters:
    PolicyID: {name: policy_id, in: path, required: true, schema: {type: string, format: uuid}}
    VersionID: {name: version_id, in: path, required: true, schema: {type: string, format: uuid}}
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string}, description: 'Required on material writes by the input contract.'}
    CorrelationID: {name: X-Correlation-ID, in: header, required: false, schema: {type: string}}
    IfMatch: {name: If-Match, in: header, required: false, schema: {type: string}, description: 'The version''s ETag (row_version). Required unless the body carries expected_version: 428 when neither is sent.'}
    PolicyType: {name: policy_type, in: query, required: true, schema: {type: string, maxLength: 64}}
    TenantIDQuery: {name: tenant_id, in: query, required: false, schema: {type: string, format: uuid}, description: 'Must equal the verified tenant when sent.'}
    LegalEntityIDQuery: {name: legal_entity_id, in: query, required: false, schema: {type: string, format: uuid}}
    AsOf: {name: as_of, in: query, required: false, schema: {type: string, format: date-time}, description: 'Effective-time cut (default now).'}
    KnownAt: {name: known_at, in: query, required: false, schema: {type: string, format: date-time}, description: 'Knowledge cut (default as_of if past, else now).'}

  requestBodies:
    Lifecycle:
      description: Optional, except suspend and retire need reason_code and review-suspension needs outcome.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LifecycleRequest'}

  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PolicyVersion:
      description: The version; its row_version is the ETag
      headers:
        ETag: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PolicyVersion'}

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, description: The §16 class callers match on.}
        reason_code: {type: string, description: The specific refusal.}
        request_id: {type: string}
        correlation_id: {type: string}
        retryable: {type: boolean}
        errors:
          type: array
          items:
            type: object
            properties:
              pointer: {type: string}
              code: {type: string}
              detail: {type: string}
        field: {type: string}

    CreatePolicyRequest:
      type: object
      required: [policy_code, policy_name, policy_type]
      properties:
        policy_id: {type: string, format: uuid}
        policy_code: {type: string}
        policy_name: {type: string}
        policy_type: {type: string}
        scope: {type: string, enum: [GLOBAL, TENANT]}

    Policy:
      type: object
      properties:
        policy_id: {type: string, format: uuid}
        policy_code: {type: string}
        policy_name: {type: string}
        policy_type: {type: string}
        tenant_id: {type: string, format: uuid, nullable: true}
        policy_status: {type: string}
        versioning_mode: {type: string}
        created_at: {type: string, format: date-time}
        created_by_principal_id: {type: string}

    CreatePolicyVersionRequest:
      type: object
      required: [effective_from]
      properties:
        policy_version_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid, nullable: true}
        legal_entity_id: {type: string, format: uuid, nullable: true}
        rule_payload: {type: object, additionalProperties: true}
        effective_from: {type: string, format: date-time}
        effective_to: {type: string, format: date-time, nullable: true}
        source: {type: string}
        rationale: {type: string}

    PolicyVersion:
      type: object
      properties:
        policy_version_id: {type: string, format: uuid}
        policy_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid, nullable: true}
        legal_entity_id: {type: string, format: uuid, nullable: true}
        scope_type: {type: string}
        rule_payload: {type: object, additionalProperties: true}
        effective_from: {type: string, format: date-time}
        effective_to: {type: string, format: date-time, nullable: true}
        version_status: {type: string}
        version_number: {type: integer}
        source: {type: string}
        rationale: {type: string}
        artifact_digest: {type: string}
        known_from: {type: string, format: date-time}
        activated_by_principal_id: {type: string, nullable: true}
        activated_at: {type: string, format: date-time, nullable: true}
        row_version: {type: integer}
        submitted_by_principal_id: {type: string}
        submitted_at: {type: string, format: date-time}
        approved_by_principal_id: {type: string}
        approved_at: {type: string, format: date-time}
        approval_reference: {type: string}
        withdrawn_at: {type: string, format: date-time}
        superseded_at: {type: string, format: date-time}
        superseded_by_version_id: {type: string, format: uuid}
        suspended_by_principal_id: {type: string}
        suspension_reviewed_by_principal_id: {type: string}
        suspension_reviewed_at: {type: string, format: date-time}
        suspension_review_outcome: {type: string}
        created_at: {type: string, format: date-time}
        created_by_principal_id: {type: string}

    ApplicablePolicyVersion:
      allOf:
        - $ref: '#/components/schemas/PolicyVersion'
        - type: object
          properties:
            policy_code: {type: string}

    LifecycleRequest:
      type: object
      properties:
        expected_version: {type: integer, description: Alternative to If-Match.}
        reason_code: {type: string}
        reason: {type: string}
        approval_reference: {type: string}
        outcome: {type: string, enum: [UPHELD, OVERTURNED]}

    VersionTransition:
      type: object
      properties:
        transition_id: {type: integer, format: int64}
        policy_version_id: {type: string, format: uuid}
        from_status: {type: string, nullable: true}
        to_status: {type: string}
        actor_id: {type: string}
        reason: {type: string}
        approval_reference: {type: string}
        correlation_id: {type: string}
        occurred_at: {type: string, format: date-time}

    Resolution:
      type: object
      properties:
        status: {type: string, enum: [RESOLVED, NOT_APPLICABLE, CONFLICTED]}
        as_of: {type: string, format: date-time}
        known_at: {type: string, format: date-time}
        selected: {$ref: '#/components/schemas/ApplicablePolicyVersion'}
        conflicting:
          type: array
          items: {$ref: '#/components/schemas/ApplicablePolicyVersion'}
        trace:
          type: array
          nullable: true
          items:
            type: object
            properties:
              policy_version_id: {type: string}
              policy_id: {type: string}
              policy_code: {type: string}
              version_number: {type: integer}
              scope_type: {type: string}
              version_status: {type: string}
              governs: {type: boolean}
              reason: {type: string}

    Comparison:
      type: object
      properties:
        base: {$ref: '#/components/schemas/PolicyVersion'}
        target: {$ref: '#/components/schemas/PolicyVersion'}
        same_content: {type: boolean}
        field_changes:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              base: {}
              target: {}
        payload_changes:
          type: array
          items:
            type: object
            properties:
              path: {type: string}
              change: {type: string, enum: [added, removed, changed]}
              base: {}
              target: {}

    EvaluateRequest:
      type: object
      required: [policy_type, decision_id]
      properties:
        policy_type: {type: string}
        tenant_id: {type: string, format: uuid, nullable: true}
        legal_entity_id: {type: string, format: uuid, nullable: true}
        action_context: {type: object, additionalProperties: true}
        decision_id: {type: string}
        as_of: {type: string, format: date-time}
        known_at: {type: string, format: date-time}

    EvaluateResponse:
      type: object
      properties:
        result: {type: string}
        policy_version_id: {type: string}
        rule_basis: {type: string}
        evidence_id: {type: string}
        decision_id: {type: string}
        policy_id: {type: string}
        policy_code: {type: string}
        artifact_digest: {type: string}
        selected_rule_ids: {type: array, items: {type: string}}
        evaluator_version: {type: string}
        input_fingerprint: {type: string}
        as_of: {type: string, format: date-time}
        known_at: {type: string, format: date-time}
        ledger_status: {type: string}
        replayed: {type: boolean}

    Evaluation:
      type: object
      properties:
        evidence_id: {type: string}
        tenant_id: {type: string}
        decision_id: {type: string}
        legal_entity_id: {type: string}
        policy_type: {type: string}
        requested_by_principal_id: {type: string}
        input_fingerprint: {type: string}
        action_context: {type: object, additionalProperties: true}
        as_of: {type: string, format: date-time}
        known_at: {type: string, format: date-time}
        result: {type: string}
        outcome: {type: string}
        policy_id: {type: string}
        policy_version_id: {type: string}
        policy_code: {type: string}
        artifact_digest: {type: string}
        rule_basis: {type: string}
        selected_rule_ids: {type: array, items: {type: string}}
        evaluator_version: {type: string}
        correlation_id: {type: string}
        causation_id: {type: string}
        request_id: {type: string}
        evaluated_at: {type: string, format: date-time}
        ledger_status: {type: string}

    CreateControlTestDefinitionRequest:
      type: object
      required: [control_ref, test_code, title, methodology]
      properties:
        control_test_definition_id: {type: string, format: uuid}
        control_ref: {type: string}
        test_code: {type: string}
        title: {type: string}
        methodology: {type: string}
        sample_approach: {type: string}
        test_frequency: {type: string}

    ControlTestDefinition:
      type: object
      properties:
        control_test_definition_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid, nullable: true}
        control_ref: {type: string}
        test_code: {type: string}
        title: {type: string}
        methodology: {type: string}
        sample_approach: {type: string}
        test_frequency: {type: string}
        design_status: {type: string}
        created_at: {type: string, format: date-time}
        created_by_principal_id: {type: string}

    CreateControlTestExecutionRequest:
      type: object
      required: [period_start, period_end, result]
      properties:
        control_test_execution_id: {type: string, format: uuid}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        population_description: {type: string}
        sample_description: {type: string}
        procedure_notes: {type: string}
        evidence_refs: {type: array, items: {type: string}}
        result: {type: string}
        exceptions_noted: {type: string}
        reviewer_principal_id: {type: string}

    ControlTestExecution:
      type: object
      properties:
        control_test_execution_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid, nullable: true}
        control_test_definition_id: {type: string, format: uuid}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        population_description: {type: string}
        sample_description: {type: string}
        procedure_notes: {type: string}
        evidence_refs: {type: array, items: {type: string}}
        tester_principal_id: {type: string}
        result: {type: string}
        exceptions_noted: {type: string}
        reviewer_principal_id: {type: string}
        reviewed_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        created_by_principal_id: {type: string}

    ControlEffectiveness:
      type: object
      properties:
        control_ref: {type: string}
        design_status: {type: string}
        operating_effectiveness: {type: string}
        as_of: {type: string, format: date-time}
        latest_execution_id: {type: string}

    CreateAttestationRequest:
      type: object
      required: [statement, statement_version, subject_ref, period_start, period_end, signer_role]
      properties:
        attestation_id: {type: string, format: uuid}
        statement: {type: string}
        statement_version: {type: string}
        subject_ref: {type: string}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        signer_role: {type: string}
        evidence_refs: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}

    Attestation:
      type: object
      properties:
        attestation_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid, nullable: true}
        statement: {type: string}
        statement_version: {type: string}
        subject_ref: {type: string}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        signer_principal_id: {type: string}
        signer_role: {type: string}
        signed_at: {type: string, format: date-time}
        evidence_refs: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}
        attestation_status: {type: string}
        revocation_reason: {type: string}
        created_at: {type: string, format: date-time}
        created_by_principal_id: {type: string}
