components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
      description: Gateway-verified tenant.
    PrincipalId:
      name: X-Principal-Id
      in: header
      required: true
      schema:
        type: string
      description: Gateway-verified actor. Maker-checker compares this, never a body field.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation id carried onto every event.
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
      description: Mandatory on writes (request tracing).
    SourceChannel:
      name: X-Source-Channel
      in: header
      required: true
      schema:
        type: string
      description: api, import, integration, mobile, scheduled_job, system or web.
    LegalEntityId:
      name: X-Legal-Entity-Id
      in: header
      required: true
      schema:
        type: string
      description: Mandatory on writes (INV-02); tenant-wide operations authorize on it.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Mandatory on writes (INV-08); a repeat is answered from the first response.
  schemas:
    Error:
      type: object
      required:
      - error_code
      properties:
        error_code:
          type: string
        error_message:
          type: string
    EnvelopeError:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        violations:
          type: array
          items:
            type: object
    Refusal:
      type: object
      required:
      - error_code
      - reason_code
      properties:
        error_code:
          type: string
        error_message:
          type: string
        reason_code:
          type: string
          enum:
          - NCD-001
          - NCD-002
          - NCD-003
          - NCD-004
          - NCD-005
          - NCD-006
          - NCD-007
          - NCD-008
          - NCD-009
          - NCD-010
          - NCD-011
          - NCD-012
          - NCD-013
          - NCD-014
          - NCD-015
          - NCD-016
          - NCD-017
          - NCD-018
          - NCD-019
          - NCD-020
        reason:
          type: string
  responses:
    Invalid:
      description: Invalid request, or the 4-envelope is incomplete
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/EnvelopeError'
    Unauthenticated:
      description: No principal or tenant, or an unauthenticated callback
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not granted, or segregation of duties
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found in this tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The object's state does not permit the command
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Refused:
      description: A 10.3 coded refusal (NCD-001 to NCD-020)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    Unavailable:
      description: A dependency or the store is unavailable; nothing was done
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
