      - $ref: '#/components/parameters/SourceChannel'
      - $ref: '#/components/parameters/LegalEntityId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content: &id001
            application/problem+json:
