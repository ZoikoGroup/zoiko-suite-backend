openapi: 3.0.3
info:
  title: notification-svc - Notification, Communication & Delivery Control (ZS-SVC-Y-001)
  version: 2.0.0
  description: 'NCD-01 to NCD-05 control plane plus the legacy delivery register. No response exposes a generic ''sent'' status
    (3.3). Delivery states: CREATED, SUBMITTED_TO_PROVIDER, PROVIDER_ACCEPTED, PROVIDER_PENDING, DELIVERY_UNKNOWN, DELIVERED_TO_MAILBOX,
    DELIVERED_TO_INBOX, DELIVERED_TO_NETWORK, FAILED, BOUNCED (legacy register: PENDING, RETRY_SCHEDULED, PROVIDER_ACCEPTED,
    DELIVERED_TO_INBOX, DELIVERY_UNKNOWN, FAILED; stored_status keeps the column). Legal sufficiency is always NOT_DETERMINED_BY_NCD.
    Every write needs the six envelope headers; Idempotency-Key replays the first response with X-Idempotent-Replay: true.'
servers:
- url: http://localhost:8133
tags:
- name: BIZ-03 document templates
- name: Communications (10.1)
- name: Legacy register
- name: Maker-checker
- name: NCD-01 registry
- name: NCD-02 recipient & channel
- name: NCD-03 routing
- name: NCD-04 evidence
- name: NCD-05 notices
