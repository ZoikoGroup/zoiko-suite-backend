openapi: 3.0.3

# notification-svc — ZS-SVC-Y-001 (Notification, Communication & Delivery
# Control) and 03-microservices.md §9.7.
#
# Generated by hand from internal/handler/handler.go, and asserted against it by
# scripts/audit.sh: every path, every error code and every channel below is
# grepped out of the running service rather than trusted. A spec that has
# drifted from its service is worse than no spec, because callers build against
# it.
#
# ── The two things a reader must not get wrong ───────────────────────────────
#
# 1. WHAT "SENT" MEANS DEPENDS ON THE CHANNEL. ZS-SVC-Y-001 §0.4 forbids
#    treating a provider's acceptance as proof that a person received, read or
#    was legally served with a notice.
#
#      IN_APP  — SENT means delivered. The register row IS the delivery, the
#                recipient reads it back from the same register, and read_at
#                proves somebody opened it. The only channel that can honestly
#                claim receipt.
#      EMAIL   — SENT means a mail provider ACCEPTED the message.
#                provider_response carries the acceptance evidence. Nothing
#                here says it arrived.
#      WEBHOOK — accepted by this API and refused by the deliverer, by design:
#                §1.3 puts machine-to-machine exchange outside this service's
#                remit (XIC owns it). It records FAILED naming what is missing,
#                rather than reporting a send.
#      SMS     — withdrawn. It used to be accepted and then failed every send,
#                so it is now refused at the request boundary with the same 400
#                an unknown channel gets. Stored SMS rows still exist and still
#                read back.
#
# 2. A FAILED DELIVERY IS A 201, NOT AN ERROR. 03-microservices.md §9.7 requires
#    that notification failure must not collapse the source operational
#    workflow: a payroll run that finalized correctly cannot be told it failed
#    because an employee has no address on file. Callers MUST read `status`, not
#    the HTTP code, to learn whether a notice went out.

info:
  title: notification-svc
  version: "1.5.0"
  description: |
    Governed delivery of notifications for workflows, deadlines, escalations,
    approvals and status changes.

    The register is the evidence that a notice was issued: it records where the
    message went, who vouched for that address, what the provider said, how many
    attempts it took, and — for in-app notices — whether the recipient opened
    it. Nothing in it is recomputed at read time.

    Exactly one domain event is emitted per notification, when its delivery
    concludes, and it is committed to a transactional outbox by the same
    transaction as the conclusion (migration 000005). See asyncapi.yaml.
  contact:
    name: Zoiko Suite Platform Engineering

servers:
  - url: http://localhost:8133
    description: Local compose
  - url: http://localhost:8000/notification-svc
    description: Through the Traefik gateway

tags:
  - name: Notifications
    description: Sending, and reading the delivery register.
  - name: Inbox
    description: The recipient's own view — read state and the unread badge.
  - name: Catalogue
    description: The compiled-in template catalogue.
  - name: Operations
    description: Health probes and metrics.

paths:
  /v1/notifications/:
    post:
      tags: [Notifications]
      summary: Record and deliver a governed notification
      operationId: sendNotification
      description: |
        Requires a `NOTIFICATION_SEND` grant on `legal_entity_id`.

        **Idempotent on (tenant_id, correlation_id).** A repeat returns 200 with
        the stored notification rather than sending a second notice. 201 means a
        new one was recorded.

        **A FAILED status still comes back 201** — see the top of this file.

        Delivery is attempted synchronously. A failure the provider classifies
        as transient does NOT conclude the notification: it stays `PENDING` with
        `next_attempt_at` set and the in-process worker re-attempts it. That is
        also a 201, and `status` is `PENDING`, not `FAILED`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/LegalEntityIdHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
            examples:
              freeText:
                summary: Free-text in-app notice
                value:
                  recipient_principal_id: 44444444-4444-4444-4444-444444444444
                  legal_entity_id: 22222222-2222-2222-2222-222222222222
                  channel: IN_APP
                  subject: Payroll cutoff approaching
                  body: Cutoff for the next payroll run is Friday.
                  source_event_type: PAYROLL_RUN
                  source_reference: pr-2026-09
                  correlation_id: corr-payroll-2026-09-cutoff
              template:
                summary: Rendered from a catalogue template
                value:
                  recipient_principal_id: 44444444-4444-4444-4444-444444444444
                  legal_entity_id: 22222222-2222-2222-2222-222222222222
                  channel: EMAIL
                  template: registration_received
                  variables:
                    organization_name: Northwind Trading Ltd
                  recipient_address: founder@northwind.example
                  correlation_id: corr-reg-northwind
      responses:
        '201':
          description: |
            A new notification was recorded. Read `status` to learn whether it
            was delivered: `SENT`, `FAILED`, or `PENDING` with `next_attempt_at`
            set (a transient failure awaiting another attempt).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '200':
          description: |
            Replay. This `correlation_id` was already processed for this tenant
            and the stored notification is returned. Nothing was sent twice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: |
            Refused at the request boundary. `error` is one of
            `invalid_json`, `missing_fields`, `unsupported_channel`,
            `conflicting_content`, `unknown_template`,
            `missing_template_variables`, `address_not_applicable`,
            `invalid_recipient_address`, `request_too_large`, or the envelope's
            own `envelope_incomplete`.

            An unrecognised channel is refused HERE rather than recorded as a
            failed delivery: a caller's typo used to leave a permanent FAILED
            row and a `notification.failed` event, which was evidence of an
            attempt no provider ever saw.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            No `NOTIFICATION_SEND` grant on this legal entity. Sending and
            reading are separate grants; holding one does not imply the other.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`template_render_failed` — the template exists and could not be rendered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            `store_unavailable` — the notification could NOT be recorded, so
            nothing was delivered and there is no record to read back. Retry
            with a fresh correlation id.

            `authz_unavailable` — authorization could not be verified, so the
            action was refused. A fail-closed refusal, not a denial.

            `event_seal_failed` — the delivery event could not be built, so the
            conclusion was refused rather than recorded with nobody told.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Notifications]
      summary: Read the delivery register, or the caller's own inbox
      operationId: listNotifications
      description: |
        `legal_entity_id` selects between two DIFFERENT reads, and this is the
        most important thing on the endpoint:

        - **supplied** → the entity's register, authorized against it. 403
          without a `NOTIFICATION_VIEW` grant there.
        - **omitted** → the caller's own inbox. The recipient filter is forced
          to the calling principal, and a `recipient_principal_id` naming anyone
          else is refused with 403 rather than silently rewritten.

        Authorization used to be conditional on the filter being present, so
        omitting it — the easier request — returned every notification in the
        tenant, subjects and bodies included, to a principal holding no grant at
        all. A read is authorized by who is asking, never by which query
        parameters they happened to send.

        Returns a bare JSON array, not an envelope. Newest first, by
        `created_at` then `notification_id` — the id is the tiebreaker, because
        two notices recorded in the same transaction share a timestamp and a
        paged read could otherwise show one row twice and skip another.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/CorrelationId'
        - name: legal_entity_id
          in: query
          schema: { type: string, format: uuid }
          description: See above — its presence changes which read this is.
        - name: recipient_principal_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, SENT, FAILED] }
        - name: unread_only
          in: query
          schema: { type: string, enum: ["true"] }
          description: |
            Restrict to notices the recipient has not opened. Implies IN_APP:
            `read_at` is NULL for every email and always will be, so an
            unfiltered unread read would report every email ever sent as unread.
            Send the literal `true`; anything else is the default.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: The notifications the caller is entitled to read.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          description: '`invalid_limit` or `invalid_offset` — limit must be 1–500, offset must not be negative.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: No `NOTIFICATION_VIEW` grant on the entity, or an attempt to read another principal's inbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          $ref: '#/components/responses/StoreUnavailable'

  /v1/notifications/{id}:
    get:
      tags: [Notifications]
      summary: One notification by id
      operationId: getNotification
      description: |
        Authorized against the notification's OWN legal entity, read from the
        record rather than from the request — a caller cannot name an entity
        they hold a grant on to read a notice belonging to another.

        Another tenant's notification is `notification_not_found`, not 403: row
        level security hides it, and telling a caller that an id exists
        elsewhere is itself a disclosure.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: No `NOTIFICATION_VIEW` grant on the notification's legal entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            `notification_not_found`. Also returned for an id that is not a
            UUID: it names no notification, which is what not found means, and
            the driver's cast failure used to surface as 503 — an outage status
            for a typo in a URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          $ref: '#/components/responses/StoreUnavailable'

  /v1/notifications/{id}/read:
    post:
      tags: [Inbox]
      summary: Mark an in-app notice read
      operationId: markNotificationRead
      description: |
        **Only the recipient may do this.** Not a `NOTIFICATION_VIEW` action:
        that grant lets an administrator read the register, and reading the
        register is not the recipient reading their notice — an administrator
        opening the audit view must not clear somebody else's unread badge.

        **Idempotent, and it keeps the FIRST read.** A repeat is 200 with the
        original `read_at`. Inboxes re-issue this on every render, and without
        that "when did they first see this" — the only question `read_at` can
        answer — would decay into "when did they last look".

        IN_APP only. This service cannot observe whether an email was opened and
        does not pretend to.

        No request body. It carries an idempotency key nonetheless, because §4
        marks one mandatory for material state changes and this is one.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/LegalEntityIdHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The notification, with `read_at` set. Re-read from the store, so a repeat shows the original time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '400':
          description: '`channel_has_no_read_state` — read state applies to IN_APP alone.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`forbidden` — the caller is not the recipient.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`notification_not_found`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          $ref: '#/components/responses/StoreUnavailable'

  /v1/notifications/unread-count:
    get:
      tags: [Inbox]
      summary: How many in-app notices the CALLER has not opened
      operationId: getUnreadCount
      description: |
        The number on the bell.

        **There is no principal parameter, deliberately.** A per-principal
        unread total that anyone could query would report on colleagues'
        attention.

        IN_APP only, and the response says so in `channel`: counting emails
        would produce a badge that only ever grows, because clearing it would
        require asserting something this platform cannot observe.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The caller's unread count.
          content:
            application/json:
              schema:
                type: object
                required: [recipient_principal_id, unread_count, channel]
                properties:
                  recipient_principal_id: { type: string, format: uuid }
                  unread_count: { type: integer, minimum: 0 }
                  channel:
                    type: string
                    enum: [IN_APP]
                    description: Always IN_APP — the count says which channel it can speak for.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/StoreUnavailable'

  /v1/notifications/templates:
    get:
      tags: [Catalogue]
      summary: The template catalogue and each template's required variables
      operationId: listNotificationTemplates
      description: |
        **No authorization check and no tenant scope.** The catalogue is
        compiled into the binary and is identical for every tenant and every
        caller: there is no tenant data in it to leak and nothing to authorize
        against. A `NOTIFICATION_SEND` grant is checked when a notification is
        actually sent, and gating discovery of what CAN be sent behind an entity
        grant would only mean a console cannot draw a form until the user picks
        a legal entity.

        It still requires a caller identity — the envelope middleware ahead of
        it refuses an unattributed request — so this is not an anonymous
        endpoint.

        A console should fetch this rather than hardcode it. The required-
        variable contracts live in the service binary, and a second copy drifts
        the first time one gains a variable; the failure is a 400 on submit with
        no field on the form to fix it.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      required: [name, subject, required_variables]
                      properties:
                        name: { type: string, example: registration_received }
                        subject:
                          type: string
                          description: The subject the template sends under. Not caller-supplied.
                        required_variables:
                          type: array
                          items: { type: string }
                          description: |
                            The service returns 400 `missing_template_variables`
                            rather than sending a message with a blank
                            organization name or an empty login link.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /healthz:
    get:
      tags: [Operations]
      summary: Liveness
      description: 200 whenever the process is up. Says nothing about the database — use /readyz for that.
      responses:
        '200': { description: The process is running. }

  /readyz:
    get:
      tags: [Operations]
      summary: Readiness
      description: |
        Pings the database pool. This is the probe the container healthcheck
        uses: liveness answers 200 with a dead pool, so a service returning 500
        on every read would read as healthy.
      responses:
        '200': { description: Ready. }
        '503': { description: The database is unreachable. }

  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics
      description: |
        HTTP metrics, plus the domain metrics that exist because every
        interesting failure here answers 2xx — `notification_deliveries_total`,
        `notification_delivery_attempts_total`,
        `notification_retries_scheduled_total`,
        `notification_retries_exhausted_total`,
        `notification_stranded_reclaimed_total`,
        `notification_delivery_duration_seconds`, and the outbox gauges
        `notification_outbox_pending` / `notification_outbox_oldest_age_seconds`.
      responses:
        '200': { description: Metrics in the Prometheus text format. }

components:
  parameters:
    # The canonical Service Input Contract, ZS-ARCH-SVC-001 v2.0 §4. Enforced by
    # internal/envelope in write-strict mode: reads need identity and
    # traceability, writes additionally need an idempotency key AND
    # X-Legal-Entity-Id. Omitting one on a write is 400 `envelope_incomplete`
    # BEFORE any handler runs — which is what broke every pre-enforcement
    # Postman collection on this estate, and what this file's own first draft
    # got wrong: it documented five write headers where the service demands six,
    # so a client built strictly from it would have had every write refused.
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Mandatory. Without it the service refuses rather than reading across tenants.
    PrincipalId:
      name: X-Principal-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: The acting principal. Authorization and attribution both key on it.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Mandatory for material state changes (§4, INV-08).
    LegalEntityIdHeader:
      name: X-Legal-Entity-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: |
        Mandatory on WRITES. §4 marks it "conditional but mandatory for
        entity-specific records", and internal/envelope/contract.go sets
        `LegalEntityID: RequiredOnWrite` for this service — a notification is an
        entity-scoped record (INV-02).

        Omitting it is 400 `envelope_incomplete` before any handler runs, which
        looks nothing like a missing field and is the single easiest way to get
        a write refused here.

        It is SEPARATE from the body's `legal_entity_id`, which is what the
        `NOTIFICATION_SEND` grant is checked against. They normally carry the
        same value; the header is the envelope's declaration of scope and the
        body field is the authorization subject.
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: { type: string }
    SourceChannel:
      name: X-Source-Channel
      in: header
      required: true
      schema: { type: string, example: system }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string }
      description: |
        Echoed back on the response and carried onto the domain event. Generated
        from the request id when absent.

        NOT the same thing as the body's `correlation_id`, which is the
        idempotency key for the SEND. Two different jobs, and conflating them is
        the easiest mistake to make against this API.

  responses:
    Unauthenticated:
      description: |
        `identity_missing` or `tenant_missing` — no caller identity or no tenant
        scope reached the service, so it failed closed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StoreUnavailable:
      description: '`store_unavailable` — the register could not be reached.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: |
        **There are TWO error dialects on this service, and a client must read
        both.** They come from different layers, and neither is going away:

        - **Handler refusals** — every business rule below the envelope —
          answer `{"error_code": "...", "error_message": "..."}`.
        - **Envelope refusals** — ZS-ARCH-SVC-001 §4, raised before any handler
          runs — answer `{"error": "envelope_incomplete", "detail": "...",
          "service": "notification-svc", "violations": [{"field", "header",
          "reason"}]}`.

        A client reading only `error` sees an empty string for every business
        refusal this service makes; one reading only `error_code` sees nothing
        for every malformed envelope. The console reads either
        (`lib/api/client.ts`), and this spec's own first draft documented only
        the first — which is why it is called out here rather than tidied into
        one shape the service does not actually emit.
      properties:
        error_code:
          type: string
          description: |
            Handler dialect. A stable machine-readable code — clients switch on
            this, never on the message.
        error_message:
          type: string
          description: Handler dialect. Human-readable, and not stable.
        error:
          type: string
          description: Envelope dialect. `envelope_incomplete` is the one worth handling.
        detail:
          type: string
          description: Envelope dialect. Names which §4 fields were missing.
        violations:
          type: array
          description: Envelope dialect. One entry per missing or invalid §4 field.
          items:
            type: object
            properties:
              field: { type: string, example: legal_entity_id }
              header: { type: string, example: X-Legal-Entity-Id }
              reason: { type: string, example: mandatory for entity-specific records (INV-02) }

    SendNotificationRequest:
      type: object
      required: [recipient_principal_id, legal_entity_id, channel, correlation_id]
      description: |
        Either `subject` (optionally with `body`) or `template` (with
        `variables`) — never both. The two are mutually exclusive because
        supplying each would leave it ambiguous which one the recipient actually
        received; a request carrying both is 400 `conflicting_content`.
      properties:
        recipient_principal_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
          description: The entity the `NOTIFICATION_SEND` grant is checked against.
        channel:
          type: string
          enum: [EMAIL, IN_APP, WEBHOOK]
          description: |
            SMS is absent and is refused with 400 `unsupported_channel`. It was
            accepted, resolved a recipient, and then failed every send — the one
            channel that advertised a capability the platform does not have.
        subject:
          type: string
          maxLength: 255
          description: Required unless `template` is used. Must be ABSENT, not empty, alongside a template.
        body:
          type: string
        template:
          type: string
          description: A name from GET /v1/notifications/templates.
        variables:
          type: object
          additionalProperties: { type: string }
          description: |
            Fills the template's placeholders. Escaped by the service for the
            context each value lands in, so an organization name containing
            markup arrives as text rather than as markup.
        recipient_address:
          type: string
          format: email
          description: |
            Overrides recipient resolution, for EMAIL only. Left empty — the
            normal case — the address is read from identity-context-svc's record
            for the recipient, which is the authoritative contact fact.

            The override exists for a recipient who is not an established
            principal yet: the `registration_received` notice goes to somebody
            whose organization has not been approved. Whichever path supplied
            the address is recorded in `recipient_address_source`, so the two
            never become indistinguishable after the fact.

            400 `address_not_applicable` for IN_APP or WEBHOOK; 400
            `invalid_recipient_address` if it does not parse.
        source_event_type:
          type: string
          example: PAYROLL_RUN
        source_reference:
          type: string
          example: pr-2026-09
        correlation_id:
          type: string
          description: |
            The idempotency key for this send. A repeat resolves to the original
            notification rather than a second delivery.

    Notification:
      type: object
      required:
        - notification_id
        - tenant_id
        - legal_entity_id
        - recipient_principal_id
        - channel
        - subject
        - status
        - correlation_id
        - created_by_principal_id
        - created_at
        - delivery_attempts
      properties:
        notification_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        recipient_principal_id: { type: string, format: uuid }
        recipient_address:
          type: string
          description: |
            The endpoint the message was actually delivered to, snapshotted at
            send time and never recomputed. Resolving it again at read time
            would answer "where would we send this today"; the question a
            delivery register exists to answer is "where did we actually send
            it", and those differ precisely when it matters.

            Absent for IN_APP, which has no endpoint outside the platform.
        recipient_address_source:
          type: string
          enum: [IDENTITY_CONTEXT, REQUEST]
          description: |
            Where that address came from. §0.4 names "mandatory notices being
            sent to an unverified or stale free-text address with no recipient
            provenance" as a thing this control plane exists to prevent, so an
            address the identity authority vouched for and one handed over in
            the request stay distinguishable.
        channel:
          type: string
          description: |
            A plain string, not the send-time enum. Historical rows carry SMS,
            and a register that could not display what it recorded would be
            worse than one showing a withdrawn channel.
          example: EMAIL
        subject: { type: string }
        body: { type: string }
        status:
          type: string
          enum: [PENDING, SENT, FAILED]
          description: |
            `PENDING` has TWO meanings and `next_attempt_at` separates them:
            set means a transient failure is scheduled to be re-attempted,
            absent means an attempt is in flight right now.

            `SENT` means a provider accepted it — for IN_APP, that the row
            exists, which IS the delivery. Never that anyone read it.

            `FAILED` is terminal.
        source_event_type: { type: string }
        source_reference: { type: string }
        correlation_id: { type: string }
        failure_reason:
          type: string
          description: |
            Present on FAILED, and also on a PENDING notification awaiting
            another attempt — where it is why the LAST attempt did not land, not
            a verdict. Rendering that as a failure would report a notice as
            undelivered while the platform is still actively delivering it.
        provider_response:
          type: string
          description: |
            Acceptance evidence — which provider took the message and under what
            identifier, so it can be traced into provider logs. Evidence of
            acceptance ONLY. Deliberately not named `delivered_at` or `receipt`:
            §0.4 forbids treating a provider's "accepted" as proof a person was
            served, and a field called provider_response cannot be misread as
            the stronger claim.
        created_by_principal_id:
          type: string
          format: uuid
          description: Who initiated the send. Distinct from recipient_principal_id.
        created_at: { type: string, format: date-time }
        sent_at:
          type: string
          format: date-time
          description: When delivery CONCLUDED — set on FAILED as well as on SENT.
        read_at:
          type: string
          format: date-time
          description: |
            When the recipient opened an in-app notice. Absent means unread, and
            only for IN_APP: the absence of this on an EMAIL row is not
            "unread", it is "unknowable".
        delivery_attempts:
          type: integer
          description: Attempts concluded. A notification delivered on its fourth try records that.
        next_attempt_at:
          type: string
          format: date-time
          description: |
            Present ONLY while status is PENDING, and its presence is what
            separates the two meanings of PENDING. The schema refuses a
            concluded notification with a retry scheduled — that combination
            would have the worker re-send a message that already went out.
        last_attempt_at: { type: string, format: date-time }
