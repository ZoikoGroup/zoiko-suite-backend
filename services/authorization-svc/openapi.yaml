        `resource_scope`, `target_environment` — all mandatory (§13). The
        subject must hold `iam.pam.eligible`. Any action that is not a pure
        read → `202 PENDING_APPROVAL`, granting nothing; otherwise `201`
        ACTIVE. Needs the caller's step-up (`401 step_up_required`
        otherwise). Max `AUTHZ_MAX_JIT_SECONDS` (8 h); longer is `400
        duration_exceeds_maximum`.
