      summary: Grant delegated authority (ZS-IAM-001 §11)
      description: |
        `iam.delegation.grant`. The delegator must be the caller; no
        self-delegation. `delegated_actions` may not name an `iam.*` or
        protected platform action (`400 protected_privilege_not_delegable`),
