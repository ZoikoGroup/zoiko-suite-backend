              $ref: '#/components/schemas/CreatePrivilegedSessionRequest'
      responses:
        '201':
          description: Session ACTIVE (read-only request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegedSession'
        '202':
          description: PENDING_APPROVAL — grants nothing until an independent approver approves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegedSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/StepUpRequired'
