components:
  securitySchemes:
    identityEnvelope:
      type: http
      scheme: bearer
      description: |
        The identity envelope identity-context-svc minted (RS256 JWT, verified
        against its JWKS: issuer, audience, expiry). Principal and tenant come
        from the envelope. Evaluation routes instead require a client
        certificate (`AUTHZ_EVALUATION_MTLS`); the canonical and gov03
        internal routes accept either.

  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: false
      schema: { type: string }
      description: Caller's tenant; must agree with the identity envelope when present.
    LegalEntityHeader:
      name: X-Legal-Entity-Id
      in: header
      required: false
      schema: { type: string }
      description: Legal-entity scope of the request.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: 'Required on material writes. Retry returns the first response (`X-Idempotent-Replay: true`); same key with a different body is `409 idempotency_mismatch`.'
    SourceChannel:
      name: X-Source-Channel
      in: header
      required: true
      schema: { type: string }
      description: Required on material writes; a missing channel is `400 envelope_incomplete`.
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string }
      description: Correlation id echoed on the response and recorded with the decision.
    WorkloadID:
      name: X-Workload-Id
      in: header
      required: false
      schema: { type: string }
      description: Set from the client certificate CN; naming anyone else is `403 workload_identity_mismatch`.
    AuthnAge:
      name: X-Authn-Age-Seconds
      in: header
      required: false
      schema: { type: integer }
      description: Age of the caller's last authentication; required for step-up-gated actions under `AUTHZ_STEP_UP_UNKNOWN_AGE=step_up`.

  requestBodies:
    CommandBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              reason_code: { type: string }
              purpose: { type: string }
              expected_version: { type: integer }
            additionalProperties: true
      description: A16 command fields; `reason_code` or `purpose` required where the route is marked R, `expected_version` honoured where marked V.

  responses:
    BadRequest:
      description: 'Bad request — `400`. Codes include `missing_field`, `envelope_incomplete`, `invalid_json`, `duration_exceeds_maximum`, `protected_privilege_not_delegable`, `missing_tenant_scope`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Unauthorized — `401`. Codes include `identity_assertion_required`, `identity_assertion_invalid`, `client_certificate_required`, `step_up_required`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Forbidden — `403`. Codes include `authorization_denied`, `tenant_scope_mismatch`, `tenant_required`, `identity_mismatch`, `self_grant_not_allowed`, `checker_not_independent`, `sod_self_interest`, `workload_not_registered`, `workload_identity_mismatch`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Not found — `404`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Conflict — `409`. Codes include `sod_conflict`, `version_conflict`, `idempotency_mismatch`, `approval_expired`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StepUpRequired:
      description: 'Step-up required — `401 step_up_required` with the reason and `WWW-Authenticate: Bearer error="insufficient_user_authentication"`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StepUpRequired'
    StoreUnavailable:
      description: '`503` — cannot answer: `store_unavailable`, or `entity_registry_unavailable` when the registry lookup fails. Fail-closed: a 503 is never "no".'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Stable code callers match on. }
        error_class:
          type: string
          enum: [CONTEXT_UNRESOLVED, AUTHORIZATION_DENIED, SOD_CONFLICT, APPROVAL_INVALIDATED, CONCURRENCY_CONFLICT, IDEMPOTENCY_MISMATCH]
        message: { type: string }
        field: { type: string }
        violations:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
      additionalProperties: true

    StepUpRequired:
      type: object
      properties:
        error: { type: string, const: step_up_required }
        reason:
          type: string
          enum: [no_verified_identity, delegated_caller, single_factor, step_up_stale, authn_time_unknown, authn_time_in_future, assertion_principal_mismatch]
        required_assurance: { type: string, const: MFA }
        max_authn_age_seconds: { type: integer }
      additionalProperties: true

    AuthorizeRequest:
      type: object
      required: [principal_id, legal_entity_id, action_type]
      properties:
        principal_id: { type: string }
        legal_entity_id: { type: string, description: The scope entity; the platform-scope sentinel for a platform-wide act. }
        action_type: { type: string, description: 'The action, e.g. `invoice.approve`. `*` is never accepted.' }
        tenant_id: { type: string, description: Fallback tenant source; `X-Tenant-Id` wins and disagreement is refused. }
        book_id: { type: string }
        org_unit_id: { type: string }
        resource_owner_principal_id: { type: string, description: Dynamic SoD "a preparer cannot approve their own object". }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: ABAC attributes; values are strings even when numeric.
        privileged_session_id: { type: string, description: JIT session id (ZS-IAM-001 §13). }
        break_glass_session_id: { type: string, description: Break-glass session id (§14). }
        support_session_id: { type: string, description: Support session id (§15). }
        principal_type: { type: string, description: '`WORKLOAD` narrows to the binding; bound principals are evaluated as workloads regardless.' }
        audience: { type: string }
        initiating_subject_id: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        resource_version: { type: string }

    CanonicalDecisionRequest:
      type: object
      required: [subject_id, action]
      properties:
        subject_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        environment:
          type: object
          additionalProperties: true
        session_id: { type: string, description: JIT session (ZS-IAM-001 §8.1). }
        break_glass_session_id: { type: string }
        support_session_id: { type: string }
      additionalProperties: true

    Decision:
      type: object
      description: |
        `/v1/authorize` answers `GRANTED` / `DENIED` / `STEP_UP`; the §8.2
        canonical API answers `PERMIT` / `DENY` / `STEP_UP` /
        `REQUIRE_APPROVAL`.
      properties:
        decision: { type: string, enum: [GRANTED, DENIED, STEP_UP, PERMIT, DENY, REQUIRE_APPROVAL] }
        basis: { type: string, description: 'e.g. `rbac:role=<code>`, `delegated:from=<principal>`, `sod:conflict_with=<action>`, `abac:require_failed=<attr>`, `principal_status:<status>`, `no_grant`. Redacted to "redacted" for another principal''s decision without `iam.policy.read`.' }
        obligations:
          type: array
          items: { type: string }
          description: 'e.g. `COMPENSATING_CONTROL:<control>`.'
        reason_codes:
          type: array
          items: { type: string }
          description: 'e.g. `SOD_EXCEPTION_APPLIED`.'
        matched_grants: { type: array, items: { type: string } }
        policy_set_version: { type: string, description: '`cfg.<n>` — the configuration watermark; replayable from `authz_config_history`.' }
        delegation_id: { type: string }
        on_behalf_of: { type: string }
        expires_at: { type: string, format: date-time }
      additionalProperties: true

    AccessDecision:
      type: object
      properties:
        access_decision_id: { type: string }
        decision: { type: string, enum: [PERMIT, DENY, STEP_UP, REQUIRE_APPROVAL] }
        decision_outcome: { type: string, enum: [GRANTED, DENIED, STEP_UP] }
        principal_id: { type: string }
        tenant_id: { type: string }
        legal_entity_id: { type: string }
        action_type: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        decision_basis: { type: string }
        obligations: { type: array, items: { type: string } }
        reason_codes: { type: array, items: { type: string } }
        matched_grants: { type: array, items: { type: string } }
        policy_set_version: { type: string }
        on_behalf_of: { type: string }
        delegation_id: { type: string }
        session_kind: { type: string, enum: [PRIVILEGED, BREAK_GLASS, SUPPORT], description: 'AU-13: the session the decision was made in.' }
        session_id: { type: string }
        expires_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
      additionalProperties: true

    Role:
      type: object
      properties:
        role_id: { type: string }
        tenant_id: { type: string }
        role_code: { type: string }
        role_name: { type: string }
        description: { type: string }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
      additionalProperties: true

    CreateRoleRequest:
      type: object
      required: [role_code]
      properties:
        role_code: { type: string }
        role_name: { type: string }
        description: { type: string }
      additionalProperties: true

    PermissionBundle:
      type: object
      properties:
        permission_bundle_id: { type: string }
        role_id: { type: string }
        bundle_code: { type: string }
        permitted_actions: { type: array, items: { type: string } }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        version: { type: integer }
      additionalProperties: true

    CreatePermissionBundleRequest:
      type: object
      required: [bundle_code, permitted_actions]
      properties:
        bundle_code: { type: string }
        permitted_actions: { type: array, items: { type: string } }
      additionalProperties: true

    RoleAssignment:
      type: object
      properties:
        assignment_id: { type: string }
        principal_id: { type: string }
        role_id: { type: string }
        legal_entity_id: { type: string, nullable: true, description: Null means tenant-wide. }
        book_id: { type: string }
        org_unit_id: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        approval_status: { type: string, enum: [APPROVED, PENDING_APPROVAL, REJECTED, EXPIRED] }
        approved_by: { type: string }
        approval_reference: { type: string }
        version: { type: integer }
      additionalProperties: true

    CreateRoleAssignmentRequest:
      type: object
      required: [principal_id, role_id, effective_from]
      properties:
        principal_id: { type: string }
        role_id: { type: string }
        legal_entity_id: { type: string }
        book_id: { type: string }
        org_unit_id: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        approval_reference: { type: string }
        reason_code: { type: string }
        purpose: { type: string }
      additionalProperties: true

    Delegation:
      type: object
      properties:
        delegation_id: { type: string }
        delegator_principal_id: { type: string }
        delegate_principal_id: { type: string }
        delegated_actions: { type: array, items: { type: string } }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        reason: { type: string }
        approval_reference: { type: string }
        status: { type: string }
      additionalProperties: true

    CreateDelegationRequest:
      type: object
      required: [delegate_principal_id, delegated_actions, reason]
      properties:
        delegate_principal_id: { type: string }
        delegated_actions: { type: array, items: { type: string } }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        reason: { type: string }
        approval_reference: { type: string }
      additionalProperties: true

    SoDRule:
      type: object
      properties:
        sod_rule_id: { type: string }
        tenant_id: { type: string, nullable: true, description: Null means platform-wide (SOD_RULE_MANAGE_GLOBAL). }
        domain_code: { type: string }
        action_a: { type: string }
        action_b: { type: string }
        conflict_type: { type: string }
        jurisdiction_id: { type: string, nullable: true }
        active_flag: { type: boolean, description: What evaluation reads; changes only when a change is published. }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        publication_status: { type: string, enum: [PENDING_APPROVAL, PUBLISHED, REJECTED], description: 'AU-17: only a PUBLISHED rule can be active.' }
        pending_change: { type: string, nullable: true, enum: [PUBLISH, REACTIVATE, RETIRE] }
        change_requested_by: { type: string, nullable: true }
        change_requested_at: { type: string, format: date-time, nullable: true }
        change_reason: { type: string, nullable: true }
        published_by: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        rejected_by: { type: string, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
      additionalProperties: true

    CreateSoDRuleRequest:
      type: object
      required: [domain_code, action_a, action_b, conflict_type]
      properties:
        domain_code: { type: string }
        action_a: { type: string }
        action_b: { type: string }
        conflict_type: { type: string }
        jurisdiction_id: { type: string }
        tenant_id: { type: string, description: Omit for a platform-wide rule (needs SOD_RULE_MANAGE_GLOBAL). }
        reason_code: { type: string }
        purpose: { type: string }
      additionalProperties: true

    SoDException:
      type: object
      properties:
        sod_exception_id: { type: string }
        sod_rule_id: { type: string }
        principal_id: { type: string }
        compensating_control: { type: string }
        reason: { type: string }
        status: { type: string, enum: [REQUESTED, APPROVED, REJECTED, REVOKED, EXPIRED] }
        effective_from: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
      additionalProperties: true

    CreateSoDExceptionRequest:
      type: object
      required: [sod_rule_id, principal_id, compensating_control, reason, expires_at]
      properties:
        sod_rule_id: { type: string }
        principal_id: { type: string }
        compensating_control: { type: string }
        reason: { type: string }
        effective_from: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Required — exceptions always expire. }
      additionalProperties: true

    ABACRule:
      type: object
      properties:
        abac_rule_id: { type: string }
        tenant_id: { type: string, nullable: true }
        rule_code: { type: string }
        action_type: { type: string }
        effect: { type: string, enum: [REQUIRE, FORBID] }
        attribute_key: { type: string }
        operator: { type: string }
        attribute_value: { type: string, nullable: true }
        active_flag: { type: boolean }
        created_by_principal_id: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        publication_status: { type: string, enum: [PENDING_APPROVAL, PUBLISHED, REJECTED], description: 'AU-17: only a PUBLISHED rule can be active.' }
        pending_change: { type: string, nullable: true, enum: [PUBLISH, REACTIVATE, RETIRE] }
        change_requested_by: { type: string, nullable: true }
        change_requested_at: { type: string, format: date-time, nullable: true }
        change_reason: { type: string, nullable: true }
        published_by: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        rejected_by: { type: string, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
      additionalProperties: true

    WorkloadBinding:
      type: object
      properties:
        workload_id: { type: string }
        tenant_id: { type: string }
        allowed_audience: { type: string }
        allowed_actions: { type: array, items: { type: string } }
        active: { type: boolean }
      additionalProperties: true

    PrivilegedSession:
      type: object
      properties:
        session_id: { type: string }
        principal_id: { type: string }
        requested_actions: { type: array, items: { type: string } }
        ticket_ref: { type: string }
        reason: { type: string }
        duration_seconds: { type: integer }
        resource_scope: { type: string }
        target_environment: { type: string }
        status: { type: string, enum: [ACTIVE, PENDING_APPROVAL, REJECTED, REVOKED, EXPIRED, ENDED] }
        requester_step_up: { $ref: '#/components/schemas/StepUpEvidence' }
        approver_step_up: { $ref: '#/components/schemas/StepUpEvidence' }
      additionalProperties: true

    StepUpEvidence:
      type: object
      properties:
        assurance: { type: string }
        authn_at: { type: string, format: date-time }
        session_context_id: { type: string }
      additionalProperties: true

    CreatePrivilegedSessionRequest:
      type: object
      required: [requested_actions, ticket_ref, reason, duration_seconds, resource_scope, target_environment]
      properties:
        principal_id: { type: string, description: Defaults to the caller. }
        requested_actions: { type: array, items: { type: string } }
        ticket_ref: { type: string }
        reason: { type: string }
        duration_seconds: { type: integer }
        resource_scope: { type: string }
        target_environment: { type: string }
      additionalProperties: true

    BreakGlassSession:
      type: object
      properties:
        session_id: { type: string }
        principal_id: { type: string }
        incident_id: { type: string }
        reason: { type: string }
        requested_actions: { type: array, items: { type: string } }
        status: { type: string, enum: [PENDING_APPROVAL, ACTIVE, REJECTED, REVOKED, EXPIRED] }
        duration_seconds: { type: integer }
        expires_at: { type: string, format: date-time, description: Starts at activation. }
        requested_by: { type: string }
        approvals_required: { type: integer, description: 'AU-02 quorum (AUTHZ_BREAK_GLASS_APPROVALS).' }
        approvals: { type: array, items: { $ref: '#/components/schemas/BreakGlassApproval' } }
        approved_by: { type: string, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        rejected_by: { type: string, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        request_expires_at: { type: string, format: date-time, nullable: true, description: An unanswered request lapses (EXPIRED) after an hour. }
        review_status: { type: string, enum: [NOT_REQUIRED, PENDING, ATTESTED, FLAGGED] }
        requester_step_up: { $ref: '#/components/schemas/StepUpEvidence' }
      additionalProperties: true

    BreakGlassApproval:
      type: object
      properties:
        approver_id: { type: string }
        approved_at: { type: string, format: date-time }
        step_up: { $ref: '#/components/schemas/StepUpEvidence' }

    CreateBreakGlassSessionRequest:
      type: object
      required: [incident_id, reason, requested_actions]
      properties:
        incident_id: { type: string }
        reason: { type: string }
        requested_actions: { type: array, items: { type: string } }
      additionalProperties: true

    SupportSession:
      type: object
      properties:
        session_id: { type: string }
        principal_id: { type: string }
        ticket_ref: { type: string }
        purpose: { type: string }
        tenant_consent_obtained: { type: boolean }
        allowed_actions: { type: array, items: { type: string } }
        allow_bulk_export: { type: boolean }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED, ENDED] }
      additionalProperties: true

    CreateSupportSessionRequest:
      type: object
      required: [ticket_ref, purpose, tenant_consent_obtained]
      properties:
        ticket_ref: { type: string }
        purpose: { type: string }
        tenant_consent_obtained: { type: boolean }
        allowed_actions: { type: array, items: { type: string }, description: Writes a writable session may exercise. }
        allow_bulk_export: { type: boolean, default: false }
        duration_seconds: { type: integer }
      additionalProperties: true

    SessionReviewRequest:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [ATTESTED, FLAGGED] }
        notes: { type: string, description: Required when FLAGGED. }
      additionalProperties: true

    CommandResult:
      type: object
      properties:
        tenant_id: { type: string }
        invalidated: { type: boolean }
      additionalProperties: true

    EffectiveAccess:
      type: object
      properties:
        principal_id: { type: string }
        assignments:
          type: array
          items:
            type: object
            additionalProperties: true
        effective_actions: { type: array, items: { type: string } }
      additionalProperties: true

    EntityScopeValidation:
      type: object
      properties:
        in_scope: { type: boolean }
      additionalProperties: true

    SoDValidation:
      type: object
      properties:
        conflicts:
          type: array
          items:
            type: object
            properties:
              sod_rule_id: { type: string }
              action_a: { type: string }
              action_b: { type: string }
              severity: { type: string }
            additionalProperties: true
      additionalProperties: true

    DelegatedAccessEvaluation:
      type: object
      properties:
        has_delegated_access: { type: boolean }
        basis: { type: string, description: "delegated:from=<delegator> or no_delegated_grant" }
        delegated_actions: { type: array, items: { type: string } }
        held_directly: { type: boolean }
        delegation_id: { type: string, description: "Set when delegator_principal_id was asked about and access is held." }
      additionalProperties: true

    AvailableActions:
      type: object
      properties:
        available_actions: { type: array, items: { type: string } }
      additionalProperties: true

    Capabilities:
      type: object
      properties:
        principal_id: { type: string }
        capabilities: { type: array, items: { type: string } }
      additionalProperties: true

    SessionActivity:
      type: object
      properties:
        session_kind: { type: string, enum: [PRIVILEGED, BREAK_GLASS, SUPPORT] }
        session_id: { type: string }
        granted: { type: integer }
        denied: { type: integer }
        actions: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        decisions: { type: array, items: { $ref: '#/components/schemas/AccessDecision' } }
        truncated: { type: boolean }

    AuthorityLimit:
      type: object
      properties:
        authority_limit_id: { type: string }
        tenant_id: { type: string }
        principal_id: { type: string, nullable: true }
        role_id: { type: string, nullable: true }
        authority_type: { type: string }
        legal_entity_id: { type: string, nullable: true }
        book_id: { type: string, nullable: true }
        org_unit_id: { type: string, nullable: true }
        currency: { type: string }
        lower_limit: { type: string }
        upper_limit: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [PENDING_APPROVAL, ACTIVE, REJECTED, RETIRED, SUPERSEDED], description: Only ACTIVE limits anything. }
        pending_action: { type: string, nullable: true, enum: [RETIRE] }
        supersedes_id: { type: string, nullable: true }
        requested_by: { type: string, nullable: true }
        requested_at: { type: string, format: date-time, nullable: true }
        request_reason: { type: string, nullable: true }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        last_decision: { type: string, nullable: true, enum: [APPROVED, REJECTED] }
        version: { type: integer }

    AuthorityLimitList:
      type: object
      properties:
        authority_limits: { type: array, items: { $ref: '#/components/schemas/AuthorityLimit' } }

    CreateAuthorityLimitRequest:
      type: object
      properties:
        principal_id: { type: string, description: One of principal_id or role_id (create only). }
        role_id: { type: string }
        authority_type: { type: string, description: 'What it governs, e.g. invoice_approval, payment_release (create only).' }
        legal_entity_id: { type: string }
        book_id: { type: string }
        org_unit_id: { type: string }
        currency: { type: string, enum: [GBP, USD, EUR, CAD, AUD, JPY, CHF] }
        lower_limit: { type: string, example: '0' }
        upper_limit: { type: string, example: '25000.00' }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        reason_code: { type: string }
        purpose: { type: string }
        expected_version: { type: integer, description: Change only — the version of the limit being replaced. }
