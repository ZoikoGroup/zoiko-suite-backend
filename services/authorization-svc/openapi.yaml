openapi: "3.1.0"

info:
  title: Authorization Service
  version: "1.0.0"
  description: |
    The platform's policy decision point (ZS-IAM-001). It answers `/v1/authorize`
    and the ZS-IAM-001 §8 canonical decision API, serves the §8.3 inbound
    evaluation APIs, and administers roles, assignments, delegations, SoD, ABAC,
    workload bindings, privileged (JIT), break-glass and support sessions.

    **Identity (register A-01).** Every route except the evaluation routes
    (and probes) identifies the caller by the identity envelope
    identity-context-svc minted, sent as `Authorization: Bearer <envelope>`
    and verified against its JWKS. A presented envelope that does not verify
    is `401 identity_assertion_invalid`. With none, a registered delegate
    service (mTLS certificate CN, never a header) may act for the principal
    it forwards; otherwise `AUTHZ_IDENTITY_ASSERTION=require` (the default
    outside `ENV=local`) answers `401 identity_assertion_required`.

    **Evaluation routes** (`/v1/authorize`, `/v1/sod/evaluate`,
    `/v1/sod/validate`, `/v1/entity-scope/validate`,
    `/v1/delegated-access/evaluate`, every `/internal/*` route) are gated by
    the caller's client certificate (`AUTHZ_EVALUATION_MTLS=require` outside
    `ENV=local`): no certificate is `401 client_certificate_required`; a CN
    not on `AUTHZ_PEP_ALLOWLIST` is `403 workload_not_registered`; an
    `X-Workload-Id` that names anyone but the CN is
    `403 workload_identity_mismatch`. They take the subject from the request
    body, not the identity envelope.

    **Permissions.** Each admin route requires the named Authorization
    Standard (ZS-IAM-001 Appendix A) permission, held at tenant scope unless
    the route says *platform*. Missing it is `403 authorization_denied`, and
    every gate check — including approvals and read gates — is itself
    recorded as a decision. A SUSPENDED / DISABLED / TERMINATED principal is
    refused wherever they hold the permission, with basis
    `principal_status:<status>`.

    **Errors.** `{"error": "<code>", "message": "...", "error_class":
    "<class>"}`. `error` is the stable code callers match on; `error_class`
    is the Governance Control Plane A16 class (`CONTEXT_UNRESOLVED`,
    `AUTHORIZATION_DENIED`, `SOD_CONFLICT`, `APPROVAL_INVALIDATED`,
    `CONCURRENCY_CONFLICT`, `IDEMPOTENCY_MISMATCH`), present where one
    applies.

    **Idempotency.** Every material write honours `Idempotency-Key`: a retry
    returns the first response (`X-Idempotent-Replay: true`, `201` answered
    as `200`); the same key with a different body is
    `409 idempotency_mismatch`. Material writes also require
    `X-Source-Channel` (`400 envelope_incomplete` otherwise).

    **A16 command fields.** Privileged and destructive commands (marked **R**
    in the route summaries) take `reason_code` and/or `purpose`; with
    `AUTHZ_COMMAND_CONTRACT=enforce` (the default) a missing reason is `400
    missing_field`. With `warn` it is admitted and marked
    `X-Command-Contract: violated`.

    **Optimistic concurrency.** Commands marked **V** take an optional
    `expected_version`; a stale one is `409 version_conflict`.

    **Tenant resolution.** The tenant of an evaluation is resolved on the
    server, from `X-Tenant-Id` / body `tenant_id` and
    tenant-entity-registry-svc's entity projection. A claimed tenant that
    disagrees with the registry is `403 tenant_scope_mismatch`; an entity the
    registry does not know is `403 tenant_scope_mismatch`; a tenantless
    request whose principal holds nothing anywhere is `403 tenant_required`
    (or `400 missing_tenant_scope` under
    `AUTHZ_ENFORCE_TENANT_ON_AUTHORIZE=true`).

    **Decision cache.** Decisions are cached in-process for 5 seconds per
    (principal, scope, action, target), grants and denials alike;
    `authorization.cache.invalidated` events drop the entry on every replica
    within a few seconds. A revoked grant can therefore still authorize for
    up to that window on a replica that cached it. `AUTHZ_CACHE_TTL_SECONDS=0`
    disables the cache.

    **Step-up.** Issuing or approving a privileged session and issuing a
    break-glass session need a verified envelope with
    `session_trust_posture.mfa_verified=true` and `auth_time` no older than
    `AUTHZ_SESSION_STEP_UP_MAX_AGE_SECONDS` (900): otherwise `401
    step_up_required`. Certain actions (reopen-class, `AUTHZ_STEP_UP_ACTIONS`)
    need a recent authentication on the request itself: `X-Authn-Age-Seconds`
    within `AUTHZ_STEP_UP_MAX_AUTHN_AGE_SECONDS` (300), else `STEP_UP`.

    **Session maximums (B-01).** JIT 8 h, break-glass 2 h, support 4 h —
    refused (`400`), never silently shortened.

servers:
  - url: http://localhost:8089
    description: Local development
  - url: https://api.zoiko.internal/authorization
    description: Internal cluster ingress (gateway strips the /authorization prefix)

tags:
  - name: Evaluation
    description: The inbound decision APIs other services call (ZS-IAM-001 §8.1–§8.3)
  - name: Roles & Bundles
    description: Role catalogue and permission bundles
  - name: Role Assignments
    description: Assignment grants with maker-checker on privileged roles
  - name: Delegations
    description: Time-boxed delegated authority (ZS-IAM-001 §11)
  - name: Segregation of Duties
    description: SoD rules and compensating-control exceptions (GOV-04)
  - name: ABAC Rules
    description: Attribute-based access rules
  - name: Workload Bindings
    description: Workload identity action bindings (ZS-IAM-001 §16)
  - name: Privileged Sessions
    description: Just-in-time privileged access management (ZS-IAM-001 §13)
  - name: Break-Glass Sessions
    description: Emergency incident sessions (ZS-IAM-001 §14)
  - name: Support Sessions
    description: Purpose-bound tenant support access (ZS-IAM-001 §15)
  - name: Decision Log
    description: ExplainAuthorization — retrieval of recorded decisions (GOV-03)
  - name: GOV-03 Commands
    description: Cache invalidation and effective-access recompute
  - name: Read Surfaces
    description: Available actions and caller capabilities

security:
  - identityEnvelope: []

paths:
  /v1/authorize:
    post:
      tags: [Evaluation]
      summary: Make an authorization decision (ZS-IAM-001 §8.1)
      description: |
        The pipeline: identity → tenant resolution → RBAC (with ABAC conditions)
        → delegation → SoD → JIT/break-glass/support elevation → step-up.
        Decision is `GRANTED`, `DENIED` or `STEP_UP`; the `basis` names the
        layer (`rbac:role=<code>`, `delegated:from=<principal>`,
        `sod:conflict_with=<action>`, `abac:require_failed=<attr>`,
        `principal_status:<status>`, `no_grant`, …). Recorded in
        `access_decision_log` (append-only). Gated by client certificate, not
        the identity envelope.
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - $ref: '#/components/parameters/CorrelationID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/WorkloadID'
        - $ref: '#/components/parameters/AuthnAge'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: A decision was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: tenant_scope_mismatch / tenant_required / workload_not_registered / authorization_denied — fail-closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/StoreUnavailable'

  /internal/authorization/decisions:
    post:
      tags: [Evaluation]
      summary: Canonical authorization decision API (ZS-IAM-001 §8.1/§8.2)
      description: |
        The same pipeline as `/v1/authorize`, with `subject_id`, `action`,
        `resource_*`, `environment`, and the optional session ids; returns the
        §8.2 decision (`PERMIT` / `DENY` / `STEP_UP` / `REQUIRE_APPROVAL`).
        Gated by client certificate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalDecisionRequest'
      responses:
        '200':
          description: A canonical decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/StoreUnavailable'

  /v1/entity-scope/validate:
    post:
      tags: [Evaluation]
      summary: Validate that an entity scope belongs to the caller's tenant
      description: |
        ZS-IAM-001 §8.3. Another principal needs `iam.assignment.read`.
        Gated by client certificate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Principal, legal entity and the tenant to validate against.
              additionalProperties: true
      responses:
        '200':
          description: The scope resolution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityScopeValidation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/sod/validate:
    post:
      tags: [Evaluation]
      summary: Validate proposed grants against SoD rules
      description: ZS-IAM-001 §8.3. Gated by client certificate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Conflicts found, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoDValidation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/sod/evaluate:
    post:
      tags: [Evaluation]
      summary: Evaluate SoD for a principal and action
      description: ZS-IAM-001 §8.3. Gated by client certificate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The SoD evaluation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoDValidation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/delegated-access/evaluate:
    post:
      tags: [Evaluation]
      summary: Evaluate delegated access for a principal and action
      description: |
        ZS-IAM-001 §8.3. Gated by client certificate.

        With `delegator_principal_id` (and `action_type`, then required) the
        question narrows to one delegator: does the principal hold the action
        by a live delegation FROM that principal. The answer then carries
        `delegation_id`. Workflow approval uses this for a delegate acting on a
        stage that names its approver.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                principal_id: { type: string }
                legal_entity_id: { type: string }
                action_type: { type: string }
                delegator_principal_id: { type: string }
              required: [principal_id, legal_entity_id]
              additionalProperties: true
      responses:
        '200':
          description: The delegation evaluation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedAccessEvaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{resource_type}/{resource_id}/available-actions:
    get:
      tags: [Read Surfaces]
      summary: Actions the caller may take on a resource
      description: |
        Classified by the same pipeline as `/v1/authorize`. The legal entity
        must belong to the caller's tenant (`403 tenant_scope_mismatch`
        otherwise). Another principal needs `iam.assignment.read`.

        The router serves this path under two spellings —
        `/v1/{resource_type}/{resource_id}/available-actions` and
        `/v1/{resource}/{id}/available-actions`. They are the same route; the
        document carries the canonical one only, because OpenAPI forbids two
        conflicting templates.
      parameters:
        - name: resource_type
          in: path
          required: true
          schema: { type: string }
        - name: resource_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Available actions for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableActions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/me/capabilities:
    get:
      tags: [Read Surfaces]
      summary: The caller's own capabilities
      description: Uses the verified caller only.
      responses:
        '200':
          description: The caller's capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/access-decisions:
    get:
      tags: [Decision Log]
      summary: List access decisions (GOV-03 ExplainAuthorization)
      description: |
        `iam.policy.read` for the tenant's log. Without it, only the caller's
        own decisions, with `decision_basis` redacted to `"redacted"` and
        matched grants / delegation removed — the reason codes remain.
        Asking for another principal is `403`.
      parameters:
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
          description: Only decisions made in this JIT, break-glass or support session (AU-13).
        - $ref: '#/components/parameters/TenantHeader'
        - name: principal_id
          in: query
          schema: { type: string }
        - name: action_type
          in: query
          schema: { type: string }
        - name: decision
          in: query
          schema: { type: string, enum: [PERMIT, DENY, STEP_UP, REQUIRE_APPROVAL] }
        - name: limit
          in: query
          schema: { type: integer, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of decisions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items: { $ref: '#/components/schemas/AccessDecision' }
                  count: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/access-decisions/{access_decision_id}:
    get:
      tags: [Decision Log]
      summary: Retrieve one decision by id
      description: Another principal's decision without `iam.policy.read` is `404`.
      parameters:
        - name: access_decision_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/roles:
    post:
      tags: [Roles & Bundles]
      summary: Create a role
      description: '`iam.role.manage`. Idempotent on (tenant, role_code): `201` / `200`.'
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceChannel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '200':
          description: Idempotent replay of a role already created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Roles & Bundles]
      summary: List the tenant's roles
      description: '`iam.role.read`. Tenant-scoped catalogue.'
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/LegalEntityHeader'
      responses:
        '200':
          description: The tenant's roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/roles/{role_id}/retire:
    post:
      tags: [Roles & Bundles]
      summary: Retire a role (R, V)
      description: '`iam.role.manage`. Takes `reason_code` or `purpose` and optional `expected_version`.'
      parameters:
        - name: role_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        $ref: '#/components/requestBodies/CommandBody'
      responses:
        '200':
          description: Role retired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Forbidden — including `self_grant_not_allowed` on reactivation of a held role.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict — `version_conflict`, or `sod_conflict` naming the holders.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/admin/roles/{role_id}/reactivate:
    post:
      tags: [Roles & Bundles]
      summary: Reactivate a role (R, V)
      description: '`iam.role.manage`. Reactivating a role you hold is `403 self_grant_not_allowed`; reactivating one that would give a holder an SoD conflict is `409 sod_conflict` listing the holders.'
      parameters:
        - name: role_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        $ref: '#/components/requestBodies/CommandBody'
      responses:
        '200':
          description: Role reactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Forbidden — including `self_grant_not_allowed`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict — `version_conflict` or `sod_conflict`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/admin/roles/{role_id}/permission-bundles:
    post:
      tags: [Roles & Bundles]
      summary: Create or replace a permission bundle (V)
      description: |
        `iam.permission_bundle.manage` — *platform* if the bundle names a
        protected platform-admin permission (`SOD_RULE_MANAGE_GLOBAL`,
        `ABAC_RULE_MANAGE_GLOBAL`, `security.*`, `platform.*`). Replace only:
        `201` created / `200` replaced. Refused on a role you hold (`403`) or
        if it gives a holder an SoD conflict (`409`).
      parameters:
        - name: role_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceChannel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionBundleRequest'
      responses:
        '201':
          description: Bundle created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionBundle'
        '200':
          description: Bundle replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionBundle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Roles & Bundles]
      summary: List a role's permission bundles
      description: '`iam.role.read`. Includes retired bundles.'
      parameters:
        - name: role_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The role's bundles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permission_bundles:
                    type: array
                    items: { $ref: '#/components/schemas/PermissionBundle' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/permission-bundles/{permission_bundle_id}/retire:
    post:
      tags: [Roles & Bundles]
      summary: Retire a permission bundle (R, V)
      description: '`iam.permission_bundle.manage`.'
      parameters:
        - name: permission_bundle_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        $ref: '#/components/requestBodies/CommandBody'
      responses:
        '200':
          description: Bundle retired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionBundle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/permission-bundles/{permission_bundle_id}/reactivate:
    post:
      tags: [Roles & Bundles]
      summary: Reactivate a permission bundle (R, V)
      description: '`iam.permission_bundle.manage`. Reactivation checks self-grant and SoD as creation does.'
      parameters:
        - name: permission_bundle_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        $ref: '#/components/requestBodies/CommandBody'
      responses:
        '200':
          description: Bundle reactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionBundle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/role-assignments:
    post:
      tags: [Role Assignments]
      summary: Grant a role assignment (maker-checker on privileged roles)
      description: |
        `iam.assignment.grant` (*platform* for `legal_entity_id` = the
        platform scope). Self-assignment `403`; SoD conflict at the
        assignment's scope `409`. A privileged role (one granting any `iam.*`
        or protected platform action), or a platform-scope assignment by a
        caller without `iam.assignment.approve_privileged`, is recorded
        `PENDING_APPROVAL` (`202`) and grants nothing until approved; with it,
        `201` `APPROVED`, `approved_by` = caller.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceChannel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleAssignmentRequest'
      responses:
        '201':
          description: Assignment approved and active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '202':
          description: PENDING_APPROVAL — recorded but granting nothing until an independent approver approves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Forbidden — including `self_grant_not_allowed`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'Conflict — `sod_conflict` at the assignment scope, or `idempotency_mismatch`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Role Assignments]
      summary: List role assignments
      description: '`iam.assignment.read`. Shows `approval_status`.'
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - name: principal_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The tenant's assignments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  role_assignments:
                    type: array
                    items: { $ref: '#/components/schemas/RoleAssignment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/role-assignments/{assignment_id}/approve:
    post:
      tags: [Role Assignments]
      summary: Approve a pending assignment (R)
      description: |
        `iam.assignment.approve_privileged` (*platform* for a platform-scope
        assignment). The checker must be neither the requester nor the target
        (`403 checker_not_independent`); approval re-runs the SoD check.
        Pending requests expire after 72 h (`409 approval_expired`).
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        $ref: '#/components/requestBodies/CommandBody'
      responses:
        '200':
          description: Assignment approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Forbidden — including `checker_not_independent`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict — `approval_expired`, `sod_conflict` after re-check, or `version_conflict`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/admin/role-assignments/{assignment_id}/reject:
    post:
      tags: [Role Assignments]
      summary: Reject a pending assignment (R)
      description: '`iam.assignment.approve_privileged` (*platform* for a platform-scope assignment).'
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        $ref: '#/components/requestBodies/CommandBody'
      responses:
        '200':
          description: Assignment rejected and grants nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/role-assignments/{assignment_id}/revoke:
    post:
      tags: [Role Assignments]
      summary: Revoke an assignment (R)
      description: '`iam.assignment.revoke` (*platform* for a platform-scope assignment). `{"effective_to": ...}` schedules the end instead of ending now.'
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
                purpose: { type: string }
                effective_to:
                  type: string
                  format: date-time
                expected_version: { type: integer }
              additionalProperties: true
      responses:
        '200':
          description: Assignment revoked or scheduled to end.
