        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  parameters: {}
  responses:
    BadRequest:
      description: The request is malformed, or a mandatory field or query parameter is missing or invalid.
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unauthenticated:
      description: The caller's identity or tenant scope is missing (identity_missing, tenant_scope_missing).
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: The caller does not hold the authorization action the operation needs, or the family of the exception is AK-AUTH (a cross-entity or segregation-of-duties refusal).
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: The record does not exist for the tenant. Another tenant's record is indistinguishable from none.
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: The request conflicts with the state of the record, with a closed or sealed period (AK-PERIOD), with a duplicate (AK-DUP) or with a concurrent change (AK-CONC).
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unprocessable:
      description: A deterministic accounting exception (AK-RULE, AK-COA, AK-DIM, AK-BAL, AK-FX, AK-TAX, AK-DATA). Nothing was written; the body says which control refused and why.
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unavailable:
      description: A dependency the operation cannot proceed without is unavailable (authorization, period, currency or evidence service; AK-EXT). The operation fails closed and can be retried.
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
