        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: RunRevaluation
      tags: [revaluation-runs]
      summary: 'Values the open foreign monetary items of a book at the closing rate and posts the unrealized difference,...'
      description: |
        Values the open foreign monetary items of a book at the closing rate and posts the unrealized difference, with its
        reversal on the first day of the next period. One run exists per entity, book and period: asking again returns it.

        Needs the authorization action(s): GL_REVALUATION_RUN.
