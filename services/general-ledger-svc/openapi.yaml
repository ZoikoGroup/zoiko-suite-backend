        family: {type: string, description: 'The exception family: AK-AUTH, AK-PERIOD, AK-RULE, AK-COA, AK-DIM, AK-BAL, AK-FX, AK-TAX, AK-DUP, AK-CONC, AK-EXT or AK-DATA.'}
