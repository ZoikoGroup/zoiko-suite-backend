openapi: 3.0.3

# general-ledger-svc - Global Accounting Kernel (standard ZS-ACC-KERNEL-001).
#
# This file describes the kernel's /v1 API: the routes registered by RegisterKernelRoutes (books, accounting events, posting rules and
# postings, dimensions, reconciliation, revaluation, snapshots and period seals, allocation, consolidation, migration and cutover, and the
# rollout readiness check). The older ledger routes of this service (journals, accounts, trial balance) are not described here.
#
# The paths, operations and request/response shapes below are generated from the code and kept in step with the router by a test
# (internal/handler/openapi_parity_test.go).
#
# THINGS A CLIENT CANNOT GUESS FROM THE PATHS
#
#  1. IDENTITY. Every operation needs X-Principal-Id (401 identity_missing without it) and a tenant (X-Tenant-Id, 401 tenant_scope_missing
#     without it). X-Legal-Entity-Id scopes the authorization check to one legal entity; without it the check is made at tenant level.
#     X-Correlation-ID is carried into the events the operation raises.
#
#  2. AUTHORIZATION. Each operation names the authorization-svc action(s) it needs in x-authorization-actions. A missing right is 403
#     authorization_denied. The check fails closed: when authorization-svc cannot answer, the answer is 503, never "allowed". Approving,
#     posting and reconciling are separate actions from preparing, so the person who prepared a record cannot also approve it (403
#     separation_of_duties; the database holds the same rule).
#
#  3. FAILURES. Every failure body is the Problem schema. A deterministic accounting exception carries its family and code:
#        AK-AUTH 403, AK-PERIOD 409, AK-DUP 409, AK-CONC 409, AK-EXT 503, and AK-RULE, AK-COA, AK-DIM, AK-BAL, AK-FX, AK-TAX, AK-DATA 422.
#     An exception means nothing was written. 503 means a dependency (authorization, period, currency, evidence) could not answer.
#
#  4. REPEATS. Commands that create work (registering an accounting event, posting, allocation, consolidation and revaluation runs,
#     staging and posting a migration batch) are idempotent: the identity of the work is in the request (the event's idempotency_key and
#     producer ids; the run's entity, book, period and kind), and a repeat returns the earlier result with 200 where the first call
#     returned 201. The same identity with different content is refused rather than overwritten.
#
#  5. NOTHING IS REWRITTEN. A posted journal, a snapshot, a seal, a migration batch's lines and every history are append-only; the database
#     refuses an update. A mistake is corrected by a reversal, a correcting event or a correction batch, each with its own lineage. A
#     posting into a sealed period is refused (409 AK-PERIOD).
#
#  6. MONEY AND DATES. Amounts are decimal strings, never floating point. Dates are YYYY-MM-DD, instants RFC 3339, periods YYYY-MM.
#     The ledger stores two decimals; transaction amounts and rates are kept at the precision they were given.
#
#  7. LISTS. List operations return an object holding the list and its total, and are bounded; those that can run long take limit and
#     after (the last ledger entry or id already seen) to page.

info:
  title: general-ledger-svc - Global Accounting Kernel
  version: "1.0.0"
  description: Books, accounting events, versioned posting rules, postings, dimensions, reconciliation, revaluation, snapshots, period seals, allocation, consolidation and migration for the ZoikoSuite general ledger.

servers:
  - url: http://localhost:8098

security:
  - principal: []

tags:
  - {name: accounting-books, description: "Books: one per legal entity and purpose, with their own framework, currency and calendar."}
  - {name: accounting-events, description: "Canonical accounting events from the business domains, and how far each has been posted."}
  - {name: accounting-postings, description: "The posting command: an event becomes a balanced journal in a book, atomically."}
  - {name: posting-rule-sets, description: "Versioned posting rules: draft, test, approve and activate by different people."}
  - {name: posting-rule-packs, description: "Ready-made rule packs that instantiate as draft rule sets."}
  - {name: posting-evaluations, description: "Dry-run evaluation of a posting. Nothing is written."}
  - {name: posting-traces, description: "The lineage of a posting: event, rule version, execution and journals."}
  - {name: dimensions, description: "The dimension registry and its effective-dated values."}
  - {name: dimension-values, description: "Dimension values."}
  - {name: account-applicability, description: "Where an account may be used and how its lines are classified: books, currency, control type, dimension policy, replacement."}
  - {name: balance-snapshots, description: "Signed balance snapshots, their verification and the trace of an account back to its sources."}
  - {name: close-evidence, description: "What the kernel can say about whether a period of an entity is ready to close."}
  - {name: period-seals, description: "Sealing a period at a ledger watermark, and reopening it under named authority."}
  - {name: reconciliation-runs, description: "Reconciliation of subledgers, bank, intercompany, snapshots and event postings; breaks are governed cases."}
  - {name: reconciliation-status, description: "The reconciliation picture of one scope for the period close."}
  - {name: reconciliation-tolerances, description: "Versioned reconciliation thresholds."}
  - {name: revaluation-runs, description: "Revaluation of open foreign monetary items at the closing rate."}
  - {name: foreign-positions, description: "Open foreign monetary positions of a book."}
  - {name: fx-rates, description: "Sourced exchange rates."}
  - {name: fx-rate-overrides, description: "Hand-keyed rates that need a second person's approval."}
  - {name: fx-rate-resolutions, description: "Which rate a posting would use."}
  - {name: allocation-rules, description: "Allocation rules: spread a pool over recipients, in this entity or across entities."}
  - {name: allocation-runs, description: "Allocation runs and their reversal."}
  - {name: consolidation-groups, description: "Consolidation groups, members, account mappings and group adjustments."}
  - {name: consolidation-adjustments, description: "Group policy adjustments: proposed, approved or withdrawn."}
  - {name: consolidation-runs, description: "Consolidation runs: freeze, translate, eliminate, post the group book; certify or supersede."}
  - {name: intercompany-pairings, description: "How the members' intercompany positions pair up."}
  - {name: counterparty-balances, description: "Customer and supplier positions on a control type, for comparing a subledger."}
  - {name: book-comparison, description: "The consequences of one event in each book, side by side."}
  - {name: migration-batches, description: "Opening balances: stage, validate, approve, post inside a cutover window, reconcile and freeze."}
  - {name: rollout-readiness, description: "Whether a tenant's reference data is ready for the kernel to post a given kind of event."}

paths:
  /v1/account-applicability/{account_code}:
    get:
      operationId: GetAccountScope
      tags: [account-applicability]
      summary: 'Reports where an account may be used and who owns it'
      description: |
        Reports where an account may be used and who owns it: the books it is valid in (none listed = every book),
        its currency restriction, its control type and whether its lines need a counterparty.

        Needs the authorization action(s): COA_ACCOUNT_VIEW.
      x-authorization-actions: [COA_ACCOUNT_VIEW]
      parameters:
        - name: account_code
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scopeBody'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: SetAccountScope
      tags: [account-applicability]
      summary: 'Sets an account''s books, currency, control type, counterparty rule, dimension policy and replacement account'
      description: |
        Sets an account's books, currency, control type, counterparty rule, dimension policy and replacement account. An empty body
        lifts every restriction.

        Needs the authorization action(s): COA_ACCOUNT_AMEND.
      x-authorization-actions: [COA_ACCOUNT_AMEND]
      parameters:
        - name: account_code
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/scopeBody'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scopeBody'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-books:
    get:
      operationId: ListBooks
      tags: [accounting-books]
      summary: 'List books'
      description: 'Needs the authorization action(s): GL_BOOK_READ.'
      x-authorization-actions: [GL_BOOK_READ]
      parameters:
        - name: legal_entity_id
          in: query
          required: false
          schema: {type: string}
        - name: status
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: CreateBook
      tags: [accounting-books]
      summary: 'Create book'
      description: 'Needs the authorization action(s): GL_BOOK_MANAGE.'
      x-authorization-actions: [GL_BOOK_MANAGE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-books/{id}:
    get:
      operationId: GetBook
      tags: [accounting-books]
      summary: 'Get book'
      description: 'Needs the authorization action(s): GL_BOOK_READ.'
      x-authorization-actions: [GL_BOOK_READ]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-books/{id}/activate:
    post:
      operationId: bookStatus_activate
      tags: [accounting-books]
      summary: 'Move an accounting book to ACTIVE'
      description: 'Needs the authorization action(s): GL_BOOK_MANAGE.'
      x-authorization-actions: [GL_BOOK_MANAGE]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/versionBody'
      responses:
        '200':
          description: Done, or the earlier result of the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-books/{id}/retire:
    post:
      operationId: bookStatus_retire
      tags: [accounting-books]
      summary: 'Move an accounting book to RETIRED'
      description: 'Needs the authorization action(s): GL_BOOK_MANAGE.'
      x-authorization-actions: [GL_BOOK_MANAGE]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/versionBody'
      responses:
        '200':
          description: Done, or the earlier result of the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-books/{id}/suspend:
    post:
      operationId: bookStatus_suspend
      tags: [accounting-books]
      summary: 'Move an accounting book to SUSPENDED'
      description: 'Needs the authorization action(s): GL_BOOK_MANAGE.'
      x-authorization-actions: [GL_BOOK_MANAGE]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/versionBody'
      responses:
        '200':
          description: Done, or the earlier result of the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-events:
    get:
      operationId: ListEvents
      tags: [accounting-events]
      summary: 'List events'
      description: 'Needs the authorization action(s): GL_EVENT_READ.'
      x-authorization-actions: [GL_EVENT_READ]
      parameters:
        - name: legal_entity_id
          in: query
          required: false
          schema: {type: string}
        - name: event_type
          in: query
          required: false
          schema: {type: string}
        - name: source_object_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: RegisterEvent
      tags: [accounting-events]
      summary: 'Register event'
      description: |
        This is RegisterAccountingEvent: 201 for a new event, 200 with the original for a replay of the same event.

        Needs the authorization action(s): GL_EVENT_REGISTER.
      x-authorization-actions: [GL_EVENT_REGISTER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingEvent'
      responses:
        '200':
          description: Done, or the earlier result of the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEvent'
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEvent'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-events/incomplete:
    get:
      operationId: ListIncompleteEvents
      tags: [accounting-events]
      summary: 'Lists the entity''s recent accounting events that are not complete across their books'
      description: |
        Lists the entity's recent accounting events that are not complete across their books. It looks at the most recent
        events (scan, at most 500) and skips those registered less than min_age_minutes ago, so an event still on its way is not reported.

        Needs the authorization action(s): GL_POSTING_VIEW.
      x-authorization-actions: [GL_POSTING_VIEW]
      parameters:
        - name: legal_entity_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncompleteResult'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-events/{id}:
    get:
      operationId: GetEvent
      tags: [accounting-events]
      summary: 'Get event'
      description: 'Needs the authorization action(s): GL_EVENT_READ.'
      x-authorization-actions: [GL_EVENT_READ]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEvent'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-events/{id}/posting-status:
    get:
      operationId: GetEventPostingStatus
      tags: [accounting-events]
      summary: 'Says how far one accounting event''s consequences have come across the books of its entity'
      description: |
        Says how far one accounting event's consequences have come across the books of its entity (standard §4, §37):
        COMPLETE when every book that must carry it has posted, INCOMPLETE — naming the books still outstanding and why — until then.

        Needs the authorization action(s): GL_POSTING_VIEW.
      x-authorization-actions: [GL_POSTING_VIEW]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingStatus'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/accounting-postings:
    post:
      operationId: PostEvent
      tags: [accounting-postings]
      summary: 'Post event'
      description: |
        This is the kernel's posting command: it turns an accounting event into a posted journal in one book, atomically and
        exactly once per event, book and basis. A repeat answers 200 with the consequence that already exists.

        Needs the authorization action(s): GL_POSTING_EXECUTE.
      x-authorization-actions: [GL_POSTING_EXECUTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '200':
          description: Done, or the earlier result of the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResult'
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResult'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/allocation-rules:
    get:
      operationId: ListAllocationRules
      tags: [allocation-rules]
      summary: 'List allocation rules'
      description: 'Needs the authorization action(s): GL_ALLOCATION_READ.'
      x-authorization-actions: [GL_ALLOCATION_READ]
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: CreateAllocationRule
      tags: [allocation-rules]
      summary: 'Create allocation rule'
      description: 'Needs the authorization action(s): GL_ALLOCATION_MANAGE.'
      x-authorization-actions: [GL_ALLOCATION_MANAGE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocRuleRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocRule'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/allocation-rules/{id}:
    get:
      operationId: GetAllocationRule
      tags: [allocation-rules]
      summary: 'Get allocation rule'
      description: 'Needs the authorization action(s): GL_ALLOCATION_READ.'
      x-authorization-actions: [GL_ALLOCATION_READ]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocRule'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/allocation-rules/{id}/approve:
    post:
      operationId: ApproveAllocationRule
      tags: [allocation-rules]
      summary: 'Approve allocation rule'
      description: 'Needs the authorization action(s): GL_ALLOCATION_APPROVE.'
      x-authorization-actions: [GL_ALLOCATION_APPROVE]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Done, or the earlier result of the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocRule'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/allocation-rules/{id}/retire:
    post:
      operationId: RetireAllocationRule
      tags: [allocation-rules]
      summary: 'Retire allocation rule'
      description: 'Needs the authorization action(s): GL_ALLOCATION_APPROVE.'
      x-authorization-actions: [GL_ALLOCATION_APPROVE]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Done, or the earlier result of the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocRule'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/allocation-runs:
    get:
      operationId: ListAllocationRuns
      tags: [allocation-runs]
      summary: 'List allocation runs'
      description: 'Needs the authorization action(s): GL_ALLOCATION_READ.'
      x-authorization-actions: [GL_ALLOCATION_READ]
      parameters:
        - name: legal_entity_id
          in: query
          required: false
          schema: {type: string}
        - name: fiscal_period
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: The result.
          content:
