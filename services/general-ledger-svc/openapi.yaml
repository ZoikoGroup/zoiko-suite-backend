      summary: 'Reports whether the rules a tenant is about to run'
      description: |
        Reports whether the rules a tenant is about to run (a named standard pack, or every ACTIVE rule set)
        can resolve everything they name: account mapping keys, the accounts behind them and the dimensions they require. It is
        read-only. GET /v1/rollout-readiness?pack=<name>&on=YYYY-MM-DD

        Needs the authorization action(s): GL_RULE_READ.
      x-authorization-actions: [GL_RULE_READ]
      parameters:
