  schemas:
    Envelope:
      type: object
      description: The CloudEvents structured envelope every event is wrapped in.
      required: [specversion, id, source, type, time, datacontenttype, dataschema, tenantid, residencyregion, classification, schemaversion, payloadhash, data]
      properties:
        specversion: {type: string, const: '1.0'}
        id: {type: string, description: Allocated before the producing transaction commits and never replaced; a publish retry re-sends it.}
        source: {type: string}
        type: {type: string}
        subject: {type: string}
        time: {type: string, format: date-time}
        datacontenttype: {type: string, const: application/json}
        dataschema: {type: string}
        tenantid: {type: string}
        legalentityid: {type: string}
        bookid: {type: string}
        aggregateid: {type: string}
        aggregateversion: {type: integer}
        correlationid: {type: string}
        causationid: {type: string}
        requestid: {type: string}
        effectiveat: {type: string, format: date-time}
        actorid: {type: string, description: An opaque principal id.}
        jurisdiction: {type: string}
        residencyregion: {type: string}
        classification: {type: string, enum: [public, internal, confidential, restricted]}
        schemaversion: {type: string}
        payloadhash: {type: string}
        traceparent: {type: string}
        data: {type: object, description: The event's own payload.}
