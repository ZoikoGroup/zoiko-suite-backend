# docker-compose.yml — local development stack for audit-event-store-svc
#
# Starts:
#   postgres              — PostgreSQL 16. DB: audit_event_store, user: postgres, pass: postgres.
#                           Accessible at localhost:5432.
#   kafka                 — Kafka 3.x in KRaft mode (no ZooKeeper required).
#                           Accessible from the host at localhost:9092.
#   audit-event-store-svc — The service itself, built from the Dockerfile in the parent dir.
#                           Health probe at http://localhost:8080/healthz
#
# Resource limits (per container):
#   postgres  — 0.5 CPU, 256 MB RAM   (light; handles low-volume local ingestion)
#   kafka     — 1.0 CPU, 512 MB RAM   (KRaft broker needs headroom for JVM + OS page cache)
#   audit-svc — 0.25 CPU, 128 MB RAM  (statically-linked Go binary; very lean)
#
# Log limits: all containers cap at 10 MB / 3 rotated files to prevent unbounded disk use.
#
# REDUCED DEVELOPMENT TOPOLOGY (deliberate, not a parity bug):
#   This stack is a deliberately minimal single-service sandbox, NOT an
#   equivalent of the platform deployment in <repo-root>/deployments/
#   docker-compose.yml. Two consequences are intentional and documented so
#   nobody mistakes them for drift:
#
#   1. TOPICS. KAFKA_TOPICS below lists two topics, not the ~79 platform-wide
#      `zoiko.*.events` topics the platform stack subscribes this service to
#      (AUD-01 universal ingestion). A reduced topic set is enough to exercise
#      the consumer loop locally; it does NOT consume the complete platform
#      event set. Use the platform stack to validate full ingestion.
#   2. AUTHORIZATION. No authorization-svc runs here. AUTHZ_SERVICE_URL is set
#      explicitly anyway (rather than left to the compiled-in default) so the
#      dependency is visible: with it unreachable, every business route fails
#      CLOSED with 503 (never a silent 200) — see internal/handler/authorize.
#      /healthz and /readyz are unaffected and still serve 200.
#
#   Both are configuration, not code: the service's behaviour (six routes, all
#   gated on principal + tenant, fail-closed RBAC) is identical in both stacks.
#
# Usage:
#   docker compose up --build          # build & start everything
#   docker compose up -d --build       # background mode
#   docker compose logs -f             # tail all logs
#   docker compose logs -f audit-svc  # tail service logs only
#   docker compose down -v             # stop and remove volumes
#
# Produce a test message (requires kafkacat / kcat):
#   kcat -P -b localhost:9092 -t zoiko.identity.events \
#        -H "X-Event-ID=test-evt-001" \
#        <<< '{"event_type":"identity.context.resolved","emitted_at":"2026-07-06T08:00:00Z","schema_version":"1.0","source_service":"identity-context-svc","payload":{"principal_id":"u-001","tenant_id":"t-001","legal_entity_id":"e-001","session_context_id":"s-001","correlation_id":"c-001"}}'
#
# Verify events landed:
#   psql "host=localhost dbname=audit_event_store user=postgres password=postgres sslmode=disable" \
#        -c "SELECT event_id, event_type, tenant_id, stored_at FROM audit_events ORDER BY stored_at;"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: audit-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: audit_event_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # All five migrations, applied in filename order on first init so the
      # local schema matches production: initial schema, hash-chain fields,
      # audit_events RLS (000003), archive tables (000004) and archive tenant
      # isolation (000005). initdb only runs on an EMPTY volume — an existing
      # dev volume from before this change keeps its old schema; `docker
      # compose down -v` drops it for a clean rebuild.
      - ./migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/000002_add_hash_chain_fields.up.sql:/docker-entrypoint-initdb.d/002_hash_chain_fields.sql:ro
      - ./migrations/000003_add_rls.up.sql:/docker-entrypoint-initdb.d/003_rls.sql:ro
      - ./migrations/000004_add_archives.up.sql:/docker-entrypoint-initdb.d/004_archives.sql:ro
      - ./migrations/000005_add_archive_tenant_isolation.up.sql:/docker-entrypoint-initdb.d/005_archive_tenant_isolation.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audit_event_store"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Kafka (KRaft mode — no ZooKeeper) ─────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: audit-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9094,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      CLUSTER_ID: "audit-event-store-local-dev"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── audit-event-store-svc ─────────────────────────────────────────────────
  audit-svc:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: audit-event-store-svc
    image: audit-event-store-svc:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: audit_event_store
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      KAFKA_BROKERS: "kafka:9094"
      KAFKA_GROUP_ID: audit-event-store-svc
      # Reduced dev topic set — see REDUCED DEVELOPMENT TOPOLOGY note at the
      # top of this file. The platform stack subscribes to the full ~79-topic
      # set for AUD-01 universal ingestion; this sandbox does not.
      KAFKA_TOPICS: "zoiko.identity.events,zoiko.entity.events"
      # Explicit rather than relying on the compiled-in default, so the
      # authorization dependency is visible. No authorization-svc runs in this
      # stack, so business routes fail closed with 503 — by design.
      AUTHZ_SERVICE_URL: "http://authorization-svc:8089"
      GOMAXPROCS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
