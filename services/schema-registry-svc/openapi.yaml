openapi: "3.1.0"

info:
  title: Schema Registry Service
  version: "1.2.0"
  description: |
    Canonical registry of event payload contracts for ZoikoSuite.

    Implements the schema-governance requirements of
    docs/architecture/04-data-model.md §2.12 and §17: all event schemas are
    centrally registered, compatibility mode is declared per version, and
    breaking changes are possible only under an explicitly recorded exemption.
    Access to the registry is protected per docs/architecture/05-security.md
    §14.6.

    **Invariants**
    - Versions are immutable and append-only. There is no update and no delete
      route, and the database enforces it: triggers on `event_schemas` reject
      UPDATE, DELETE and TRUNCATE (migration 000005); INSERT is unaffected. The
      primary key alone would not do this — it only refuses a duplicate key.
      Evolution registers a new version and the old one stays readable
      forever. (A database superuser or table owner can still disable the
      triggers; that is an administrative act, not something the service does.)
    - The version number is assigned by the service, never by the caller. Two
      concurrent registrations cannot collide — the later one is refused with
      409 and must re-read and resubmit, because its schema was checked against
      a version that is no longer latest.
    - Compatibility is evaluated against the current latest version only, and
      only under `BACKWARD` (the default); `NONE` skips the check and is
      recorded on the version. The analysis recurses into nested object
      properties and array item schemas, but it compares a **subset** of JSON
      Schema only: the declared `type` (a single string), `properties`,
      `required`, and the `items` schema of arrays. It does NOT compare `enum`,
      `format`, `pattern`, numeric or length bounds, `additionalProperties`,
      `$ref`, or `allOf`/`anyOf`/`oneOf`; a change confined to those is
      accepted. A schema that declares `type` as an array (for example
      `["string","null"]`) is refused at registration with 400, because it
      cannot be compared. Violations are returned in a stable, sorted order.
    - Reads require a verified principal (`X-Principal-Id`). No separate read
      permission is checked — the requirement for one is not specified.
    - Registration is governed: authorization-svc must grant SCHEMA_PUBLISH on
      the caller's legal entity, or on the platform scope when the request names
      none. An unreachable authorization service refuses the write
      (fail-closed); it is never treated as permission.
    - Idempotency: `Idempotency-Key` is required on registration by the
      canonical service input contract. A retry with a key already used for the
      same event returns the originally stored version (201) instead of
      claiming a new one. The key is scoped to the event name; whether it is
      also bound to the request body or the principal is not specified, so a
      different body under the same key also receives the original version.
    - This registry records what a contract is meant to be. Nothing validates
      published events against it at runtime.

servers:
  - url: http://localhost:8093
    description: Local development
  - url: https://api.zoiko.internal/schema-registry-svc
    description: Internal cluster ingress

tags:
  - name: Schemas
    description: Event contract registration and lookup
  - name: Health
    description: Liveness and readiness probes

paths:
  /v1/schemas:
    get:
      tags: [Schemas]
      summary: List every event name with at least one registered version
      security:
        - GatewayIdentity: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Event names, sorted, one page. Empty array when nothing is registered or the page is beyond the end — never null.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
              example: ["entity.status.changed", "jurisdiction.rule.updated"]
        "400":
          $ref: "#/components/responses/InvalidPaging"
        "401":
          $ref: "#/components/responses/IdentityMissing"
        "503":
          $ref: "#/components/responses/StoreUnavailable"

  /v1/schemas/{eventName}/versions:
    parameters:
      - $ref: "#/components/parameters/EventName"
    get:
      tags: [Schemas]
      summary: List every registered version of an event, oldest first
      security:
        - GatewayIdentity: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of versions. A page beyond the end of an existing event's history is an empty array.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventSchema" }
        "400":
          $ref: "#/components/responses/InvalidPaging"
        "401":
          $ref: "#/components/responses/IdentityMissing"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    post:
      tags: [Schemas]
      summary: Register the next version of an event's payload schema
      description: |
        The version number is assigned by the service from the current maximum.
        The caller does not supply it and cannot influence it.

        Order of checks: canonical envelope, then identity, then the
        SCHEMA_PUBLISH grant, then the event name, then idempotent replay, then
        the body. An unauthenticated or unauthorized caller therefore learns
        nothing about what the service considers a well-formed name or schema.

        A 409 carries two distinct meanings, distinguished by the body:
        a `violations` array means the proposed schema breaks the current
        contract and must be changed; its absence means a concurrent
        registration claimed the version and the request should be re-checked
        against the new latest and resubmitted unchanged.
      security:
        - GatewayIdentity: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/LegalEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterSchemaRequest" }
      responses:
        "201":
          description: |
            Registered — or, when `Idempotency-Key` was already used for this
            event, the originally stored version (also 201; no replay marker is
            defined). The body carries the assigned version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSchema" }
        "400":
          description: |
            One of: the canonical service input contract is incomplete
            (`envelope_incomplete`, with `violations`); the event name is not
            dotted lowercase or exceeds 255 characters; the body is malformed or
            contains an unknown field; `json_schema` is missing, is not a JSON
            object, is empty, or has a `properties`/`required`/`type` the
            registry cannot read (including `type` given as an array);
            `owning_service` exceeds 255 characters; or `compatibility_mode` is
            one this service cannot enforce — an unrecognised mode is refused
            rather than defaulted to BACKWARD, so the registry never records a
            discipline it is not applying.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/EnvelopeError"
        "401":
          description: |
            No verified principal or tenant — the request did not carry
            gateway-resolved identity (`caller identity missing`, or
            `envelope_incomplete` when the missing field is the tenant or actor).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/EnvelopeError"
        "403":
          description: authorization-svc denied SCHEMA_PUBLISH for this principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Incompatible schema, or a lost version race. See the description above.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IncompatibleSchemaError"
                  - $ref: "#/components/schemas/Error"
              examples:
                incompatible:
                  summary: Breaks the current contract
                  value:
                    error: "incompatible schema change"
                    violations:
                      - "field \"tenant_id\" was required and has been removed"
                raced:
                  summary: Concurrent registration won
                  value:
                    error: "a concurrent registration claimed this version — re-read the latest version and retry"
        "503":
          description: |
            The store or authorization-svc could not be reached. Nothing was
            written — this is never treated as permission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/schemas/{eventName}/versions/latest:
    parameters:
      - $ref: "#/components/parameters/EventName"
    get:
      tags: [Schemas]
      summary: The current contract for an event
      security:
        - GatewayIdentity: []
      responses:
        "200":
          description: The highest-numbered version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSchema" }
        "401":
          $ref: "#/components/responses/IdentityMissing"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"

  /v1/schemas/{eventName}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/EventName"
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Schemas]
      summary: One specific version
      security:
        - GatewayIdentity: []
      responses:
        "200":
          description: The requested version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSchema" }
        "400":
          description: version was not an integer, or was less than 1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/IdentityMissing"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"

  /healthz:
    get:
      tags: [Health]
      summary: Liveness
      responses:
        "200":
          description: Process is alive. Body `{"status":"ok"}`.

  /readyz:
    get:
      tags: [Health]
      summary: Readiness
      responses:
        "200":
          description: Ready — the database responded. Body `{"status":"ok"}`.
        "503":
          description: Not ready — the database did not respond. Body `{"status":"unavailable","reason":"db_unreachable"}`.

components:
  securitySchemes:
    GatewayIdentity:
      type: apiKey
      in: header
      name: X-Principal-Id
      description: |
        Set by Traefik from gateway-auth-svc's ForwardAuth verification of the
        caller's signed identity envelope. The service does not parse tokens
        itself; a request without this header never passed verification and is
        refused with 401. Required on every `/v1/schemas` route, reads included.

  parameters:
    EventName:
      name: eventName
      in: path
      required: true
      description: |
        Dotted lowercase name with at least two segments, at most 255
        characters. A name that cannot be registered reads as 404 on a GET and
        is refused with 400 on a POST (after authentication and authorization).
      schema:
        type: string
        maxLength: 255
        pattern: '^[a-z][a-z0-9]*(\.[a-z0-9]+)+$'
      example: entity.status.changed
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      description: Page size. Anything outside 1–500, or not an integer, is 400.
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
      description: Rows to skip. Negative or not an integer is 400.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on registration by the canonical service input contract. A
        retry with a key already used for the same event returns the original
        version. The other canonical envelope headers — `X-Tenant-Id`,
        `X-Principal-Id`, `X-Request-Id`, `X-Correlation-ID`,
        `X-Source-Channel` — are also required on this write.
      schema: { type: string, maxLength: 255 }
      # A key longer than 255 characters is refused with 400 (field too long).
    LegalEntityId:
      name: X-Legal-Entity-Id
      in: header
      required: false
      description: |
        Optional. Event contracts are platform-wide, so when it is absent
        SCHEMA_PUBLISH is checked against the platform scope
        (`AUTHZ_PLATFORM_SCOPE_ID`, default `00000000-0000-0000-0000-00000000f001`).
      schema: { type: string }

  responses:
    NotFound:
      description: No such event or version (or a name that cannot be registered).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdentityMissing:
      description: No verified principal — `caller identity missing`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidPaging:
      description: limit was not an integer in 1–500, or offset was not a non-negative integer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StoreUnavailable:
      description: The schema store could not be reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    EventSchema:
      type: object
      required: [event_name, version, json_schema, compatibility_mode, registered_at]
      properties:
        event_name: { type: string, example: "entity.status.changed" }
        version:
          type: integer
          minimum: 1
          description: Assigned by the service, never by the caller.
        json_schema:
          type: object
          description: |
            The event's payload shape. The shared envelope fields (event_type,
            emitted_at, schema_version, source_service) are common to every
            publisher and are deliberately not registered here.
          additionalProperties: true
        compatibility_mode:
          $ref: "#/components/schemas/CompatibilityMode"
        owning_service:
          type: string
          maxLength: 255
          description: The service that produces this event (04-data-model.md §17.1).
          example: "identity-context-svc"
        registered_by:
          type: string
          description: The verified principal that registered this version.
        registered_at: { type: string, format: date-time }

    CompatibilityMode:
      type: string
      enum: [BACKWARD, NONE]
      description: |
        The evolution discipline the version was accepted under, recorded per
        version rather than per event so the register shows which rule was in
        force each time.

        - `BACKWARD` — the default. A new version must not break existing
          consumers of the current latest version, as far as the compared subset
          of JSON Schema (see the invariants) can tell.
        - `NONE` — the check is skipped. Exists for the controlled-rollout case
          in §17.2; recorded on the row so the exemption is visible rather than
          inferred from a schema that changed shape. It needs no approval beyond
          SCHEMA_PUBLISH; whether a rollout approval step is required is not
          specified.

        FORWARD and FULL are absent deliberately: the service refuses any mode
        it cannot enforce rather than accepting it and applying something else.

    RegisterSchemaRequest:
      type: object
      required: [json_schema]
      additionalProperties: false
      properties:
        json_schema:
          type: object
          minProperties: 1
          additionalProperties: true
          description: |
            A JSON object with at least one member. `properties` must be an
            object and `required` an array of strings; a property's `type`, if
            given, must be a single string.
        compatibility_mode:
          $ref: "#/components/schemas/CompatibilityMode"
        owning_service: { type: string, maxLength: 255 }
      example:
        json_schema:
          type: object
          properties:
            tenant_id: { type: string }
          required: ["tenant_id"]
        compatibility_mode: "BACKWARD"
        owning_service: "tenant-entity-registry-svc"

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    IncompatibleSchemaError:
      type: object
      required: [error, violations]
      properties:
        error: { type: string, example: "incompatible schema change" }
        violations:
          type: array
          description: |
            One entry per breaking change, naming the field that broke, in a
            stable sorted order (the same two schemas always yield the same list).
          items: { type: string }

    EnvelopeError:
      type: object
      required: [error, detail, violations]
      description: Refusal by the canonical service input contract, before any handler runs.
      properties:
        error: { type: string, example: "envelope_incomplete" }
        detail: { type: string }
        service: { type: string, example: "schema-registry-svc" }
        violations:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              header: { type: string }
              reason: { type: string }
