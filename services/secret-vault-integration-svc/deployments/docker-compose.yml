# docker-compose.yml — limited, self-contained local stack for secret-vault-integration-svc
#
# Runs:
#   postgres     — PostgreSQL 16. DB: secret_vault_integration. Applies all
#                  migrations on first boot.
#   svc          — secret-vault-integration-svc, resource-limited
#                  (mem_limit 256m, cpus 0.5). HTTP on :8087.
#
# The service is deliberately run without relying on Kafka, OTEL, or
# authorization-svc: in ENV=local, an absent event backbone is a logged no-op
# and the vault uses the LocalFileVaultBackend stand-in. Postgres is the only
# hard dependency.
#
# Usage:
#   docker compose up -d --build     # build & start in background
#   docker compose logs -f svc       # tail service logs
#   docker compose down -v           # stop and remove volumes
#
# Health probe: http://localhost:8087/healthz   (liveness)
# Readiness:    http://localhost:8087/readyz    (requires a live DB pool)

name: svault-stack

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: svault-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: secret_vault_integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/000002_add_data_classification.up.sql:/docker-entrypoint-initdb.d/002_data_classification.sql:ro
      - ./migrations/000003_add_rls.up.sql:/docker-entrypoint-initdb.d/003_rls.sql:ro
      - svault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secret_vault_integration"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── secret-vault-integration-svc (resource-limited) ───────────────────────────
  svc:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: secret-vault-integration-svc
    image: secret-vault-integration-svc:local
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8087:8087"
    environment:
      ENV: local
      PORT: "8087"
      # Postgres — superuser for the single-service local run; RLS remains
      # unexercised because superusers bypass it, which is fine here.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: secret_vault_integration
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      # Local-file vault stand-in (AES-256 at rest). Throwaway dev key only.
      VAULT_LOCAL_STORE_PATH: /tmp/secret_store.local
      VAULT_MASTER_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # No Kafka/OTEL/AuthZ for the limited run. Point these at their own
      # containers if you want the full event backbone / authorization gate.
      KAFKA_BROKERS: ""
      AUTHZ_SERVICE_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8087/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

volumes:
  svault_pgdata: