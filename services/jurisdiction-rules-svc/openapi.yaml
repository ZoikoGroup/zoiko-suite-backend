        Rollback changes FUTURE resolution only (JUR-NEG-19): the response counts the decisions already made with the
        rolled-back version in that scope, states that remediating them is a separate workflow (not built), and states that
        no reconciliation was performed.
      operationId: rollbackDeployment
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Rolled back and restored. }, "404": { description: No active deployment of that version there. }, "409": { description: operation_blocked. } }
  /v1/packs/{pack_ref}/versions/{version}/deployments:
    get: { tags: [Rollout], summary: Deployment history of a version, operationId: listDeployments, parameters: [{ name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Deployments. } } }
  /v1/admin/packs/{pack_ref}/versions/{version}/hotfix:
    post:
      tags: [Admin, Packs]
      summary: Declare an emergency hotfix (s24) before certification
      description: |
        Action JURISDICTION_PACK_VERSION_DECLARE_HOTFIX. Body: severity (P0|P1), scope_summary, incident_ref,
        incident_commander, rollback_target_version (an older RELEASED version, named BEFORE promotion). Only while the
        version is DRAFT or REVIEW, so the enhanced review always applies: certification then needs at least TWO independent
        approving reviewers regardless of PACK_CERT_MIN_REVIEWS. Starts the retrospective clock (HOTFIX_RETRO_SLA_HOURS).
      operationId: declareHotfix
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Identical declaration already exists. }, "201": { description: Declared. }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: 'Different declaration exists, wrong state, or invalid rollback target.' } }
  /v1/packs/{pack_ref}/versions/{version}/hotfix:
    get: { tags: [Packs], summary: The hotfix record of a version, operationId: getHotfix, parameters: [{ name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }], responses: { "200": { description: The hotfix. }, "404": { $ref: '#/components/responses/NotFound' } } }
  /v1/admin/packs/{pack_ref}/versions/{version}/hotfix/retrospective:
    post: { tags: [Admin, Packs], summary: Record the mandatory post-incident retrospective (once), description: "Action JURISDICTION_PACK_VERSION_COMPLETE_RETROSPECTIVE. Body: note (required). Overdue retrospectives appear in /v1/ops/metrics.", operationId: completeRetrospective, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Completed (or already). }, "404": { $ref: '#/components/responses/NotFound' } } }
  /v1/admin/source-change-notices:
    post:
      tags: [Admin, SourceChange]
      summary: Record that an authority's material may have changed (s29, s31)
      description: |
        Action SOURCE_CHANGE_NOTICE_CREATE. Body: authority, change_type (FUTURE_DATED_LAW, SCHEMA_OR_CODE_LIST_UPDATE,
        CLARIFICATION, RETROACTIVE_CHANGE, AUTHORITY_PROCESS_CHANGE, SOURCE_WITHDRAWN, DISPUTED_INTERPRETATION), title,
        jurisdiction_id?, location?, observed_hash?, affected_source_id?, detail?. It opens a CONTROLLED REVIEW and never
        edits, activates or publishes a rule.
      operationId: createNotice
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "201": { description: Recorded OPEN. }, "400": { $ref: '#/components/responses/BadRequest' } }
  /v1/source-change-notices:
    get: { tags: [SourceChange], summary: List notices (filter status=open|under_review|closed), operationId: listNotices, responses: { "200": { description: Notices. } } }
  /v1/source-change-notices/{notice_id}:
    get: { tags: [SourceChange], summary: Get a notice, operationId: getNotice, parameters: [{ name: notice_id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: The notice. }, "404": { $ref: '#/components/responses/NotFound' } } }
  /v1/admin/source-change-notices/{notice_id}/review:
    post: { tags: [Admin, SourceChange], summary: Take the notice for independent review, description: "Action SOURCE_CHANGE_NOTICE_REVIEW. The reviewer must differ from the author (403 segregation_of_duties).", operationId: startNoticeReview, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: notice_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Under review. }, "403": { $ref: '#/components/responses/Forbidden' }, "409": { description: Already reviewed by someone else. } } }
  /v1/admin/source-change-notices/{notice_id}/close:
    post: { tags: [Admin, SourceChange], summary: Close with a conclusion, description: "Action SOURCE_CHANGE_NOTICE_CLOSE. Only the assigned reviewer may close. Body: outcome (NO_CHANGE|INTERPRETATION_RECORDED|RULE_CHANGE_PLANNED|CAPABILITY_BLOCKED), note, linked_interpretation_id (required, and must be APPROVED, for INTERPRETATION_RECORDED). Changes no rule or pack.", operationId: closeNotice, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: notice_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Closed (or already). }, "403": { $ref: '#/components/responses/Forbidden' }, "409": { description: Different conclusion already recorded. } } }
  /v1/ops/metrics:
