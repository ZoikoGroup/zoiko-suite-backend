openapi: "3.1.0"

info:
  title: Jurisdiction Rules Service
  version: "1.1.0"
  description: |
    Authoritative registry of jurisdiction identities and their effective-dated
    applicability rules (03-microservices.md §8.2).

    **Governance invariants:**
    - `rule_payload` holds APPLICABILITY METADATA ONLY — never computation values.
      Thresholds, rates and bands belong to the Tax and Payroll services (OQ-1, Model B).
    - Every type/status/domain field is a VARCHAR tag stored as data. New jurisdiction
      types, rule domains and status values are added by data migration, never by a
      code change (OQ-3).
    - Nothing is deleted. Jurisdictions are deactivated with `active_flag` + `effective_to`;
      rules are end-dated and moved to SUPERSEDED or RETIRED.
    - Historical actions must always be explainable against the rule set active at the
      time of execution, so point-in-time reads keep working after a jurisdiction is
      deactivated and after a rule is superseded.
    - `legal_drift_state` transitions are append-only. The column carries the current
      value; `/v1/rules/{id}/drift-events` carries the history (OQ-4).
    - Jurisdiction and rule data are platform-wide reference data. There is no
      `tenant_id` and no row-level security on these tables.

    **Read vs runtime resolution.** `/rules` is the raw per-jurisdiction, effective-dated
    view — the audit and replay surface, one jurisdiction only. `/rule-pack` is the
    runtime view: it walks the ancestor chain and resolves exactly one winning rule per
    (`rule_domain`, `rule_code`).

    **Authentication.** Read endpoints are unauthenticated — this is public reference
    data, and `GET /v1/jurisdictions/{id}` is the synchronous fail-closed validation
    call other services make before persisting a `jurisdiction_id`. Every `/v1/admin/*`
    endpoint requires a caller identity in `X-Principal-Id` (set by the gateway's
    ForwardAuth middleware from a verified identity envelope) and a positive decision
    from the Authorization Service. Both a denial and an unreachable Authorization
    Service block the mutation.

    **Fail-closed status codes.** `503` means "cannot answer", never "no". A caller
    that treats `503` as `404` breaks the validation contract.

servers:
  - url: http://localhost:8082
    description: Local development
  - url: https://api.zoiko.internal/jurisdiction
    description: Internal cluster ingress (gateway strips the /jurisdiction prefix)

tags:
  - name: Jurisdictions
    description: Jurisdiction registry reads, including the fail-closed validation probe
  - name: Rules
    description: Effective-dated rule reads and runtime rule-pack resolution
  - name: Drift
    description: Legal Drift Detection — divergence between stored rules and legal reality
  - name: Admin
    description: Mutations. Authenticated and authorized on every route.
  - name: Rollout
    description: Jurisdiction rollout governance (ZS-JUR-001 Wave 8)
  - name: Health
    description: Liveness and readiness probes

paths:

  # ── Jurisdictions (public read) ────────────────────────────────────────────

  /v1/jurisdictions:
    get:
      tags: [Jurisdictions]
      summary: List jurisdictions
      operationId: listJurisdictions
      parameters:
        - name: type
          in: query
          description: Filter by jurisdiction_type, e.g. COUNTRY, STATE_PROVINCE, TAX_AUTHORITY.
          schema: { type: string }
        - name: active
          in: query
          description: When "true", limit to active_flag=true and non-expired rows.
          schema: { type: string, enum: ["true"] }
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        "200":
          description: Matching jurisdictions. Always an array, never null.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Jurisdiction' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "503": { $ref: '#/components/responses/StoreUnavailable' }

  /v1/jurisdictions/{jurisdiction_id}:
    get:
      tags: [Jurisdictions]
      summary: Validate and fetch a jurisdiction
      description: |
        The synchronous validation endpoint other services call fail-closed before
        persisting anything that references a `jurisdiction_id`.

        Unknown, malformed, inactive and expired ids all answer `404` — they are the
        same fact to a caller. A `503` is categorically different and must cause the
        caller to reject the write rather than treat it as "not found".
      operationId: getJurisdiction
      parameters:
        - $ref: '#/components/parameters/JurisdictionID'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        "200":
          description: Jurisdiction is known and active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jurisdiction' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/StoreUnavailable' }

  /v1/jurisdictions/{jurisdiction_id}/ancestors:
    get:
      tags: [Jurisdictions]
      summary: Resolve the ancestor chain
      description: |
        Ancestors from the immediate parent outward to the root, nearest first. The
        jurisdiction itself is not included, so a root jurisdiction answers `200 []` —
        which is a different fact from `404`.
      operationId: getAncestors
      parameters:
        - $ref: '#/components/parameters/JurisdictionID'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        "200":
          description: Ancestor chain, nearest first. Empty for a root jurisdiction.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Jurisdiction' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/StoreUnavailable' }

  # ── Rules (public read) ────────────────────────────────────────────────────

  /v1/jurisdictions/{jurisdiction_id}/rules:
    get:
      tags: [Rules]
      summary: Rules effective at a point in time, for one jurisdiction
      description: |
        The raw, per-jurisdiction, effective-dated view. Inheritance is NOT resolved —
        use `/rule-pack` for the runtime view.

        DRAFT rules are excluded. SUPERSEDED and RETIRED rules ARE returned when the
        requested `effective_at` falls inside their effective period, because a
        historical action has to remain explainable against the rules that governed it.

        This endpoint keeps answering after the jurisdiction is deactivated, for the
        same reason.
      operationId: getRules
      parameters:
        - $ref: '#/components/parameters/JurisdictionID'
        - name: domain
          in: query
          description: Filter by rule_domain, e.g. PAYROLL, TAX, EMPLOYMENT, FILING, RETENTION, BENEFITS.
          schema: { type: string }
        - $ref: '#/components/parameters/EffectiveAt'
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        "200":
          description: Matching rules. Always an array, never null.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JurisdictionRule' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/StoreUnavailable' }

  /v1/jurisdictions/{jurisdiction_id}/rule-pack:
    get:
      tags: [Rules]
      summary: Resolve the runtime rule pack
      description: |
        The "resolve jurisdiction set" and "fetch runtime rule pack" capabilities of
        §8.2, in one call.

        Walks the jurisdiction and its whole ancestor chain and returns exactly one
        winning rule per (`rule_domain`, `rule_code`): the nearest jurisdiction wins,
        ties broken by the later `effective_from`. DRAFT and RETIRED rules never enter
        a pack.

        `resolved_from` names the jurisdictions the pack was assembled from, self first,
        so the caller can record the rule basis of a governed action — §8.2's evidence
        obligation.

        A pack is a runtime artifact, so an inactive or expired jurisdiction answers
        `404` rather than a stale pack.
      operationId: getRulePack
      parameters:
        - $ref: '#/components/parameters/JurisdictionID'
        - name: domain
          in: query
          description: Restrict the pack to one rule_domain.
          schema: { type: string }
        - $ref: '#/components/parameters/EffectiveAt'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        "200":
          description: Resolved rule pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RulePack' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/StoreUnavailable' }

  /v1/rules/{jurisdiction_rule_id}:
    get:
      tags: [Rules]
      summary: Fetch one rule by id
      description: |
        The rule id appears in every published event and in the rule basis recorded
        against governed actions, so it has to be resolvable directly.
      operationId: getRule
      parameters:
        - $ref: '#/components/parameters/RuleID'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        "200":
          description: The rule, in whatever status it currently holds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JurisdictionRule' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/StoreUnavailable' }

  /v1/rules/{jurisdiction_rule_id}/drift-events:
    get:
      tags: [Drift]
      summary: Legal drift history for a rule
      description: |
        The append-only `legal_drift_state` transition history, newest first (OQ-4).
        The current state on the rule says *that* a rule has drifted; this says when,
        from what, on whose authority, and why.

        A rule that has never drifted answers `200 []`, which is a different fact from
        `404`.
      operationId: getDriftEvents
      parameters:
        - $ref: '#/components/parameters/RuleID'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        "200":
          description: Drift history, newest first. Always an array, never null.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DriftEvent' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/StoreUnavailable' }

  /v1/rules/{jurisdiction_rule_id}/status-history:
    get:
      tags: [Rules]
      summary: Bitemporal status history for a rule
      description: |
        The `known_from`/`known_to` history tracking when the platform became aware
        of each rule status change (V-001 §8.1). Enables "what did the platform know
        on date X" queries for audit and replay.
      operationId: getRuleStatusHistory
      parameters:
        - $ref: '#/components/parameters/RuleID'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        "200":
          description: Status history, newest known_from first. Always an array, never null.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RuleStatusHistory' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/StoreUnavailable' }

  # ── Validate Action ────────────────────────────────────────────────────────────

  # ── Admin mutations ────────────────────────────────────────────────────────

  /v1/admin/jurisdictions:
    post:
      tags: [Admin, Jurisdictions]
      summary: Create a jurisdiction
      description: |
        Idempotent on the dedup key (`jurisdiction_code`, `jurisdiction_type`,
        `parent_jurisdiction_id`): a replay with identical attributes answers `200`
        with the existing record and publishes nothing. A replay with differing
        attributes is a `409`.

        `jurisdiction_id`, `active_flag`, `data_classification` and
        `created_by_principal_id` are server-assigned and cannot be set by the caller.
      operationId: createJurisdiction
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJurisdictionRequest' }
      responses:
        "201":
          description: Created. Publishes `jurisdiction.created`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jurisdiction' }
        "200":
          description: Idempotent replay of an existing jurisdiction. Publishes nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jurisdiction' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/MissingPrincipal' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: |
            `parent_jurisdiction_not_found` — the supplied parent does not exist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: |
            `conflict` — the dedup key matches an existing jurisdiction with different
            attributes. `cyclic_hierarchy` — the parent assignment would make the
            jurisdiction its own ancestor.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "503": { $ref: '#/components/responses/AuthzOrStoreUnavailable' }

  /v1/admin/jurisdictions/{jurisdiction_id}/deactivate:
    post:
      tags: [Admin, Jurisdictions]
      summary: Deactivate a jurisdiction
      description: |
        Sets `active_flag=false` and end-dates the record with `effective_to`. This is
        not a delete: the row is preserved and stays readable for historical replay.
        Publishes `jurisdiction.deactivated`.
      operationId: deactivateJurisdiction
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JurisdictionID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        "200":
          description: Deactivated and end-dated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jurisdiction' }
        "401": { $ref: '#/components/responses/MissingPrincipal' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/AuthzOrStoreUnavailable' }

  /v1/admin/jurisdictions/{jurisdiction_id}/rules:
    post:
      tags: [Admin, Rules]
      summary: Create a rule
      description: |
        Idempotent on the dedup key (`jurisdiction_id`, `rule_code`, `effective_from`).

        A rule may only be created in DRAFT (the default) or ACTIVE. SUPERSEDED and
        RETIRED are reached through the transition endpoint, never directly.

        Two live rules with the same `rule_code` and overlapping effective periods are
        rejected with `409 overlapping_rule`, because both would satisfy the same
        point-in-time query. DRAFT rules are exempt so a replacement can be prepared
        while the incumbent is still in force — the same check runs again on activation.
      operationId: createRule
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JurisdictionID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRuleRequest' }
      responses:
        "201":
          description: |
            Created. Publishes `jurisdiction.rule.updated`, plus
            `jurisdiction.rule.activated` when created directly in ACTIVE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JurisdictionRule' }
        "200":
          description: Idempotent replay of an existing rule. Publishes nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JurisdictionRule' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/MissingPrincipal' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: |
            `jurisdiction_not_found` — the jurisdiction is unknown or has been deactivated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: |
            `conflict` — dedup key matches an existing rule with a different payload or
            name. `overlapping_rule` — the effective period overlaps another live rule
            with the same `rule_code`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "503": { $ref: '#/components/responses/AuthzOrStoreUnavailable' }

  /v1/admin/rules/{jurisdiction_rule_id}/transition:
    post:
      tags: [Admin, Rules]
      summary: Transition a rule's lifecycle status
      description: |
        The only legal transitions are DRAFT→ACTIVE, ACTIVE→SUPERSEDED, and
        ACTIVE|SUPERSEDED→RETIRED. Nothing returns to DRAFT.

        A retried transition into the status the rule already holds answers `200` and
        publishes nothing, so a network retry cannot make a consumer act twice.

        Transitions into SUPERSEDED or RETIRED close an open-ended rule. Supply
        `effective_to` to say when it stopped applying; omitted, it closes at the
        current time. Without this a superseded rule keeps matching every
        point-in-time query alongside its own replacement.
      operationId: transitionRuleStatus
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RuleID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRuleStatusRequest' }
      responses:
        "200":
          description: |
            Transitioned, or an idempotent no-op. A real transition publishes
            `jurisdiction.rule.updated`, plus `jurisdiction.rule.activated` for ACTIVE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JurisdictionRule' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/MissingPrincipal' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: |
            `invalid_transition` — the current status is not a legal prior state.
            `overlapping_rule` — activating this rule would overlap another live rule
            with the same `rule_code`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "503": { $ref: '#/components/responses/AuthzOrStoreUnavailable' }

  /v1/admin/rules/{jurisdiction_rule_id}/drift:
    post:
      tags: [Admin, Drift]
      summary: Record a legal drift state change
      description: |
        The write side of Legal Drift Detection (§8.2's Critical Enhancement): an
        external regulatory feed, or a human reviewer, declares that a stored rule has
        diverged from applicable legal reality.

        The state change and its justification are written together, append-only. A
        move away from CURRENT publishes `legal.drift.detected`; a return to CURRENT is
        a resolution and publishes nothing — announcing it as "drift detected" would
        have consumers react to the opposite of what happened. Setting the state the
        rule already holds is a no-op: it appends no history and publishes nothing.
      operationId: recordDrift
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RuleID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordDriftRequest' }
      responses:
        "200":
          description: Drift state recorded, or an unchanged no-op.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordDriftResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/MissingPrincipal' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "413": { $ref: '#/components/responses/BodyTooLarge' }
        "503": { $ref: '#/components/responses/AuthzOrStoreUnavailable' }

  # ── Validate Action ────────────────────────────────────────────────────────────

  /v1/validate-action:
    post:
      tags: [Rules]
      summary: Validate an action against the resolved rule pack
      description: |
        The "validate-action" API of §8.2: given an action type, entity, and
        jurisdiction, resolve the applicable rule pack and return the applicable
        rule metadata (payload) or a conflict/insufficient decision.

        This is the synchronous validation call other services make before
        executing a governed action (e.g., tax calculation, payroll run).
      operationId: validateAction
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateActionRequest' }
      responses:
        "200":
          description: Action is permitted. Returns the applicable rule payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateActionResponse' }
        "409":
          description: |
            `conflicted` — multiple rules with equal precedence and overlapping periods.
            `insufficient` — no rule found in the ancestor chain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateActionConflictResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/MissingPrincipal' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/AuthzOrStoreUnavailable' }
  # ── ZS-JUR-001 Wave 0: regime, source, interpretation and pack registries ───
  # Mounted only when the registry store is wired (it is, in main.go). Every
  # privileged command below is a separate authorization action so authoring,
  # independent review/approval and submission can sit with different roles.
  # Error bodies are RFC 9457 application/problem+json (see components/schemas/Error).

  /v1/regimes:
    get: { tags: [Registry], summary: List regulatory regimes, operationId: listRegimes, responses: { "200": { description: Regimes. } } }
  /v1/regimes/{regime}:
    get:
      tags: [Registry]
      summary: Get a regime by id or code
      operationId: getRegime
      parameters: [{ name: regime, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: The regime. }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/sources:
    get:
      tags: [Registry]
      summary: List captured regulatory sources (newest first)
      operationId: listSources
      parameters:
        - { name: jurisdiction_id, in: query, schema: { type: string } }
        - { name: authority, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { "200": { description: Sources. } }
  /v1/sources/{source_id}:
    get:
      tags: [Registry]
      summary: Get a source, including superseded ones (kept for reproducibility)
      operationId: getSource
      parameters: [{ name: source_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: The source. }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/interpretations/{interpretation_id}:
    get:
      tags: [Registry]
      summary: Get an interpretation record and its cited sources
      operationId: getInterpretation
      parameters: [{ name: interpretation_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: The record. }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/packs:
    get: { tags: [Packs], summary: List jurisdiction packs, operationId: listPacks, responses: { "200": { description: Packs. } } }
  /v1/packs/{pack_ref}:
    get:
      tags: [Packs]
      summary: Get a pack identity
      operationId: getPack
      parameters: [{ name: pack_ref, in: path, required: true, schema: { type: string, example: jur.gb.tax.core } }]
      responses: { "200": { description: The pack. }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/packs/{pack_ref}/versions:
    get:
      tags: [Packs]
      summary: List versions of a pack
      operationId: listPackVersions
      parameters: [{ name: pack_ref, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Versions. }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/packs/{pack_ref}/versions/{version}:
    get:
      tags: [Packs]
      summary: Get one pack version with its manifest and digest
      operationId: getPackVersion
      parameters:
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string, example: "2026.08.1" } }
      responses: { "200": { description: The version. }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/rules/{jurisdiction_rule_id}/provenance:
    get:
      tags: [Registry]
      summary: Get a rule's regime, interpretation, precedence, supersedes link and sources
      operationId: getRuleProvenance
      parameters: [{ $ref: '#/components/parameters/RuleID' }]
      responses: { "200": { description: Provenance. }, "404": { $ref: '#/components/responses/NotFound' } }

  /v1/admin/regimes:
    post:
      tags: [Admin, Registry]
      summary: Create a regime (idempotent by code; a different name is 409)
      description: "Action REGULATORY_REGIME_CREATE. Body: regime_code, regime_name, description?."
      operationId: createRegime
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }, { $ref: '#/components/parameters/CorrelationID' }]
      responses:
        "200": { description: Already existed. }
        "201": { description: Created. }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/MissingPrincipal' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { description: 'Same code, different name.' }
  /v1/admin/sources:
    post:
      tags: [Admin, Registry]
      summary: Capture a regulatory source with its snapshot hash
      description: |
        Action REGULATORY_SOURCE_CREATE. A source is evidence: `snapshot_hash`
        (sha256:<64 hex>) is mandatory so the reviewed text can be identified later
        (JUR-NEG-06). Idempotent on (jurisdiction, authority, snapshot_hash); the same
        hash with a different title/location/type/level is 409. Captured content is
        immutable (database trigger); only review and supersede links can be added.
      operationId: createSource
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }, { $ref: '#/components/parameters/CorrelationID' }]
      responses:
        "200": { description: Identical capture already recorded. }
        "201": { description: Captured. }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/MissingPrincipal' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Unknown jurisdiction. }
        "409": { description: Hash collision with different attributes. }
  /v1/admin/sources/{source_id}/review:
    post:
      tags: [Admin, Registry]
      summary: Record the independent source review (once)
      description: "Action REGULATORY_SOURCE_REVIEW. The reviewer must not be the author (403 segregation_of_duties); a second different reviewer is 409."
      operationId: reviewSource
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: source_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Reviewed (or the same reviewer replaying). }, "403": { $ref: '#/components/responses/Forbidden' }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: Already reviewed by someone else. } }
  /v1/admin/sources/{source_id}/supersede:
    post:
      tags: [Admin, Registry]
      summary: Link a source to its replacement; the old record is preserved
      description: "Action REGULATORY_SOURCE_SUPERSEDE. Body: replacement_source_id."
      operationId: supersedeSource
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: source_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Superseded. }, "400": { $ref: '#/components/responses/BadRequest' }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: Already superseded by another source. } }
  /v1/admin/interpretations:
    post:
      tags: [Admin, Registry]
      summary: Record a PENDING interpretation citing at least one live source
      description: "Action INTERPRETATION_RECORD_CREATE. Body: jurisdiction_id, regime_id?, subject, decision, rationale, source_ids[]."
      operationId: createInterpretation
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "201": { description: Recorded as PENDING. }, "400": { $ref: '#/components/responses/BadRequest' }, "403": { $ref: '#/components/responses/Forbidden' } }
  /v1/admin/interpretations/{interpretation_id}/approve:
    post:
      tags: [Admin, Registry]
      summary: Approve an interpretation (qualified human, not the author)
      description: |
        Action INTERPRETATION_RECORD_APPROVE. The approver must differ from the author
        (403 segregation_of_duties) and every cited source must be independently
        reviewed and not superseded (409 source_not_ready). Approved records are
        immutable. AI-proposed content cannot become authoritative without this step (JUR-NEG-18).
      operationId: approveInterpretation
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: interpretation_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Approved (or the same approver replaying). }, "403": { $ref: '#/components/responses/Forbidden' }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: 'Source not ready, or already approved by someone else.' } }
  /v1/admin/packs:
    post:
      tags: [Admin, Packs]
      summary: Register a pack identity (idempotent by pack_ref)
      description: "Action JURISDICTION_PACK_CREATE. Body: pack_ref (jur.gb.tax.core), pack_name, owner, support_owner?."
      operationId: createPack
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Already existed. }, "201": { description: Created. }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: 'Same ref, different attributes.' } }
  /v1/admin/packs/{pack_ref}/versions:
    post:
      tags: [Admin, Packs]
      summary: Draft a pack version from a manifest (the request body IS the manifest)
      description: |
        Action JURISDICTION_PACK_VERSION_CREATE. The manifest carries pack_id,
        pack_version, jurisdiction_ids (codes), regimes (codes), effective_from/to,
        dependencies and schema_dependencies (each pinned to an exact version),
        source_register_version, rule_modules (rule ids). Status, digests and
        signature are server-owned: a manifest that includes them is rejected.
        The server stores the version as DRAFT with the sha256 of the canonical
        manifest. Versions must strictly increase (numeric order). Replaying
        identical content is 200; different content under an existing version is 409
        (JUR-NEG-20). Signing, artifact digest and certification arrive in later waves.
      operationId: createPackVersion
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: pack_ref, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Identical version already drafted. }, "201": { description: Drafted. }, "400": { $ref: '#/components/responses/BadRequest' }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: Version collision or not newer. } }
  /v1/admin/packs/{pack_ref}/versions/{version}/submit-review:
    post:
      tags: [Admin, Packs]
      summary: Move a DRAFT version to REVIEW (content freezes)
      description: "Action JURISDICTION_PACK_VERSION_SUBMIT. Later states require the compiler and certification harness; the database forbids skipping them."
      operationId: submitPackVersion
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PrincipalID' }
      responses: { "200": { description: In REVIEW (or already was). }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: Past DRAFT in another direction. } }
  /v1/admin/rules/{jurisdiction_rule_id}/provenance:
    put:
      tags: [Admin, Registry]
      summary: Replace the provenance of a DRAFT rule
      description: |
        Action JURISDICTION_RULE_SET_PROVENANCE. Body: regime_id?, interpretation_id?,
        supersedes_rule_id?, precedence?, published_on?, source_ids[]. Full replacement.
        The interpretation must be APPROVED and belong to the rule's jurisdiction or an
        ancestor; supersedes_rule_id must be an earlier version of the same rule code.
        A rule past DRAFT is immutable (409 not_draft).
      operationId: setRuleProvenance
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RuleID' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Provenance replaced. }, "400": { $ref: '#/components/responses/BadRequest' }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: 'Rule not DRAFT, or interpretation not approved.' } }

  # ── ZS-JUR-001 Wave 1: compiler, signing, verification, trusted keys ───────

  /v1/admin/packs/{pack_ref}/versions/{version}/compile:
    post:
      tags: [Admin, Packs]
      summary: Compile a REVIEW version into an unsigned, digest-pinned artifact
      description: |
        Action JURISDICTION_PACK_VERSION_COMPILE. Pure and reproducible: the artifact
        contains no clock, so unchanged inputs give the same digest. Rule modules are
        snapshotted with their sources and interpretations. Errors (422, body has the
        report) include: rule without regime/source/approved interpretation, unreviewed or
        superseded source, retired rule, overlapping rules with no declared precedence or
        supersedes link (JUR-NEG-02), floating-point numbers in rule content (JUR-NEG-25),
        self/missing/withdrawn/uncompiled dependency packs. Nothing is stored on error.
        Replaying unchanged inputs is 200; changed inputs under the same version are 409
        already_compiled (JUR-NEG-20). Mandatory test suites are NOT run here (Wave 3);
        the report says so.
      operationId: compilePackVersion
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PrincipalID' }
      responses:
        "200": { description: Identical artifact already compiled. }
        "201": { description: Compiled. }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: 'Not under REVIEW, or inputs changed since the artifact was compiled.' }
        "422": { description: Compile errors; the body carries the full report. }
  /v1/admin/packs/{pack_ref}/versions/{version}/sign:
    post:
      tags: [Admin, Packs]
      summary: Sign the compiled artifact digest (write-once)
      description: |
        Action JURISDICTION_PACK_VERSION_SIGN. Ed25519 over a domain-separated artifact
        digest. The service signs only with its configured key, and only when that key is
        registered, ACTIVE and has the same public key. 503 signing_not_configured when no
        key file is configured; 503 signing_key_not_active otherwise. Signing again is a
        no-op returning the original signature.
      operationId: signPackVersion
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PrincipalID' }
      responses: { "200": { description: Signed (or already signed). }, "404": { $ref: '#/components/responses/NotFound' }, "503": { description: Signing unavailable. } }
  /v1/packs/{pack_ref}/versions/{version}/artifact:
    get:
      tags: [Packs]
      summary: Get the compiled artifact with its live verification verdict
      operationId: getPackArtifact
      parameters:
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{artifact, verification}." }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/packs/{pack_ref}/versions/{version}/verify:
    post:
      tags: [Packs]
      summary: Loader-facing verification; fails closed (JUR-NEG-03, JUR-NEG-04)
      description: |
        Action JURISDICTION_PACK_VERSION_VERIFY. Recomputes the artifact digest, compares
        the recorded digests, and verifies the signature against the registered key
        (ACTIVE or RETIRED verify; REVOKED does not). 200 only when verified; 409 with the
        reasons otherwise, so a caller that ignores the body still fails closed. A failure
        also emits jurisdiction-pack.verification-failed.
      operationId: verifyPackArtifact
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PrincipalID' }
      responses: { "200": { description: Verified. }, "409": { description: Not verified; reasons in body. } }
  /v1/pack-signing-keys:
    get: { tags: [Registry], summary: List trusted signing PUBLIC keys, operationId: listSigningKeys, responses: { "200": { description: Keys. } } }
  /v1/admin/pack-signing-keys:
    post:
      tags: [Admin, Registry]
      summary: Register a trusted signing PUBLIC key
      description: "Action PACK_SIGNING_KEY_REGISTER. Body: key_ref, public_key (base64 32-byte Ed25519), algorithm? (ED25519). A key_ref names one key forever (different key = 409). Private keys are never accepted or stored."
      operationId: registerSigningKey
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Already registered. }, "201": { description: Registered. }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: key_ref held by a different key. } }
  /v1/admin/pack-signing-keys/{key_ref}/retire:
    post:
      tags: [Admin, Registry]
      summary: Retire a key (stops signing; still verifies what it signed)
      description: "Action PACK_SIGNING_KEY_RETIRE. Body: reason (required)."
      operationId: retireSigningKey
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: key_ref, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Retired (or already). }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: Illegal status move. } }
  /v1/admin/pack-signing-keys/{key_ref}/revoke:
    post:
      tags: [Admin, Registry]
      summary: Revoke a compromised key (verification against it fails)
      description: "Action PACK_SIGNING_KEY_REVOKE. Body: reason (required). Status only moves forward; never deleted."
      operationId: revokeSigningKey
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: key_ref, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Revoked (or already). }, "404": { $ref: '#/components/responses/NotFound' } }

  # ── ZS-JUR-001 Wave 3: test harness, reviews, certification ─────────────────

  /v1/admin/packs/{pack_ref}/versions/{version}/test-bundle:
    post:
      tags: [Admin, Packs]
      summary: Append a test bundle revision (identical content is a no-op)
      description: |
        Action JURISDICTION_PACK_VERSION_AUTHOR_TESTS. Body: {bundle_version:"1", cases:[{id, class
        (GOLDEN|BOUNDARY|HISTORICAL|NEGATIVE), description?, input:{jurisdiction, rule_domain, rule_code,
        effective_at (RFC3339)}, expect:{outcome (RESOLVED|NO_RULE|UNSUPPORTED_JURISDICTION|AMBIGUOUS),
        rule_id?, content_digest?}}]}. Only while the version is under REVIEW. Revisions are append-only.
      operationId: submitTestBundle
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PrincipalID' }
      responses: { "200": { description: Identical to the latest revision. }, "201": { description: New revision. }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: Not under REVIEW. } }
  /v1/packs/{pack_ref}/versions/{version}/test-bundle:
    get:
      tags: [Packs]
      summary: Latest test bundle revision
      operationId: getTestBundle
      parameters:
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: The bundle. }, "409": { description: No bundle submitted yet. } }
  /v1/admin/packs/{pack_ref}/versions/{version}/test-runs:
    post:
      tags: [Admin, Packs]
      summary: Run the latest bundle against the compiled artifact
      description: |
        Action JURISDICTION_PACK_VERSION_EXECUTE_TESTS. Executes against the artifact ONLY (what is signed is
        what is tested). The run is recorded whether it passes or fails (201 either way; see `passed`). A
        run passes only if every case passes AND coverage is complete: a GOLDEN case per rule, BOUNDARY
        cases at each rule's start, start-minus-1ns, end and end-minus-1ns, a HISTORICAL case for each
        supersession, and a NEGATIVE case expecting UNSUPPORTED_JURISDICTION. Each gap names the exact
        instant to add. The result lists the s22 classes that are NOT implemented.
      operationId: runTests
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PrincipalID' }
      responses: { "201": { description: Run recorded. }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: Not under REVIEW or no bundle. } }
  /v1/packs/{pack_ref}/versions/{version}/test-runs:
    get:
      tags: [Packs]
      summary: Test run history (newest first)
      operationId: listTestRuns
      parameters:
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { "200": { description: Runs. } }
  /v1/admin/packs/{pack_ref}/versions/{version}/reviews:
    post:
      tags: [Admin, Packs]
      summary: Record an independent review of the compiled artifact
      description: |
        Action JURISDICTION_PACK_VERSION_REVIEW. Body: role (UPPER_SNAKE, e.g. TAX), decision
        (APPROVE|REJECT), findings (required for REJECT). The reviewer must differ from the version author,
        the compiler and every test author (403 segregation_of_duties; also enforced by trigger). The latest
        decision per (reviewer, role) counts; a REJECT blocks certification until that reviewer changes it.
      operationId: addReview
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PrincipalID' }
      responses: { "201": { description: Review recorded. }, "400": { $ref: '#/components/responses/BadRequest' }, "403": { $ref: '#/components/responses/Forbidden' }, "409": { description: Not under REVIEW / not compiled. } }
  /v1/packs/{pack_ref}/versions/{version}/reviews:
    get:
      tags: [Packs]
      summary: Full review history including rejections
      operationId: listReviews
      parameters:
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Reviews. } }
  /v1/admin/packs/{pack_ref}/versions/{version}/certify:
    post:
      tags: [Admin, Packs]
      summary: Certify a pack version (REVIEW to CERTIFIED), signed
      description: |
        Action JURISDICTION_PACK_VERSION_CERTIFY. Succeeds only when ALL hold: the artifact is compiled, signed and
        verifies; the latest bundle was run against exactly this artifact and passed with complete coverage;
        at least PACK_CERT_MIN_REVIEWS distinct independent reviewers approve and no latest decision is REJECT;
        the certifier is independent of the author, compiler, test authors and every approving reviewer.
        409 certification_blocked lists EVERY unmet gate. The certification report is signed with the service key;
        with no signer configured the call is 503. It states which s22 classes were NOT run. The database
        independently refuses a certification that violates any gate, and refuses CERTIFIED without one.
        Re-certifying returns the original (200).
      operationId: certifyPackVersion
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PrincipalID' }
      responses: { "200": { description: Already certified. }, "201": { description: Certified. }, "409": { description: 'certification_blocked, or not under REVIEW.' }, "503": { description: Signing unavailable. } }
  /v1/packs/{pack_ref}/versions/{version}/certification:
    get:
      tags: [Packs]
      summary: The certification record with a live signature verdict
      operationId: getCertification
      parameters:
        - { name: pack_ref, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{certification, verification}." }, "404": { $ref: '#/components/responses/NotFound' } }

  # ── ZS-JUR-001 Wave 2: runtime rule resolution ──────────────────────────────

  /v1/rule-resolutions:resolve:
    post:
      tags: [Resolver]
      summary: Resolve which rule applies, from verified released pack artifacts
      description: |
        Action RULE_RESOLUTION_RESOLVE. Body: jurisdiction (a code: a FACT, not a conclusion), rule_domain,
        rule_code, effective_at (RFC3339), pack_ref? (restrict to one pack), pack_version? (with pack_ref:
        replay that exact version, for reproducing a past decision; WITHDRAWN/EMERGENCY_BLOCKED never resolve).
        Optional header Idempotency-Key (scoped to the caller; same key + same request returns the same
        decision with replayed=true; same key + different request is 409).

        The server picks the pack: among RELEASED versions (configurable; CERTIFIED only outside
        production) whose scope names the jurisdiction and whose window contains the instant, the highest
        version per pack. Every consulted pack is verified first (artifact digest, recorded digests,
        registered non-revoked key, signature, and the certification's own signature). If a covering pack
        fails verification the answer is **503 pack_unverified**, never a different answer from an older
        pack (JUR-NEG-03/04). Overlapping rules are decided only by declared precedence or supersedes;
        otherwise AMBIGUOUS. Two packs defining the same rule for the same jurisdiction and instant is a
        cross-pack conflict, also AMBIGUOUS (JUR-NEG-24). No eligible pack naming the jurisdiction is
        UNSUPPORTED_JURISDICTION (JUR-NEG-22): nothing is guessed.

        Every answer except 503 is recorded in the evidence ledger. HTTP: 200 RESOLVED or NO_RULE;
        409 AMBIGUOUS; 422 UNSUPPORTED_JURISDICTION; 503 pack_unverified. The body is
        {decision_id, replayed, decision{outcome, pack{pack_ref, version, artifact_digest, certification_id},
        rule{...payload}, sources[], basis, considered_rule_ids[], packs_consulted[], explanation[]}}.

        NOT BUILT: POST /jurisdiction-decisions:resolve (needs authoritative entity/counterparty/transaction
        facts and place-of-supply rules) and POST /regulatory-calculations:execute (needs a rule formula
        language). Neither is faked.
      operationId: resolveRule
      security: [{ principalHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { $ref: '#/components/parameters/PrincipalID' }
      responses:
        "200": { description: RESOLVED or NO_RULE. }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/MissingPrincipal' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Pinned pack version not found. }
        "409": { description: 'AMBIGUOUS, idempotency_conflict, or pinned_pack_not_eligible.' }
        "422": { description: UNSUPPORTED_JURISDICTION. }
        "503": { description: pack_unverified (fail closed) or authorization/store unavailable. }
  /v1/rule-decisions/{decision_id}:
    get:
      tags: [Resolver]
      summary: A recorded decision (the evidence of a past resolution)
      description: "Action RULE_DECISION_VIEW. The stored response is exactly what the caller received."
      operationId: getRuleDecision
      security: [{ principalHeader: [] }]
      parameters: [{ name: decision_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: The decision. }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/pack-coverage:
    get:
      tags: [Resolver]
      summary: Which eligible pack versions name a jurisdiction (read model, no legal conclusion)
      operationId: packCoverage
      parameters:
        - { name: jurisdiction, in: query, required: true, schema: { type: string } }
        - { name: effective_at, in: query, schema: { type: string, format: date-time } }
      responses: { "200": { description: 'Packs naming the jurisdiction, with in_force.' }, "400": { $ref: '#/components/responses/BadRequest' } }
  /v1/admin/resolver-cache:invalidate:
    post:
      tags: [Admin, Resolver]
      summary: Drop every cached pack so the next resolution re-reads and re-verifies
      description: |
        Action RESOLVER_CACHE_INVALIDATE. Verified artifacts are cached for RESOLVER_CACHE_TTL_SECONDS
        (default 30, 0 = never). A key revocation or withdrawal takes effect within that bound; call this to
        make it immediate. The cache is per process: with several replicas, invalidate each.
      operationId: invalidateResolverCache
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Invalidated; cache counters in the body. }, "403": { $ref: '#/components/responses/Forbidden' } }

  # ── ZS-JUR-001 Wave 7: release, rings, rollback, hotfix, source-change intake, metrics ──
  # Every command below is its own authorization action. Refusals that depend on several gates answer
  # 409 {"error":"operation_blocked","reasons":[...]} listing ALL unmet gates at once.

  /v1/admin/deployment-regions:
    post: { tags: [Admin, Rollout], summary: Register a deployment region (append-only), description: "Action DEPLOYMENT_REGION_CREATE. Body: region_code (lowercase), description?.", operationId: createRegion, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Already exists. }, "201": { description: Created. }, "400": { $ref: '#/components/responses/BadRequest' } } }
  /v1/deployment-regions:
    get: { tags: [Rollout], summary: List regions, operationId: listRegions, responses: { "200": { description: Regions. } } }
  /v1/admin/deployment-rings:
    post: { tags: [Admin, Rollout], summary: Define a rollout ring (append-only), description: "Action DEPLOYMENT_RING_CREATE. Body: ring_code, ordinal (>=1, unique), min_soak_seconds (time a version must have been active in THIS ring before the next), description?. Same code with different values is 409.", operationId: createRing, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Already exists. }, "201": { description: Created. }, "409": { description: Conflicting definition. } } }
  /v1/deployment-rings:
    get: { tags: [Rollout], summary: List rings in rollout order, operationId: listRings, responses: { "200": { description: Rings. } } }
  /v1/admin/packs/{pack_ref}/versions/{version}/publish:
    post:
      tags: [Admin, Packs]
      summary: Release a CERTIFIED version (CERTIFIED to RELEASED)
      description: |
        Action JURISDICTION_PACK_VERSION_PUBLISH. Re-verifies the artifact and certification (never trusting an
        earlier check), requires every registered-pack dependency to be RELEASED, and for a hotfix its rollback target
        to be RELEASED. Optional body {evidence_ref}. RELEASED, WITHDRAWN and EMERGENCY_BLOCKED are reachable only
        through these commands (database-enforced). Publishing again is a no-op.
      operationId: publishPackVersion
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Released (changed=true) or already released. }, "409": { description: 'Not CERTIFIED, or operation_blocked.' } }
  /v1/admin/packs/{pack_ref}/versions/{version}/withdraw:
    post:
      tags: [Admin, Packs]
      summary: "Withdraw a version: no new use, history stays resolvable"

      description: "Action JURISDICTION_PACK_VERSION_WITHDRAW. Body: reason AND evidence_ref are required. Refused while another RELEASED version depends on it. Rolls its ACTIVE deployments back with the reason."
      operationId: withdrawPackVersion
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Withdrawn (or already). }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: 'In use by a released dependent, or wrong state.' } }
  /v1/admin/packs/{pack_ref}/versions/{version}/block:
    post: { tags: [Admin, Packs], summary: Emergency stop (RELEASED to EMERGENCY_BLOCKED), description: "Action JURISDICTION_PACK_VERSION_BLOCK. Body: reason (required). The resolver stops using it within its cache TTL.", operationId: blockPackVersion, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Blocked. }, "409": { description: Not RELEASED. } } }
  /v1/admin/packs/{pack_ref}/versions/{version}/unblock:
    post: { tags: [Admin, Packs], summary: Return a blocked version to RELEASED after incident review, description: "Action JURISDICTION_PACK_VERSION_UNBLOCK. Body: reason (required). Re-verifies the version first.", operationId: unblockPackVersion, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Released again. }, "409": { description: 'Not blocked, or unverified.' } } }
  /v1/admin/packs/{pack_ref}/versions/{version}/deploy:
    post:
      tags: [Admin, Packs]
      summary: Deploy (promote) a RELEASED version to a ring and region
      description: |
        Action JURISDICTION_PACK_VERSION_DEPLOY. Body: ring, region, exception_reason?. Gates (all reported together):
        the version re-verifies; the PREVIOUS ring has this version active in the same region for at least that ring's
        min_soak_seconds with no runtime verification failure since it was deployed there; every registered-pack
        dependency is ACTIVE in the same ring and region (JUR-NEG-15); a hotfix has its rollback target active here and two
        independent approving reviewers (JUR-NEG-14). exception_reason skips ring order, is accepted ONLY for a
        declared hotfix and ONLY from its incident commander, and is recorded. Nothing here measures business or
        reconciliation health: there is no such signal in this service.
      operationId: deployPackVersion
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: pack_ref, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Already active there. }, "201": { description: Deployed. }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: operation_blocked or not RELEASED. } }
  /v1/admin/packs/{pack_ref}/versions/{version}/rollback:
    post:
      tags: [Admin, Packs]
      summary: Roll a version back in one ring and region and restore an older release
      description: |
        Action JURISDICTION_PACK_VERSION_ROLLBACK. Body: ring, region, restore_version, reason (all required). The restore
