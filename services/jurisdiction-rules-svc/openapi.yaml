      responses: { "200": { description: The feed. }, "400": { $ref: '#/components/responses/BadRequest' }, "403": { $ref: '#/components/responses/Forbidden' } }

  # ── ZS-JUR-001 Wave 4 (calendar half): calendars, obligation rules, due-date calculation ──
  # Calendar versions and obligation rules are authored as DRAFT, given source provenance, and PUBLISHED by a
  # DIFFERENT principal; PUBLISHED is immutable (database-enforced) and an amendment is a new version. They reach
  # runtime only inside signed, certified, released packs (manifest fields calendar_modules and obligation_modules).

  /v1/admin/calendars:
    post: { tags: [Admin, Calendar], summary: Register an authority calendar, description: "Action REGULATORY_CALENDAR_CREATE. Body: calendar_code (lowercase), jurisdiction_id, authority, description?. Same code with different jurisdiction or authority is 409.", operationId: createCalendar, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Already exists. }, "201": { description: Created. }, "400": { $ref: '#/components/responses/BadRequest' }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: Conflicting definition. } } }
  /v1/calendars:
    get: { tags: [Calendar], summary: List calendars, operationId: listCalendars, responses: { "200": { description: Calendars. } } }
  /v1/calendars/{calendar_code}:
    get: { tags: [Calendar], summary: Get a calendar, operationId: getCalendar, parameters: [{ name: calendar_code, in: path, required: true, schema: { type: string } }], responses: { "200": { description: The calendar. }, "404": { $ref: '#/components/responses/NotFound' } } }
  /v1/calendars/{calendar_code}/versions:
    get: { tags: [Calendar], summary: List versions with holidays and sources, operationId: listCalendarVersions, parameters: [{ name: calendar_code, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Versions. } } }
  /v1/admin/calendars/{calendar_code}/versions:
    post:
      tags: [Admin, Calendar]
