      description: |
        Action REGULATORY_CALENDAR_VERSION_CREATE. Body: effective_from (date), timezone (IANA), weekend_days (REQUIRED,
        0=Sunday..6=Saturday; it differs between authorities so it is never defaulted), cutoff_time? (HH:MM authority-local),
        holidays [{date, name}]. The version number is assigned by the server.
      operationId: createCalendarVersion
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: calendar_code, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "201": { description: Drafted. }, "400": { $ref: '#/components/responses/BadRequest' }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/calendars/{calendar_code}/versions/{version}:
    get: { tags: [Calendar], summary: One calendar version, operationId: getCalendarVersion, parameters: [{ name: calendar_code, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: The version. }, "404": { $ref: '#/components/responses/NotFound' } } }
  /v1/admin/calendars/{calendar_code}/versions/{version}/sources:
    put: { tags: [Admin, Calendar], summary: Replace the official sources of a DRAFT version, description: "Action REGULATORY_CALENDAR_VERSION_SET_SOURCES. Body: source_ids[]. 409 not_draft once published.", operationId: setCalendarVersionSources, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: calendar_code, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Sources set. }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: Not DRAFT. } } }
  /v1/admin/calendars/{calendar_code}/versions/{version}/publish:
    post:
      tags: [Admin, Calendar]
      summary: Publish (freeze) a calendar version
      description: |
        Action REGULATORY_CALENDAR_VERSION_PUBLISH. The publisher must differ from the author (403 segregation_of_duties,
        also a database check); the version must cite at least one reviewed, non-superseded source (409 source_not_ready).
        Emits jurisdiction.calendar.changed. An amended holiday list is a NEW version, never an edit (JUR-NEG-13).
      operationId: publishCalendarVersion
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: calendar_code, in: path, required: true, schema: { type: string } }, { name: version, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Published (or already). }, "403": { $ref: '#/components/responses/Forbidden' }, "409": { description: source_not_ready. } }
  /v1/admin/obligation-rules:
    post:
      tags: [Admin, Obligations]
      summary: Draft the next version of an obligation (due-date) rule
      description: |
        Action OBLIGATION_RULE_CREATE. Body: jurisdiction_id, obligation_code (UPPER_SNAKE), name, period_basis
        (MONTHLY|QUARTERLY|ANNUAL|EVENT_DRIVEN|PAYROLL_CYCLE), anchor (PERIOD_END|EVENT_DATE|REGISTRATION_DATE|ANNIVERSARY),
        offset_months, offset_to_month_end (move to the last day of that month: "end of next month + N days"), offset_days,
        business_day_adjustment (NONE|NEXT|PREVIOUS; needs calendar_code), calendar_code?, effective_from, effective_to?,
        extension_allowed, max_extension_days, extension_requires_evidence, cutoff_applies, escalation_owner?,
        escalation_sla_hours?. rule_version is assigned by the server.
        Order of operations (an assumption the document leaves open): anchor, plus months, optionally to month end, plus days,
        plus a granted extension, then the business-day adjustment, then the authority-local cutoff.
      operationId: createObligationRule
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "201": { description: Drafted. }, "400": { $ref: '#/components/responses/BadRequest' }, "404": { $ref: '#/components/responses/NotFound' } }
  /v1/obligation-rules:
    get: { tags: [Obligations], summary: 'List obligation rules (filters jurisdiction_id, obligation_code)', operationId: listObligationRules, responses: { "200": { description: Rules. } } }
  /v1/obligation-rules/{obligation_rule_id}:
    get: { tags: [Obligations], summary: Get an obligation rule, operationId: getObligationRule, parameters: [{ name: obligation_rule_id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: The rule. }, "404": { $ref: '#/components/responses/NotFound' } } }
  /v1/admin/obligation-rules/{obligation_rule_id}/provenance:
    put: { tags: [Admin, Obligations], summary: 'Set regime, interpretation and sources of a DRAFT rule', description: "Action OBLIGATION_RULE_SET_PROVENANCE. Body: regime_id, interpretation_id (must be APPROVED, in the rule's jurisdiction or an ancestor), source_ids[]. Full replacement.", operationId: setObligationProvenance, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: obligation_rule_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Set. }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: 'Not DRAFT, or interpretation not approved.' } } }
  /v1/admin/obligation-rules/{obligation_rule_id}/publish:
    post: { tags: [Admin, Obligations], summary: Publish (freeze) an obligation rule, description: "Action OBLIGATION_RULE_PUBLISH. Publisher must differ from the author (403). Needs regime, an APPROVED interpretation, reviewed non-superseded sources, and an existing calendar when one is named.", operationId: publishObligationRule, security: [{ principalHeader: [] }], parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: obligation_rule_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PrincipalID' }], responses: { "200": { description: Published (or already). }, "403": { $ref: '#/components/responses/Forbidden' }, "409": { description: source_not_ready or interpretation_not_approved. } } }
  /v1/obligation-calculations:calculate:
    post:
      tags: [Resolver]
      summary: Derive an obligation's due date from verified released pack artifacts
      description: |
        Action OBLIGATION_CALCULATION_CALCULATE. Body: jurisdiction (code), obligation_code, ONE anchor fact (period_end,
        event_date, registration_date, or anniversary_date with anchor_year), extension_days?, extension_evidence_ref?,
        as_of? (adds an `overdue` verdict against the due instant), pack_ref?/pack_version? (replay a past calculation against
        the exact pack release it used). Header Idempotency-Key as for rule resolution; as_of is not part of the question.

        The pack, obligation rule version and calendar version are chosen by the server (the same eligibility, ring/region,
        verification and fail-closed rules as /v1/rule-resolutions:resolve). A calendar amendment is a new pack release, so a
        past calculation stays reproducible (JUR-NEG-13). The response carries every step, the pack release, the rule and
        calendar versions, the sources and the escalation owner. Every answer except 503 is recorded in the evidence ledger.

        HTTP: 200 DUE_DATE_CALCULATED or NO_OBLIGATION_RULE; 409 AMBIGUOUS (including two packs defining the same obligation)
        or NO_CALENDAR; 422 UNSUPPORTED_JURISDICTION, INVALID_FACTS (for example a MONTHLY period_end that is not a month end)
        or EXTENSION_NOT_PERMITTED (not legally supported, over the cap, or not evidenced); 503 pack_unverified.
      operationId: calculateObligation
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: 'Calculated, or no obligation rule applies.' }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: 'AMBIGUOUS, NO_CALENDAR or idempotency_conflict.' }, "422": { description: Explicit refusal. }, "503": { description: pack_unverified. } }

  # ── ZS-JUR-001 Wave 4 (tax half): rule parameters and regulatory calculation ──
  # DECISION: ZS-JUR-001 governs. Rates, thresholds and rounding live in a rule's typed `parameters`, frozen with the rule and
  # carried in signed, tested, certified, released packs; they are executed with exact decimal arithmetic. `rule_payload` keeps
  # its original meaning (applicability metadata only).

  /v1/admin/rules/{jurisdiction_rule_id}/parameters:
    put:
      tags: [Admin, Rules]
      summary: Set the typed calculation parameters of a DRAFT rule
      description: |
        Action JURISDICTION_RULE_SET_PARAMETERS. Body: {"parameters": {...}} (required; an explicit null clears them).
        Two closed families, decimal STRINGS only (a JSON number is refused: JUR-NEG-25):
        TAX_RATE {"family":"TAX_RATE","rate":"0.2000","rounding":{"mode":"HALF_UP","scale":2}} and
        TAX_BANDS {"family":"TAX_BANDS","bands":[{"up_to":"12570","rate":"0"},{"up_to":"50270","rate":"0.2"},{"up_to":null,"rate":"0.4"}],
        "rounding":{...}} (marginal bands; limits strictly increasing and inclusive; the last band must have up_to null).
        Rates are 0 to 1. Rounding mode HALF_UP, HALF_EVEN, UP or DOWN, scale 0 to 6, applied ONCE to the total.
        409 not_draft once the rule leaves DRAFT; the database also refuses any change then.
      operationId: setRuleParameters
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RuleID' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Set (or cleared). }, "400": { $ref: '#/components/responses/BadRequest' }, "404": { $ref: '#/components/responses/NotFound' }, "409": { description: Not DRAFT. } }
  /v1/rules/{jurisdiction_rule_id}/parameters:
    get: { tags: [Rules], summary: A rule's typed calculation parameters (null when none), operationId: getRuleParameters, parameters: [{ $ref: '#/components/parameters/RuleID' }], responses: { "200": { description: The parameters. }, "404": { $ref: '#/components/responses/NotFound' } } }
  /v1/regulatory-calculations:execute:
    post:
      tags: [Resolver]
      summary: Calculate tax from the applicable rule's parameters (exact decimal arithmetic)
      description: |
        Action REGULATORY_CALCULATION_EXECUTE. Body: jurisdiction, rule_domain, rule_code, effective_at, taxable_amount (a
        non-negative decimal STRING, at most 12 decimal places; "1e3", "-5" and "1." are refused), currency (three upper-case letters;
        echoed, not validated against a registry), pack_ref?/pack_version? (replay against the exact pack release a past calculation
        used). Header Idempotency-Key as for rule resolution.

        The rule is resolved exactly as in /v1/rule-resolutions:resolve (verified released pack, fail closed), then its parameters are
        applied with exact rational arithmetic and ONE rounding step. The response carries the resolution (pack release, rule, sources),
        the tax (taxable amount, tax amount, unrounded tax, whether rounding changed it) and every step. Every answer except 503 is
        recorded as evidence (decision_kind CALCULATION): inputs, steps, result, rule and pack versions (s12).

        HTTP: 200 CALCULATED or NO_RULE; 409 AMBIGUOUS; 422 UNSUPPORTED_JURISDICTION, NO_PARAMETERS (the rule carries no parameters:
        no rate is ever guessed) or INVALID_FACTS; 503 pack_unverified. A rate quietly altered in storage cannot be served: the artifact
        digest and signature fail and there is no answer instead of a wrong tax.

        Certification: a rule that carries parameters needs calculation coverage in its test bundle: a GOLDEN calculation case
        (JUR-T020), a BOUNDARY case at exactly each finite band limit (JUR-T021), a BOUNDARY case whose result is actually rounded
        (JUR-T022), and a NEGATIVE case in which an unsupported amount is refused (JUR-T023).
      operationId: executeCalculation
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: 'Calculated, or no rule applies.' }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: AMBIGUOUS or idempotency_conflict. }, "422": { description: Explicit refusal. }, "503": { description: pack_unverified. } }

  /v1/payroll-statutory-parameters:resolve:
    post:
      tags: [Resolver]
      summary: Resolve the statutory payroll parameter set in force (allowances, withholding bands, contributions)
      description: |
        Action PAYROLL_PARAMETERS_RESOLVE. Body: jurisdiction, effective_at (pay date), classes? (INCOME_WITHHOLDING, EMPLOYEE_CONTRIBUTION,
        EMPLOYER_CONTRIBUTION, ALLOWANCE_OR_THRESHOLD, STATUTORY_PAY_LEAVE), pack_ref?/pack_version? (pinned replay). Header Idempotency-Key.

        Returns every PAYROLL rule in force from verified, certified, released packs with its typed parameters, class, sources and content
        digest, ordered by class then code, plus a bundle_digest over the whole set. The payroll product consumes the parameters; payroll
        CALCULATION is not done here. If any rule code is ambiguous across packs the answer is AMBIGUOUS with NO items (never a partial set).
        Recorded as evidence (decision_kind PARAMETER_SET, anchored on the bundle digest).

        HTTP: 200 PARAMETERS_RESOLVED or NO_RULE; 409 AMBIGUOUS or idempotency_conflict; 422 UNSUPPORTED_JURISDICTION; 503 pack_unverified.
      operationId: resolvePayrollParameters
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: 'Parameter set, or no rule applies.' }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: AMBIGUOUS or idempotency_conflict. }, "422": { description: UNSUPPORTED_JURISDICTION. }, "503": { description: pack_unverified. } }

  /v1/retention-rules:resolve:
    post:
      tags: [Resolver]
      summary: Resolve a record class's statutory retention period and retain-until date
      description: |
        Action RETENTION_RULE_RESOLVE. Body: jurisdiction, record_class, trigger_date (YYYY-MM-DD; the rule in force on that date applies),
        trigger? (the event the caller measures from; a mismatch is refused), tenant_minimum? ({years, months, days}), pack_ref?/pack_version?.
        Header Idempotency-Key.

        Returns the statutory minimum (ISO 8601), retain_until, format requirement, legal_hold_override (always true) and destruction_rule
        (always ELIGIBILITY_ONLY: this service decides eligibility and NEVER deletes). A tenant policy may extend retention but never
        shorten it (TENANT_POLICY_TOO_SHORT, JUR-NEG-12). Recorded as evidence (decision_kind RETENTION).

        HTTP: 200 RETENTION_RESOLVED or NO_RULE; 409 AMBIGUOUS or idempotency_conflict; 422 UNSUPPORTED_JURISDICTION, TENANT_POLICY_TOO_SHORT,
        TRIGGER_MISMATCH or NO_PARAMETERS; 503 pack_unverified.
      operationId: resolveRetention
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: 'Retention determined, or no rule applies.' }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: AMBIGUOUS or idempotency_conflict. }, "422": { description: Explicit refusal. }, "503": { description: pack_unverified. } }

  /v1/accounting-mappings:resolve:
    post:
      tags: [Resolver]
      summary: Resolve an accounting or reporting mapping (classification only; never posts)
      description: |
        Action ACCOUNTING_MAPPING_RESOLVE. Body: jurisdiction, mapping_code, effective_at, from? (one code to look up; omitted returns the whole
        mapping), pack_ref?/pack_version?. Header Idempotency-Key. Mapping types: TAX_CODE_TO_ACCOUNT_CLASS, STATUTORY_LINE_TO_METRIC,
        REPORTING_TAXONOMY, DISCLOSURE_REQUIREMENT, CONTROL_ACCOUNT_CLASS. An unmapped code is MAPPING_ENTRY_NOT_FOUND: nothing is guessed.
        The Accounting Kernel remains the only posting authority. Recorded as evidence (decision_kind MAPPING).

        HTTP: 200 MAPPING_RESOLVED or NO_RULE; 409 AMBIGUOUS or idempotency_conflict; 422 UNSUPPORTED_JURISDICTION, MAPPING_ENTRY_NOT_FOUND
        or NO_PARAMETERS; 503 pack_unverified.
      operationId: resolveAccountingMapping
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: 'Mapping resolved, or no rule applies.' }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: AMBIGUOUS or idempotency_conflict. }, "422": { description: Explicit refusal. }, "503": { description: pack_unverified. } }

  /v1/submission-profiles:resolve:
    post:
      tags: [Resolver]
      summary: Resolve the e-invoice or filing profile in force, and check the dependencies a payload was built with
      description: |
        Action SUBMISSION_PROFILE_RESOLVE. Body: jurisdiction, kind (EINVOICE or FILING), profile_code, effective_at, dependencies_used? ([{ref, version}]
        schema, code-list and business-rule versions the payload was built with), pack_ref?/pack_version?. Header Idempotency-Key.

        Returns the profile (channel, document type, version, syntax, transmission mode, timing, corrections, dependencies with validity windows,
        semantic mapping or filing obligation, lifecycle) from the verified released pack. A used dependency the profile does not declare is
        DEPENDENCY_UNKNOWN, and one outside its validity window is DEPENDENCY_EXPIRED; both name the exact reference and version (JUR-NEG-08, 27).
        No endpoint, credential or certificate is ever part of a profile. Recorded as evidence (decision_kind PROFILE).

        HTTP: 200 PROFILE_RESOLVED or NO_RULE; 409 AMBIGUOUS or idempotency_conflict; 422 UNSUPPORTED_JURISDICTION, DEPENDENCY_UNKNOWN,
        DEPENDENCY_EXPIRED or NO_PARAMETERS; 503 pack_unverified.
      operationId: resolveSubmissionProfile
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: 'Profile resolved, or no rule applies.' }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: AMBIGUOUS or idempotency_conflict. }, "422": { description: Explicit refusal. }, "503": { description: pack_unverified. } }

  /v1/regulatory-submissions:
    post:
      tags: [Resolver]
      summary: Register an e-invoice or filing submission under the profile in force
      description: |
        Action REGULATORY_SUBMISSION_CREATE. Body as /v1/submission-profiles:resolve plus subject_ref (the invoice or filing in the caller's system),
        payload_hash (sha256:<64 hex>) and, for filings, approvals ([{role, principal_id}]). Header Idempotency-Key.

        Registers nothing, and returns the refusal with its outcome, when a dependency is unknown or expired, or when a filing lacks an approval for
        every role its profile requires from a principal other than the preparer and the other approvers (APPROVAL_MISSING). A registered submission
        snapshots the profile (so a later pack release cannot change an in-flight lifecycle), the pack release and the artifact digest. This service
        does not transmit anything: adapters, endpoints and credentials belong to the provider layer.

        HTTP: 201 registered, 200 idempotent repeat; 409 AMBIGUOUS or idempotency_conflict; 422 refusal; 503 pack_unverified.
      operationId: registerSubmission
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Idempotent repeat. }, "201": { description: Registered. }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: AMBIGUOUS or idempotency_conflict. }, "422": { description: Explicit refusal. }, "503": { description: pack_unverified. } }

  /v1/regulatory-submissions/{submission_id}:
    get:
      tags: [Resolver]
      summary: Read a submission with every status report it received
      description: Action REGULATORY_SUBMISSION_VIEW.
      operationId: getSubmission
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/PrincipalID' }, { name: submission_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: The submission and its events. }, "404": { description: submission_not_found. } }

  /v1/regulatory-submissions/{submission_id}/events:
    post:
      tags: [Resolver]
      summary: Record an authority or provider status report
      description: |
        Action REGULATORY_SUBMISSION_RECORD_EVENT. Body: provider_event_id (the provider's own id; a repeat is stored once), status (UPPER_SNAKE),
        receipt_id? (required to enter a state the profile marks receipt_required, such as ACCEPTED), occurred_at, detail?.

        Always 200 once stored: the body says whether the report changed the status (applied) and why not otherwise (disposition), so a webhook
        caller is not pushed into retries by a late or duplicate report. Dispositions: APPLIED; STALE (older than the last applied report);
        AFTER_TERMINAL (the submission already reached a final outcome: no regression, JUR-NEG-11); ILLEGAL_TRANSITION (not in the profile's
        lifecycle); MISSING_RECEIPT (no false accepted state, JUR-NEG-09); UNKNOWN_STATUS. A duplicate provider_event_id returns the stored result
        with replayed true (JUR-NEG-10). Every report is append-only evidence.
      operationId: recordSubmissionEvent
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }, { name: submission_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Report stored (see applied and disposition). }, "400": { $ref: '#/components/responses/BadRequest' }, "404": { description: submission_not_found. } }

  /v1/admin/rollouts:
    post:
      tags: [Rollout]
      summary: Add a jurisdiction pack family to the rollout portfolio (PLANNED)
      description: |
        Action JURISDICTION_ROLLOUT_CREATE. Body: family_ref (for example gb or us.state.ca), display_name, layer (GLOBAL_REFERENCE, GLOBAL_CORE,
        REGIONAL_FRAMEWORK, COUNTRY, SUBDIVISION), jurisdiction_code (required for COUNTRY and SUBDIVISION), owner, support_owner?, scope_note?.
        Naming a family here does NOT mean certified rules exist for it (s32).
      operationId: createRollout
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "201": { description: Created. }, "400": { $ref: '#/components/responses/BadRequest' }, "409": { description: One rollout per family_ref. } }
    get:
      tags: [Rollout]
      summary: List rollouts (optional status filter)
      description: Action JURISDICTION_ROLLOUT_VIEW.
      operationId: listRollouts
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/PrincipalID' }, { name: status, in: query, required: false, schema: { type: string, enum: [PLANNED, AUTHORING, READY, LAUNCHED, SUSPENDED, RETIRED] } }]
      responses: { "200": { description: Rollouts. } }

  /v1/admin/rollouts:seed-portfolio:
    post:
      tags: [Rollout]
      summary: Seed the s32 initial portfolio as PLANNED entries with no owner (idempotent)
      description: Action JURISDICTION_ROLLOUT_SEED. States intent only; a PLANNED entry is not support.
      operationId: seedRolloutPortfolio
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: Counts of created and already present entries. } }

  /v1/admin/rollouts/{rollout_id}:
    get:
      tags: [Rollout]
      summary: A rollout with its checklist state, expert decisions, packs, history and what blocks each next step
      description: Action JURISDICTION_ROLLOUT_VIEW.
      operationId: getRollout
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/PrincipalID' }, { name: rollout_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Detail. }, "404": { description: rollout_not_found. } }

  /v1/admin/rollouts/{rollout_id}/owner:
    put:
      tags: [Rollout]
      summary: Assign the accountable owner and support owner (DOR_09)
      description: Action JURISDICTION_ROLLOUT_SET_OWNER. A principal who already attested to or approved the rollout cannot become its owner. Not allowed once LAUNCHED or RETIRED.
      operationId: setRolloutOwner
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }, { name: rollout_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Updated. }, "400": { $ref: '#/components/responses/BadRequest' }, "403": { description: segregation_of_duties. }, "404": { description: rollout_not_found. } }

  /v1/admin/rollouts/{rollout_id}/packs:
    put:
      tags: [Rollout]
      summary: Link the packs that make up the rollout (additive, idempotent)
      description: Action JURISDICTION_ROLLOUT_LINK_PACKS. Body pack_refs (1 to 50).
      operationId: linkRolloutPacks
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }, { name: rollout_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Linked pack refs. }, "404": { description: rollout_not_found or pack_not_found. } }

  /v1/admin/rollouts/{rollout_id}/attestations:
    post:
      tags: [Rollout]
      summary: Record a Definition of Ready (DOR_01..10) or Definition of Done (DOD_01..11) answer
      description: |
        Action JURISDICTION_ROLLOUT_ATTEST. Body: checklist (READY or DONE), item_code, met, evidence_ref (required when met). The attester cannot be the
        rollout owner. Append-only: the latest answer for an item is current, so an item can be withdrawn by recording met false.
      operationId: attestRollout
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }, { name: rollout_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "201": { description: Recorded. }, "400": { $ref: '#/components/responses/BadRequest' }, "403": { description: segregation_of_duties. }, "404": { description: rollout_not_found. } }

  /v1/admin/rollouts/{rollout_id}/expert-approvals:
    post:
      tags: [Rollout]
      summary: Record a qualified local expert, legal or tax decision
      description: 'Action JURISDICTION_ROLLOUT_EXPERT_APPROVE. Body: qualification, scope, decision (APPROVE or REJECT), notes?. The expert cannot be the rollout owner. An expert''s latest decision counts.'
      operationId: expertApproveRollout
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }, { name: rollout_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "201": { description: Recorded. }, "400": { $ref: '#/components/responses/BadRequest' }, "403": { description: segregation_of_duties. }, "404": { description: rollout_not_found. } }

  /v1/admin/rollouts/{rollout_id}/transition:
    post:
      tags: [Rollout]
      summary: Move a rollout (AUTHORING, READY, LAUNCHED, SUSPENDED, RETIRED)
      description: |
        Action JURISDICTION_ROLLOUT_TRANSITION. Body: to, reason (required for SUSPENDED, RETIRED and for READY back to AUTHORING).
        READY needs the whole Definition of Ready. LAUNCHED additionally needs the whole Definition of Done, at least one approving qualified expert, a linked pack with a
        RELEASED version, and a launcher who is neither the owner nor an expert on the rollout. A refused move returns 409 with EVERY blocker. The database enforces the same gates.
      operationId: transitionRollout
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestID' }, { $ref: '#/components/parameters/TenantID' }, { $ref: '#/components/parameters/SourceChannel' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/PrincipalID' }, { name: rollout_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Moved. }, "400": { $ref: '#/components/responses/BadRequest' }, "404": { description: rollout_not_found. }, "409": { description: 'rollout_blocked, with blockers.' } }

  /v1/rollout-checklists:
    get:
      tags: [Rollout]
      summary: The Definition of Ready (s35) and Definition of Done (s36) items
      description: Action JURISDICTION_ROLLOUT_VIEW.
      operationId: rolloutChecklists
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/PrincipalID' }]
      responses: { "200": { description: The two checklists. } }

  /v1/jurisdiction-support/{jurisdiction_code}:
    get:
      tags: [Rollout]
      summary: Is this jurisdiction supported for production? (never guesses)
      description: |
        Action JURISDICTION_SUPPORT_VIEW. SUPPORTED only when a LAUNCHED rollout names the jurisdiction AND a linked pack has a RELEASED version covering it. Otherwise
        NOT_YET_SUPPORTED, SUSPENDED, NO_RELEASED_PACK (launched but nothing released covers it, for example after a withdrawal) or NO_ROLLOUT, each with an explanation (JUR-NEG-22).
        Matches the rollout's jurisdiction_code exactly: a subdivision is not supported because its country is.
      operationId: jurisdictionSupport
      security: [{ principalHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/PrincipalID' }, { name: jurisdiction_code, in: path, required: true, schema: { type: string, maxLength: 32 } }]
      responses: { "200": { description: Support status. } }

  # ── Health ─────────────────────────────────────────────────────────────────

  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: liveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: "ok" }

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Answers 200 only when the database pool can be pinged within 2 seconds.
      operationId: readiness
      responses:
        "200":
          description: Ready to serve traffic.
        "503":
          description: Not ready — the database is unreachable.

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      operationId: metrics
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain: {}

components:

  securitySchemes:
    principalHeader:
      type: apiKey
      in: header
      name: X-Principal-Id
      description: |
        The acting principal, set by the gateway's ForwardAuth middleware after it
        verifies the caller's identity envelope against identity-svc's JWKS. Callers
        do not set this themselves — a request that reaches the service without it is
        rejected with `401 missing_principal` rather than attributed to the platform.

  parameters:
    JurisdictionID:
      name: jurisdiction_id
      in: path
      required: true
      description: Jurisdiction UUID. A malformed value answers 404, not 503.
      schema: { type: string }

    RuleID:
      name: jurisdiction_rule_id
      in: path
      required: true
      description: Rule UUID. A malformed value answers 404, not 503.
      schema: { type: string }

    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Evidence propagation id, echoed on every response. Generated by the service
        when absent.
      schema: { type: string }

    PrincipalID:
      name: X-Principal-Id
      in: header
      required: true
      description: See the `principalHeader` security scheme.
      schema: { type: string }

    TenantID:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        The tenant context from the verified identity envelope. Mandatory on every
        request — INV-01 ("every authenticated operation resolves exactly one tenant
        context before data access"). Set by the gateway's ForwardAuth middleware.
      schema: { type: string }

    RequestID:
      name: X-Request-Id
      in: header
      required: true
      description: |
        Unique request identifier. Mandatory on every request — request tracing.
      schema: { type: string }

    WorkloadID:
      name: X-Workload-Id
      in: header
      required: false
      description: |
        Workload identity for service-to-service calls. Alternative to X-Principal-Id.
      schema: { type: string }

    SourceChannel:
      name: X-Source-Channel
      in: header
      required: true
      description: |
        Originating channel. Mandatory on every request; unrecognised values are
        refused (400) rather than silently accepted.
      schema:
        type: string
        enum: [api, batch, webhook, cli]

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated idempotency key for safe retries on material state changes
        (INV-08). Mandatory on every write; outside the envelope a missing key is a
        400 `envelope_incomplete`, a conflict on replay is a 409.
      schema: { type: string, maxLength: 128 }

    EffectiveAt:
      name: effective_at
      in: query
      required: false
      description: RFC3339 point-in-time. Defaults to now. A malformed value is a 400, never silently "now".
      schema: { type: string, format: date-time }

    Limit100:
      name: limit
      in: query
      required: false
      description: Page size, max 100, default 50. Must be a non-negative integer.
      schema: { type: integer, minimum: 0, maximum: 100, default: 50 }

    Limit200:
      name: limit
      in: query
      required: false
      description: Page size, max 200, default 50. Must be a non-negative integer.
      schema: { type: integer, minimum: 0, maximum: 200, default: 50 }

    Offset:
      name: offset
      in: query
      required: false
      description: Zero-based page offset. Must be a non-negative integer.
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    BadRequest:
      description: |
        Malformed or incomplete request. Codes include `missing_field`,
        `invalid_request_body`, `invalid_effective_at`, `invalid_effective_period`,
        `invalid_limit`, `invalid_offset`, `invalid_rule_status`,
        `invalid_rule_payload`, `invalid_status`, `invalid_drift_state`, and
        `envelope_incomplete` — a write-strict obligation header (`X-Request-Id`,
        `X-Source-Channel`, `Idempotency-Key`) is missing or unusable.
        An unknown JSON field is rejected rather than ignored.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

    MissingPrincipal:
      description: |
        `missing_principal` — no caller identity on the request, or
        `envelope_incomplete` with HTTP 401 — the request envelope omitted
        `X-Tenant-Id` or `X-Principal-Id` (a write-strict obligation).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

    Forbidden:
      description: '`unauthorized` — the Authorization Service denied the action.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

    NotFound:
      description: |
        `jurisdiction_not_found` / `rule_not_found`. Also returned for a malformed id,
        which cannot name an existing row.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

    BodyTooLarge:
      description: '`request_body_too_large` — the body exceeds 256 KiB.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

    StoreUnavailable:
      description: |
        `store_unavailable` — the service cannot answer. This is NOT "no". Callers
        validating a `jurisdiction_id` must reject the write fail-closed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

    AuthzOrStoreUnavailable:
      description: |
        `authz_unavailable` — no authorization decision could be obtained, so the
        mutation was refused. `store_unavailable` — the database could not be reached.
        Both fail closed: nothing was written.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [type, title, status, code]
      description: |
        RFC 9457 Problem Details (API standard §12) plus the Zoiko extensions:
        `code` is the stable machine-readable code clients branch on, and `error`
        is a deprecated alias of `code` retained for one migration cycle.
        `type` names the stable error class (Governance Control Plane §16) where
        one applies. Additional extension fields — `field`, `jurisdiction_id`,
        `reasons`, `report`, `failures`, `service` — appear inline as relevant.
        Emitted as `application/problem+json`.
      properties:
        type:
          type: string
          format: uri
          description: URI naming the problem type (GCP §16 class when one applies).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence, when known.
        code:
          type: string
          description: Stable machine-readable code for client logic (e.g., "missing_field").
        error:
          type: string
          description: Deprecated alias of `code`; clients should branch on `code`.
        request_id:
          type: string
          description: Request identifier for support/evidence (API standard §12).
        correlation_id:
          type: string
          description: Cross-service business correlation, when known.
        retryable:
          type: boolean
          description: |
            Advisory only; a retry still respects idempotency and Retry-After.
            Marked true only for transient 429/503/504 conditions.
        errors:
          type: array
          description: Field/item validation details.
          items:
            type: object
            properties:
              pointer:
                type: string
                description: JSON Pointer-style location of the field (e.g. "#/rule_code").
              code:
                type: string
                description: Stable machine code for the violation (e.g. "missing").
              detail:
                type: string
                description: Human-readable explanation of the violation.
        field:
          type: string
          description: The offending field, when code is "missing_field".
        jurisdiction_id:
          type: string
          format: uuid
          description: The jurisdiction ID, when relevant.

    Jurisdiction:
      type: object
      description: |
        A jurisdiction identity. PUBLIC data
        (data_classification_audit.md §2.11) — names, region codes, country codes.
      required:
        - jurisdiction_id
        - jurisdiction_code
        - jurisdiction_name
        - jurisdiction_type
        - authority_type
        - effective_from
        - active_flag
        - data_classification
        - created_at
        - created_by_principal_id
        - schema_version
      properties:
        jurisdiction_id: { type: string, format: uuid }
        jurisdiction_code:
          type: string
          description: |
            Human-readable short code, e.g. "GB", "US-CA". DATA ONLY — never used as a
            code branch anywhere in the platform.
        jurisdiction_name: { type: string }
        jurisdiction_type:
          type: string
          description: |
            VARCHAR tag stored as data, e.g. COUNTRY, STATE_PROVINCE, TAX_AUTHORITY,
            LABOR_LAW_BOUNDARY, FILING_AUTHORITY, DATA_RESIDENCY_BOUNDARY. New values
            arrive by data migration; this list is illustrative, not exhaustive.
        parent_jurisdiction_id:
          type: [string, "null"]
          format: uuid
          description: Null for a root jurisdiction. Nests country → state → tax authority.
        authority_type:
          type: string
          description: e.g. FEDERAL, STATE, MUNICIPAL, SUPRANATIONAL. Data driven.
        effective_from: { type: string, format: date-time }
        effective_to:
          type: [string, "null"]
          format: date-time
          description: Null while current. Set on deactivation — end-dating, not deletion.
        active_flag: { type: boolean }
        data_classification: { type: string, const: "PUBLIC" }
        created_at: { type: string, format: date-time }
        created_by_principal_id: { type: string }
        schema_version: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by_principal_id: { type: [string, "null"] }

    JurisdictionRule:
      type: object
      description: |
        An effective-dated applicability rule. INTERNAL data
        (data_classification_audit.md §2.11).
      required:
        - jurisdiction_rule_id
        - jurisdiction_id
        - rule_domain
        - rule_code
        - rule_name
        - effective_from
        - rule_payload
        - rule_status
        - legal_drift_state
        - data_classification
        - created_at
        - created_by_principal_id
        - schema_version
      properties:
        jurisdiction_rule_id: { type: string, format: uuid }
        jurisdiction_id: { type: string, format: uuid }
        rule_domain:
          type: string
          description: e.g. PAYROLL, TAX, EMPLOYMENT, FILING, RETENTION, BENEFITS. Data driven.
        rule_code:
          type: string
          description: Stable machine-readable identifier for this rule type within a domain.
        rule_name: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to:
          type: [string, "null"]
          format: date-time
          description: |
            Exclusive end of the half-open effective period. Set automatically when the
            rule is superseded or retired.
        rule_payload:
          type: object
          description: |
            APPLICABILITY METADATA ONLY — never computation values. Thresholds, rates
            and bands belong to the Tax and Payroll services (OQ-1, Model B). Structure
            is domain-specific and governed by `rule_domain` + `schema_version`.
            Example: `{"applies_to_entity_types":["COMPANY","BRANCH"],
            "filing_frequency":"MONTHLY","authority_code":"HMRC"}`.
        source_reference:
          type: [string, "null"]
          description: Citation — legislative act, regulation, statutory instrument.
        external_feed_reference:
          type: [string, "null"]
          description: The external regulatory data feed that produced this rule.
        rule_status:
          type: string
          description: DRAFT, ACTIVE, SUPERSEDED or RETIRED. VARCHAR, not an enum.
        rule_version:
          type: integer
          description: Immutable version number. Incremented on each status change.
        supersedes_rule_id:
          type: [string, "null"]
          format: uuid
          description: The rule this rule supersedes, forming a version chain.
        precedence_level:
          type: integer
          description: Explicit precedence level. Lower = higher precedence. Used for conflict resolution.
        legal_drift_state:
          type: string
          description: |
            CURRENT, DRIFTED or UNDER_REVIEW. Current value only — the transition
            history is at /v1/rules/{id}/drift-events.
        data_classification: { type: string, const: "INTERNAL" }
        created_at: { type: string, format: date-time }
        created_by_principal_id: { type: string }
        schema_version: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by_principal_id: { type: [string, "null"] }

    RulePack:
      type: object
      description: The resolved, runtime-ready rule set for a jurisdiction at a point in time.
      required: [jurisdiction_id, effective_at, resolved_from, rules]
      properties:
        jurisdiction_id: { type: string, format: uuid }
        effective_at: { type: string, format: date-time }
        resolved_from:
          type: array
          description: |
            The jurisdiction chain the pack was assembled from, self first then
            ancestors outward to the root. Record this as the rule basis of a governed
            action.
          items: { type: string, format: uuid }
        rules:
          type: array
          description: One winning rule per (rule_domain, rule_code). Never null.
          items: { $ref: '#/components/schemas/JurisdictionRule' }
        conflicts:
          type: array
          description: (rule_domain, rule_code) pairs with equal precedence and overlapping periods.
          items: { $ref: '#/components/schemas/RuleConflict' }
        insufficient:
          type: array
          description: (rule_domain, rule_code) pairs with no rule in the ancestor chain.
          items:
            type: string
            description: "Format: rule_domain|rule_code"

    DriftEvent:
      type: object
      description: One append-only entry in a rule's legal_drift_state history (OQ-4).
      required:
        - drift_event_id
        - jurisdiction_rule_id
        - from_state
        - to_state
        - effective_at
        - recorded_by_principal_id
        - schema_version
      properties:
        drift_event_id: { type: string, format: uuid }
        jurisdiction_rule_id: { type: string, format: uuid }
        from_state: { type: string }
        to_state: { type: string }
        reason:
          type: [string, "null"]
          description: |
            The evidence — the regulatory update that diverged from the stored rule, or
            the review conclusion that closed it.
        effective_at: { type: string, format: date-time }
        recorded_by_principal_id: { type: string }
        correlation_id: { type: [string, "null"] }
        schema_version: { type: string }

    CreateJurisdictionRequest:
      type: object
      required: [jurisdiction_code, jurisdiction_name, jurisdiction_type, authority_type, effective_from]
      additionalProperties: false
      properties:
        jurisdiction_code: { type: string, minLength: 1, maxLength: 32 }
        jurisdiction_name: { type: string, minLength: 1 }
        jurisdiction_type: { type: string, minLength: 1, maxLength: 64 }
        parent_jurisdiction_id: { type: [string, "null"], format: uuid }
        authority_type: { type: string, minLength: 1, maxLength: 64 }
        effective_from: { type: string, format: date-time }
        effective_to:
          type: [string, "null"]
          format: date-time
          description: Must be strictly after effective_from.

    CreateRuleRequest:
      type: object
      required: [rule_domain, rule_code, rule_name, effective_from]
      additionalProperties: false
      properties:
        rule_domain: { type: string, minLength: 1, maxLength: 64 }
        rule_code: { type: string, minLength: 1, maxLength: 128 }
        rule_name: { type: string, minLength: 1 }
        effective_from: { type: string, format: date-time }
        effective_to:
          type: [string, "null"]
          format: date-time
          description: Must be strictly after effective_from.
        rule_payload:
          type: object
          description: |
            Applicability metadata. Must be a JSON object — a scalar or array is
            rejected. Omitted defaults to `{}`.
          default: {}
        source_reference: { type: [string, "null"] }
        external_feed_reference: { type: [string, "null"] }
        rule_status:
          type: string
          enum: [DRAFT, ACTIVE]
          default: DRAFT
          description: |
            SUPERSEDED and RETIRED are not accepted here — they are reached only
            through the transition endpoint.
        rule_version:
          type: integer
          default: 1
          description: Immutable version number. Defaults to 1 for new rules.
        supersedes_rule_id:
          type: [string, "null"]
          format: uuid
          description: The rule this rule supersedes, forming a version chain.
        precedence_level:
          type: integer
          default: 0
          description: Explicit precedence level. Lower = higher precedence.

    TransitionRuleStatusRequest:
      type: object
      required: [new_status]
      additionalProperties: false
      properties:
        new_status:
          type: string
          enum: [ACTIVE, SUPERSEDED, RETIRED]
        effective_to:
          type: [string, "null"]
          format: date-time
          description: |
            When the rule stopped applying. Used only for SUPERSEDED and RETIRED, and
            only when the rule does not already carry an end date. Omitted means now.
            Must be strictly after the rule's effective_from.

    RecordDriftRequest:
      type: object
      required: [drift_state]
      additionalProperties: false
      properties:
        drift_state:
          type: string
          enum: [CURRENT, DRIFTED, UNDER_REVIEW]
        reason:
          type: [string, "null"]
          description: The evidence for the change. Preserved verbatim in the history.

    RecordDriftResponse:
      type: object
      required: [rule, changed]
      properties:
        rule: { $ref: '#/components/schemas/JurisdictionRule' }
        drift_event:
          oneOf:
            - $ref: '#/components/schemas/DriftEvent'
            - type: "null"
          description: The history entry written. Null when the state was already set.
        changed:
          type: boolean
          description: |
            False for a replay. Consumers use this to tell a real divergence from a
            retried call.

    RuleStatusHistory:
      type: object
      description: One entry in the bitemporal rule status history (V-001 §8.1).
      required:
        - history_id
        - jurisdiction_rule_id
        - rule_status
        - effective_from
        - known_from
        - changed_by_principal_id
        - schema_version
      properties:
        history_id: { type: string, format: uuid }
        jurisdiction_rule_id: { type: string, format: uuid }
        rule_status: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: [string, "null"], format: date-time }
        known_from: { type: string, format: date-time }
        known_to: { type: [string, "null"], format: date-time }
        changed_by_principal_id: { type: string }
        change_reason: { type: [string, "null"] }
        schema_version: { type: string }

    RuleConflict:
      type: object
      description: A (rule_domain, rule_code) pair with equal precedence and overlapping periods.
      required: [rule_domain, rule_code, rule_ids]
      properties:
        rule_domain: { type: string }
        rule_code: { type: string }
        rule_ids:
          type: array
          items: { type: string, format: uuid }
          description: The conflicting rule IDs.

    ValidateActionRequest:
      type: object
      required: [action_type, jurisdiction_id, entity_type]
      additionalProperties: false
      properties:
        action_type:
          type: string
          description: The action being validated, e.g., "tax.calculate", "payroll.run".
        jurisdiction_id:
          type: string
          format: uuid
          description: The jurisdiction context for the action.
        entity_type:
          type: string
          description: The entity type the action applies to, e.g., "COMPANY", "EMPLOYEE".
        effective_at:
          type: [string, "null"]
          format: date-time
          description: RFC3339 point-in-time. Defaults to now.
        payload:
          type: object
          description: Optional action-specific context for rule evaluation.

    ValidateActionResponse:
      type: object
      description: Action is permitted; returns the applicable rule payload.
      required: [permitted, rule]
      properties:
        permitted:
          type: boolean
          const: true
        rule:
          $ref: '#/components/schemas/JurisdictionRule'
        resolved_from:
          type: array
          items: { type: string, format: uuid }
          description: The jurisdiction chain the pack was assembled from.

    ValidateActionConflictResponse:
      type: object
      description: Action cannot be validated due to conflict or insufficient rules.
      required: [permitted, detail]
      properties:
        permitted:
          type: boolean
          const: false
        detail:
          type: string
          enum: [conflicted, insufficient]
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/RuleConflict' }
          description: Present when detail=conflicted.
        insufficient:
          type: array
          items: { type: string }
          description: Present when detail=insufficient. List of (rule_domain, rule_code) pairs with no rule.

    EventEnvelope:
      type: object
      description: The standard event envelope published by this service (Event Catalogue §19).
      required: [event_id, event_type, event_version, emitted_at, schema_version, source_service, correlation_id, payload]
      properties:
        event_id:
          type: string
          description: Unique event identifier (evt-<uuid>).
        event_type:
          type: string
          description: |
            jurisdiction.created, jurisdiction.deactivated, jurisdiction.rule.updated,
            jurisdiction.rule.activated, legal.drift.detected
        event_version:
          type: string
          const: "1.0"
        emitted_at:
          type: string
          format: date-time
        schema_version:
          type: string
          const: "1.0"
        source_service:
          type: string
          const: "jurisdiction-rules-svc"
        jurisdiction_id:
          type: [string, "null"]
          format: uuid
        actor_id:
          type: [string, "null"]
        correlation_id:
          type: string
        payload:
          type: object
          description: The event-specific payload.
