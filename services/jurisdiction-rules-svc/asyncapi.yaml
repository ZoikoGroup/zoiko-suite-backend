asyncapi: "2.6.0"

info:
  title: Jurisdiction Rules Service — Event Contract
  version: "1.2.0"
  description: |
    The published and consumed event surface of jurisdiction-rules-svc (D2-1):
    Doc 03 s8.2, ZS-JUR-001 s26, REF-01 and REF-10.

    ## Delivery semantics

    Every published event is written to the transactional outbox in the same database
    transaction as the change it announces (the request's unit of work, J-11): the two
    commit together or neither does, and the API answers only after the commit. The outbox
    relay claims rows with FOR UPDATE SKIP LOCKED under a transaction advisory lock (J-15),
    so one replica publishes at a time and events of one aggregate leave in the order they
    were written. Delivery is at-least-once: consumers deduplicate on event_id. An event
    refused by the broker 10 times is parked and can be requeued by an operator
    (POST /v1/admin/outbox/{id}/requeue, J-16).

    ## Envelope

    Every message is the envelope below. aggregate_version (J-12) is the aggregate's
    row_version after the change (1 for a create), so a consumer can drop an older
    event that arrives late. payload_hash is the sha256 of payload. The partition key
    is the aggregate id. Jurisdiction and pack data are platform reference data: the
    envelope carries no tenant.

    ## Contract tests

    internal/events/asyncapi_test.go fails when an event type the code can publish or
    consume is missing here, or when this document lists one the code does not have.

defaultContentType: application/json

