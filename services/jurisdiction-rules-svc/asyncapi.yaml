    regulatory_source_change_review_started:
      name: regulatory-source-change.review-started
      summary: "s29/s31 source-change intake: captured, review started, closed."
      payload: { $ref: '#/components/schemas/Envelope' }
    regulatory_source_captured:
      name: regulatory-source.captured
      summary: "s8 source register: captured, independently reviewed, superseded (the original stays for reproducibility)."
      payload: { $ref: '#/components/schemas/Envelope' }
    regulatory_source_reviewed:
      name: regulatory-source.reviewed
      summary: "s8 source register: captured, independently reviewed, superseded (the original stays for reproducibility)."
      payload: { $ref: '#/components/schemas/Envelope' }
    regulatory_source_superseded:
      name: regulatory-source.superseded
      summary: "s8 source register: captured, independently reviewed, superseded (the original stays for reproducibility)."
      payload: { $ref: '#/components/schemas/Envelope' }
    regulatory_source_changed:
      name: regulatory.source.changed
      summary: "An authority changed a source a rule cites (payload: external_feed_reference, authority, change_summary, observed_at, source_url). Every ACTIVE rule citing the reference moves to legal_drift_state UNDER_REVIEW and legal.drift.detected is published, in one transaction with the de-duplication row."
      payload: { $ref: '#/components/schemas/ConsumedEnvelope' }
  schemas:
    Envelope:
      type: object
      required: [event_id, event_type, event_version, emitted_at, schema_version, source_service, correlation_id, classification, payload_hash, payload]
      properties:
        event_id: { type: string, description: Deduplicate on this. }
        event_type: { type: string }
        event_version: { type: string, const: "1.0" }
        emitted_at: { type: string, format: date-time }
        schema_version: { type: string }
        source_service: { type: string, const: jurisdiction-rules-svc }
        jurisdiction_id: { type: string }
        actor_id: { type: string, description: The verified principal or the workload that caused the event. }
        correlation_id: { type: string }
        request_id: { type: string }
        aggregate_version: { type: integer, description: "The aggregate's row_version after the change; 1 for a create (J-12)." }
        classification: { type: string, description: Data classification of the payload (INTERNAL by default). }
        payload_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        payload: { type: object, description: The event's facts; aggregate_id names the record. }
    ConsumedEnvelope:
      type: object
      required: [event_id, event_type, payload]
      properties:
        event_id: { type: string }
        event_type: { type: string }
        tenant_id: { type: string }
        legal_entity_id: { type: string }
        object_id: { type: string }
        object_version: { type: integer }
        effective_at: { type: string, format: date-time }
        correlation_id: { type: string }
        payload: { type: object }
