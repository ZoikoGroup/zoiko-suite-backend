openapi: 3.0.3

# access-control-svc — the governed authoring layer for RBAC role and
# permission-bundle DEFINITIONS.
#
# SCOPE, STATED UP FRONT because it is the thing most easily got wrong about
# this service. authorization-svc owns live RBAC and every other service's
# authz checks resolve against it. This service does not shadow that data. It
# is the front door: creating a role or bundle here makes a synchronous call
# into authorization-svc's admin API, so a definition recorded here has
# actually been provisioned for enforcement.
#
# 1.3.0 (6 Oct 2026) adds the governance surface the Authorization Standard
# asks of the IAM Policy / IAM Governance owner: the §5 permission taxonomy,
# §9 system role templates (the 21 §9.1 archetypes), §9/§21 governed
# assignment requests, and §9/§24 access review campaigns. Assignments
# themselves still live in, and are enforced by, authorization-svc: a request
# here is provisioned there before it is recorded here.
#
# Written from the running service (handler.RegisterRoutes and the store), not
# from the design note. Where the two disagreed the code won and the note was
# corrected.

info:
  title: access-control-svc
  version: "1.4.0"
  description: |
    Role catalogues, permission bundles, and the provisioning of both into
    authorization-svc (Doc 03 §9.4).

    ## Ordering, and why every write can answer 503

    Every write PROVISIONS BEFORE IT RECORDS, and fails closed. A role is never
    listed here as created unless authorization-svc accepted it; a retirement is
    never recorded unless authorization-svc's `active_flag` was actually
    cleared. So `503 authz_admin_unavailable` means **nothing was written**, and
    on a retirement it means the role is still granting everything it grants
    today. That is the one outcome a reader must not read as a transient blip.

    The alternative — record locally, reconcile later — was rejected: a
    governance register that claims a state the platform is not enforcing is
    worse than no register.

    ## Authorization

    Every write is authorized against `ROLE_MANAGE` on the `legal_entity_id` in
    the request body, not platform-wide. A `403` means the caller holds no such
    grant on that entity specifically.

    Reads are authenticated and tenant-scoped, and are NOT gated on a grant.
    Two reasons: no bundle in this estate grants a view action on this service,
    so enforcing one would close a working page against every existing
    operator; and identity-context-svc reads the bundle collection as a
    **workload** (`X-Workload-Id`) on its session-resolution hot path, where
    there is no principal to evaluate a grant for.

    ## Idempotency

    Two keys, both honoured. `Idempotency-Key` (header, required on every
    write) is bound to the caller and the body: the same key with a different
    request is `409 IDEMPOTENCY_MISMATCH`, a concurrent duplicate is
    `409 IDEMPOTENCY_IN_FLIGHT`, and a retry is answered from the first
    response with `X-Idempotent-Replay: true` (a 201/202 replays as 200).

    `correlation_id` in the body is the domain idempotency key. Creates are unique on
    `(tenant_id, correlation_id)`: a first write answers **201**, a replay
    answers **200** with the original record and writes nothing. A client that
    cannot tell those apart has no use for the key.

    ## Errors

    Business refusals use `{"error_code","error_message"}`. Envelope violations
    come from the shared middleware and use `{"error","detail","violations"}`.
    Both dialects are in this document because both reach callers.

servers:
  - url: http://localhost:8137
    description: Local (published port)
  - url: http://access-control-svc:8137
    description: In-cluster
  - url: http://localhost:8000/access-control-svc
    description: Through the Traefik gateway

tags:
  - name: role-definitions
    description: The role catalogue.
  - name: permission-bundles
    description: The action sets a role definition permits.
  - name: governance
    description: Permission taxonomy, role templates, assignment requests, access reviews.
  - name: operations
    description: Health, readiness and metrics.

paths:
  /v1/role-definitions/:
    get:
      tags: [role-definitions]
      summary: List the tenant's role catalogue
      description: |
        Scoped by the verified `X-Tenant-Id` alone — there is no tenant
        parameter, and every store query carries an explicit predicate over the
        header in addition to the row-level-security policy.

        `limit` of 0 (the default) means NO CAP. Paging is something a caller
        asks for: silently truncating a catalogue read would make its totals
        wrong, and a register whose totals are wrong is not a register.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RoleStatus' }
          description: Narrow to ACTIVE or RETIRED. Anything else is `400 invalid_status` rather than an empty list — a typo must not read as "nothing is defined".
        - name: scope_type
          in: query
          schema: { $ref: '#/components/schemas/RoleScopeType' }
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring over role_code OR role_name.
        - name: limit
          in: query
          schema: { type: integer, minimum: 0 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The catalogue, newest first. An empty catalogue is `[]`, never null.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

    post:
      tags: [role-definitions]
      summary: Define a role, and provision it into authorization-svc
      description: |
        The remote call happens FIRST. If authorization-svc refuses or cannot be
        reached, nothing is persisted and the answer is `503`.

        A `role_code` this tenant already uses is `409 role_code_exists`, and
        the check runs BEFORE provisioning — so a refused create never leaves a
        role in authorization-svc that this register does not record.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Defined and provisioned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDefinition' }
        '200':
          description: |
            A replay. This `correlation_id` already defined a role in this
            tenant; the original is returned and nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A role definition with that `role_code` already exists in this tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceError' }
              example:
                error_code: role_code_exists
                error_message: a role definition with that role_code already exists in this tenant
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/role-definitions/{role_definition_id}:
    parameters:
      - $ref: '#/components/parameters/RoleDefinitionId'
    get:
      tags: [role-definitions]
      summary: Read one role definition
      description: |
        A malformed id answers `404`, not `503`. `role_definition_id` is a UUID
        column, so a non-UUID raised `22P02` from Postgres and used to leave as
        `store_unavailable` with the raw SQLSTATE in the body — a database
        outage reported for a request that simply named nothing.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDefinition' }
          description: The definition.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

    patch:
      tags: [role-definitions]
      summary: Rename a role, retire it, or bring it back
      description: |
        A partial update: an omitted field is left alone.

        **A status change is propagated to authorization-svc before it is
        recorded, and fails closed.** Retiring clears `roles.active_flag` there,
        and its authorize path joins through that flag, so a RETIRED role grants
        nothing to anyone from that moment. Assignments are left intact, so
        reactivating restores exactly the access the retirement suspended.

        A rename makes no remote call. Setting the status a role already has is
        a no-op rather than a redundant round trip.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: The updated definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/role-definitions/{role_definition_id}/permission-bundles:
    parameters:
      - $ref: '#/components/parameters/RoleDefinitionId'
    get:
      tags: [permission-bundles]
      summary: The bundles attached to one role
      description: |
        This is the read identity-context-svc makes on its session-resolution
        hot path, as a **workload**. It therefore accepts `X-Workload-Id` in
        place of `X-Principal-Id`, per the canonical contract's definition of
        `actor_subject_id`. It did not, once, and the resulting 401 was reported
        by that service's resolver as "upstream dependency unavailable" — so
        every context resolution in the stack answered 503 and the cause looked
        like an outage rather than a contract mismatch.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
      responses:
        '200':
          description: The role's bundles, newest first. A malformed role id reads as `[]`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionBundleDef' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

    post:
      tags: [permission-bundles]
      summary: Attach a permission bundle to a role
      description: |
        Provisioned into authorization-svc against the role, then recorded.
        Same fail-closed ordering and same idempotency as role creation.

        A `bundle_code` this role already carries is `409 bundle_code_exists`,
        checked before provisioning. This is not a cosmetic uniqueness rule:
        authorization-svc identifies a bundle by `(role_id, bundle_code)` and
        its attach endpoint is an upsert-REPLACE on that pair, so a second
        bundle sharing a code would silently overwrite the first one's permitted
        actions there while both kept showing as ACTIVE here — and detaching
        either would retire the single grant they both described.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBundleRequest' }
      responses:
        '201':
          description: Attached and provisioned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionBundleDef' }
        '200':
          description: A replay of a bundle this `correlation_id` already attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionBundleDef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: That `bundle_code` is already attached to this role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceError' }
              example:
                error_code: bundle_code_exists
                error_message: a permission bundle with that bundle_code is already attached to this role
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/role-definitions/{role_definition_id}/permission-bundles/{bundle_id}:
    parameters:
      - $ref: '#/components/parameters/RoleDefinitionId'
      - $ref: '#/components/parameters/BundleId'
    get:
      tags: [permission-bundles]
      summary: Read one bundle, resolved under its role
      description: |
        Addressed by BOTH ids. A bundle that exists but belongs to a different
        role reads exactly like one that does not exist — deliberately, so a
        probe cannot confirm a foreign bundle id.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionBundleDef' }
          description: The bundle.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

    patch:
      tags: [permission-bundles]
      summary: Edit one bundle's permitted actions and/or its active state
      description: |
        A partial update. Both changes are propagated to authorization-svc
        BEFORE they are recorded and fail closed, like every other write here.

        An action edit is propagated as an upsert-replace (idempotent on
        `(role_id, bundle_code)`). An active-state change goes through the
        retire/reactivate endpoints. A submission that changes nothing returns
        the current record and makes no remote call.

        `bundle_code` is deliberately NOT editable: authorization-svc has no
        rename, so a rename here could only be a local label on a
        differently-enforced reality. Detach and re-attach under a new code.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBundleRequest' }
      responses:
        '200':
          description: The bundle, edited — or unchanged, if the submission changed nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionBundleDef' }
        '400':
          description: |
            `nothing_to_update` (neither field supplied) or `empty_actions` (an
            explicitly empty action list — a bundle that grants nothing is a
            control in name only; detach it instead).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

    delete:
      tags: [permission-bundles]
      summary: Detach one bundle from its role
      description: |
        A withdrawal, not a deletion: `active_flag` goes false here and the
        bundle is retired in authorization-svc by resolving its code to the
        remote id. Nothing is hard-deleted, matching authorization-svc's own
        retire posture — a decision recorded as `rbac:role=<code>` is only
        explainable while the actions that role once held remain readable.

        Idempotent: an already-detached bundle answers 200 with the current
        record. Fail-closed: a retirement that cannot be propagated refuses, so
        a detached row here always means a withdrawn bundle there.

        This route carries its context in the QUERY STRING
        (`legal_entity_id`, `correlation_id`) because DELETE carries no body
        over this API surface. A JSON body is still honoured if present.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: legal_entity_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: The entity this write is authorized against.
        - name: correlation_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The detached bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionBundleDef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/permission-bundles/:
    get:
      tags: [permission-bundles]
      summary: The tenant's whole bundle catalogue, across every role
      description: |
        The flat read the role-scoped collection cannot give. A console showing
        bundles across roles previously fanned out one request per role; this is
        the endpoint that read was added to avoid.

        Still scoped by the verified `X-Tenant-Id` — a slice of one tenant's
        catalogue, not a platform-wide dump.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - name: role_id
          in: query
          schema: { type: string, format: uuid }
          description: Narrow to one role. A malformed value narrows to nothing rather than erroring.
        - name: active_flag
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring over bundle_code.
        - name: limit
          in: query
          schema: { type: integer, minimum: 0 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Every bundle in the tenant, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionBundleDef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

  /v1/permission-definitions:
    get:
      tags: [governance]
      summary: The permission taxonomy (Authorization Standard §5, §22)
      description: |
        Every action a bundle may grant. A bundle write naming an action not
        listed here (exact spelling) is `400 unknown_permission`. `TAXONOMY`
        entries are §5 `resource.action` names; `LEGACY` entries are the
        SCREAMING_SNAKE names the estate enforced before the registry, kept so
        no existing role breaks. Entries are added by migration, never by a
        tenant.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
        - { name: naming, in: query, schema: { type: string, enum: [TAXONOMY, LEGACY] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Active registered permissions.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PermissionDefinition' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

  /v1/role-templates/:
    get:
      tags: [governance]
      summary: System role templates, including the 21 §9.1 archetypes
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: Every template with its latest published version.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleTemplate' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

  /v1/role-templates/{template_code}:
    parameters:
      - $ref: '#/components/parameters/TemplateCode'
    get:
      tags: [governance]
      summary: One role template
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleTemplate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/role-templates/{template_code}/versions:
    parameters:
      - $ref: '#/components/parameters/TemplateCode'
    get:
      tags: [governance]
      summary: Every published version of a template, newest first
      description: |
        Versions are append-only (a database trigger refuses UPDATE and DELETE,
        for every connection including the owner's): a published version never
        changes under the roles made from it.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: The versions.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleTemplateVersion' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/role-templates/{template_code}/instantiate:
    parameters:
      - $ref: '#/components/parameters/TemplateCode'
    post:
      tags: [governance]
      summary: Create a tenant role from a template version
      description: |
        The role gets ONE template-managed bundle (`bundle_code` `TEMPLATE`)
        carrying exactly that version's actions; its actions cannot be edited
        through the bundle routes (`409 template_managed_bundle`), only by an
        upgrade. Guards: every action registered, and the set SoD-clean. The
        protected-action guard does not apply to template actions (§9 reserves
        protected actions from tenant CUSTOM roles); assigning such a role is
        CRITICAL risk and needs an independent approver.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstantiateTemplateRequest' }
      responses:
        '201':
          description: Created and provisioned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantiatedRole' }
        '200':
          description: A replay of this `correlation_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantiatedRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/role-templates/{template_code}/upgrade:
    parameters:
      - $ref: '#/components/parameters/TemplateCode'
    post:
      tags: [governance]
      summary: Move a template-derived role to a newer template version
      description: |
        Explicit and evented (§9: "customers cannot mutate canonical template
        silently"). The new action set is SoD-checked with the role's other
        active bundles, provisioned, then recorded; `role.updated` ends the
        sessions holding the old grant and `iam.role.published` records the
        version activation.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateUpgradeRequest' }
      responses:
        '200':
          description: Upgraded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantiatedRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/iam/access-assignments/:
    get:
      tags: [governance]
      summary: Assignment requests in this tenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AssignmentStatus' } }
        - { name: target_principal_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AssignmentRequest' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [governance]
      summary: Request an access assignment through the governed workflow (§9, §21)
      description: |
        The role must be ACTIVE; no identical request may be pending; the
        subject plus the role must be SoD-clean against what the subject
        already holds in the entity. Risk is computed from the role's actions
        (registry tiers; protected actions are CRITICAL). A STANDARD request
        that is not a self-request is provisioned into authorization-svc at
        once (`201`). Anything HIGH or CRITICAL, and any self-request, waits
        for an independent approver (`202`). authorization-svc's assignment id
        is the request id.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignmentRequest' }
      responses:
        '201':
          description: Provisioned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentRequest' }
        '202':
          description: Awaiting an independent approver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentRequest' }
        '200':
          description: A replay of this `correlation_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/iam/access-assignments/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    get:
      tags: [governance]
      summary: One assignment request
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/iam/access-assignments/{request_id}:approve:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [governance]
      summary: Approve and provision a pending request
      description: |
        The approver may be neither the requester nor the subject
        (`403 self_approval`; §10.1 row 6, §10.2 own access elevation). SoD is
        re-checked, then the assignment is provisioned AS the approver (who
        therefore needs `iam.assignment.grant` in authorization-svc). Also
        served as `/{request_id}/approve`.

        Approval authority follows risk (§9): HIGH needs an independent
        `ROLE_MANAGE` holder; CRITICAL additionally needs
        `iam.assignment.approve_privileged` (`403 security_approval_required`).
        A request whose end date has passed cannot be approved
        (`409 assignment_window_elapsed`).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentDecisionRequest' }
      responses:
        '200':
          description: PROVISIONED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/iam/access-assignments/{request_id}:reject:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [governance]
      summary: Reject a pending request (reason required; not by the requester or subject)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentDecisionRequest' }
      responses:
        '200':
          description: REJECTED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/iam/access-assignments/{request_id}:cancel:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [governance]
      summary: Withdraw a pending request (requester only; reason required)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentDecisionRequest' }
      responses:
        '200':
          description: CANCELLED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/iam/access-assignments/{request_id}:revoke:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [governance]
      summary: Revoke a provisioned assignment (§21)
      description: |
        Revoked in authorization-svc first (as the caller, who needs
        `iam.assignment.revoke` there), then recorded with
        `iam.assignment.revoked`, which identity-context-svc acts on by ending
        every session of the subject. An assignment already gone there is
        recorded as revoked.

        With `effective_at` in the future the end is SCHEDULED instead (§9
        "effective-dated removal"): authorization-svc ends the assignment at
        that instant, the request stays PROVISIONED with `effective_to` set, and
        the expiry sweep closes it as REVOKED and emits `iam.assignment.revoked`
        once it passes.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentDecisionRequest' }
      responses:
        '200':
          description: REVOKED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/access-review-campaigns/:
    get:
      tags: [governance]
      summary: Access review campaigns
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
        - { name: status, in: query, schema: { type: string, enum: [OPEN, COMPLETED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Newest first (without items).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReviewCampaign' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [governance]
      summary: Start a certification campaign (§9 assignment review, §24)
      description: |
        Snapshots the ACTIVE assignments of the covered roles from
        authorization-svc. Each item carries a risk tier, and flags:
        `ORPHANED_ROLE` (retired here, still assigned there),
        `SOD_CONFLICT` (the subject's reviewed roles together conflict; raises
        the item to at least HIGH), `SELF_REVIEW_REASSIGNED` (the default
        reviewer is the subject, so `escalation_reviewer_principal_id` reviews
        it — required in that case). `PRIVILEGED` campaigns cover only
        HIGH/CRITICAL roles; `EVENT_TRIGGERED` ones name their trigger.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCampaignRequest' }
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCampaign' }
        '200':
          description: A replay of this `correlation_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCampaign' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/access-review-campaigns/{campaign_id}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [governance]
      summary: One campaign with its items and outcome summary
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: The campaign.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCampaign' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/access-review-campaigns/{campaign_id}/items/{item_id}/decide:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [governance]
      summary: Decide a review item (KEEP / REVOKE / MODIFY / ESCALATE)
      description: |
        Only the item's reviewer, and never its subject (`self_attestation`).
        The authority is the designation, not ROLE_MANAGE. REVOKE revokes the
        assignment in authorization-svc as the reviewer before recording; a
        refusal there leaves the item open. ESCALATE leaves it ESCALATED until
        reassigned. A reason is always required (§24 evidence).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideItemRequest' }
      responses:
        '200':
          description: Decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/access-review-campaigns/{campaign_id}/items/{item_id}/reassign:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [governance]
      summary: Hand an undecided or escalated item to another reviewer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignItemRequest' }
      responses:
        '200':
          description: Reassigned (status OPEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/access-review-campaigns/{campaign_id}/complete:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [governance]
      summary: Close a campaign
      description: |
        `409 unresolved_high_risk` while any HIGH/CRITICAL item is OPEN or
        ESCALATED (§24: "unresolved high-risk review cannot silently close").
        STANDARD items still open become EXPIRED and are counted in the
        summary and in `iam.access_review.completed`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteCampaignRequest' }
      responses:
        '200':
          description: COMPLETED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCampaign' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/iam/access-reviews:
    get:
      tags: [governance]
      summary: The review items assigned to the caller (§21)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - { name: status, in: query, schema: { type: string, enum: [OPEN, DECIDED, ESCALATED, EXPIRED] } }
      responses:
        '200':
          description: The caller's items.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReviewItem' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/iam/groups/:
    get:
      tags: [groups]
      summary: Groups in this tenant (§2)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: By group_code.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [groups]
      summary: Create a group (§2 "administrative collection of subjects; may be SCIM-provisioned")
      description: ROLE_MANAGE on legal_entity_id, which becomes the group's administering entity.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '200':
          description: A replay of this `correlation_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/iam/groups/{group_id}:
    parameters:
      - { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [groups]
      summary: One group with its live members
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/iam/groups/{group_id}/members:
    parameters:
      - { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [groups]
      summary: Add a member; fans every ACTIVE group assignment out to them
      description: |
        Each ACTIVE group assignment becomes one governed assignment request
        for the new member, through the individual pipeline (pending check,
        principal-aware SoD, risk-tiered approval, provisioning). A refusal for
        one assignment is reported in its outcome and does not undo the join.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupMemberRequest' }
      responses:
        '201':
          description: Joined; one outcome per ACTIVE group assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: '#/components/schemas/GroupMember' }
                  assignments:
                    type: array
                    items:
                      type: object
                      properties:
                        group_assignment_id: { type: string, format: uuid }
                        outcome: { $ref: '#/components/schemas/GroupMemberOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/iam/groups/{group_id}/members/{principal_id}:remove:
    parameters:
      - { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: principal_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [groups]
      summary: Remove a member; ends what membership gave them
      description: |
        The member's group-sourced requests are ended first - pending ones
        cancelled, provisioned ones revoked in authorization-svc and here -
        and the membership closes only once all of them have. A failure leaves
        a state the same call can finish. The slash form `/remove` is served too.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupMemberRequest' }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id: { type: string, format: uuid }
                  principal_id: { type: string }
                  ended: { type: array, items: { $ref: '#/components/schemas/GroupMemberOutcome' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/iam/groups/{group_id}/assignments:
    parameters:
      - { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [groups]
      summary: The group's assignments
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: Oldest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GroupAssignment' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [groups]
      summary: Assign a role to a group (§9 "subject/GROUP + role + scope + effective dates")
      description: |
        Never enforced as a group. Fans out to ONE governed assignment request
        per live member, each with its own SoD check and risk-tiered approval;
        a protected / CRITICAL role enters the approval path per member (A20),
        and the requester's own membership needs an independent approver.
        `members` carries each member's request or refusal.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupAssignmentRequest' }
      responses:
        '201':
          description: Recorded and fanned out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAssignment' }
        '200':
          description: A replay of this `correlation_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/iam/group-assignments/{group_assignment_id}:
    parameters:
      - { name: group_assignment_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [groups]
      summary: One group assignment with the member requests it fanned out to
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: The group assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAssignment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/iam/group-assignments/{group_assignment_id}:revoke:
    parameters:
      - { name: group_assignment_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [groups]
      summary: Revoke a group assignment; ends every member's request, then closes it
      description: Requires `reason`. A second revoke is 409 group_assignment_revoked. The slash form `/revoke` is served too.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentDecisionRequest' }
      responses:
        '200':
          description: Revoked; members lists what was ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/iam/group-assignments/{group_assignment_id}:sync:
    parameters:
      - { name: group_assignment_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [groups]
      summary: Re-run the fan-out for every live member (idempotent)
      description: Members already served replay; fills in a member a racing join or an outage missed. The slash form `/sync` is served too.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentDecisionRequest' }
      responses:
        '200':
          description: Fanned out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }

  /v1/iam/subject-links:
    get:
      tags: [reviews]
      summary: Employee-to-principal links HR events are resolved through (§24, S9-C2)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: By employee_id.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SubjectLink' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [reviews]
      summary: Link an employee to the principal that holds their access
      description: |
        HR events (employee.updated, employee.status.changed,
        employee.terminated) name employees; access is held by principals and
        nothing on the estate maps one to the other. A linked employee's
        manager change or exit opens an EVENT_TRIGGERED review of their
        assignments; an unlinked one's is counted and skipped, never guessed.
        Re-linking replaces the principal. ROLE_MANAGE on legal_entity_id.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PrincipalIdRequired'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SourceChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkSubjectRequest' }
      responses:
        '200':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProvisioningUnavailable' }


  /healthz:
    get:
      tags: [operations]
      summary: Liveness
      description: |
        Answers whenever the process is up, and deliberately checks nothing. A
        liveness probe that fails on a dependency outage gets the container
        killed and restarted, which fixes nothing and removes the one instance
        that could have reported what was wrong.
      responses:
        '200': { description: OK }

  /readyz:
    get:
      tags: [operations]
      summary: Readiness — database AND authorization-svc
      description: |
        authorization-svc is a readiness dependency, not merely a runtime one.
        Every write calls it twice (authorize the caller, provision the
        definition) and fails closed on both, so a probe that only pinged the
        database reported green while 100% of writes answered 503 and the load
        balancer kept sending traffic to an instance that could author nothing.

        The body names which component failed, because the two have opposite
        remedies: a dead pool is this service's problem; an unreachable
        authorization-svc is somebody else's and restarting this one will not
        help.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example:
                status: READY
                components: { database: ok, authorization-svc: ok }
        '503':
          description: Not ready. `components` names the failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example:
                status: NOT_READY
                components:
                  database: ok
                  authorization-svc: "unreachable: dial tcp: connection refused"

  /metrics:
    get:
      tags: [operations]
      summary: Prometheus exposition
      description: |
        Beyond the standard HTTP series, this service exports the decision
        counters in `internal/telemetry/domain.go`:
        `access_control_role_writes_total`,
        `access_control_bundle_writes_total`,
        `access_control_authz_decisions_total`,
        `access_control_authz_admin_calls_total`, and the outbox gauges
        `access_control_outbox_pending` / `_oldest_age_seconds`.

        Every label combination is pre-created at zero. A series that has never
        been observed and one reading zero are indistinguishable to an alert
        expression, so a rule written to catch the FIRST refusal would otherwise
        stay silent through exactly the event it exists for.
      responses:
        '200': { description: Prometheus text exposition. }

components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: The verified tenant. Absent is 401 — never an unscoped read.
    PrincipalId:
      name: X-Principal-Id
      in: header
      schema: { type: string }
      description: The human subject. On a READ, either this or X-Workload-Id satisfies `actor_subject_id`.
    WorkloadId:
      name: X-Workload-Id
      in: header
      schema: { type: string }
      description: |
        A workload subject. Accepted on reads only. A workload may read the
        catalogue; only a named human changes it, because the principal is what
        the evidence records.
    PrincipalIdRequired:
      name: X-Principal-Id
      in: header
      required: true
      schema: { type: string }
      description: Writes require a human principal. X-Workload-Id does not satisfy a write.
    LegalEntityId:
      name: X-Legal-Entity-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Required on writes (INV-02).
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: { type: string }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string }
    SourceChannel:
      name: X-Source-Channel
      in: header
      required: true
      schema: { type: string, enum: [ui, api, system, batch] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Required on material state changes (INV-08).
    RoleDefinitionId:
      name: role_definition_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateCode:
      name: template_code
      in: path
      required: true
      schema: { type: string }
    RequestIdPath:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    RoleStatus:
      type: string
      enum: [ACTIVE, RETIRED]
      description: |
        Constrained by a CHECK in migration 000002 and validated in the handler.
        It used to be an unconstrained VARCHAR with the vocabulary in a comment,
        so `{"status":"BANANA"}` persisted and the role then matched neither
        status filter — invisible without being retired.

    RoleScopeType:
      type: string
      enum: [LEGAL_ENTITY, TENANT]
      description: |
        Which kind of assignment the role is for. Scoping happens at ASSIGNMENT
        time, not definition time — this mirrors authorization-svc's own model.

    RoleDefinition:
      type: object
      required:
        [role_definition_id, tenant_id, role_code, role_name, role_scope_type,
         status, created_by_principal_id, correlation_id, created_at, updated_at]
      properties:
        role_definition_id:
          type: string
          format: uuid
          description: |
            The SAME id authorization-svc knows the role by — this service
            generates it and provisions the role under it. Events carry it as
            `role_id` for that reason.
        tenant_id: { type: string, format: uuid }
        role_code:
          type: string
          description: Unique per tenant. The string every service's authz check names.
        role_name: { type: string }
        role_scope_type: { $ref: '#/components/schemas/RoleScopeType' }
        status: { $ref: '#/components/schemas/RoleStatus' }
        created_by_principal_id: { type: string }
        updated_by_principal_id:
          type: string
          description: Who made the last change. Absent on rows never updated.
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        template_code: { type: string, description: Set on a role instantiated from a system role template. }
        template_version: { type: integer }

    PermissionBundleDef:
      type: object
      required:
        [bundle_id, tenant_id, role_definition_id, bundle_code,
         permitted_actions, active_flag, correlation_id, created_at, updated_at]
      properties:
        bundle_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        role_definition_id: { type: string, format: uuid }
        bundle_code:
          type: string
          description: Unique per (tenant, role) — see the 409 on the attach route for why.
        permitted_actions:
          type: array
          items: { type: string }
          minItems: 1
        active_flag:
          type: boolean
          description: False means detached — withdrawn, with its contents kept.
        updated_by_principal_id: { type: string }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        template_code:
          type: string
          description: Set on the one template-managed bundle; its actions change only by a template upgrade.
        template_version: { type: integer }

    CreateRoleRequest:
      type: object
      required: [legal_entity_id, role_code, role_name, role_scope_type, correlation_id]
      properties:
        legal_entity_id:
          type: string
          format: uuid
          description: The entity the ROLE_MANAGE check is made against.
        role_code: { type: string }
        role_name: { type: string }
        role_scope_type: { $ref: '#/components/schemas/RoleScopeType' }
        correlation_id:
          type: string
          description: The idempotency key. Generate once per intent and reuse on retry.

    UpdateRoleRequest:
      type: object
      required: [legal_entity_id]
      properties:
        legal_entity_id: { type: string, format: uuid }
        role_name:
          type: string
          description: Omit (or send empty) to leave the name alone.
        status:
          allOf: [{ $ref: '#/components/schemas/RoleStatus' }]
          description: Omit to leave the status alone.
        correlation_id: { type: string }

    CreateBundleRequest:
      type: object
      required: [legal_entity_id, bundle_code, permitted_actions, correlation_id]
      properties:
        legal_entity_id: { type: string, format: uuid }
        bundle_code: { type: string }
        permitted_actions:
          type: array
          items: { type: string }
          minItems: 1
        correlation_id: { type: string }

    UpdateBundleRequest:
      type: object
      required: [legal_entity_id]
      description: At least one of `permitted_actions` or `active_flag` must be present.
      properties:
        legal_entity_id: { type: string, format: uuid }
        permitted_actions:
          type: array
          items: { type: string }
          minItems: 1
        active_flag: { type: boolean }
        correlation_id: { type: string }

    PermissionDefinition:
      type: object
      required: [action_name, naming, risk_tier, protected]
      properties:
        action_name: { type: string, example: payment.release }
        naming: { type: string, enum: [TAXONOMY, LEGACY] }
        risk_tier: { $ref: '#/components/schemas/RiskTier' }
        description: { type: string }
        protected:
          type: boolean
          description: A protected platform-admin action (tenant custom roles may not grant it).

    RiskTier:
      type: string
      enum: [STANDARD, HIGH, CRITICAL]

    RoleTemplate:
      type: object
      properties:
        template_code: { type: string, example: TREASURY_RELEASER }
        template_name: { type: string }
        default_intent: { type: string, description: The §9.1 intent text. }
        role_scope_type: { $ref: '#/components/schemas/RoleScopeType' }
        is_archetype: { type: boolean }
        status: { type: string, enum: [ACTIVE, DEPRECATED] }
        latest_version: { type: integer }
        latest_permitted_actions: { type: array, items: { type: string } }

    RoleTemplateVersion:
      type: object
      properties:
        template_code: { type: string }
        template_version: { type: integer }
        permitted_actions: { type: array, items: { type: string } }
        change_note: { type: string }
        published_by: { type: string }
        published_at: { type: string, format: date-time }

    InstantiateTemplateRequest:
      type: object
      required: [legal_entity_id, correlation_id]
      properties:
        legal_entity_id: { type: string, format: uuid }
        role_code: { type: string, description: Defaults to the template code. }
        role_name: { type: string, description: Defaults to the template name. }
        template_version: { type: integer, description: Omit (or 0) for the latest. }
        correlation_id: { type: string }

    TemplateUpgradeRequest:
      type: object
      required: [legal_entity_id, role_definition_id, correlation_id]
      properties:
        legal_entity_id: { type: string, format: uuid }
        role_definition_id: { type: string, format: uuid }
        template_version: { type: integer, description: Omit (or 0) for the latest. }
        correlation_id: { type: string }

    InstantiatedRole:
      type: object
      properties:
        role: { $ref: '#/components/schemas/RoleDefinition' }
        bundle: { $ref: '#/components/schemas/PermissionBundleDef' }

    AssignmentStatus:
      type: string
      description: |
        EXPIRED: the assignment reached an end date set at grant time and the
        expiry sweep closed it. An end scheduled by a revoke closes as REVOKED.
      enum: [PENDING_APPROVAL, PROVISIONED, REJECTED, CANCELLED, REVOKED, EXPIRED]

    AssignmentRequest:
      type: object
      properties:
        request_id: { type: string, format: uuid, description: Also authorization-svc's assignment id once provisioned. }
        tenant_id: { type: string }
        target_principal_id: { type: string }
        role_definition_id: { type: string, format: uuid }
        legal_entity_id: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to:
          type: string
          format: date-time
          description: |
            The assignment's end: set at grant time, or by an effective-dated
            revoke (then revoked_by_principal_id and revocation_reason are
            filled while status is still PROVISIONED). Absent is open-ended.
            authorization-svc enforces it at the instant; the expiry sweep then
            closes the request and emits iam.assignment.revoked.
        justification: { type: string }
        risk_tier: { $ref: '#/components/schemas/RiskTier' }
        approval_required: { type: boolean }
        approval_reason: { type: string }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        requested_by_principal_id: { type: string }
        decided_by_principal_id: { type: string }
        decision_reason: { type: string }
        decided_at: { type: string, format: date-time }
        authz_assignment_id: { type: string, format: uuid }
        revoked_by_principal_id: { type: string }
        revocation_reason: { type: string }
        revoked_at: { type: string, format: date-time }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        group_assignment_id:
          type: string
          format: uuid
          description: Set when the request is one member's share of a group assignment's fan-out.

    CreateAssignmentRequest:
      type: object
      required: [legal_entity_id, target_principal_id, role_definition_id, justification, correlation_id]
      properties:
        legal_entity_id: { type: string, format: uuid }
        target_principal_id: { type: string }
        role_definition_id: { type: string, format: uuid }
        effective_from: { type: string, format: date-time, description: Defaults to now. }
        effective_to:
          type: string
          format: date-time
          description: 'Optional end date (§9 "effective dates"). Must be after effective_from and in the future (400 invalid_effective_to).'
        justification: { type: string }
        correlation_id: { type: string }

    AssignmentDecisionRequest:
      type: object
      required: [legal_entity_id, correlation_id]
      properties:
        legal_entity_id:
          type: string
          format: uuid
          description: Must be the request's own entity (400 entity_mismatch); ROLE_MANAGE is checked on it.
        reason: { type: string, description: 'Required to reject, cancel or revoke.' }
        effective_at:
          type: string
          format: date-time
          description: |
            Revoke only. A future instant schedules the end (§9 "effective-dated
            removal") instead of revoking now; it may only bring an existing end
            earlier (409 ends_sooner). Past: 400 invalid_effective_at.
        correlation_id: { type: string }

    ReviewItem:
      type: object
      properties:
        item_id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        authz_assignment_id: { type: string, format: uuid }
        target_principal_id: { type: string }
        role_definition_id: { type: string, format: uuid }
        role_code: { type: string }
        legal_entity_id: { type: string }
        granted_actions: { type: array, items: { type: string } }
        risk_tier: { $ref: '#/components/schemas/RiskTier' }
        flags:
          type: array
          description: |
            ORPHANED_ROLE: the role is retired here but still assigned there.
            SOD_CONFLICT: the subject's reviewed roles combine to a §10.1
            conflict in an entity (a tenant-wide role counts in every entity).
            SELF_REVIEW_REASSIGNED: the default reviewer is the subject.
            DORMANT: a HIGH/CRITICAL assignment held through the campaign's
            dormancy window with no GRANTED decision inside it (flagged, never
            removed). SUBJECT_INACTIVE: the subject is SUSPENDED or DISABLED;
            raises the item to HIGH.
          items: { type: string, enum: [ORPHANED_ROLE, SOD_CONFLICT, SELF_REVIEW_REASSIGNED, DORMANT, SUBJECT_INACTIVE] }
        reviewer_principal_id: { type: string }
        status: { type: string, enum: [OPEN, DECIDED, ESCALATED, EXPIRED] }
        decision: { type: string, enum: [KEEP, REVOKE, MODIFY, ESCALATE] }
        decision_reason: { type: string }
        decided_by_principal_id: { type: string }
        decided_at: { type: string, format: date-time }
        revocation_applied: { type: boolean }
