        principal_id: { type: string }
        correlation_id: { type: string }

    ServiceErrorCode:
      type: string
      description: |
        Every `error_code` this service emits, exhaustively.

        Exhaustive on purpose. A client branching on the code needs the whole
        list or it will one day meet one this contract never mentioned and fall
        through to a generic failure message — and the codes that matter most
        here (`authz_admin_unavailable`, `role_code_exists`) are precisely the
        ones a generic message renders wrongly. `scripts/audit.sh` §5 diffs this
        enum against the handler and fails if either side gains a code the other
        does not have.
      enum:
        # Authorization and identity.
        - forbidden                 # no ROLE_MANAGE grant on this legal entity
        - identity_missing          # no verified actor
        - tenant_missing            # no verified tenant
        - authz_unavailable         # the authorize call could not be made; nothing written
        - authz_admin_unavailable   # provisioning could not be made; NOTHING WAS WRITTEN
        - provisioning_forbidden    # authorization-svc refused THIS CALLER (403): it lacks the iam.* admin grant there; nothing written
        # Conflicts.
        - role_code_exists
        - bundle_code_exists
        # SoD and protected actions (Authorization Standard §9, §10.1).
        - sod_conflict              # the role's whole action set (its other active bundles plus this one) is conflicted; the message names each pair
        - protected_action          # the bundle includes protected platform-admin action(s), named in the message
        - sod_unavailable           # no SoD verdict could be read from authorization-svc; fails closed, nothing written
        - protected_catalogue_unavailable  # the protected-action catalogue is unreadable or empty; fails closed, nothing written
        # Request validation.
        - invalid_json
        - missing_fields
        - invalid_status
        - invalid_scope_type
        - invalid_active_flag
        - invalid_limit
        - invalid_offset
        - nothing_to_update         # a partial update supplying neither field
        - empty_actions             # an explicitly empty permitted_actions list
        # Resolution and storage.
        - not_found                 # unknown, malformed, or another tenant's id
        - store_unavailable
        # Permission taxonomy (§5).
        - unknown_permission        # an action not in the registry (exact spelling), named in the message
        - taxonomy_unavailable      # the registry could not be read; fails closed
        - invalid_naming
        # Role templates (§9).
        - template_managed_bundle   # the bundle's actions belong to its template; upgrade instead
        - template_deprecated
        - template_bundle_detached
        - not_template_role
        - template_version_not_newer
        # Assignment requests (§9, §21).
        - role_retired
        - assignment_pending        # an identical request is already awaiting approval
        - self_approval             # the requester or subject tried to approve/reject
        - not_requester             # only the requester may cancel
        - missing_reason
        - invalid_state             # the request is not in a state that allows this transition
        - assignment_absent
        - entity_mismatch           # legal_entity_id is not the request's / campaign's own entity
        - invalid_effective_to      # end date not after the start, or in the past
        - invalid_effective_at      # a scheduled revoke in the past
        - ends_sooner               # a scheduled revoke later than the assignment's existing end
        - assignment_window_elapsed # approving a request whose end date has passed
        - security_approval_required  # a CRITICAL request's approver lacks iam.assignment.approve_privileged
        - authz_approval_pending    # authorization-svc parked the grant PENDING its own approval; withdrawn there, not provisioned here
        # Groups (§2, §9).
        - group_code_exists
        - group_retired
        - member_exists             # the principal is already a live member
        - group_assignment_revoked  # the group assignment is already revoked
        - invalid_source            # source must be MANUAL or SCIM
        # Access reviews (§24).
        - invalid_review_type
        - missing_trigger_reason
        - invalid_due_at
        - invalid_decision
        - self_attestation          # the subject of an item may not review it
        - not_item_reviewer
        - already_decided
        - campaign_closed
        - unresolved_high_risk      # HIGH/CRITICAL items are open or escalated
        - escalation_reviewer_required
        - invalid_dormancy_days
        # Idempotency-Key (middleware).
        - IDEMPOTENCY_MISMATCH
        - IDEMPOTENCY_IN_FLIGHT
        - invalid_request           # the request body could not be read (replay protection needs it)

    ServiceError:
      type: object
      required: [error_code, error_message]
      properties:
        error_code: { $ref: '#/components/schemas/ServiceErrorCode' }
        error_message: { type: string }

    EnvelopeError:
      type: object
      description: |
        The shared canonical-input-contract refusal. `violations` is kept
        STRUCTURED rather than folded into `detail`: a caller cannot tell which
        of seven headers it is missing from one concatenated sentence.
      required: [error, detail, violations]
      properties:
        error: { type: string, example: envelope_incomplete }
        detail: { type: string }
        service: { type: string }
        violations:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }

    Readiness:
      type: object
      properties:
        status: { type: string, enum: [READY, NOT_READY] }
        components:
          type: object
          additionalProperties: { type: string }

  responses:
    BadRequest:
      description: Malformed request, or a violated envelope.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ServiceError'
              - $ref: '#/components/schemas/EnvelopeError'
    Unauthenticated:
      description: |
        No verified tenant (`tenant_missing`) or no verified actor
        (`identity_missing`), or an incomplete envelope on a write.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ServiceError'
              - $ref: '#/components/schemas/EnvelopeError'
    Forbidden:
      description: |
        A refusal. Nothing was written. One of:

        - `forbidden`: the caller holds no `ROLE_MANAGE` grant on this legal
          entity (entity-scoped, not platform-wide).
        - `provisioning_forbidden`: authorization-svc refused the caller. Its
          admin writes require `iam.role.manage` / `iam.permission_bundle.manage`
          at tenant scope, and this service provisions as the caller.
        - `sod_conflict` (bundle writes): the role's action set, all its active
          bundles together, is conflicted. Role creation is never SoD-checked;
          a role with no actions cannot conflict.
        - `protected_action` (bundle writes): a protected platform-admin action,
          including every `iam.*` admin action.
        - `security_approval_required` (approve): the request is CRITICAL and
          the approver does not hold `iam.assignment.approve_privileged`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceError' }
          example:
            error_code: forbidden
            error_message: authorization denied for this access control action
    NotFound:
      description: |
        No such definition or bundle in this tenant. A malformed id, a foreign
        tenant's id and an id that never existed are all answered the same way,
        deliberately.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceError' }
          example:
            error_code: not_found
            error_message: role definition not found
    Conflict:
      description: |
        A state conflict. Nothing was written. The code says which:
        `role_code_exists`, `template_managed_bundle`, `template_version_not_newer`,
        `not_template_role`, `template_deprecated`, `template_bundle_detached`,
        `role_retired`, `assignment_pending`, `invalid_state`, `already_decided`,
        `campaign_closed`, `unresolved_high_risk`, `assignment_absent`,
        `ends_sooner`, `assignment_window_elapsed`, `authz_approval_pending`,
        `group_code_exists`, `group_retired`, `member_exists`, `group_assignment_revoked`,
        `IDEMPOTENCY_MISMATCH`, `IDEMPOTENCY_IN_FLIGHT`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceError' }
    StoreUnavailable:
      description: The catalogue's database could not be reached. Nothing was changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceError' }
    ProvisioningUnavailable:
      description: |
        `authz_admin_unavailable`, `authz_unavailable`, `sod_unavailable` or
        `protected_catalogue_unavailable` — **nothing was written**. The guards
        fail closed: no verdict is never read as a pass. On a retirement this means the role is still being enforced;
        it is not a transient blip and must not be rendered as one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceError' }
          example:
            error_code: authz_admin_unavailable
            error_message: authorization-svc admin API unavailable
