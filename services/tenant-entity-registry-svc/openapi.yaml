openapi: "3.1.0"

info:
  title: Tenant & Entity Registry Service
  version: "1.0.0"
  description: |
    Authoritative registry for ZoikoSuite tenants, legal entities, entity hierarchies,
    jurisdiction assignments, data residency policies, residency regions (read-only),
    and TaxIdentityBundle headers.

    **Governance invariants:**
    - All mutating endpoints require a valid `Authorization: Bearer <IdentityContextEnvelope JWT>`.
    - Every mutating request must carry `X-Correlation-ID` for evidence propagation.
    - ResidencyRegion is IaC-managed — no write endpoints are exposed.
    - TaxIdentityBundle stores only the structural header (legal_entity_id, jurisdiction_id,
      effective dates, status). Tax identifier values are owned by the Tax Service.
    - jurisdiction_id references on EntityJurisdictionAssignment and TaxIdentityBundle are
      validated synchronously against the Jurisdiction Rules Service (fail-closed).
    - Entity status transitions publish `entity.status.changed` on the event backbone.

servers:
  - url: http://localhost:8081
    description: Local development
  - url: https://api.zoiko.internal/tenant-entity-registry
    description: Internal cluster ingress

tags:
  - name: Tenants
    description: Tenant provisioning and lifecycle management
  - name: Entities
    description: Legal entity CRUD, status probe, and status transitions
  - name: Hierarchies
    description: Effective-dated parent-child entity relationships
  - name: Jurisdictions
    description: Effective-dated jurisdiction assignments for entities
  - name: ResidencyPolicies
    description: Data residency policy management
  - name: ResidencyRegions
    description: IaC-managed hosting regions (read-only)
  - name: TaxIdentityBundles
    description: Structural tax identity headers (no tax identifier values stored here)
  - name: Health
    description: Liveness and readiness probes

paths:

  # ── Tenants ────────────────────────────────────────────────────────────────

  /v1/tenants:
    post:
      operationId: provisionTenant
      summary: Provision a new tenant
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionTenantRequest"
      responses:
        "201":
          description: Tenant provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/tenants/{tenantID}:
    get:
      operationId: getTenant
      summary: Get a tenant by ID
      tags: [Tenants]
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantID}/lifecycle:
    post:
      operationId: transitionTenantLifecycle
      summary: Transition a tenant's lifecycle state
      description: |
        Valid transitions: ONBOARDING→ACTIVE, ACTIVE→SUSPENDED, ACTIVE→OFFBOARDING,
        SUSPENDED→ACTIVE, SUSPENDED→OFFBOARDING. OFFBOARDING is terminal.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionTenantLifecycleRequest"
      responses:
        "204": { description: Transition applied }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Entities ───────────────────────────────────────────────────────────────

  /v1/entities:
    post:
      operationId: createEntity
      summary: Create a new legal entity
      description: |
        `primary_jurisdiction_id` is validated synchronously against the
        Jurisdiction Rules Service before the entity is persisted (fail-closed).
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityRequest"
      responses:
        "201":
          description: Entity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/tenants/{tenantID}/entities:
    get:
      operationId: listEntities
      summary: List all legal entities for a tenant
      tags: [Entities]
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Entity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalEntity"

  /v1/entities/{entityID}:
    get:
      operationId: getEntity
      summary: Get a legal entity by ID
      tags: [Entities]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Legal entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEntity
      summary: Update mutable fields on a legal entity
      description: |
        Only non-governance fields are patchable: legal_name, trading_name,
        default_currency_code. Status, jurisdiction, and hierarchy are managed
        through dedicated endpoints.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntityRequest"
      responses:
        "200":
          description: Updated entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/{entityID}/status:
    get:
      operationId: getEntityStatus
      summary: Entity status probe
      description: |
        Lightweight status probe — returns entity_id, tenant_id, and entity_status
        without the full entity payload. Designed for high-frequency polling by
        downstream services (e.g. identity-context-svc on cache miss).
        Renamed from the draft probe path per approved design decisions.
      tags: [Entities]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Entity status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityStatusResponse"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: transitionEntityStatus
      summary: Transition an entity's status
      description: |
        Valid transitions: ACTIVE→DORMANT, ACTIVE→SUSPENDED, ACTIVE→DISSOLVED,
        DORMANT→ACTIVE, DORMANT→DISSOLVED, SUSPENDED→ACTIVE, SUSPENDED→DISSOLVED.
        DISSOLVED is terminal. Idempotent — same target status is a no-op.
        Publishes `entity.status.changed` on every successful transition.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionEntityStatusRequest"
      responses:
        "204": { description: Transition applied (or idempotent no-op) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Hierarchies ────────────────────────────────────────────────────────────

  /v1/entity-hierarchies:
    post:
      operationId: createHierarchy
      summary: Create an effective-dated parent-child hierarchy
      tags: [Hierarchies]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHierarchyRequest"
      responses:
        "201":
          description: Hierarchy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityHierarchy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/entities/{entityID}/hierarchies:
    get:
      operationId: listHierarchies
      summary: List all hierarchy records for an entity
      tags: [Hierarchies]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Hierarchy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityHierarchy"

  /v1/entity-hierarchies/{hierarchyID}:
    delete:
      operationId: endDateHierarchy
      summary: End-date a hierarchy relationship
      description: |
        Closes the relationship by setting effective_to. No hard-delete per doctrine.
        `end_date` query parameter is required (RFC3339 format).
      tags: [Hierarchies]
      security:
        - bearerAuth: []
      parameters:
        - name: hierarchyID
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationID"
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "204": { description: Hierarchy end-dated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Jurisdiction assignments ───────────────────────────────────────────────

  /v1/entities/{entityID}/jurisdictions:
    get:
      operationId: listJurisdictions
      summary: List effective-dated jurisdiction assignments for an entity
      tags: [Jurisdictions]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Jurisdiction assignment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityJurisdictionAssignment"
    post:
      operationId: assignJurisdiction
      summary: Assign a jurisdiction to a legal entity
      description: |
        jurisdiction_id is validated synchronously against the Jurisdiction Rules
        Service before persistence. If the service is unreachable the request is
        rejected (fail-closed) — a bad jurisdiction reference would silently
        propagate tax, payroll, and filing failures across the platform.
      tags: [Jurisdictions]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignJurisdictionRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityJurisdictionAssignment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/entity-jurisdictions/{assignmentID}:
    delete:
      operationId: endDateJurisdictionAssignment
      summary: End-date a jurisdiction assignment
      description: |
        Closes the assignment by setting effective_to. No hard-delete per doctrine.
        `end_date` query parameter is required (RFC3339).
      tags: [Jurisdictions]
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentID
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationID"
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "204": { description: Assignment end-dated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Data Residency Policies ────────────────────────────────────────────────

  /v1/residency-policies:
    post:
      operationId: createResidencyPolicy
      summary: Create a data residency policy for a tenant
      tags: [ResidencyPolicies]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResidencyPolicyRequest"
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResidencyPolicy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/residency-policies/{policyID}:
    get:
      operationId: getResidencyPolicy
      summary: Get a residency policy by ID
      tags: [ResidencyPolicies]
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Residency policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResidencyPolicy"
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Residency Regions (IaC-managed — read-only) ───────────────────────────

  /v1/residency-regions:
    get:
      operationId: listResidencyRegions
      summary: List all active residency regions
      description: |
        ResidencyRegion records are IaC-provisioned (Terraform/CDK).
        No write endpoints exist on this service.
      tags: [ResidencyRegions]
      responses:
        "200":
          description: Region list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResidencyRegion"

  /v1/residency-regions/{regionID}:
    get:
      operationId: getResidencyRegion
      summary: Get a residency region by ID
      tags: [ResidencyRegions]
      parameters:
        - name: regionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Residency region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencyRegion"
        "404": { $ref: "#/components/responses/NotFound" }

  # ── TaxIdentityBundles ─────────────────────────────────────────────────────

  /v1/entities/{entityID}/tax-identity-bundles:
    get:
      operationId: listTaxIdentityBundles
      summary: List all TaxIdentityBundle headers for an entity
      tags: [TaxIdentityBundles]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Bundle header list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxIdentityBundle"
    post:
      operationId: createTaxIdentityBundle
      summary: Create a TaxIdentityBundle header for an entity
      description: |
        Stores the structural header only: legal_entity_id, jurisdiction_id,
        effective dates, and status. No tax identifier values are stored here.
        The actual tax registration number and all evidence artifacts are owned
        by the Tax Service.

        jurisdiction_id is validated synchronously (fail-closed).
      tags: [TaxIdentityBundles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxIdentityBundleRequest"
      responses:
        "201":
          description: Bundle header created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxIdentityBundle"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/tax-identity-bundles/{bundleID}:
    get:
      operationId: getTaxIdentityBundle
      summary: Get a TaxIdentityBundle header by ID
      tags: [TaxIdentityBundles]
      parameters:
        - name: bundleID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bundle header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxIdentityBundle"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tax-identity-bundles/{bundleID}/status:
    post:
      operationId: transitionTaxIdentityBundleStatus
      summary: Transition a TaxIdentityBundle header status
      description: |
        Valid statuses: PENDING, ACTIVE, EXPIRED, SUPERSEDED.
        Idempotent — same target status is a no-op.
      tags: [TaxIdentityBundles]
      security:
        - bearerAuth: []
      parameters:
        - name: bundleID
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionTaxIdentityBundleStatusRequest"
      responses:
        "204": { description: Status transitioned }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Health ─────────────────────────────────────────────────────────────────

  /v1/tenants/{tenantID}/residency-region:
    get:
      operationId: resolveTenantRegion
      summary: Resolve a tenant's data-residency region
      description: |
        The tenant-to-region lookup consumed by the Global Traffic & Residency
        Manager's ingress layer, resolving
        Tenant.default_data_residency_policy_id to the policy's region code.

        Returns 409, not 404, when the tenant exists but its active residency
        policy has no region assigned. That is a real and expected state for
        policies created before migration 000003 added the column, and
        collapsing it into "not found" would send an operator looking for a
        tenant that is plainly there.

        Served since before this contract was written and absent from it until
        the route/contract parity test was added.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Resolved region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedTenantRegion"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The tenant's residency policy has no region assigned }

  # ── ORG-02 §4.2: tenant named commands ─────────────────────────────────────

  /v1/tenants/{tenantID}/commands/{command}:
    post:
      operationId: executeTenantCommand
      summary: Execute a named ORG-02 tenant lifecycle command
      description: |
        ORG-02 §4.2 names seven commands; the five lifecycle ones are invoked
        here. ChangeDefaultLocale has its own route (it is not a lifecycle
        transition) and CreateTenant is POST /v1/tenants.

        The command NAME, not just the destination state, is written to the
        tenant lifecycle history and carried in the emitted event — which is
        what distinguishes a suspension from the reversal of a mistaken
        activation after the fact.

        InitiateTermination and CompleteTermination require maker-checker:
        approved_by_principal_id is mandatory and must differ from the acting
        principal. Suspension deliberately does not — it is a containment
        action taken during an incident, and requiring a second approver would
        keep a compromised tenant live until one is found.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CorrelationID"
        - name: command
          in: path
          required: true
          schema:
            type: string
            enum: [ActivateTenant, SuspendTenant, ResumeTenant, InitiateTermination, CompleteTermination]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteTenantCommandRequest"
      responses:
        "200":
          description: Command applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCommandResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found, or the command is not an ORG-02 command }
        "409": { description: expected_version is stale, or the tenant moved first }
        "422": { description: Command not reachable from the current state, or an independent approver is required }

  /v1/tenants/{tenantID}/defaults:
    get:
      operationId: getTenantDefaults
      summary: Get baseline tenancy configuration (ORG-02 GetTenantDefaults)
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDefaults"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: changeDefaultLocale
      summary: ORG-02 ChangeDefaultLocale
      description: |
        Not a lifecycle transition: lifecycle_state is untouched. Still written
        to the lifecycle history, because an unrecorded configuration change is
        one nobody can attribute later.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeDefaultLocaleRequest"
      responses:
        "200":
          description: Defaults changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: expected_version is stale, or the tenant may not transact }

  /v1/tenants/{tenantID}/lifecycle-history:
    get:
      operationId: listTenantLifecycleHistory
      summary: ORG-02 ListTenantLifecycleHistory
      description: Durable lifecycle evidence — actor, reason, approver and command, newest first.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Lifecycle history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantLifecycleEvent"
        "404": { $ref: "#/components/responses/NotFound" }

  # ── ORG-02 §4.2: host bindings and ResolveTenantByHost ─────────────────────

  /v1/tenants/{tenantID}/host-bindings:
    get:
      operationId: listTenantHostBindings
      summary: List a tenant's bound hostnames
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Host bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantHostBinding"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: bindTenantHost
      summary: Bind a hostname to a tenant
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindTenantHostRequest"
      responses:
        "201":
          description: Bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantHostBinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Hostname already bound, or the tenant already has a primary hostname }

  /v1/resolve-tenant:
    get:
      operationId: resolveTenantByHost
      summary: ORG-02 ResolveTenantByHost
      description: |
        Deliberately UNAUTHENTICATED and not tenant-scoped: this is the lookup
        by which a caller learns which tenant a hostname belongs to, so
        requiring the answer as input would be circular.

        An unknown hostname returns 404. It never falls back to a default
        tenant — that fallback is the defect ORG §8 NP3 exists to prevent.
      tags: [Tenants]
      parameters:
        - name: hostname
          in: query
          required: false
          description: Defaults to the request's own Host header if omitted.
          schema: { type: string }
      responses:
        "200":
          description: Resolved tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedTenantByHost"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: Hostname is not bound to any tenant }

  # ── ORG-03 §4.3: profile amendment commands ────────────────────────────────

  /v1/entities/{entityID}/profile-amendments:
    post:
      operationId: amendLegalProfile
      summary: ORG-03 AmendLegalProfile — create the next effective-dated profile version
      description: |
        Creates a NEW version rather than mutating the entity in place, which
        is what makes §8 NP6 hold: a legal-name change after financial history
        exists leaves the prior version intact, so a historical read still
        resolves the name the history was booked under.

        Every profile field is optional; an omitted field is carried forward
        from the version in force at effective_from, not blanked.

        effective_from is BUSINESS time and may be in the past — a registry
        filing learned about late is effective from the filing date. A
        backdated version does not become the entity's current identity.

        Changes to legal_name, registration_number or
        incorporation_jurisdiction_id require an independent approver (§4.3:
        the maker cannot approve their own legal-identity change).
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendLegalProfileRequest"
      responses:
        "201":
          description: New profile version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityProfileVersion"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: expected_version is stale, the tenant may not transact, or the registry identity is already claimed and has been quarantined }
        "422": { description: An independent approver is required }

  /v1/entities/{entityID}/legal-name:
    post:
      operationId: changeLegalName
      summary: ORG-03 ChangeLegalName
      description: |
        A narrowing of AmendLegalProfile that records change_reason
        LEGAL_NAME_CHANGE, which is what lets a downstream consumer react to a
        rename specifically rather than to any amendment.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeLegalNameRequest"
      responses:
        "201":
          description: New profile version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityProfileVersion"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: expected_version is stale or the tenant may not transact }
        "422": { description: An independent approver is required }

  /v1/entities/{entityID}/registered-office:
    post:
      operationId: changeRegisteredOffice
      summary: ORG-03 ChangeRegisteredOffice
      description: |
        The registered office is stored as opaque structured JSON. ORG-08 owns
        address normalization and §1 is explicit that storing an address here
        must not become a second address authority — this service records what
        it was told and draws no conclusions from it.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRegisteredOfficeRequest"
      responses:
        "201":
          description: New profile version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityProfileVersion"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: expected_version is stale or the tenant may not transact }

  # ── ORG-03 §4.3: as-of and version reads ───────────────────────────────────

  /v1/entities/{entityID}/versions:
    get:
      operationId: listEntityVersions
      summary: ORG-03 ListEntityVersions
      description: Every profile version ever recorded for this entity, newest first. Nothing is ever rewritten or removed.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Profile versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalEntityProfileVersion"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/{entityID}/as-of:
    get:
      operationId: getLegalEntityAsOf
      summary: ORG-03 GetLegalEntityAsOf — reconstruct an entity at a business instant
      description: |
        as_of is BUSINESS time: what this entity's legal name was on the date
        an invoice was issued, not what this platform believed on that date.
        The two differ for a backdated correction, and business time is the one
        a financial reconstruction needs.

        The interval is half-open — a version effective from an instant owns
        that instant, and the one it supersedes does not.

        profile is null when the entity existed but had no recorded profile at
        that instant (a date before incorporation). That is a true answer, not
        an error.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - name: as_of
          in: query
          required: false
          description: RFC3339 timestamp or a YYYY-MM-DD date (read as midnight UTC). Defaults to now.
          schema: { type: string }
      responses:
        "200":
          description: Entity as of the requested instant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityAsOf"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/by-registry-number:
    get:
      operationId: findByRegistryNumber
      summary: ORG-03 FindByRegistryNumber
      description: |
        Returns a LIST, deliberately. §4.3 records that registry number plus
        jurisdiction is a dedup signal and not a universal identifier.
        Returning a single entity would present that hint as an identity
        lookup, which is the assumption that produces silent merges.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - name: registration_number
          in: query
          required: true
          schema: { type: string }
        - name: jurisdiction_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Candidate entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalEntity"
        "400": { $ref: "#/components/responses/BadRequest" }

  # ── ORG-03 §8 NP5: registry conflict quarantine ────────────────────────────

  /v1/registry-conflicts:
    get:
      operationId: listRegistryConflicts
      summary: List quarantined registry-identity conflicts
      description: |
        §8 NP5 requires a duplicate registry claim to be quarantined rather
        than silently merged. The incoming entity is NOT written; the attempt
        is recorded here with its full payload, because there is no row to
        point at.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Pass all to include resolved conflicts; the default is open only.
          schema: { type: string, enum: [open, all] }
      responses:
        "200":
          description: Conflicts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityRegistryConflict"

  /v1/registry-conflicts/{conflictID}/resolution:
    post:
      operationId: resolveRegistryConflict
      summary: Record a conclusion about a quarantined conflict
      description: |
        Records a finding. It does NOT merge anything: §1 is explicit that
        destructive merge is prohibited and that lineage must be preserved, so
        acting on a RESOLVED_DUPLICATE conclusion is a separate governed
        operation this service does not perform.

        A conflict can be resolved once. A second attempt is 409 rather than an
        overwrite of the first resolver's conclusion.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
        - name: conflictID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRegistryConflictRequest"
      responses:
        "204": { description: Resolution recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Already resolved }

  # ── Workspaces ─────────────────────────────────────────────────────────────
  #
  # These five routes have existed since migration 000005 and were absent from
  # this contract entirely — found by the route/contract parity test added
  # alongside the ORG work, not by a reader noticing.

  /v1/workspaces:
    post:
      operationId: createWorkspace
      summary: Create a workspace beneath a tenant
      description: |
        billing_classification is mandatory and validated. A non-billable
        workspace (INTERNAL, DEMO, SANDBOX, QA_AUTOMATION, PILOT_NON_BILLABLE)
        is legitimate; an unrecognized string is not. Environment name and
        workspace age are never enough to infer it.
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Tenant may not transact }

  /v1/tenants/{tenantID}/workspaces:
    get:
      operationId: listWorkspaces
      summary: List a tenant's workspaces
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workspaces/{workspaceID}:
    get:
      operationId: getWorkspace
      summary: Get a workspace
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWorkspace
      summary: Update a workspace
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Tenant may not transact }

  /v1/workspaces/{workspaceID}/status:
    post:
      operationId: transitionWorkspaceStatus
      summary: Archive or restore a workspace
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionWorkspaceStatusRequest"
      responses:
        "204": { description: Transition applied }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }


  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      tags: [Health]
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      description: Returns 200 only if the DB pool is reachable.
      tags: [Health]
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: DB unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

# ── Components ────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        IdentityContextEnvelope JWT issued by identity-context-svc.
        Verified by the Authorization Service on every material action.

  parameters:
    TenantID:
      name: tenantID
      in: path
      required: true
      schema:
        type: string
    EntityID:
      name: entityID
      in: path
      required: true
      schema:
        type: string
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema:
        type: string
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: |
        Propagated through every request for evidence and distributed tracing.
        If absent, the service generates one from the request ID.

  schemas:

    # ── Tenant ────────────────────────────────────────────────────────────────

    Tenant:
      type: object
      properties:
        tenant_id:           { type: string }
        tenant_code:         { type: string }
        legal_name:          { type: string }
        trading_name:        { type: string, nullable: true }
        status:              { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        default_currency_code: { type: string }
        primary_timezone:    { type: string }
        primary_locale:      { type: string }
        default_data_residency_policy_id: { type: string }
        lifecycle_state:     { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING] }
        created_at:          { type: string, format: date-time }
        created_by:          { type: string }

    ProvisionTenantRequest:
      type: object
      required: [tenant_code, legal_name, default_currency_code, primary_timezone, primary_locale, default_data_residency_policy_id]
      properties:
        tenant_code:         { type: string }
        legal_name:          { type: string }
        trading_name:        { type: string }
        default_currency_code: { type: string }
        primary_timezone:    { type: string }
        primary_locale:      { type: string }
        default_data_residency_policy_id: { type: string }

    TransitionTenantLifecycleRequest:
      type: object
      required: [target_state, correlation_id]
      properties:
        target_state:
          type: string
          enum: [ACTIVE, SUSPENDED, OFFBOARDING]
        correlation_id: { type: string }

    # ── LegalEntity ───────────────────────────────────────────────────────────

    LegalEntity:
      type: object
      properties:
        legal_entity_id:        { type: string }
        tenant_id:              { type: string }
        entity_code:            { type: string }
        legal_name:             { type: string }
        trading_name:           { type: string, nullable: true }
        registration_number:    { type: string, nullable: true }
        tax_identity_bundle_id: { type: string, nullable: true }
        entity_type:            { type: string, enum: [SUBSIDIARY, BRANCH, HOLDING, OPERATIONAL] }
        incorporation_date:     { type: string, format: date, nullable: true }
        default_currency_code:  { type: string }
        fiscal_calendar_id:     { type: string }
        parent_legal_entity_id: { type: string, nullable: true }
        entity_status:          { type: string, enum: [ACTIVE, DORMANT, SUSPENDED, DISSOLVED] }
        primary_jurisdiction_id: { type: string }
        data_residency_policy_id: { type: string }
        created_at:             { type: string, format: date-time }

    CreateEntityRequest:
      type: object
      required: [tenant_id, entity_code, legal_name, entity_type, default_currency_code, fiscal_calendar_id, primary_jurisdiction_id, data_residency_policy_id, correlation_id]
      properties:
        tenant_id:              { type: string }
        entity_code:            { type: string }
        legal_name:             { type: string }
        trading_name:           { type: string }
        entity_type:            { type: string, enum: [SUBSIDIARY, BRANCH, HOLDING, OPERATIONAL] }
        default_currency_code:  { type: string }
        fiscal_calendar_id:     { type: string }
        primary_jurisdiction_id:
          type: string
          description: Validated synchronously against Jurisdiction Rules Service (fail-closed).
        data_residency_policy_id: { type: string }
        correlation_id:         { type: string }

    UpdateEntityRequest:
      type: object
      properties:
        legal_name:           { type: string }
        trading_name:         { type: string }
        default_currency_code: { type: string }
        correlation_id:       { type: string }

    EntityStatusResponse:
      type: object
      description: Lightweight status probe response — no full entity payload.
      properties:
        entity_id:     { type: string }
        tenant_id:     { type: string }
        entity_status: { type: string, enum: [ACTIVE, DORMANT, SUSPENDED, DISSOLVED] }

    TransitionEntityStatusRequest:
      type: object
      required: [new_status, correlation_id]
      description: |
        Publishes entity.status.changed on success.
        Idempotent — same target status is a no-op.
      properties:
        new_status:
          type: string
          enum: [ACTIVE, DORMANT, SUSPENDED, DISSOLVED]
        correlation_id: { type: string }

    # ── EntityHierarchy ───────────────────────────────────────────────────────

    EntityHierarchy:
      type: object
      properties:
        hierarchy_id:           { type: string }
        tenant_id:              { type: string }
        parent_legal_entity_id: { type: string }
        child_legal_entity_id:  { type: string }
        relationship_type:      { type: string, enum: [OWNERSHIP, REPORTING, OPERATIONAL] }
        effective_from:         { type: string, format: date-time }
        effective_to:           { type: string, format: date-time, nullable: true }

    CreateHierarchyRequest:
      type: object
      required: [tenant_id, parent_legal_entity_id, child_legal_entity_id, relationship_type, effective_from, correlation_id]
      properties:
        tenant_id:              { type: string }
        parent_legal_entity_id: { type: string }
        child_legal_entity_id:  { type: string }
        relationship_type:      { type: string, enum: [OWNERSHIP, REPORTING, OPERATIONAL] }
        effective_from:         { type: string, format: date-time }
        correlation_id:         { type: string }

    # ── EntityJurisdictionAssignment ──────────────────────────────────────────

    EntityJurisdictionAssignment:
      type: object
      properties:
        assignment_id:   { type: string }
        legal_entity_id: { type: string }
        jurisdiction_id: { type: string }
        assignment_type: { type: string, enum: [PRIMARY, SECONDARY, TAX_ONLY, FILING_ONLY] }
        effective_from:  { type: string, format: date-time }
        effective_to:    { type: string, format: date-time, nullable: true }
        source_basis:    { type: string }

    AssignJurisdictionRequest:
      type: object
      required: [jurisdiction_id, assignment_type, effective_from, source_basis, correlation_id]
      properties:
        jurisdiction_id:
          type: string
          description: Validated synchronously against Jurisdiction Rules Service (fail-closed).
        assignment_type: { type: string, enum: [PRIMARY, SECONDARY, TAX_ONLY, FILING_ONLY] }
        effective_from:  { type: string, format: date-time }
        source_basis:    { type: string }
        correlation_id:  { type: string }

    # ── DataResidencyPolicy ───────────────────────────────────────────────────

    DataResidencyPolicy:
      type: object
      properties:
        data_residency_policy_id: { type: string }
        tenant_id:                { type: string }
        policy_name:              { type: string }
        policy_code:              { type: string }
        residency_mode:           { type: string, enum: [STRICT_REGION, PREFERRED_REGION, FOLLOW_ENTITY] }
        conflict_resolution_mode: { type: string, enum: [FAIL_CLOSED, LOG_AND_PROCEED, ESCALATE] }
        active_flag:              { type: boolean }

    CreateResidencyPolicyRequest:
      type: object
      required: [tenant_id, policy_name, policy_code, residency_mode, conflict_resolution_mode, correlation_id]
      properties:
        tenant_id:                { type: string }
        policy_name:              { type: string }
        policy_code:              { type: string }
        residency_mode:           { type: string, enum: [STRICT_REGION, PREFERRED_REGION, FOLLOW_ENTITY] }
        conflict_resolution_mode: { type: string, enum: [FAIL_CLOSED, LOG_AND_PROCEED, ESCALATE] }
        correlation_id:           { type: string }

    # ── ResidencyRegion (IaC-managed — no write schemas exposed) ─────────────

    ResidencyRegion:
      type: object
      description: |
        IaC-provisioned record. No create/update/delete endpoints exist on this service.
        These records are managed exclusively via infrastructure-as-code (Terraform/CDK).
      properties:
        residency_region_id: { type: string }
        region_code:         { type: string }
        region_name:         { type: string }
        cloud_provider:      { type: string }
        country_code:        { type: string }
        sovereign_flag:      { type: boolean }
        active_flag:         { type: boolean }

    # ── TaxIdentityBundle ─────────────────────────────────────────────────────

    TaxIdentityBundle:
      type: object
      description: |
        Structural header only — no tax identifier values stored here.
        Fields: legal_entity_id, jurisdiction_id, effective dates, status.
        The actual tax_registration_number and all evidence artifacts are
        owned by the Tax Service.
      properties:
        tax_identity_bundle_id: { type: string }
        legal_entity_id:        { type: string }
        jurisdiction_id:        { type: string }
        status:                 { type: string, enum: [PENDING, ACTIVE, EXPIRED, SUPERSEDED] }
        effective_from:         { type: string, format: date-time }
        effective_to:           { type: string, format: date-time, nullable: true }

    CreateTaxIdentityBundleRequest:
      type: object
      required: [jurisdiction_id, effective_from, correlation_id]
      description: |
        Creates the structural header only — do NOT include tax identifier values here.
        jurisdiction_id is validated synchronously (fail-closed).
      properties:
        jurisdiction_id:
          type: string
          description: Validated synchronously against Jurisdiction Rules Service (fail-closed).
        effective_from: { type: string, format: date-time }
        effective_to:   { type: string, format: date-time, nullable: true }
        correlation_id: { type: string }

    TransitionTaxIdentityBundleStatusRequest:
      type: object
      required: [new_status, correlation_id]
      properties:
        new_status:
          type: string
          enum: [PENDING, ACTIVE, EXPIRED, SUPERSEDED]
        correlation_id: { type: string }

    # ── Health ────────────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      properties:
        status:    { type: string }
        timestamp: { type: string, format: date-time }
        service:   { type: string }

    # ── Error ─────────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:          { type: string }
        correlation_id: { type: string }

    ResolvedTenantRegion:
      type: object
      properties:
        tenant_id:   { type: string, format: uuid }
        region_code: { type: string }
        region_name: { type: string }

    # ── ORG-02 §4.2: named commands, defaults, host bindings ─────────────────

    ExecuteTenantCommandRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: |
            Mandatory. §4.2 requires the lifecycle actor and reason as
            evidence, and a history whose reason column is empty answers
            "why is this tenant suspended?" with silence.
        expected_version:
          type: integer
          format: int64
          description: |
            The tenant's record_version as the caller last saw it. Omitting it
            is accepted and does NOT skip the guard: the service substitutes
            the version it reads, turning its own read-then-write into a
            compare-and-swap. Supplying it gives the stronger guarantee that
            nothing moved since the CALLER read.
        approved_by_principal_id:
          type: string
          description: |
            The independent approver, required for InitiateTermination and
            CompleteTermination. Must differ from the acting principal; the
            database enforces that independently of this service.
        correlation_id: { type: string }

    TenantCommandResult:
      type: object
      properties:
        from_state:     { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        to_state:       { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        record_version: { type: integer, format: int64 }
        status:         { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }

    ChangeDefaultLocaleRequest:
      type: object
      required: [reason]
      properties:
        primary_locale:   { type: string }
        primary_timezone: { type: string }
        reason:           { type: string }
        expected_version: { type: integer, format: int64 }
        correlation_id:   { type: string }

    TenantDefaults:
      type: object
      properties:
        tenant_id:             { type: string, format: uuid }
        default_currency_code: { type: string }
        primary_timezone:      { type: string }
        primary_locale:        { type: string }
        default_data_residency_policy_id: { type: string, format: uuid }
        record_version:        { type: integer, format: int64 }

    TenantLifecycleEvent:
      type: object
      properties:
        lifecycle_event_id: { type: string, format: uuid }
        tenant_id:          { type: string, format: uuid }
        from_state:         { type: string, nullable: true }
        to_state:           { type: string }
        command_name:
          type: string
          description: |
            The ORG-02 named command that caused the transition. Stored rather
            than inferred from the state pair: SuspendTenant followed by
            ResumeTenant is otherwise indistinguishable from the correction of
            a mistaken suspension.
          enum: [CreateTenant, ActivateTenant, SuspendTenant, ResumeTenant, InitiateTermination, CompleteTermination, ChangeDefaultLocale]
        reason:                   { type: string }
        actor_principal_id:       { type: string }
        approved_by_principal_id: { type: string, nullable: true }
        correlation_id:           { type: string, nullable: true }
        occurred_at:              { type: string, format: date-time }

    TenantHostBinding:
      type: object
      properties:
        host_binding_id:          { type: string, format: uuid }
        hostname:                 { type: string }
        tenant_id:                { type: string, format: uuid }
        is_primary:               { type: boolean }
        active_flag:              { type: boolean }
        created_at:               { type: string, format: date-time }
        created_by_principal_id:  { type: string }

    BindTenantHostRequest:
      type: object
      required: [hostname]
      properties:
        hostname:
          type: string
          description: Lowercased on write; case is not meaningful in a hostname.
        is_primary:     { type: boolean }
        correlation_id: { type: string }

    ResolvedTenantByHost:
      type: object
      description: |
        Carries the tenant's status and lifecycle state alongside its id,
        because the caller is an ingress layer deciding whether to admit a
        request — handing it only an id would force a second round trip to
        learn the tenant is suspended.
      properties:
        hostname:        { type: string }
        tenant_id:       { type: string, format: uuid }
        tenant_code:     { type: string }
        status:          { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        lifecycle_state: { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        is_primary:      { type: boolean }

    # ── ORG-03 §4.3: bitemporal profile versions ─────────────────────────────

    LegalEntityProfileVersion:
      type: object
      description: |
        One effective-dated version of an entity's legal profile.

        effective_from/effective_to are BUSINESS time — when the fact was true
        in the world. recorded_at is RECORD time — when this platform learned
        it. The two differ whenever a change is backdated, which is exactly
        the case §9.2 requires as-of retrieval to be verified against.

        superseded_at marks a version replaced by a later one. The row is never
        rewritten or deleted: §8 NP6 requires history to resolve the ORIGINAL
        version, which is impossible if a correction overwrites what it
        corrects.
      properties:
        profile_version_id: { type: string, format: uuid }
        tenant_id:          { type: string, format: uuid }
        legal_entity_id:    { type: string, format: uuid }
        version_number:     { type: integer }
        legal_name:         { type: string }
        trading_name:       { type: string, nullable: true }
        legal_form_code:    { type: string, nullable: true }
        legal_form_source:  { type: string, nullable: true }
        legal_form_local_text: { type: string, nullable: true }
        registration_number:   { type: string, nullable: true }
        registry_authority:    { type: string, nullable: true }
        registered_office:     { type: string, nullable: true, description: Opaque structured JSON; ORG-08 owns address normalization. }
        incorporation_jurisdiction_id: { type: string, nullable: true }
        default_currency_code: { type: string, nullable: true }
        effective_from:  { type: string, format: date-time }
        effective_to:    { type: string, format: date-time, nullable: true }
        recorded_at:     { type: string, format: date-time }
        superseded_at:   { type: string, format: date-time, nullable: true }
        change_reason:
          type: string
          enum: [INITIAL, INITIAL_BACKFILL, LEGAL_NAME_CHANGE, REGISTERED_OFFICE_CHANGE, AMENDMENT, CORRECTION]
          description: |
            CORRECTION and AMENDMENT are not interchangeable: a correction
            means the prior version was WRONG, so reports already issued
            against it were misstated. INITIAL and INITIAL_BACKFILL are
            service-assigned and refused if a caller supplies them.
        source_evidence_ref:      { type: string, nullable: true }
        created_by_principal_id:  { type: string }
        approved_by_principal_id: { type: string, nullable: true }

    AmendLegalProfileRequest:
      type: object
      description: |
        Every profile field is optional. An omitted field is CARRIED FORWARD
        from the version in force at effective_from — which is what makes this
        an amendment rather than a replacement.
      properties:
        legal_name:            { type: string }
        trading_name:          { type: string }
        legal_form_code:       { type: string }
        legal_form_source:     { type: string }
        legal_form_local_text: { type: string }
        registration_number:   { type: string }
        registry_authority:    { type: string }
        registered_office:     { type: string }
        incorporation_jurisdiction_id: { type: string }
        default_currency_code: { type: string }
        effective_from:
          type: string
          format: date-time
          description: Business time. May be in the past. Defaults to now.
        change_reason:
          type: string
          enum: [LEGAL_NAME_CHANGE, REGISTERED_OFFICE_CHANGE, AMENDMENT, CORRECTION]
        source_evidence_ref:      { type: string }
        approved_by_principal_id: { type: string }
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    ChangeLegalNameRequest:
      type: object
      required: [legal_name]
      properties:
        legal_name:               { type: string }
        effective_from:           { type: string, format: date-time }
        source_evidence_ref:      { type: string }
        approved_by_principal_id: { type: string }
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    ChangeRegisteredOfficeRequest:
      type: object
      required: [registered_office]
      properties:
        registered_office:        { type: string }
        effective_from:           { type: string, format: date-time }
        source_evidence_ref:      { type: string }
        approved_by_principal_id: { type: string }
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    EntityAsOf:
      type: object
      description: |
        The entity's unchanging identifiers paired with the profile version in
        force at the requested instant. Both are returned because a caller
        reconstructing a historical report needs both: the entity carries
        identifiers that do not change, the profile carries the facts that do.
      properties:
        legal_entity_id: { type: string, format: uuid }
        tenant_id:       { type: string, format: uuid }
        entity_code:     { type: string }
        entity_type:     { type: string }
        entity_status:   { type: string }
        as_of:           { type: string, format: date-time }
        profile:
          allOf:
            - $ref: "#/components/schemas/LegalEntityProfileVersion"
          nullable: true

    # ── ORG-03 §8 NP5: registry conflict quarantine ──────────────────────────

    EntityRegistryConflict:
      type: object
      properties:
        conflict_id:         { type: string, format: uuid }
        tenant_id:           { type: string, format: uuid }
        registration_number: { type: string }
        jurisdiction_id:     { type: string, format: uuid }
        existing_legal_entity_id: { type: string, format: uuid }
        attempted_payload:
          type: object
          additionalProperties: true
          description: |
            The rejected claim, kept whole. There is no row to point at,
            because the point is that it was not written.
        status:
          type: string
          enum: [OPEN, RESOLVED_DISTINCT, RESOLVED_DUPLICATE, DISMISSED]
          description: |
            RESOLVED_DISTINCT means a human confirmed the two are genuinely
            different entities sharing a registry number, which happens across
            registry authorities within one jurisdiction. RESOLVED_DUPLICATE
            records the opposite conclusion; it does not itself merge anything.
        resolution_note:          { type: string, nullable: true }
        resolved_by_principal_id: { type: string, nullable: true }
        resolved_at:              { type: string, format: date-time, nullable: true }
        detected_at:              { type: string, format: date-time }
        detected_by_principal_id: { type: string }
        correlation_id:           { type: string, nullable: true }

    ResolveRegistryConflictRequest:
      type: object
      required: [status, resolution_note]
      properties:
        status:
          type: string
          enum: [RESOLVED_DISTINCT, RESOLVED_DUPLICATE, DISMISSED]
        resolution_note:
          type: string
          description: Mandatory — a resolution nobody can audit is not one.
        correlation_id: { type: string }

    # ── Workspaces ───────────────────────────────────────────────────────────

    Workspace:
      type: object
      properties:
        workspace_id:    { type: string, format: uuid }
        tenant_id:       { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid, nullable: true }
        name:            { type: string }
        business_unit:   { type: string, nullable: true }
        billing_classification:
          type: string
          enum: [COMMERCIAL_STANDALONE, COMMERCIAL_ZOIKO_ONE, LEGACY_MIGRATION, PILOT_NON_BILLABLE, INTERNAL, DEMO, SANDBOX, QA_AUTOMATION]
        billing_source:  { type: string, enum: [NONE, DIRECT, ZOIKO_ONE_BUNDLE] }
        commercial_account_id: { type: string, format: uuid, nullable: true }
        status:          { type: string, enum: [ACTIVE, ARCHIVED] }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }
        created_by_principal_id: { type: string }
        updated_by_principal_id: { type: string }

    CreateWorkspaceRequest:
      type: object
      required: [tenant_id, name, billing_classification]
      properties:
        tenant_id:       { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        name:            { type: string }
        business_unit:   { type: string }
        billing_classification: { type: string }
        billing_source:  { type: string }
        commercial_account_id:  { type: string, format: uuid }
        correlation_id:  { type: string }

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:            { type: string }
        business_unit:   { type: string }
        billing_classification: { type: string }
        billing_source:  { type: string }
        commercial_account_id:  { type: string, format: uuid }
        correlation_id:  { type: string }

    TransitionWorkspaceStatusRequest:
      type: object
      required: [new_status]
      properties:
        new_status:     { type: string, enum: [ACTIVE, ARCHIVED] }
        correlation_id: { type: string }

  responses:
    BadRequest:
      description: Invalid request body or missing required fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authorization denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Upstream service (AuthZ or Jurisdiction Rules) unreachable — request rejected fail-closed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
