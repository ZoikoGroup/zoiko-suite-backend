openapi: "3.1.0"

info:
  title: Tenant & Entity Registry Service
  version: "1.0.0"
  description: |
    Authoritative registry for ZoikoSuite tenants, legal entities, entity hierarchies,
    jurisdiction assignments, data residency policies, residency regions (read-only),
    and TaxIdentityBundle headers.

    **Governance invariants:**
    - All mutating endpoints require a valid `Authorization: Bearer <IdentityContextEnvelope JWT>`.
    - Every mutating request must carry `X-Correlation-ID` for evidence propagation.
    - ResidencyRegion is IaC-managed — no write endpoints are exposed.
    - TaxIdentityBundle stores only the structural header (legal_entity_id, jurisdiction_id,
      effective dates, status). Tax identifier values are owned by the Tax Service.
    - jurisdiction_id references on EntityJurisdictionAssignment and TaxIdentityBundle are
      validated synchronously against the Jurisdiction Rules Service (fail-closed).
    - Entity status transitions publish `entity.status.changed` on the event backbone.
    - **Replay protection (migration 000010).** Every material write's `Idempotency-Key`
      is honoured per (tenant, method + path): a retry with the same key, principal and
      body is answered with the first response and `X-Idempotent-Replay: true`, without
      running the command again. The same key with a different body or principal is
      `409`. A `5xx` is not recorded, so a retry after one genuinely retries. Records
      are kept for 7 days.
    - **Host isolation (§8 NP3).** On every `/v1` route, a request arriving on a hostname
      bound to one tenant while `X-Tenant-Id` names another is refused `403` before any
      data is read.

servers:
  - url: http://localhost:8081
    description: Local development
  - url: https://api.zoiko.internal/tenant-entity-registry
    description: Internal cluster ingress

tags:
  - name: Tenants
    description: Tenant provisioning and lifecycle management
  - name: Entities
    description: Legal entity CRUD, status probe, and status transitions
  - name: Hierarchies
    description: Effective-dated parent-child entity relationships
  - name: Ownership
    description: ORG-04 effective-dated ownership and control relationships between legal entities
  - name: Jurisdictions
    description: Effective-dated jurisdiction assignments for entities
  - name: ResidencyPolicies
    description: Data residency policy management
  - name: ResidencyRegions
    description: IaC-managed hosting regions (read-only)
  - name: TaxIdentityBundles
    description: Structural tax identity headers (no tax identifier values stored here)
  - name: Health
    description: Liveness and readiness probes

paths:

  # ── Tenants ────────────────────────────────────────────────────────────────

  /v1/tenants:
    post:
      operationId: provisionTenant
      summary: Provision a new tenant
      description: |
        Creates the tenant in ONBOARDING and files its ORG-02 creation
        approval (creation_approval_request_id in the response). The tenant
        cannot be activated until a principal other than its creator approves
        that request.

        Idempotent by external_customer_key (ORG-02 §4.2): repeating a request
        with the same key and the same body returns the original tenant with
        200 and idempotent_replay=true; the same key with a different body is
        409. A missing key is 422.

        If the follow-on provisioning step (creation approval + tenant.created
        event) fails, the tenant is returned in FAILED_PROVISIONING and can be
        retried or abandoned with the RetryProvisioning / AbandonProvisioning
        commands.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionTenantRequest"
      responses:
        "201":
          description: Tenant provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "200":
          description: Replay of an onboarding key already used for this same request; the original tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "409": { description: "external_customer_key already used for a different onboarding request, or tenant_code taken", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "external_customer_key is required", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/tenants/{tenantID}:
    get:
      operationId: getTenant
      summary: Get a tenant by ID
      tags: [Tenants]
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantID}/lifecycle:
    post:
      operationId: transitionTenantLifecycle
      summary: Transition a tenant's lifecycle state
      description: |
        Valid transitions: ONBOARDING→ACTIVE, ACTIVE→SUSPENDED, ACTIVE→OFFBOARDING,
        SUSPENDED→ACTIVE, SUSPENDED→OFFBOARDING. OFFBOARDING is terminal.

        Not a way around maker-checker: a target of OFFBOARDING or TERMINATED
        is refused 422 (use the InitiateTermination / CompleteTermination named
        commands), and ONBOARDING→ACTIVE is refused 422 until the tenant's
        creation has been independently approved.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionTenantLifecycleRequest"
      responses:
        "204": { description: "Transition applied" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Entities ───────────────────────────────────────────────────────────────

  /v1/entities:
    post:
      operationId: createLegalEntity
      summary: CreateLegalEntity - create a new legal entity
      description: |
        `primary_jurisdiction_id` is validated synchronously against the
        Jurisdiction Rules Service before the entity is persisted (fail-closed).
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityRequest"
      responses:
        "201":
          description: Entity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/tenants/{tenantID}/entities:
    get:
      operationId: listEntities
      summary: List all legal entities for a tenant
      tags: [Entities]
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Entity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalEntity"

  /v1/entities/{entityID}:
    get:
      operationId: getEntity
      summary: Get a legal entity by ID
      tags: [Entities]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Legal entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEntity
      summary: Update mutable fields on a legal entity
      description: |
        Only non-governance fields are patchable: trading_name and
        default_currency_code. legal_name is refused 422 — it is under ORG-03
        segregation of duties and effective-dating, and is changed through
        POST /v1/entities/{entityID}/legal-name. Status, jurisdiction, and
        hierarchy are managed through dedicated endpoints.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntityRequest"
      responses:
        "200":
          description: Updated entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/{entityID}/status:
    get:
      operationId: getEntityStatus
      summary: Entity status probe
      description: |
        Lightweight status probe — returns entity_id, tenant_id, and entity_status
        without the full entity payload. Designed for high-frequency polling by
        downstream services (e.g. identity-context-svc on cache miss).
        Renamed from the draft probe path per approved design decisions.
      tags: [Entities]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Entity status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityStatusResponse"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: deactivateLegalEntity
      summary: DeactivateLegalEntity - transition an entity status (also reactivates, suspends and marks dormant)
      description: |
        Valid transitions: ACTIVE→DORMANT, ACTIVE→SUSPENDED, ACTIVE→DISSOLVED,
        DORMANT→ACTIVE, DORMANT→DISSOLVED, SUSPENDED→ACTIVE, SUSPENDED→DISSOLVED.
        DISSOLVED is terminal. Idempotent — same target status is a no-op.
        Publishes `entity.status.changed` on every successful transition.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionEntityStatusRequest"
      responses:
        "204": { description: "Transition applied (or idempotent no-op)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Hierarchies ────────────────────────────────────────────────────────────

  /v1/entity-hierarchies:
    post:
      operationId: createHierarchy
      summary: Create an effective-dated parent-child hierarchy
      tags: [Hierarchies]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHierarchyRequest"
      responses:
        "201":
          description: Hierarchy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityHierarchy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/entities/{entityID}/hierarchies:
    get:
      operationId: listHierarchies
      summary: List all hierarchy records for an entity
      tags: [Hierarchies]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Hierarchy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityHierarchy"

  /v1/entity-hierarchies/{hierarchyID}:
    delete:
      operationId: endDateHierarchy
      summary: End-date a hierarchy relationship
      description: |
        Closes the relationship by setting effective_to. No hard-delete per doctrine.
        `end_date` query parameter is required (RFC3339 format).
      tags: [Hierarchies]
      security:
        - bearerAuth: []
      parameters:
        - name: hierarchyID
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationID"
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "204": { description: "Hierarchy end-dated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Jurisdiction assignments ───────────────────────────────────────────────

  /v1/entities/{entityID}/jurisdictions:
    get:
      operationId: listJurisdictions
      summary: List effective-dated jurisdiction assignments for an entity
      tags: [Jurisdictions]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Jurisdiction assignment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityJurisdictionAssignment"
    post:
      operationId: assignJurisdiction
      summary: Assign a jurisdiction to a legal entity
      description: |
        jurisdiction_id is validated synchronously against the Jurisdiction Rules
        Service before persistence. If the service is unreachable the request is
        rejected (fail-closed) — a bad jurisdiction reference would silently
        propagate tax, payroll, and filing failures across the platform.
      tags: [Jurisdictions]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignJurisdictionRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityJurisdictionAssignment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/entity-jurisdictions/{assignmentID}:
    delete:
      operationId: endDateJurisdictionAssignment
      summary: End-date a jurisdiction assignment
      description: |
        Closes the assignment by setting effective_to. No hard-delete per doctrine.
        `end_date` query parameter is required (RFC3339).
      tags: [Jurisdictions]
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentID
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationID"
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "204": { description: "Assignment end-dated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Data Residency Policies ────────────────────────────────────────────────

  /v1/residency-policies:
    post:
      operationId: createResidencyPolicy
      summary: Create a data residency policy for a tenant
      tags: [ResidencyPolicies]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResidencyPolicyRequest"
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResidencyPolicy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/residency-policies/{policyID}:
    get:
      operationId: getResidencyPolicy
      summary: Get a residency policy by ID
      tags: [ResidencyPolicies]
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Residency policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResidencyPolicy"
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Residency Regions (IaC-managed — read-only) ───────────────────────────

  /v1/residency-regions:
    get:
      operationId: listResidencyRegions
      summary: List all active residency regions
      description: |
        ResidencyRegion records are IaC-provisioned (Terraform/CDK).
        No write endpoints exist on this service.
      tags: [ResidencyRegions]
      responses:
        "200":
          description: Region list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResidencyRegion"

  /v1/residency-regions/{regionID}:
    get:
      operationId: getResidencyRegion
      summary: Get a residency region by ID
      tags: [ResidencyRegions]
      parameters:
        - name: regionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Residency region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencyRegion"
        "404": { $ref: "#/components/responses/NotFound" }

  # ── TaxIdentityBundles ─────────────────────────────────────────────────────

  /v1/entities/{entityID}/tax-identity-bundles:
    get:
      operationId: listTaxIdentityBundles
      summary: List all TaxIdentityBundle headers for an entity
      description: |
        ORG-03 "sensitive identifier access scoped": RESTRICTED and
        CONFIDENTIAL bundles are omitted unless the caller holds
        ENTITY_SENSITIVE_IDENTIFIER_READ and sends X-Purpose-Context.
      tags: [TaxIdentityBundles]
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Bundle header list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxIdentityBundle"
    post:
      operationId: createTaxIdentityBundle
      summary: Create a TaxIdentityBundle header for an entity
      description: |
        Stores the structural header only: legal_entity_id, jurisdiction_id,
        effective dates, and status. No tax identifier values are stored here.
        The actual tax registration number and all evidence artifacts are owned
        by the Tax Service.

        jurisdiction_id is validated synchronously (fail-closed).
      tags: [TaxIdentityBundles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxIdentityBundleRequest"
      responses:
        "201":
          description: Bundle header created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxIdentityBundle"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/tax-identity-bundles/{bundleID}:
    get:
      operationId: getTaxIdentityBundle
      summary: Get a TaxIdentityBundle header by ID
      description: |
        A RESTRICTED or CONFIDENTIAL bundle is 403 unless the caller holds
        ENTITY_SENSITIVE_IDENTIFIER_READ and sends X-Purpose-Context.
      tags: [TaxIdentityBundles]
      parameters:
        - name: bundleID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bundle header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxIdentityBundle"
        "403": { description: "Sensitive bundle without the scoped-access permission and purpose", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tax-identity-bundles/{bundleID}/status:
    post:
      operationId: transitionTaxIdentityBundleStatus
      summary: Transition a TaxIdentityBundle header status
      description: |
        Valid statuses: PENDING, ACTIVE, EXPIRED, SUPERSEDED.
        Idempotent — same target status is a no-op.
      tags: [TaxIdentityBundles]
      security:
        - bearerAuth: []
      parameters:
        - name: bundleID
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionTaxIdentityBundleStatusRequest"
      responses:
        "204": { description: "Status transitioned" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Health ─────────────────────────────────────────────────────────────────

  /v1/tenants/{tenantID}/residency-region:
    get:
      operationId: resolveTenantRegion
      summary: Resolve a tenant's data-residency region
      description: |
        The tenant-to-region lookup consumed by the Global Traffic & Residency
        Manager's ingress layer, resolving
        Tenant.default_data_residency_policy_id to the policy's region code.

        Returns 409, not 404, when the tenant exists but its active residency
        policy has no region assigned. That is a real and expected state for
        policies created before migration 000003 added the column, and
        collapsing it into "not found" would send an operator looking for a
        tenant that is plainly there.

        Served since before this contract was written and absent from it until
        the route/contract parity test was added.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Resolved region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedTenantRegion"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The tenant's residency policy has no region assigned", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ── ORG-02 §4.2: tenant named commands ─────────────────────────────────────

  /v1/tenants/{tenantID}/commands/{command}:
    post:
      operationId: executeTenantCommand
      summary: Execute a named ORG-02 tenant lifecycle command
      description: |
        ORG-02 §4.2 names seven commands; the five lifecycle ones are invoked
        here. ChangeDefaultLocale has its own route (it is not a lifecycle
        transition) and CreateTenant is POST /v1/tenants.

        The command NAME, not just the destination state, is written to the
        tenant lifecycle history and carried in the emitted event — which is
        what distinguishes a suspension from the reversal of a mistaken
        activation after the fact.

        InitiateTermination and CompleteTermination require maker-checker:
        they answer 202 with an approval request and run only when a different
        verified principal approves it. ActivateTenant from ONBOARDING is
        refused 422 until the tenant's creation has been approved. Suspension
        deliberately needs no approver — it is a containment action taken
        during an incident, and requiring one would keep a compromised tenant
        live until one is found.

        approved_by_principal_id is refused on every command.

        RetryProvisioning (FAILED_PROVISIONING → ONBOARDING) re-runs the failed
        provisioning step. AbandonProvisioning (FAILED_PROVISIONING →
        TERMINATED) is the compensating cleanup — host bindings and residency
        policies are deactivated, nothing is deleted — and is maker-checker
        (202), like any termination.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CorrelationID"
        - name: command
          in: path
          required: true
          schema:
            type: string
            enum: [ActivateTenant, SuspendTenant, ResumeTenant, InitiateTermination, CompleteTermination, RetryProvisioning, AbandonProvisioning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteTenantCommandRequest"
      responses:
        "200":
          description: Command applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCommandResult"
        "202":
          description: |
            Filed for independent approval, not executed. A different verified
            principal releases it with POST /v1/approval-requests/{id}/approve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Tenant not found, or the command is not an ORG-02 command", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "409": { description: "expected_version is stale, the tenant moved first, or an approval is already pending for this tenant", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "Command not reachable from the current state, creation not yet approved, or approved_by_principal_id supplied", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/tenants/{tenantID}/defaults:
    get:
      operationId: getTenantDefaults
      summary: Get baseline tenancy configuration (ORG-02 GetTenantDefaults)
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDefaults"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: changeDefaultLocale
      summary: ORG-02 ChangeDefaultLocale
      description: |
        Not a lifecycle transition: lifecycle_state is untouched. Still written
        to the lifecycle history, because an unrecorded configuration change is
        one nobody can attribute later.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeDefaultLocaleRequest"
      responses:
        "200":
          description: Defaults changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "expected_version is stale, or the tenant may not transact", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/tenants/{tenantID}/home-region:
    post:
      operationId: changeHomeRegion
      summary: ORG-02 ChangeHomeRegion (maker-checker)
      description: |
        §4.2 "home-region changes require maker-checker". Re-points the tenant's
        home region — the region of its default residency policy — which is a
        hard isolation identifier, so the command is authorized in the platform
        scope (`TENANT_HOME_REGION_CHANGE`) and never applied directly: it is
        filed (202) and a different verified principal holding
        `TENANT_HOME_REGION_CHANGE_APPROVE` releases it through
        `POST /v1/approval-requests/{id}/approve`. On approval the region, the
        tenant's version, a lineage row carrying `home_region_decision_ref`, and
        `tenant.home_region.changed` commit together.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeHomeRegionRequest"
      responses:
        "202":
          description: Filed for independent approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "400": { description: "residency_region_id is not a UUID (VALIDATION_FAILED), or home_region_decision_ref is missing (SOURCE_UNVERIFIED)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "expected_version is stale (VERSION_CONFLICT), or a change is already pending (DUPLICATE_CANDIDATE)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "the tenant is OFFBOARDING or TERMINATED (INVALID_TRANSITION)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/tenants/{tenantID}/lifecycle-history:
    get:
      operationId: listTenantLifecycleHistory
      summary: ORG-02 ListTenantLifecycleHistory
      description: Durable lifecycle evidence — actor, reason, approver and command, newest first.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Lifecycle history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantLifecycleEvent"
        "404": { $ref: "#/components/responses/NotFound" }

  # ── ORG-02 §4.2: host bindings and ResolveTenantByHost ─────────────────────

  /v1/tenants/{tenantID}/host-bindings:
    get:
      operationId: listTenantHostBindings
      summary: List a tenant's bound hostnames
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Host bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantHostBinding"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: bindTenantHost
      summary: Bind a hostname to a tenant
      description: |
        A host binding is a hard isolation identifier (ORG-02 §4.2 "tenant
        admin cannot change hard isolation identifiers"): the grant is
        evaluated in the PLATFORM scope, so no tenant-scope grant can make one.
      tags: [Tenants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindTenantHostRequest"
      responses:
        "201":
          description: Bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantHostBinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Hostname already bound, or the tenant already has a primary hostname", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/resolve-tenant:
    get:
      operationId: resolveTenantByHost
      summary: ORG-02 ResolveTenantByHost
      description: |
        Deliberately UNAUTHENTICATED and not tenant-scoped: this is the lookup
        by which a caller learns which tenant a hostname belongs to, so
        requiring the answer as input would be circular.

        An unknown hostname returns 404. It never falls back to a default
        tenant — that fallback is the defect ORG §8 NP3 exists to prevent.
      tags: [Tenants]
      parameters:
        - name: hostname
          in: query
          required: false
          description: Defaults to the request's own Host header if omitted.
          schema: { type: string }
      responses:
        "200":
          description: Resolved tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedTenantByHost"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: "Hostname is not bound to any tenant", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ── ORG-03 §4.3: profile amendment commands ────────────────────────────────

  /v1/entities/{entityID}/profile-amendments:
    post:
      operationId: amendLegalProfile
      summary: ORG-03 AmendLegalProfile — create the next effective-dated profile version
      description: |
        Creates a NEW version rather than mutating the entity in place, which
        is what makes §8 NP6 hold: a legal-name change after financial history
        exists leaves the prior version intact, so a historical read still
        resolves the name the history was booked under.

        Every profile field is optional; an omitted field is carried forward
        from the version in force at effective_from, not blanked.

        effective_from is BUSINESS time and may be in the past — a registry
        filing learned about late is effective from the filing date. A
        backdated version does not become the entity's current identity.

        Changes to legal_name, registration_number, incorporation_jurisdiction_id
        or lei require an independent approver (§4.3:
        the maker cannot approve their own legal-identity change): they answer
        202 with an approval request and are written only when a different
        verified principal approves it.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendLegalProfileRequest"
      responses:
        "201":
          description: New profile version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityProfileVersion"
        "202":
          description: |
            Filed for independent approval, not executed. A different verified
            principal releases it with POST /v1/approval-requests/{id}/approve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "expected_version is stale, the tenant may not transact, the registry identity is already claimed and has been quarantined, or an approval is already pending", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "approved_by_principal_id supplied", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/entities/{entityID}/legal-name:
    post:
      operationId: changeLegalName
      summary: ORG-03 ChangeLegalName
      description: |
        A narrowing of AmendLegalProfile that records change_reason
        LEGAL_NAME_CHANGE, which is what lets a downstream consumer react to a
        rename specifically rather than to any amendment. Always filed for
        independent approval (202).
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeLegalNameRequest"
      responses:
        "201":
          description: New profile version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityProfileVersion"
        "202":
          description: |
            Filed for independent approval, not executed. A different verified
            principal releases it with POST /v1/approval-requests/{id}/approve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "expected_version is stale, the tenant may not transact, or an approval is already pending", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "approved_by_principal_id supplied", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/entities/{entityID}/registered-office:
    post:
      operationId: changeRegisteredOffice
      summary: ORG-03 ChangeRegisteredOffice
      description: |
        The registered office is stored as opaque structured JSON. ORG-08 owns
        address normalization and §1 is explicit that storing an address here
        must not become a second address authority — this service records what
        it was told and draws no conclusions from it.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRegisteredOfficeRequest"
      responses:
        "201":
          description: New profile version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityProfileVersion"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "expected_version is stale or the tenant may not transact", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ── ORG-03 §4.3: Draft → Verified → Active, MergeDuplicateCandidate ───────

  /v1/entities/{entityID}/verification:
    post:
      operationId: requestEntityVerification
      summary: ORG-03 VerifyLegalEntity (DRAFT → VERIFIED), filed for independent approval
      description: |
        Always 202. The approver may be neither the requester nor the
        entity's creator, and needs ENTITY_VERIFY_APPROVE.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEntityVerificationRequest"
      responses:
        "202":
          description: Filed for independent approval, not executed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, tenant may not transact, or a verification is already pending", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "Entity is not DRAFT", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/entities/{entityID}/activation:
    post:
      operationId: activateLegalEntity
      summary: ORG-03 activation (VERIFIED → ACTIVE)
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateLegalEntityRequest"
      responses:
        "200":
          description: Entity activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version or the tenant may not transact", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "Entity is not VERIFIED", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/entities/{entityID}/merge:
    post:
      operationId: mergeDuplicateCandidate
      summary: ORG-03 MergeDuplicateCandidate (non-destructive), filed for independent approval
      description: |
        On approval the duplicate (this entity) becomes DORMANT with
        merged_into_legal_entity_id pointing at the survivor, and a merge
        record is written. Nothing is deleted and no reference is re-pointed
        (§1: destructive merge is prohibited). Reversible with /unmerge.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeDuplicateCandidateRequest"
      responses:
        "202":
          description: Filed for independent approval, not executed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already merged, survivor not ACTIVE/unmerged, stale version, or a merge already pending", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "Entity status cannot be merged", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/entities/{entityID}/unmerge:
    post:
      operationId: unmergeEntity
      summary: Reverse a merge, filed for independent approval
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnmergeEntityRequest"
      responses:
        "202":
          description: Filed for independent approval, not executed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Entity is not merged, or stale version", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/entities/{entityID}/merge-records:
    get:
      operationId: listEntityMergeRecords
      summary: Merge lineage for an entity (as duplicate or survivor)
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Merge records, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityMergeRecord"
        "404": { $ref: "#/components/responses/NotFound" }

  # ── ORG-03 §4.3: as-of and version reads ───────────────────────────────────

  /v1/entities/{entityID}/versions:
    get:
      operationId: listEntityVersions
      summary: ORG-03 ListEntityVersions
      description: Every profile version ever recorded for this entity, newest first. Nothing is ever rewritten or removed.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Profile versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalEntityProfileVersion"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/{entityID}/as-of:
    get:
      operationId: getLegalEntityAsOf
      summary: ORG-03 GetLegalEntityAsOf — reconstruct an entity at a business instant
      description: |
        as_of is BUSINESS time: what this entity's legal name was on the date
        an invoice was issued, not what this platform believed on that date.
        The two differ for a backdated correction, and business time is the one
        a financial reconstruction needs.

        The interval is half-open — a version effective from an instant owns
        that instant, and the one it supersedes does not.

        profile is null when the entity existed but had no recorded profile at
        that instant (a date before incorporation). That is a true answer, not
        an error.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - name: as_of
          in: query
          required: false
          description: RFC3339 timestamp or a YYYY-MM-DD date (read as midnight UTC). Defaults to now.
          schema: { type: string }
      responses:
        "200":
          description: Entity as of the requested instant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityAsOf"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/by-registry-number:
    get:
      operationId: findByRegistryNumber
      summary: ORG-03 FindByRegistryNumber
      description: |
        Returns a LIST, deliberately. §4.3 records that registry number plus
        jurisdiction is a dedup signal and not a universal identifier.
        Returning a single entity would present that hint as an identity
        lookup, which is the assumption that produces silent merges.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - name: registration_number
          in: query
          required: true
          schema: { type: string }
        - name: jurisdiction_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Candidate entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalEntity"
        "400": { $ref: "#/components/responses/BadRequest" }

  # ── ORG-03 §8 NP5: registry conflict quarantine ────────────────────────────

  /v1/registry-conflicts:
    get:
      operationId: listRegistryConflicts
      summary: List quarantined registry-identity conflicts
      description: |
        §8 NP5 requires a duplicate registry claim to be quarantined rather
        than silently merged. The incoming entity is NOT written; the attempt
        is recorded here with its full payload, because there is no row to
        point at.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Pass all to include resolved conflicts; the default is open only.
          schema: { type: string, enum: [open, all] }
      responses:
        "200":
          description: Conflicts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityRegistryConflict"

  /v1/registry-conflicts/{conflictID}/resolution:
    post:
      operationId: resolveRegistryConflict
      summary: Record a conclusion about a quarantined conflict
      description: |
        Records a finding. It does NOT merge anything: §1 is explicit that
        destructive merge is prohibited and that lineage must be preserved, so
        acting on a RESOLVED_DUPLICATE conclusion is a separate governed
        operation this service does not perform.

        A conflict can be resolved once. A second attempt is 409 rather than an
        overwrite of the first resolver's conclusion.

        §4.3 "no self-approval of merge": the resolution is filed (202) and
        recorded only when approved by a principal who is neither the resolver
        nor the principal whose claim was quarantined.
      tags: [Entities]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
        - name: conflictID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRegistryConflictRequest"
      responses:
        "204": { description: "Resolution recorded (legacy mode only)" }
        "202":
          description: |
            Filed for independent approval, not executed. A different verified
            principal releases it with POST /v1/approval-requests/{id}/approve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already resolved, or a resolution is already pending approval", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ── Verified maker-checker (ORG-02 §4.2, ORG-03 §4.3) ─────────────────────
  #
  # A maker-checker command answers 202 with one of these. The approver is the
  # verified caller of /approve — never a request-body field — and must not be
  # the maker. Each decision needs its own permission (e.g.
  # TENANT_INITIATE_TERMINATION_APPROVE), distinct from the one to propose.

  /v1/approval-requests:
    get:
      operationId: listApprovalRequests
      summary: List the caller's tenant's approval requests
      tags: [Approvals]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Pass all to include decided and expired requests; the default is live pending ones only.
          schema: { type: string, enum: [pending, all] }
      responses:
        "200":
          description: Approval requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalRequest"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/approval-requests/{approvalRequestID}:
    get:
      operationId: getApprovalRequest
      summary: Get one approval request, with the payload and fingerprint to review
      tags: [Approvals]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalRequestID"
      responses:
        "200":
          description: Approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/approval-requests/{approvalRequestID}/approve:
    post:
      operationId: approveRequest
      summary: Approve a proposal and execute the stored command
      description: |
        The caller becomes the approver of record. Refused if the caller is the
        maker (403), lacks the approve permission (403), presents a fingerprint
        other than the proposal's (409), or if the request is no longer pending
        or has expired (409). If the subject changed since the proposal the
        command is not applied, the request is marked STALE, and 409 is
        returned. The approval and the command commit in one transaction.
      tags: [Approvals]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalRequestID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequestBody"
      responses:
        "200":
          description: Approved and executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutcome"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "The caller is the maker (or the quarantined claimant), or lacks the approve permission", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Not pending, expired, fingerprint mismatch, or the subject changed since the proposal", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/approval-requests/{approvalRequestID}/reject:
    post:
      operationId: rejectRequest
      summary: Reject a proposal
      tags: [Approvals]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalRequestID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequestBody"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "The caller is the maker, or lacks the approve permission", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Not pending, or expired", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ── ORG-04 Corporate Group & Ownership ──────────────────────────────────────
  #
  # A relationship is proposed, then decided by a DIFFERENT principal. The
  # decider is the verified caller; no body field names it, and the database
  # refuses a decision by the proposer as well (or_no_self_approval).

  /v1/ownership-relationships:
    post:
      operationId: proposeOwnershipRelationship
      summary: ORG-04 ProposeOwnershipRelationship
      description: |
        Files a PROPOSED ownership or control relationship between two
        operational legal entities of the caller's tenant. It has no effect on
        the group structure until another principal approves it.
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeOwnershipRequest"
      responses:
        "201":
          description: Relationship proposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipRelationship"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The relationship is already proposed or active from that date, an entity is not operational, or the tenant may not transact", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/ownership-relationships/{relationshipID}:
    get:
      operationId: getOwnershipRelationship
      summary: Get one ownership relationship
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelationshipID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: The relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipRelationship"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ownership-relationships/{relationshipID}/approval:
    post:
      operationId: approveOwnershipRelationship
      summary: ORG-04 ApproveOwnershipRelationship (PROPOSED → ACTIVE)
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelationshipID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnershipDecisionRequest"
      responses:
        "200":
          description: Relationship approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipRelationship"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "The caller proposed this relationship, or lacks the approve permission", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, or an entity is no longer operational", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "The relationship is not PROPOSED", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/ownership-relationships/{relationshipID}/rejection:
    post:
      operationId: rejectOwnershipRelationship
      summary: Reject a proposed ownership relationship (PROPOSED → REJECTED)
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelationshipID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnershipDecisionRequest"
      responses:
        "200":
          description: Relationship rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipRelationship"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "The caller proposed this relationship, or lacks the approve permission", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "The relationship is not PROPOSED", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/ownership-relationships/{relationshipID}/supersession:
    post:
      operationId: supersedeOwnershipRelationship
      summary: ORG-04 SupersedeRelationship, new terms for an ACTIVE relationship
      description: |
        Files a PROPOSED replacement that names the relationship it replaces. The
        original keeps applying until a different principal approves the
        replacement (POST .../approval on the NEW relationship's id); on approval
        the original becomes SUPERSEDED with its valid_to cut to the
        replacement's valid_from, in one transaction. Parent, child and kind
        stay the same.
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelationshipID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupersedeOwnershipRequest"
      responses:
        "201":
          description: The PROPOSED replacement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipRelationship"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, a replacement is already pending, or the new terms contradict the active structure (cycle, overlap, owners above 100%)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "The relationship is not ACTIVE", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/ownership-relationships/{relationshipID}/end:
    post:
      operationId: endOwnershipRelationship
      summary: ORG-04 EndRelationship (ACTIVE → ENDED)
      description: |
        Records that an ACTIVE relationship stopped on end_date, which must fall
        after its valid_from and not after its current valid_to. Takes effect at
        once, so it needs its own HIGH-tier permission, and it records who ended
        it, why and on what evidence.
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelationshipID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndOwnershipRequest"
      responses:
        "200":
          description: Relationship ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipRelationship"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { description: "The relationship is not ACTIVE", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ── ORG-04 read surfaces ────────────────────────────────────────────────────
  #
  # as_of is BUSINESS time. The structure on a past date is rebuilt from each
  # relationship's own valid interval, so a relationship since superseded or
  # ended still appears on the dates it applied. Needs ENTITY_OWNERSHIP_VIEW;
  # beneficial_notes are returned only to a caller who also holds
  # ENTITY_OWNERSHIP_VIEW_SENSITIVE, and are otherwise omitted.

  /v1/ownership-graph:
    get:
      operationId: getOwnershipGraph
      summary: ORG-04 GetOwnershipGraph, the group structure at a business instant
      description: |
        Every relationship in force at as_of, ordered deterministically. With
        root_entity_id, only what that entity owns or controls, directly or
        through others.
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AsOf"
        - name: root_entity_id
          in: query
          required: false
          description: Limit the graph to this entity and everything below it.
          schema: { type: string }
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: The graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipGraph"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/{entityID}/group:
    get:
      operationId: getGroupAsOf
      summary: ORG-04 GetGroupAsOf, the corporate group an entity belonged to
      description: |
        Every entity connected to this one through relationships in force at
        as_of, and the entities at the top of the group. An entity with no
        relationships is a group of one, its own ultimate parent.
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipGroup"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/{entityID}/parents:
    get:
      operationId: listEntityParents
      summary: ORG-04 ListEntityParents, an entity's direct owners and controllers
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: The direct parents at as_of
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityParents"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/{entityID}/control-chain:
    get:
      operationId: explainControlChain
      summary: ORG-04 ExplainControlChain, who owns and controls an entity and why
      description: |
        Every path from an ultimate parent down to the entity through the
        relationships in force at as_of, with each link's evidence.

        effective_ownership_pct multiplies the equity along a path and sums the
        paths from one ultimate parent (capped at 100). A path that crosses a
        CONTROL link carries no equity, so its figure is null. A link controls
        when it is a CONTROL relationship or holds a majority of the votes
        (voting_pct, or ownership_pct where no voting figure is recorded); a
        path controls only when every link on it does.
      tags: [Ownership]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: The control chains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlChain"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Workspaces ─────────────────────────────────────────────────────────────
  #
  # These five routes have existed since migration 000005 and were absent from
  # this contract entirely — found by the route/contract parity test added
  # alongside the ORG work, not by a reader noticing.

  /v1/workspaces:
    post:
      operationId: createWorkspace
      summary: Create a workspace beneath a tenant
      description: |
        billing_classification is mandatory and validated. A non-billable
        workspace (INTERNAL, DEMO, SANDBOX, QA_AUTOMATION, PILOT_NON_BILLABLE)
        is legitimate; an unrecognized string is not. Environment name and
        workspace age are never enough to infer it.
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Tenant may not transact", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/tenants/{tenantID}/workspaces:
    get:
      operationId: listWorkspaces
      summary: List a tenant's workspaces
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workspaces/{workspaceID}:
    get:
      operationId: getWorkspace
      summary: Get a workspace
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWorkspace
      summary: Update a workspace
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Tenant may not transact", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/workspaces/{workspaceID}/status:
    post:
      operationId: transitionWorkspaceStatus
      summary: Archive or restore a workspace
      tags: [Workspaces]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionWorkspaceStatusRequest"
      responses:
        "204": { description: "Transition applied" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }


  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      tags: [Health]
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      description: Returns 200 only if the DB pool is reachable.
      tags: [Health]
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: DB unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

# ── Components ────────────────────────────────────────────────────────────────

  # ── ORG-07 / MDM-01 Parties ─────────────────────────────────────────────────

  /v1/parties:
    post:
      operationId: createParty
      summary: ORG-07 CreateParty - the MDM-01 create flow, idempotent on create_request_id
      description: |
        Never creates a duplicate. The request is matched first (MDM-05): a verified identifier in the right scheme
        and scope that names one active party returns that party (`MATCHED_EXISTING`, 200); an ambiguous or
        conflicting request opens a stewardship case and returns `REVIEW_REQUIRED` (202) without creating anything;
        otherwise a party is created (201). The same `create_request_id` with the same request returns the first
        answer (`replayed: true`); with a different request it is 409 IDEMPOTENCY_MISMATCH.
        A source-system reference (`source_system` and `source_ref`) is an identifier like any other, so a replayed
        ingest does not create a second party.
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartyRequest"
      responses:
        "201":
          description: Party created
          content: { application/json: { schema: { $ref: "#/components/schemas/CreatePartyResult" } } }
        "200":
          description: "An existing party matched, or a replay of an earlier create"
          content: { application/json: { schema: { $ref: "#/components/schemas/CreatePartyResult" } } }
        "202":
          description: "REVIEW_REQUIRED: a stewardship case was opened and no party was created"
          content: { application/json: { schema: { $ref: "#/components/schemas/CreatePartyResult" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "create_request_id already used for a different request", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      operationId: searchParties
      summary: ORG-07 SearchParties
      description: Reads the authoritative tables, not a search index, so it never lags a write.
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "Words of a name; every word must appear" }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [LEGAL_ENTITY, ORGANIZATION_NON_LEGAL, NATURAL_PERSON, PUBLIC_AUTHORITY] } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [CUSTOMER, SUPPLIER, COUNTERPARTY, SIGNATORY, BANK, REGULATOR, LANDLORD, EMPLOYER_LINK, OTHER_GOVERNED] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [CANDIDATE, ACTIVE, INACTIVE, MERGED] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page
          content: { application/json: { schema: { $ref: "#/components/schemas/PartySearchPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/parties/{partyID}:
    get:
      operationId: getPartyAsOf
      summary: ORG-07 GetParty and GetPartyAsOf - the master view with quality and version metadata
      description: |
        Answers both what was true at `as_of` (valid time) and what ZoikoSuite knew at `known_at` (knowledge time).
        Sensitive identifiers (tax and national ids) are masked unless `reveal=true`, which needs
        PARTY_IDENTIFIER_REVEAL; asking without holding it is 403, not a silently masked answer.
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/AsOf"
        - { name: known_at, in: query, required: false, schema: { type: string, format: date-time }, description: "What was known at this instant. Defaults to now." }
        - { name: reveal, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: The master view
          content: { application/json: { schema: { $ref: "#/components/schemas/PartyView" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/parties/{partyID}/facts:propose:
    post:
      operationId: amendPartyProfile
      summary: ORG-07 AmendPartyProfile - propose a sourced, effective-dated fact
      description: |
        Never overwrites a verified fact. An authority source verifies a fact that does not contradict one in force;
        anything else is held `PROPOSED`. A proposal that contradicts a verified fact is held beside it and opens a
        FACT_CONFLICT stewardship case (`master.conflict.opened`). Restating a verified fact is a no-op (200).
        `expected_master_version` is required: a stale write is 409 VERSION_CONFLICT.
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProposePartyFactRequest" } } }
      responses:
        "201":
          description: Fact recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/PartyFactOutcome" } } }
        "200":
          description: The fact restates a verified one
          content: { application/json: { schema: { $ref: "#/components/schemas/PartyFactOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_master_version, or the party is INACTIVE", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/parties/{partyID}/roles:
    post:
      operationId: addPartyRole
      summary: ORG-07 AddPartyRole - an explicit, evidenced, time-aware role
      description: A role never redefines identity. One live role of a type at a time.
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddPartyRoleRequest" } } }
      responses:
        "201":
          description: Role added
          content: { application/json: { schema: { $ref: "#/components/schemas/PartyRoleOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_master_version, or the party already has this role", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/parties/{partyID}/roles/{roleID}/removal:
    post:
      operationId: removePartyRole
      summary: ORG-07 RemovePartyRole - end a role; the row stays as history
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - { name: roleID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RemovePartyRoleRequest" } } }
      responses:
        "200":
          description: Role ended
          content: { application/json: { schema: { $ref: "#/components/schemas/PartyRoleOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_master_version, or the role was already removed", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/parties/{partyID}/identifiers:
    post:
      operationId: linkExternalIdentifier
      summary: ORG-07 LinkExternalIdentifier
      description: |
        An identifier names one active party. Linking one the party already holds is a no-op (200). Linking one
        another party holds does not link: it opens an IDENTIFIER_CONFLICT case (202). An authority source verifies
        the identifier on arrival. The identifier value is never in an event.
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LinkIdentifierRequest" } } }
      responses:
        "201":
          description: Identifier linked
          content: { application/json: { schema: { $ref: "#/components/schemas/PartyIdentifierOutcome" } } }
        "200":
          description: The party already holds this identifier
          content: { application/json: { schema: { $ref: "#/components/schemas/PartyIdentifierOutcome" } } }
        "202":
          description: "Another party holds this identifier; a stewardship case was opened and nothing was linked"
          content: { application/json: { schema: { $ref: "#/components/schemas/PartyIdentifierOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Stale expected_master_version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/identifiers:find:
    get:
      operationId: findByExternalIdentifier
      summary: ORG-07 FindByExternalIdentifier
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - { name: scheme, in: query, required: true, schema: { $ref: "#/components/schemas/IdentifierScheme" } }
        - { name: scope, in: query, required: false, schema: { type: string }, description: "An ISO 3166-1 alpha-2 code, or the source system for SOURCE_SYSTEM" }
        - { name: value, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The party the identifier names, if any
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/PartySummary" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/resolution-cases/{caseID}:
    get:
      operationId: getResolutionCase
      summary: A stewardship case
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - { name: caseID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The case
          content: { application/json: { schema: { $ref: "#/components/schemas/ResolutionCase" } } }
        "404": { $ref: "#/components/responses/NotFound" }


  # ── MDM-05 matching, merge, split and stewardship ───────────────────────────

  /v1/resolution:match:
    post:
      operationId: matchParties
      summary: MDM-05 match candidates - what a create would do for this request, and why
      description: |
        Tenant-scoped and explainable; another tenant's parties are never candidates. Writes nothing. The verdict is
        `SAFE_LINK` (a tier A match: a create would return that party), `REVIEW_REQUIRED` (a create would open a case)
        or `NO_MATCH`. Each candidate carries its tier (A scheme-proven, B strong composite, C probabilistic, D
        conflict), a score and the basis for it.
      tags: [Parties]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MatchPartiesRequest" } } }
      responses:
        "200":
          description: The verdict
          content: { application/json: { schema: { $ref: "#/components/schemas/MatchPartiesResult" } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/resolution/{caseID}:merge:
    post:
      operationId: mergeParties
      summary: ORG-07 MergeParties - the non-destructive merge of MDM-05 s18.2
      description: |
        CRITICAL (PARTY_MERGE) and never self-approved: the principal who opened the case cannot decide its merge.
        In one transaction, under a per-tenant lock and the parties' row locks: every party's expected version is
        revalidated (409 VERSION_CONFLICT); the survivor keeps its id; each merged party keeps its row with status
        `MERGED` and resolves to the survivor, so its id is never reused and still resolves; identifiers and roles
        move by ending the old row and writing a new one that names where it came from; the decision is appended to
        the lineage; and `party.merged` tells the domains to remediate (`remediation_scope`), prospectively, through
        the alias. Prior transaction snapshots are untouched.

        Prohibited (409 MERGE_PROHIBITED): a party that is not live; parties of different kinds; two parties that
        stand for different legal entities; a survivor that was itself merged away or a merged party that already
        absorbed others (merges do not chain). A case is decided once.
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MergePartiesRequest" } } }
      responses:
        "201":
          description: Merged
          content: { application/json: { schema: { $ref: "#/components/schemas/MergeOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Not permitted, or the caller opened this case (SOD_DENIED)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "VERSION_CONFLICT, MERGE_PROHIBITED, or the case is already decided", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/resolution/{caseID}:split:
    post:
      operationId: splitParty
      summary: ORG-07 SplitParty - correct a merge with new lineage
      description: |
        HIGH (PARTY_SPLIT). The party that was merged in error is distinct again: its status returns to what it was,
        identifiers that moved go back, a legal entity the survivor adopted returns, and a `party.split` event
        carries the remediation scope. The merge stays in the lineage; nothing is erased. The principal who merged
        cannot split. Roles the merge consolidated are not guessed back: the domains re-resolve them from the event.
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SplitPartiesRequest" } } }
      responses:
        "200":
          description: Split
          content: { application/json: { schema: { $ref: "#/components/schemas/SplitOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Not permitted, or the caller made the merge (SOD_DENIED)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale version, or the party was not merged by this case or is already split", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/resolution-cases:
    get:
      operationId: listResolutionCases
      summary: Stewardship cases, oldest first
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, RESOLVED, DISMISSED] } }
        - { name: case_type, in: query, required: false, schema: { type: string, enum: [DUPLICATE_REVIEW, IDENTIFIER_CONFLICT, FACT_CONFLICT] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page
          content: { application/json: { schema: { $ref: "#/components/schemas/ResolutionCasePage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/resolution-cases/{caseID}/decision:
    post:
      operationId: decideResolutionCase
      summary: Decide a stewardship case that is not a merge
      description: |
        HIGH (PARTY_RESOLUTION_DECIDE). The principal who opened the case cannot decide it. DUPLICATE_REVIEW:
        `CREATE_NEW` (creates the party the held request asked for, as the requester's), `LINK_EXISTING` (names one of
        the candidates) or `DISMISS`. FACT_CONFLICT: `ACCEPT_PROPOSED_FACT` (the verified fact is superseded, never
        edited, and the accepted fact is verified now, so what was known earlier stays answerable) or `KEEP_VERIFIED`.
        IDENTIFIER_CONFLICT: `KEEP_HOLDER` or `MOVE_TO_REQUESTER`. Merging is `:merge`.
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CaseDecisionRequest" } } }
      responses:
        "200":
          description: Decided
          content: { application/json: { schema: { $ref: "#/components/schemas/CaseDecisionOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Not permitted, or the caller opened this case (SOD_DENIED)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale case version, or the case is already decided", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/parties/{partyID}/merge-history:
    get:
      operationId: explainMergeHistory
      summary: ORG-07 ExplainMergeHistory - where a party id resolves and every merge and split that touched it
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartyID"
      responses:
        "200":
          description: The history, oldest first
          content: { application/json: { schema: { $ref: "#/components/schemas/MergeHistory" } } }
        "404": { $ref: "#/components/responses/NotFound" }


  # ── ORG-08 Addresses ────────────────────────────────────────────────────────
  /v1/addresses:
    post:
      operationId: createAddress
      summary: ORG-08 CreateAddress - a structured address; the source value is kept
      description: |
        The structured fields are stored exactly as entered, with a normalized comparison form beside them.
        create_request_id makes a retry return the first result; the same id with different content is a 409
        IDEMPOTENCY_MISMATCH. A REGISTERED address is a legal assertion and is recorded only with
        source_class AUTHORITY_REGISTRY or AUTHORITY_DOCUMENT (400 SOURCE_UNVERIFIED otherwise): a valid postal
        address is not a legally registered one.
      tags: [Addresses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAddressRequest" } } }
      responses:
        "201":
          description: Address recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/AddressOutcome" } } }
        "200":
          description: Replay of an earlier create_request_id
          content: { application/json: { schema: { $ref: "#/components/schemas/AddressOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "create_request_id was used for a different address", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: searchAddresses
      summary: ORG-08 SearchAddresses - over the normalized comparison form
      tags: [Addresses]
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Words of the address; street and st. compare equal." }
        - { name: country, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: postal_code, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Addresses, with next_cursor when more remain
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AddressSummary" } }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/addresses/{addressID}:
    get:
      operationId: getAddress
      summary: ORG-08 GetAddress - the version in force at as_of
      tags: [Addresses]
      security:
        - bearerAuth: []
      parameters:
        - { name: addressID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: as_of, in: query, schema: { type: string }, description: "RFC3339 or YYYY-MM-DD; absent means now." }
        - { name: history, in: query, schema: { type: boolean }, description: "Include every version." }
      responses:
        "200":
          description: The address; version is null when nothing was in force at as_of
          content: { application/json: { schema: { $ref: "#/components/schemas/AddressView" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/addresses/{addressID}/versions:
    post:
      operationId: amendAddress
      summary: ORG-08 AmendAddress - add a version; the prior one is superseded, never edited
      description: |
        expected_version is the current_version last read. The address type never changes. A new version starts
        UNVERIFIED. Identical content is a 200 no-op.
      tags: [Addresses]
      security:
        - bearerAuth: []
      parameters:
        - { name: addressID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AmendAddressRequest" } } }
      responses:
        "201":
          description: New version recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/AddressOutcome" } } }
        "200":
          description: Nothing changed
          content: { application/json: { schema: { $ref: "#/components/schemas/AddressOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/addresses/{addressID}:verify:
    post:
      operationId: verifyAddress
      summary: ORG-08 VerifyAddress - record what a verifier observed
      description: |
        An observation, not a certificate. Only a confident PASSED moves the version to VERIFIED; LOW_CONFIDENCE
        and FAILED are recorded and surfaced and the address is left as it was. Verification never makes an address
        a registered office. The local rules verifier is available; EXTERNAL_PROVIDER is BLOCKED (503).
      tags: [Addresses]
      security:
        - bearerAuth: []
      parameters:
        - { name: addressID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerifyAddressRequest" } } }
      responses:
        "200":
          description: The observation and the version it was made on
          content: { application/json: { schema: { $ref: "#/components/schemas/VerifyOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/parties/{partyID}/addresses:
    post:
      operationId: linkAddressToParty
      summary: ORG-08 LinkAddressToParty - use an address for a party in the address's own capacity
      description: |
        link_type must equal the address type. A new REGISTERED link ends the party's previous one on its start
        date; both stay queryable. A party has one live registered office.
      tags: [Addresses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LinkAddressRequest" } } }
      responses:
        "201":
          description: Linked
          content: { application/json: { schema: { $ref: "#/components/schemas/AddressLinkOutcome" } } }
        "200":
          description: Already linked
          content: { application/json: { schema: { $ref: "#/components/schemas/AddressLinkOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_master_version, or the party is not live", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listPartyAddresses
      summary: ORG-08 a party's addresses, current or historical
      tags: [Addresses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - { name: as_of, in: query, schema: { type: string } }
        - { name: include_ended, in: query, schema: { type: boolean }, description: "Include links that have ended." }
      responses:
        "200":
          description: Links with the address version in force at as_of
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PartyAddress" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── ORG-08 Establishments ───────────────────────────────────────────────────
  /v1/establishments:
    post:
      operationId: createEstablishment
      summary: ORG-08 CreateEstablishment - record a legal-presence fact, starting PROPOSED
      description: |
        An establishment has its own id and stands at an address; the address does not make it one, and nothing is
        inferred from it. evidence_ref and source_class are required. create_request_id makes a retry return the
        first result (409 IDEMPOTENCY_MISMATCH if it carries different content). The entity must be operational.
      tags: [Establishments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateEstablishmentRequest" } } }
      responses:
        "201":
          description: Establishment recorded as PROPOSED
          content: { application/json: { schema: { $ref: "#/components/schemas/EstablishmentOutcome" } } }
        "200":
          description: Replay of an earlier create_request_id
          content: { application/json: { schema: { $ref: "#/components/schemas/EstablishmentOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "create_request_id was used for a different establishment, or the entity is not operational", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/establishments/{establishmentID}:
    get:
      operationId: getEstablishment
      summary: ORG-08 GetEstablishment - with the address version in force at as_of
      tags: [Establishments]
      security:
        - bearerAuth: []
      parameters:
        - { name: establishmentID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: as_of, in: query, schema: { type: string } }
        - { name: history, in: query, schema: { type: boolean }, description: "Include every recorded status change." }
      responses:
        "200":
          description: The establishment
          content: { application/json: { schema: { $ref: "#/components/schemas/EstablishmentView" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/establishments/{establishmentID}:activate:
    post:
      operationId: activateEstablishment
      summary: ORG-08 ChangeEstablishmentStatus to ACTIVE (PROPOSED or INACTIVE to ACTIVE)
      description: |
        A material establishment (BRANCH, PERMANENT_ESTABLISHMENT) cannot be activated by the principal who proposed
        it: 403 SOD_DENIED. The permission does not lift that.
      tags: [Establishments]
      security:
        - bearerAuth: []
      parameters:
        - { name: establishmentID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeEstablishmentStatusRequest" } } }
      responses:
        "200":
          description: Activated; the transition is recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/EstablishmentOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, or the lifecycle does not allow this move", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/establishments/{establishmentID}:deactivate:
    post:
      operationId: deactivateEstablishment
      summary: ORG-08 ChangeEstablishmentStatus to INACTIVE (ACTIVE to INACTIVE); reason required
      tags: [Establishments]
      security:
        - bearerAuth: []
      parameters:
        - { name: establishmentID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeEstablishmentStatusRequest" } } }
      responses:
        "200":
          description: Deactivated; the transition is recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/EstablishmentOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, or the lifecycle does not allow this move", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/establishments/{establishmentID}:close:
    post:
      operationId: closeEstablishment
      summary: ORG-08 ChangeEstablishmentStatus to CLOSED (final); reason required, sets the end of the presence
      tags: [Establishments]
      security:
        - bearerAuth: []
      parameters:
        - { name: establishmentID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeEstablishmentStatusRequest" } } }
      responses:
        "200":
          description: Closed; the transition is recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/EstablishmentOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, or the lifecycle does not allow this move", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/entities/{entityID}/establishments:
    get:
      operationId: listEntityEstablishments
      summary: ORG-08 ListEntityEstablishments, or GetEstablishmentsAsOf when as_of is given
      description: |
        Without as_of, lists by current status. With as_of, returns the establishments that were ACTIVE on that
        date, reconstructed from the recorded transitions, each with its address version then.
      tags: [Establishments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EstablishmentStatus" } }
        - { name: as_of, in: query, schema: { type: string } }
      responses:
        "200":
          description: Establishments (a list, or the as-of reconstruction)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  as_of: { type: string, format: date-time }
                  items:
                    type: array
                    items:
                      oneOf:
                        - { $ref: "#/components/schemas/Establishment" }
                        - { $ref: "#/components/schemas/EstablishmentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entities/{entityID}/addresses:
    get:
      operationId: listEntityAddresses
      summary: ORG-08 an entity's addresses; the registered office is one, now or as it was
      description: |
        POST /v1/entities/{id}/registered-office still writes the ORG-03 profile version. When the office is sent
        as a structured address (lines or line1, locality or city, country) it is also recorded here as a REGISTERED
        address from authority evidence, ending the previous one on the new start date. An unstructured office, or a
        change that does not start after the current one, stays in the profile history only.
      tags: [Establishments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - { name: as_of, in: query, schema: { type: string } }
        - { name: include_ended, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Links with the address version in force at as_of
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PartyAddress" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── ORG-09 Registrations and licences ───────────────────────────────────────
  /v1/registrations:
    post:
      operationId: createRegistration
      summary: ORG-09 CreateRegistration - record a registration or licence, DRAFT (unverified)
      description: |
        Generic evidence that a holder (a legal entity or a party) is registered or licensed by an authority. It
        starts DRAFT and never reads as in force until verified. It decides no tax semantics: a TAX_REFERENCE is a
        reference, and TAX-01 stays authoritative for what it means. create_request_id makes a retry return the first
        result. A live registration with the same authority, type, jurisdiction and number is a 409
        DUPLICATE_CANDIDATE. supersedes_id names the registration this one replaces when it is verified.
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateRegistrationRequest" } } }
      responses:
        "201":
          description: Registration recorded as DRAFT
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationOutcome" } } }
        "200":
          description: Replay of an earlier create_request_id
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A live registration of this number exists, create_request_id was used for a different registration, or the holder or the registration to supersede is not in a state that allows it", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listRegistrations
      summary: ORG-09 list registrations by holder, type, status or jurisdiction
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: holder_legal_entity_id, in: query, schema: { type: string, format: uuid } }
        - { name: holder_party_id, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/RegistrationType" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RegistrationStatus" } }
        - { name: jurisdiction, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: reveal, in: query, schema: { type: boolean }, description: "Show sensitive numbers unmasked; needs the reveal permission (403 without it)." }
      responses:
        "200":
          description: Registrations, with next_cursor when more remain; sensitive numbers masked unless revealed
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Registration" } }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/registrations:find:
    get:
      operationId: findRegistrationsByNumber
      summary: ORG-09 FindByNumber - on the normalized number, so "gb 123-456" finds "GB123456"
      description: Sensitive numbers are masked unless revealed. The ORG-03 registry-number lookup for legal entities is unchanged.
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: number, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/RegistrationType" } }
        - { name: authority, in: query, schema: { type: string } }
        - { name: jurisdiction, in: query, schema: { type: string } }
        - { name: reveal, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Matching registrations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Registration" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/registrations/expiring:
    get:
      operationId: listExpiringRegistrations
      summary: ORG-09 ListExpiringRegistrations - expiring within within_days of as_of, soonest first
      description: |
        Includes any ACTIVE or SUSPENDED registration already past its expiry date that the sweep has not yet recorded:
        expiry is surfaced from the dates, whether or not the sweep has run.
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: within_days, in: query, schema: { type: integer, minimum: 0, maximum: 3650, default: 30 } }
        - { name: as_of, in: query, schema: { type: string } }
        - { name: reveal, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Registrations by expiry date
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Registration" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/registrations/{registrationID}:
    get:
      operationId: getRegistration
      summary: ORG-09 GetRegistration - with in_force and lapsed computed from the dates
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: registrationID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reveal, in: query, schema: { type: boolean }, description: "Unmask a sensitive number; refused (403) without the reveal permission." }
      responses:
        "200":
          description: The registration
          content: { application/json: { schema: { $ref: "#/components/schemas/Registration" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/registrations/{registrationID}/history:
    get:
      operationId: getRegistrationHistory
      summary: ORG-09 GetRegistrationHistory - every recorded step, in order
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: registrationID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The steps, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistrationTransition" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/registrations/{registrationID}:verify:
    post:
      operationId: verifyRegistration
      summary: ORG-09 VerifyRegistration - DRAFT or SUSPENDED to ACTIVE, on evidence
      description: |
        A material registration (PERMIT, LICENSE, REGULATED) is not verified by the principal who created it: 403
        SOD_DENIED, held by the table as well. A registration past its expiry date is renewed, not verified. Verifying a
        registration that supersedes another ends the other as SUPERSEDED.
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: registrationID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerifyRegistrationRequest" } } }
      responses:
        "200":
          description: Verified; the step is recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, or the lifecycle does not allow it", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/registrations/{registrationID}:renew:
    post:
      operationId: renewRegistration
      summary: ORG-09 RenewRegistration - a later expiry on evidence; an expired one becomes ACTIVE again
      description: |
        new_expiry_date must be later than the current one. A material registration is not renewed by the principal who
        last verified or renewed it: 403 SOD_DENIED.
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: registrationID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RenewRegistrationRequest" } } }
      responses:
        "200":
          description: Renewed; the step is recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, or the lifecycle does not allow it", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/registrations/{registrationID}:suspend:
    post:
      operationId: suspendRegistration
      summary: ORG-09 SuspendRegistration - ACTIVE to SUSPENDED; reason and evidence required
      description: A suspended registration is verified again to return to ACTIVE.
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: registrationID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationEndRequest" } } }
      responses:
        "200":
          description: Suspended; the step is recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, or the lifecycle does not allow it", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/registrations/{registrationID}:expire:
    post:
      operationId: expireRegistration
      summary: ORG-09 ExpireRegistration - ACTIVE or SUSPENDED to EXPIRED. The sweep does this itself when the date passes.
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: registrationID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationEndRequest" } } }
      responses:
        "200":
          description: Expired; the step is recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, or the lifecycle does not allow it", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /v1/registrations/{registrationID}:revoke:
    post:
      operationId: revokeRegistration
      summary: ORG-09 RevokeRegistration - to REVOKED (final) from DRAFT, ACTIVE, SUSPENDED or EXPIRED
      tags: [Registrations]
      security:
        - bearerAuth: []
      parameters:
        - { name: registrationID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationEndRequest" } } }
      responses:
        "200":
          description: Revoked; the step is recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationOutcome" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale expected_version, or the lifecycle does not allow it", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        IdentityContextEnvelope JWT issued by identity-context-svc.
        Verified by the Authorization Service on every material action.

  parameters:
    AsOf:
      name: as_of
      in: query
      required: false
      description: Business time, an RFC3339 timestamp or a YYYY-MM-DD date (read as midnight UTC). Defaults to now.
      schema: { type: string }
    CaseID:
      name: caseID
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartyID:
      name: partyID
      in: path
      required: true
      schema: { type: string, format: uuid }
    RelationshipID:
      name: relationshipID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalRequestID:
      name: approvalRequestID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantID:
      name: tenantID
      in: path
      required: true
      schema:
        type: string
    EntityID:
      name: entityID
      in: path
      required: true
      schema:
        type: string
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema:
        type: string
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: |
        Propagated through every request for evidence and distributed tracing.
        If absent, the service generates one from the request ID.

  schemas:
    # ── ORG-07 / MDM-01 Parties ───────────────────────────────────────────────
    # ── MDM-05 matching, merge, split and stewardship ─────────────────────────
    MatchPartiesRequest:
      type: object
      required: [party_kind]
      properties:
        party_kind: { type: string, enum: [LEGAL_ENTITY, ORGANIZATION_NON_LEGAL, NATURAL_PERSON, PUBLIC_AUTHORITY] }
        names: { type: array, items: { $ref: "#/components/schemas/PartyNameInput" } }
        country: { type: string }
        identifiers: { type: array, items: { $ref: "#/components/schemas/PartyIdentifierInput" } }
        legal_entity_id: { type: string, format: uuid }

    MatchPartiesResult:
      type: object
      required: [verdict, candidates]
      properties:
        verdict: { type: string, enum: [SAFE_LINK, REVIEW_REQUIRED, NO_MATCH] }
        case_type: { type: string }
        candidates: { type: array, items: { $ref: "#/components/schemas/PartyMatchCandidate" } }

    MergePartiesRequest:
      type: object
      required: [survivor_party_id, merged_party_ids, expected_master_versions, reason, evidence_ref]
      properties:
        survivor_party_id: { type: string, format: uuid }
        merged_party_ids: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }
        expected_master_versions:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: "The version of every party involved, survivor included, as the steward saw it."
        reason: { type: string }
        evidence_ref: { type: string }
        correlation_id: { type: string }

    SplitPartiesRequest:
      type: object
      required: [merged_party_id, expected_master_versions, reason, evidence_ref]
      properties:
        merged_party_id: { type: string, format: uuid }
        expected_master_versions:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: "The version of the merged party and of its survivor."
        reason: { type: string }
        evidence_ref: { type: string }
        correlation_id: { type: string }

    CaseDecisionRequest:
      type: object
      required: [decision, note, expected_case_version]
      properties:
        decision: { type: string, enum: [CREATE_NEW, LINK_EXISTING, DISMISS, ACCEPT_PROPOSED_FACT, KEEP_VERIFIED, KEEP_HOLDER, MOVE_TO_REQUESTER] }
        party_id: { type: string, format: uuid, description: "LINK_EXISTING only: one of the case's candidates." }
        note: { type: string }
        expected_case_version: { type: integer, format: int64 }
        correlation_id: { type: string }

    LineageEvent:
      type: object
      properties:
        lineage_id: { type: string, format: uuid }
        event_type: { type: string, enum: [MERGE, SPLIT] }
        case_id: { type: string, format: uuid }
        survivor_id: { type: string, format: uuid }
        party_id: { type: string, format: uuid }
        actor: { type: string }
        independent_of: { type: string, description: "Who this decision had to be independent of." }
        reason: { type: string }
        evidence_ref: { type: string }
        occurred_at: { type: string, format: date-time }
        details: { type: object, additionalProperties: true }

    MergeOutcome:
      type: object
      required: [survivor, aliases, lineage, case]
      properties:
        survivor: { $ref: "#/components/schemas/Party" }
        aliases: { type: array, items: { $ref: "#/components/schemas/Party" } }
        lineage: { type: array, items: { $ref: "#/components/schemas/LineageEvent" } }
        case: { $ref: "#/components/schemas/ResolutionCase" }

    SplitOutcome:
      type: object
      required: [restored, survivor, lineage]
      properties:
        restored: { $ref: "#/components/schemas/Party" }
        survivor: { $ref: "#/components/schemas/Party" }
        lineage: { $ref: "#/components/schemas/LineageEvent" }

    CaseDecisionOutcome:
      type: object
      required: [case]
      properties:
        case: { $ref: "#/components/schemas/ResolutionCase" }
        party: { $ref: "#/components/schemas/Party" }

    ResolutionCasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ResolutionCase" } }
        next_cursor: { type: string }

    MergeHistory:
      type: object
      required: [party_id, status, resolves_to, alias_ids, lineage]
      properties:
        party_id: { type: string, format: uuid }
        status: { type: string }
        resolves_to: { type: string, format: uuid, description: "The survivor this id resolves to; itself when it was not merged away." }
        alias_ids: { type: array, items: { type: string, format: uuid } }
        lineage: { type: array, items: { $ref: "#/components/schemas/LineageEvent" } }

    AddressType:
      type: string
      description: "REGISTERED, PRINCIPAL_PLACE, OPERATING, BILLING, REMITTANCE, TAX, EMPLOYMENT_ESTABLISHMENT or a custom X_UPPER_CASE type."
      pattern: '^(REGISTERED|PRINCIPAL_PLACE|OPERATING|BILLING|REMITTANCE|TAX|EMPLOYMENT_ESTABLISHMENT|X_[A-Z0-9_]{1,30})$'

    AddressFields:
      type: object
      required: [lines, locality, country, source_class, evidence_ref]
      properties:
        lines: { type: array, minItems: 1, maxItems: 4, items: { type: string, minLength: 1, maxLength: 200 } }
        locality: { type: string }
        subdivision: { type: string }
        postal_code: { type: string, maxLength: 20 }
        country: { type: string, minLength: 2, maxLength: 2, description: "ISO 3166-1 alpha-2. A well-shaped but unassigned code is recorded and fails verification." }
        formatted: { type: string, description: "Free-text rendering as supplied, kept apart from the structured fields." }
        valid_from: { type: string, format: date }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        correlation_id: { type: string }

    CreateAddressRequest:
      allOf:
        - $ref: "#/components/schemas/AddressFields"
        - type: object
          required: [address_type]
          properties:
            create_request_id: { type: string, maxLength: 128 }
            address_type: { $ref: "#/components/schemas/AddressType" }

    AmendAddressRequest:
      allOf:
        - $ref: "#/components/schemas/AddressFields"
        - type: object
          required: [expected_version, reason]
          properties:
            expected_version: { type: integer, minimum: 1 }
            reason: { type: string }

    VerifyAddressRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        verifier: { type: string, enum: [LOCAL_RULES, EXTERNAL_PROVIDER], description: "EXTERNAL_PROVIDER is BLOCKED and answers 503." }
        correlation_id: { type: string }

    LinkAddressRequest:
      type: object
      required: [address_id, link_type, evidence_ref, expected_master_version]
      properties:
        address_id: { type: string, format: uuid }
        link_type: { $ref: "#/components/schemas/AddressType" }
        valid_from: { type: string, format: date }
        evidence_ref: { type: string }
        expected_master_version: { type: integer, minimum: 1 }
        correlation_id: { type: string }

    Address:
      type: object
      required: [address_id, tenant_id, address_type, current_version, created_by, created_at]
      properties:
        address_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        address_type: { $ref: "#/components/schemas/AddressType" }
        current_version: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    AddressVersion:
      type: object
      required: [version_no, lines, locality, country, normalized, valid_from, verification_state, source_class, evidence_ref, recorded_by, recorded_at]
      properties:
        version_no: { type: integer }
        lines: { type: array, items: { type: string } }
        locality: { type: string }
        subdivision: { type: string }
        postal_code: { type: string }
        country: { type: string }
        formatted: { type: string }
        normalized: { type: string, description: "Comparison form; never replaces the source fields." }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        verification_state: { type: string, enum: [UNVERIFIED, VERIFIED, SUPERSEDED] }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        recorded_by: { type: string }
        recorded_at: { type: string, format: date-time }
        superseded_at: { type: string, format: date-time }
        reason: { type: string }

    AddressObservation:
      type: object
      required: [version_no, verifier, result, confidence, findings, normalized_seen, observed_at]
      properties:
        verification_id: { type: string, format: uuid }
        version_no: { type: integer }
        verifier: { type: string }
        result: { type: string, enum: [PASSED, LOW_CONFIDENCE, FAILED] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        findings: { type: array, items: { type: string } }
        normalized_seen: { type: string }
        observed_by: { type: string }
        observed_at: { type: string, format: date-time }

    AddressOutcome:
      type: object
      required: [address, version]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        version: { $ref: "#/components/schemas/AddressVersion" }

    VerifyOutcome:
      type: object
      required: [address, version, observation]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        version: { $ref: "#/components/schemas/AddressVersion" }
        observation: { $ref: "#/components/schemas/AddressObservation" }

    AddressView:
      type: object
      required: [address, version, verifications]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        version: { nullable: true, allOf: [{ $ref: "#/components/schemas/AddressVersion" }] }
        verifications: { type: array, items: { $ref: "#/components/schemas/AddressObservation" } }
        history: { type: array, items: { $ref: "#/components/schemas/AddressVersion" } }

    AddressSummary:
      type: object
      required: [address_id, address_type, version_no, locality, country, verification_state, normalized]
      properties:
        address_id: { type: string, format: uuid }
        address_type: { $ref: "#/components/schemas/AddressType" }
        version_no: { type: integer }
        locality: { type: string }
        postal_code: { type: string }
        country: { type: string }
        verification_state: { type: string }
        normalized: { type: string }

    AddressLink:
      type: object
      required: [link_id, address_id, link_type, valid_from, evidence_ref, linked_by, linked_at]
      properties:
        link_id: { type: string, format: uuid }
        address_id: { type: string, format: uuid }
        party_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid, description: "Set instead of party_id when the link is an entity's." }
        link_type: { $ref: "#/components/schemas/AddressType" }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        evidence_ref: { type: string }
        linked_by: { type: string }
        linked_at: { type: string, format: date-time }

    AddressLinkOutcome:
      type: object
      required: [link, party]
      properties:
        link: { $ref: "#/components/schemas/AddressLink" }
        party: { $ref: "#/components/schemas/Party" }
        ended: { $ref: "#/components/schemas/AddressLink" }

    PartyAddress:
      type: object
      required: [link, version]
      properties:
        link: { $ref: "#/components/schemas/AddressLink" }
        version: { nullable: true, allOf: [{ $ref: "#/components/schemas/AddressVersion" }] }

    EstablishmentType:
      type: string
      enum: [BRANCH, PERMANENT_ESTABLISHMENT, PLACE_OF_BUSINESS, REPRESENTATIVE_OFFICE, OPERATING_SITE, EMPLOYMENT_SITE]
      description: "BRANCH and PERMANENT_ESTABLISHMENT are material: activated by a principal other than the proposer."

    EstablishmentStatus:
      type: string
      enum: [PROPOSED, ACTIVE, INACTIVE, CLOSED]

    CreateEstablishmentRequest:
      type: object
      required: [legal_entity_id, establishment_type, name, address_id, source_class, evidence_ref]
      properties:
        create_request_id: { type: string, maxLength: 128 }
        legal_entity_id: { type: string, format: uuid }
        establishment_type: { $ref: "#/components/schemas/EstablishmentType" }
        name: { type: string, minLength: 1, maxLength: 200 }
        address_id: { type: string, format: uuid }
        valid_from: { type: string, format: date }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        correlation_id: { type: string }

    ChangeEstablishmentStatusRequest:
      type: object
      required: [expected_version, evidence_ref]
      properties:
        expected_version: { type: integer, minimum: 1 }
        effective_date: { type: string, format: date, description: "Defaults to today. Not before the establishment began or its last change." }
        reason: { type: string, description: "Required to deactivate or close." }
        evidence_ref: { type: string }
        correlation_id: { type: string }

    Establishment:
      type: object
      required: [establishment_id, tenant_id, legal_entity_id, establishment_type, name, address_id, status, material, valid_from, source_class, evidence_ref, record_version, created_by, created_at]
      properties:
        establishment_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        establishment_type: { $ref: "#/components/schemas/EstablishmentType" }
        name: { type: string }
        address_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/EstablishmentStatus" }
        material: { type: boolean }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        record_version: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        activated_by: { type: string }

    EstablishmentTransition:
      type: object
      required: [seq, to_status, effective_date, command, evidence_ref, actor, version_after, occurred_at]
      properties:
        seq: { type: integer }
        from_status: { $ref: "#/components/schemas/EstablishmentStatus" }
        to_status: { $ref: "#/components/schemas/EstablishmentStatus" }
        effective_date: { type: string, format: date }
        command: { type: string }
        reason: { type: string }
        evidence_ref: { type: string }
        actor: { type: string }
        version_before: { type: integer }
        version_after: { type: integer }
        occurred_at: { type: string, format: date-time }

    EstablishmentOutcome:
      type: object
      required: [establishment, transition]
      properties:
        establishment: { $ref: "#/components/schemas/Establishment" }
        transition: { $ref: "#/components/schemas/EstablishmentTransition" }

    EstablishmentView:
      type: object
      required: [establishment, address]
      properties:
        establishment: { $ref: "#/components/schemas/Establishment" }
        address: { nullable: true, allOf: [{ $ref: "#/components/schemas/AddressVersion" }] }
        history: { type: array, items: { $ref: "#/components/schemas/EstablishmentTransition" } }

    RegistrationType:
      type: string
      enum: [COMPANY_REGISTRATION, TAX_REFERENCE, EMPLOYER_PAYROLL, PERMIT, LICENSE, REGULATED, OTHER_GOVERNED]
      description: |
        PERMIT, LICENSE and REGULATED are material: verified and renewed by independent principals. TAX_REFERENCE and
        EMPLOYER_PAYROLL numbers are sensitive and masked unless revealed. TAX_REFERENCE is evidence only; TAX-01 owns tax semantics.

    RegistrationStatus:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, REVOKED, SUPERSEDED]

    CreateRegistrationRequest:
      type: object
      required: [registration_type, issuing_authority, jurisdiction, number, effective_from, source_class, evidence_ref]
      description: Name exactly one holder, holder_legal_entity_id or holder_party_id.
      properties:
        create_request_id: { type: string, maxLength: 128 }
        registration_type: { $ref: "#/components/schemas/RegistrationType" }
        issuing_authority: { type: string, minLength: 1, maxLength: 200 }
        jurisdiction: { type: string, minLength: 1, maxLength: 16 }
        number: { type: string, minLength: 1, maxLength: 100 }
        holder_legal_entity_id: { type: string, format: uuid }
        holder_party_id: { type: string, format: uuid }
        issue_date: { type: string, format: date }
        effective_from: { type: string, format: date }
        expiry_date: { type: string, format: date }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        evidence_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 of the source document." }
        supersedes_id: { type: string, format: uuid }
        correlation_id: { type: string }

    VerifyRegistrationRequest:
      type: object
      required: [expected_version, evidence_ref]
      properties:
        expected_version: { type: integer, minimum: 1 }
        evidence_ref: { type: string }
        evidence_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        reason: { type: string }
        correlation_id: { type: string }

    RenewRegistrationRequest:
      type: object
      required: [expected_version, new_expiry_date, evidence_ref]
      properties:
        expected_version: { type: integer, minimum: 1 }
        new_expiry_date: { type: string, format: date }
        issue_date: { type: string, format: date }
        effective_from: { type: string, format: date }
        evidence_ref: { type: string }
        evidence_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        correlation_id: { type: string }

    RegistrationEndRequest:
      type: object
      required: [expected_version, reason, evidence_ref]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string }
        evidence_ref: { type: string }
        effective_date: { type: string, format: date, description: "Defaults to today." }
        correlation_id: { type: string }

    Registration:
      type: object
      required: [registration_id, tenant_id, registration_type, issuing_authority, jurisdiction, number, status, material, effective_from, source_class, evidence_ref, record_version, created_by, created_at, in_force]
      properties:
        registration_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        registration_type: { $ref: "#/components/schemas/RegistrationType" }
        issuing_authority: { type: string }
        jurisdiction: { type: string }
        number: { type: string, description: "As recorded; masked to its last four characters for a sensitive type unless revealed." }
        number_masked: { type: boolean }
        holder_legal_entity_id: { type: string, format: uuid }
        holder_party_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RegistrationStatus" }
        material: { type: boolean }
        issue_date: { type: string, format: date }
        effective_from: { type: string, format: date }
        expiry_date: { type: string, format: date }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        evidence_hash: { type: string }
        supersedes_id: { type: string, format: uuid }
        superseded_by_id: { type: string, format: uuid }
        record_version: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        verified_by: { type: string }
        verified_at: { type: string, format: date-time }
        in_force: { type: boolean, description: "What a consumer may rely on: ACTIVE, begun and not past its expiry date. A DRAFT never is." }
        lapsed: { type: boolean, description: "The dates say it has expired but the sweep has not yet recorded it." }

    RegistrationTransition:
      type: object
      required: [seq, command, to_status, effective_date, evidence_ref, actor, version_after, occurred_at]
      properties:
        seq: { type: integer }
        command: { type: string }
        from_status: { $ref: "#/components/schemas/RegistrationStatus" }
        to_status: { $ref: "#/components/schemas/RegistrationStatus" }
        effective_date: { type: string, format: date }
        expiry_after: { type: string, format: date }
        reason: { type: string }
        evidence_ref: { type: string }
        evidence_hash: { type: string }
        actor: { type: string }
        version_before: { type: integer }
        version_after: { type: integer }
        occurred_at: { type: string, format: date-time }

    RegistrationOutcome:
      type: object
      required: [registration, transition]
      properties:
        registration: { $ref: "#/components/schemas/Registration" }
        transition: { $ref: "#/components/schemas/RegistrationTransition" }
        superseded: { $ref: "#/components/schemas/Registration" }

    IdentifierScheme:
      type: string
      enum: [COMPANY_REGISTRATION, TAX_ID, VAT, LEI, DUNS, NATIONAL_ID, SOURCE_SYSTEM]
      description: "TAX_ID and NATIONAL_ID are sensitive and masked unless revealed."

    PartySourceClass:
      type: string
      enum: [AUTHORITY_REGISTRY, AUTHORITY_DOCUMENT, TENANT_ASSERTED, SYSTEM_IMPORT, EXTERNAL_PROVIDER]
      description: "An authority class verifies a fact or identifier on arrival; the others are held PROPOSED."

    PartyNameInput:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [LEGAL_NAME, TRADING_NAME, FORMER_NAME, LOCAL_SCRIPT_NAME, DISPLAY_NAME] }
        value: { type: string }
        language: { type: string, description: "Required for LOCAL_SCRIPT_NAME." }
        script: { type: string, description: "Required for LOCAL_SCRIPT_NAME." }

    PartyIdentifierInput:
      type: object
      required: [scheme, value]
      properties:
        scheme: { $ref: "#/components/schemas/IdentifierScheme" }
        scope: { type: string, description: "An ISO 3166-1 alpha-2 code, or the source system for SOURCE_SYSTEM." }
        value: { type: string }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }

    CreatePartyRequest:
      type: object
      required: [create_request_id, party_kind, names, source_class, evidence_ref, valid_from]
      properties:
        create_request_id: { type: string, maxLength: 128 }
        party_kind: { type: string, enum: [LEGAL_ENTITY, ORGANIZATION_NON_LEGAL, NATURAL_PERSON, PUBLIC_AUTHORITY] }
        names: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/PartyNameInput" } }
        country: { type: string, description: "ISO 3166-1 alpha-2. Required for a PUBLIC_AUTHORITY." }
        identifiers: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/PartyIdentifierInput" } }
        source_system: { type: string }
        source_ref: { type: string }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        valid_from: { type: string, format: date }
        legal_entity_id: { type: string, format: uuid, description: "LEGAL_ENTITY only: the ORG-03 legal entity this party is. A legal entity is one party." }
        correlation_id: { type: string }

    Party:
      type: object
      required: [party_id, tenant_id, party_kind, status, master_version]
      properties:
        party_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        party_kind: { type: string }
        status: { type: string, enum: [CANDIDATE, ACTIVE, INACTIVE, MERGED] }
        legal_entity_id: { type: string, format: uuid }
        merged_into: { type: string, format: uuid, description: "Set when status is MERGED: the survivor this id resolves to." }
        master_version: { type: integer, format: int64 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    PartyMatchCandidate:
      type: object
      properties:
        party_id: { type: string, format: uuid }
        tier: { type: string, enum: [A, B, C, D], description: "MDM-05 s18.1: A scheme-proven exact, B strong composite, C probabilistic, D conflict." }
        score: { type: number }
        basis: { type: array, items: { type: string } }

    ResolutionCase:
      type: object
      required: [case_id, case_type, status, candidates]
      properties:
        case_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        case_type: { type: string, enum: [DUPLICATE_REVIEW, IDENTIFIER_CONFLICT, FACT_CONFLICT] }
        status: { type: string, enum: [OPEN, RESOLVED, DISMISSED] }
        subject_party_id: { type: string, format: uuid }
        candidates: { type: array, items: { $ref: "#/components/schemas/PartyMatchCandidate" } }
        create_request_id: { type: string }
        reason: { type: string }
        opened_by: { type: string }
        opened_at: { type: string, format: date-time }
        record_version: { type: integer, format: int64, description: "Send as expected_case_version when deciding." }
        proposed_fact_id: { type: string, format: uuid }
        decision: { type: string }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time }
        decision_note: { type: string }
        resolved_party_id: { type: string, format: uuid }

    CreatePartyResult:
      type: object
      required: [outcome, replayed]
      properties:
        outcome: { type: string, enum: [CREATED, MATCHED_EXISTING, REVIEW_REQUIRED] }
        party: { $ref: "#/components/schemas/Party" }
        match: { $ref: "#/components/schemas/PartyMatchCandidate" }
        case: { $ref: "#/components/schemas/ResolutionCase" }
        candidates: { type: array, items: { $ref: "#/components/schemas/PartyMatchCandidate" } }
        replayed: { type: boolean }

    PartyFact:
      type: object
      properties:
        fact_id: { type: string, format: uuid }
        fact_type: { type: string, enum: [LEGAL_NAME, TRADING_NAME, FORMER_NAME, LOCAL_SCRIPT_NAME, DISPLAY_NAME, COUNTRY, AUTHORITY_TYPE] }
        value: { type: string }
        language: { type: string }
        script: { type: string }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        recorded_at: { type: string, format: date-time }
        status: { type: string, enum: [PROPOSED, VERIFIED, SUPERSEDED, REJECTED, PROMOTED] }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        proposed_by: { type: string }

    PartyIdentifier:
      type: object
      properties:
        identifier_id: { type: string, format: uuid }
        party_id: { type: string, format: uuid }
        scheme: { $ref: "#/components/schemas/IdentifierScheme" }
        scope: { type: string }
        value: { type: string }
        masked: { type: boolean }
        verification_status: { type: string, enum: [UNVERIFIED, VERIFIED, FAILED] }
        evidence_ref: { type: string }
        linked_at: { type: string, format: date-time }

    PartyRole:
      type: object
      properties:
        role_id: { type: string, format: uuid }
        role_type: { type: string, enum: [CUSTOMER, SUPPLIER, COUNTERPARTY, SIGNATORY, BANK, REGULATOR, LANDLORD, EMPLOYER_LINK, OTHER_GOVERNED] }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        evidence_ref: { type: string }
        added_by: { type: string }
        added_at: { type: string, format: date-time }
        removed_by: { type: string }
        remove_reason: { type: string }

    PartyView:
      type: object
      required: [party, as_of, known_at, names, facts, pending_facts, identifiers, roles, quality_flags]
      properties:
        party: { $ref: "#/components/schemas/Party" }
        as_of: { type: string, format: date }
        known_at: { type: string, format: date-time }
        names: { type: array, items: { $ref: "#/components/schemas/PartyFact" } }
        facts: { type: array, items: { $ref: "#/components/schemas/PartyFact" } }
        pending_facts: { type: array, items: { $ref: "#/components/schemas/PartyFact" }, description: "PROPOSED facts, not yet part of the master view." }
        identifiers: { type: array, items: { $ref: "#/components/schemas/PartyIdentifier" } }
        roles: { type: array, items: { $ref: "#/components/schemas/PartyRole" } }
        quality_flags:
          type: array
          items: { type: string, enum: [NO_VERIFIED_LEGAL_NAME, NO_VERIFIED_IDENTIFIER, UNVERIFIED_FACTS_PENDING, OPEN_RESOLUTION_CASE] }
        alias_ids: { type: array, items: { type: string, format: uuid }, description: "Parties merged into this one." }

    PartySummary:
      type: object
      properties:
        party_id: { type: string, format: uuid }
        party_kind: { type: string }
        status: { type: string }
        legal_name: { type: string }

    PartySearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PartySummary" } }
        next_cursor: { type: string, description: "Empty on the last page." }

    ProposePartyFactRequest:
      type: object
      required: [fact_type, value, valid_from, source_class, evidence_ref, expected_master_version]
      properties:
        fact_type: { type: string, enum: [LEGAL_NAME, TRADING_NAME, FORMER_NAME, LOCAL_SCRIPT_NAME, DISPLAY_NAME, COUNTRY, AUTHORITY_TYPE] }
        value: { type: string }
        language: { type: string }
        script: { type: string }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        expected_master_version: { type: integer, format: int64 }
        correlation_id: { type: string }

    PartyFactOutcome:
      type: object
      required: [fact, party]
      properties:
        fact: { $ref: "#/components/schemas/PartyFact" }
        party: { $ref: "#/components/schemas/Party" }
        case: { $ref: "#/components/schemas/ResolutionCase" }

    AddPartyRoleRequest:
      type: object
      required: [role_type, valid_from, evidence_ref, expected_master_version]
      properties:
        role_type: { type: string, enum: [CUSTOMER, SUPPLIER, COUNTERPARTY, SIGNATORY, BANK, REGULATOR, LANDLORD, EMPLOYER_LINK, OTHER_GOVERNED] }
        valid_from: { type: string, format: date }
        evidence_ref: { type: string }
        expected_master_version: { type: integer, format: int64 }
        correlation_id: { type: string }

    RemovePartyRoleRequest:
      type: object
      required: [end_date, reason, expected_master_version]
      properties:
        end_date: { type: string, format: date }
        reason: { type: string }
        expected_master_version: { type: integer, format: int64 }
        correlation_id: { type: string }

    PartyRoleOutcome:
      type: object
      required: [role, party]
      properties:
        role: { $ref: "#/components/schemas/PartyRole" }
        party: { $ref: "#/components/schemas/Party" }

    LinkIdentifierRequest:
      type: object
      required: [scheme, value, source_class, evidence_ref, expected_master_version]
      properties:
        scheme: { $ref: "#/components/schemas/IdentifierScheme" }
        scope: { type: string }
        value: { type: string }
        source_class: { $ref: "#/components/schemas/PartySourceClass" }
        evidence_ref: { type: string }
        expected_master_version: { type: integer, format: int64 }
        correlation_id: { type: string }

    PartyIdentifierOutcome:
      type: object
      required: [party]
      properties:
        identifier: { $ref: "#/components/schemas/PartyIdentifier" }
        party: { $ref: "#/components/schemas/Party" }
        case: { $ref: "#/components/schemas/ResolutionCase" }


    # ── Tenant ────────────────────────────────────────────────────────────────

    Tenant:
      type: object
      properties:
        primary_jurisdiction_id: { type: string, format: uuid, nullable: true, description: "Provisioning lineage (§4.2 source input)." }
        subscription_id:         { type: string, nullable: true, description: "The subscription whose plan entitlement was checked at provisioning." }
        tenant_id:           { type: string }
        tenant_code:         { type: string }
        legal_name:          { type: string }
        trading_name:        { type: string, nullable: true }
        status:              { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        default_currency_code: { type: string }
        primary_timezone:    { type: string }
        primary_locale:      { type: string }
        default_data_residency_policy_id: { type: string }
        lifecycle_state:     { type: string, enum: [ONBOARDING, FAILED_PROVISIONING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        created_at:          { type: string, format: date-time }
        created_by:          { type: string }
        record_version:      { type: integer, format: int64 }
        external_customer_key:  { type: string, nullable: true }
        onboarding_request_ref: { type: string, nullable: true, description: "ORG-02 onboarding-request evidence." }
        provisioning_failure_reason: { type: string, nullable: true }
        provisioning_failed_at:      { type: string, format: date-time, nullable: true }
        idempotent_replay:
          type: boolean
          description: Present and true only on a provisionTenant 200 replay.
        creation_approval_request_id:
          type: string
          format: uuid
          description: Set on the provisionTenant response only. The pending creation approval a principal other than the creator must approve before the tenant can be activated.

    ProvisionTenantRequest:
      type: object
      description: |
        ORG-02 §4.2 required source inputs. primary_jurisdiction_id,
        residency_region_id, onboarding_request_ref and subscription_id are
        required outside local development (LEGACY_PROVISIONING_INPUTS relaxes
        them there only). Server-resolved: jurisdiction validity and the
        restricted list (JURISDICTION_RESTRICTED), region availability
        (REFERENCE_RETIRED), plan entitlement (NOT_ENTITLED).
      required: [tenant_code, legal_name, default_currency_code, primary_timezone, primary_locale, external_customer_key,
                 primary_jurisdiction_id, residency_region_id, onboarding_request_ref, subscription_id]
      properties:
        primary_jurisdiction_id: { type: string, format: uuid }
        residency_region_id:
          type: string
          format: uuid
          description: The residency preference; becomes the default residency policy's region — the home region.
        subscription_id: { type: string, description: "commercial-account-svc subscription checked for plan entitlement." }
        external_customer_key:
          type: string
          description: The approved onboarding correlation / external customer key. The idempotency key for tenant creation.
        onboarding_request_ref:
          type: string
          description: Reference to the onboarding request the tenant is created from (evidence).
        tenant_code:         { type: string }
        legal_name:          { type: string }
        trading_name:        { type: string }
        default_currency_code: { type: string }
        primary_timezone:    { type: string }
        primary_locale:      { type: string }
        default_data_residency_policy_id:
          type: string
          deprecated: true
          description: Ignored; the service always generates the default policy.

    TransitionTenantLifecycleRequest:
      type: object
      required: [target_state, correlation_id]
      properties:
        target_state:
          type: string
          enum: [ACTIVE, SUSPENDED, OFFBOARDING]
        correlation_id: { type: string }

    # ── LegalEntity ───────────────────────────────────────────────────────────

    LegalEntity:
      type: object
      properties:
        legal_entity_id:        { type: string }
        tenant_id:              { type: string }
        entity_code:            { type: string }
        legal_name:             { type: string }
        trading_name:           { type: string, nullable: true }
        registration_number:    { type: string, nullable: true }
        tax_identity_bundle_id: { type: string, nullable: true }
        entity_type:            { type: string, enum: [SUBSIDIARY, BRANCH, HOLDING, OPERATIONAL] }
        incorporation_date:     { type: string, format: date, nullable: true }
        default_currency_code:  { type: string }
        fiscal_calendar_id:     { type: string }
        parent_legal_entity_id: { type: string, nullable: true }
        entity_status:
          type: string
          enum: [DRAFT, VERIFIED, ACTIVE, DORMANT, SUSPENDED, DISSOLVED]
          description: |
            ORG-03 §4.3 Draft → Verified → Active. New entities are DRAFT;
            DRAFT and VERIFIED entities cannot be transacted against.
        primary_jurisdiction_id: { type: string }
        data_residency_policy_id: { type: string }
        record_version:         { type: integer, format: int64 }
        created_at:             { type: string, format: date-time }
        created_by_principal_id: { type: string }
        verified_by_principal_id:  { type: string, nullable: true }
        verified_at:               { type: string, format: date-time, nullable: true }
        verification_evidence_ref: { type: string, nullable: true }
        merged_into_legal_entity_id:
          type: string
          nullable: true
          description: Set on a DORMANT duplicate merged (non-destructively) into another entity.
        merged_at:                 { type: string, format: date-time, nullable: true }

    CreateEntityRequest:
      type: object
      description: |
        ORG-03 §4.3 required source inputs. registered_office and
        source_evidence_ref are required outside local development
        (LEGACY_PROVISIONING_INPUTS relaxes them there only). The legal form is
        optional, but when sent is held to the ISO 20275 control (four-character
        ELF code, with its source and the local legal-form text). All of these
        are recorded on profile version 1.
      required: [tenant_id, entity_code, legal_name, entity_type, default_currency_code, fiscal_calendar_id, primary_jurisdiction_id, data_residency_policy_id, correlation_id,
                 registered_office, source_evidence_ref]
      properties:
        tenant_id:              { type: string }
        entity_code:            { type: string }
        legal_name:             { type: string }
        trading_name:           { type: string }
        entity_type:            { type: string, enum: [SUBSIDIARY, BRANCH, HOLDING, OPERATIONAL] }
        default_currency_code:  { type: string }
        fiscal_calendar_id:     { type: string }
        primary_jurisdiction_id:
          type: string
          description: Validated synchronously against Jurisdiction Rules Service (fail-closed).
        data_residency_policy_id: { type: string }
        correlation_id:         { type: string }
        registration_number:    { type: string }
        lei:
          type: string
          description: ISO 17442 LEI (20 chars, MOD 97-10). An external identifier, never the internal key.
        lei_source:      { type: string, description: "Where the LEI came from, e.g. GLEIF. Required with an LEI." }
        lei_status:
          type: string
          enum: [ISSUED, LAPSED, PENDING_TRANSFER, PENDING_ARCHIVAL, MERGED, RETIRED, ANNULLED, DUPLICATE, TRANSFERRED, CANCELLED]
        lei_verified_at: { type: string, format: date-time }
        legal_form_code:       { type: string, pattern: "^[A-Za-z0-9]{4}$", description: "ISO 20275 ELF code; normalised to upper case." }
        legal_form_source:     { type: string, description: "e.g. GLEIF-ELF-1.6. Required with legal_form_code." }
        legal_form_local_text: { type: string, description: "The local legal-form text the code maps. Required with legal_form_code." }
        registry_authority:    { type: string }
        registered_office:
          type: object
          additionalProperties: true
          description: Structured registered address, held as recorded (ORG-08 owns normalisation).
        source_evidence_ref:   { type: string, description: "Supporting evidence for the entity's identity (§4.3)." }

    UpdateEntityRequest:
      type: object
      properties:
        legal_name:           { type: string }
        trading_name:         { type: string }
        default_currency_code: { type: string }
        correlation_id:       { type: string }

    EntityStatusResponse:
      type: object
      description: Lightweight status probe response — no full entity payload.
      properties:
        entity_id:     { type: string }
        tenant_id:     { type: string }
        entity_status: { type: string, enum: [DRAFT, VERIFIED, ACTIVE, DORMANT, SUSPENDED, DISSOLVED] }

    TransitionEntityStatusRequest:
      type: object
      required: [new_status, correlation_id]
      description: |
        Publishes entity.status.changed on success.
        Idempotent — same target status is a no-op.
      properties:
        new_status:
          type: string
          enum: [ACTIVE, DORMANT, SUSPENDED, DISSOLVED]
        correlation_id: { type: string }

    # ── EntityHierarchy ───────────────────────────────────────────────────────

    EntityHierarchy:
      type: object
      properties:
        record_version: { type: integer, format: int64, description: "Optimistic-concurrency version (migration 000011); carried as object_version on its events." }
        hierarchy_id:           { type: string }
        tenant_id:              { type: string }
        parent_legal_entity_id: { type: string }
        child_legal_entity_id:  { type: string }
        relationship_type:      { type: string, enum: [OWNERSHIP, REPORTING, OPERATIONAL] }
        effective_from:         { type: string, format: date-time }
        effective_to:           { type: string, format: date-time, nullable: true }

    CreateHierarchyRequest:
      type: object
      required: [tenant_id, parent_legal_entity_id, child_legal_entity_id, relationship_type, effective_from, correlation_id]
      properties:
        tenant_id:              { type: string }
        parent_legal_entity_id: { type: string }
        child_legal_entity_id:  { type: string }
        relationship_type:      { type: string, enum: [OWNERSHIP, REPORTING, OPERATIONAL] }
        effective_from:         { type: string, format: date-time }
        correlation_id:         { type: string }

    # ── EntityJurisdictionAssignment ──────────────────────────────────────────

    EntityJurisdictionAssignment:
      type: object
      properties:
        record_version: { type: integer, format: int64, description: "Optimistic-concurrency version (migration 000011); carried as object_version on its events." }
        assignment_id:   { type: string }
        legal_entity_id: { type: string }
        jurisdiction_id: { type: string }
        assignment_type: { type: string, enum: [PRIMARY, SECONDARY, TAX_ONLY, FILING_ONLY] }
        effective_from:  { type: string, format: date-time }
        effective_to:    { type: string, format: date-time, nullable: true }
        source_basis:    { type: string }

    AssignJurisdictionRequest:
      type: object
      required: [jurisdiction_id, assignment_type, effective_from, source_basis, correlation_id]
      properties:
        jurisdiction_id:
          type: string
          description: Validated synchronously against Jurisdiction Rules Service (fail-closed).
        assignment_type: { type: string, enum: [PRIMARY, SECONDARY, TAX_ONLY, FILING_ONLY] }
        effective_from:  { type: string, format: date-time }
        source_basis:    { type: string }
        correlation_id:  { type: string }

    # ── DataResidencyPolicy ───────────────────────────────────────────────────

    DataResidencyPolicy:
      type: object
      properties:
        data_residency_policy_id: { type: string }
        tenant_id:                { type: string }
        policy_name:              { type: string }
        policy_code:              { type: string }
        residency_mode:           { type: string, enum: [STRICT_REGION, PREFERRED_REGION, FOLLOW_ENTITY] }
        conflict_resolution_mode: { type: string, enum: [FAIL_CLOSED, LOG_AND_PROCEED, ESCALATE] }
        active_flag:              { type: boolean }

    CreateResidencyPolicyRequest:
      type: object
      required: [tenant_id, policy_name, policy_code, residency_mode, conflict_resolution_mode, correlation_id]
      properties:
        tenant_id:                { type: string }
        policy_name:              { type: string }
        policy_code:              { type: string }
        residency_mode:           { type: string, enum: [STRICT_REGION, PREFERRED_REGION, FOLLOW_ENTITY] }
        conflict_resolution_mode: { type: string, enum: [FAIL_CLOSED, LOG_AND_PROCEED, ESCALATE] }
        correlation_id:           { type: string }

    # ── ResidencyRegion (IaC-managed — no write schemas exposed) ─────────────

    ResidencyRegion:
      type: object
      description: |
        IaC-provisioned record. No create/update/delete endpoints exist on this service.
        These records are managed exclusively via infrastructure-as-code (Terraform/CDK).
      properties:
        residency_region_id: { type: string }
        region_code:         { type: string }
        region_name:         { type: string }
        cloud_provider:      { type: string }
        country_code:        { type: string }
        sovereign_flag:      { type: boolean }
        active_flag:         { type: boolean }

    # ── TaxIdentityBundle ─────────────────────────────────────────────────────

    TaxIdentityBundle:
      type: object
      description: |
        Structural header only — no tax identifier values stored here.
        Fields: legal_entity_id, jurisdiction_id, effective dates, status.
        The actual tax_registration_number and all evidence artifacts are
        owned by the Tax Service.
      properties:
        tax_identity_bundle_id: { type: string }
        legal_entity_id:        { type: string }
        jurisdiction_id:        { type: string }
        status:                 { type: string, enum: [PENDING, ACTIVE, EXPIRED, SUPERSEDED] }
        effective_from:         { type: string, format: date-time }
        effective_to:           { type: string, format: date-time, nullable: true }

    CreateTaxIdentityBundleRequest:
      type: object
      required: [jurisdiction_id, effective_from, correlation_id]
      description: |
        Creates the structural header only — do NOT include tax identifier values here.
        jurisdiction_id is validated synchronously (fail-closed).
      properties:
        jurisdiction_id:
          type: string
          description: Validated synchronously against Jurisdiction Rules Service (fail-closed).
        effective_from: { type: string, format: date-time }
        effective_to:   { type: string, format: date-time, nullable: true }
        correlation_id: { type: string }

    TransitionTaxIdentityBundleStatusRequest:
      type: object
      required: [new_status, correlation_id]
      properties:
        new_status:
          type: string
          enum: [PENDING, ACTIVE, EXPIRED, SUPERSEDED]
        correlation_id: { type: string }

    # ── Health ────────────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      properties:
        status:    { type: string }
        timestamp: { type: string, format: date-time }
        service:   { type: string }

    # ── Error ─────────────────────────────────────────────────────────────────

    Problem:
      type: object
      description: RFC 9457 problem document with ZS-API-001 extensions
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type
          example: "https://api.zoikosuite.com/problems/validation_failed"
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: "Bad Request"
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
          example: "external_customer_key is required"
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem
          example: "urn:zoikosuite:problem:req_01h4k2m9x8n7p3q2r1s0"
        code:
          type: string
          description: A stable, machine-readable error code (ORG §3)
          example: "VALIDATION_FAILED"
        request_id:
          type: string
          description: The request identifier (Zoiko-Request-Id)
          example: "req_01h4k2m9x8n7p3q2r1s0"
        correlation_id:
          type: string
          description: The correlation identifier (Zoiko-Correlation-Id or X-Correlation-ID)
          example: "corr_abc123"
        retryable:
          type: boolean
          description: Whether the client may retry the request
          example: false
        errors:
          type: array
          description: Field-level validation errors
          items:
            type: object
            required: [code]
            properties:
              pointer:
                type: string
                description: JSON Pointer to the field with the error
                example: "/external_customer_key"
              code:
                type: string
                description: Field-specific error code
                example: "REQUIRED"
              detail:
                type: string
                description: Human-readable field error
                example: "external_customer_key is required"
        current_version:
          type: integer
          format: int64
          description: The current version of the aggregate (for stale_version errors)
          example: 5

    ErrorResponse:
      type: object
      required: [error, error_code]
      properties:
        error:
          type: string
          description: Human-readable; may change. Branch on error_code.
        error_code:
          type: string
          description: |
            Stable typed code (ORG §3). The nine §3 codes, plus extensions for
            cases §3 does not name.
          enum: [CONTEXT_INVALID, VERSION_CONFLICT, DUPLICATE_CANDIDATE, INVALID_TRANSITION,
                 RULE_AMBIGUOUS, SOURCE_UNVERIFIED, SOD_DENIED, REFERENCE_RETIRED,
                 DEPENDENCY_UNAVAILABLE, NOT_FOUND, VALIDATION_FAILED, AUTHORIZATION_DENIED,
                 IDEMPOTENCY_MISMATCH, IDEMPOTENCY_IN_FLIGHT, JURISDICTION_RESTRICTED,
                 NOT_ENTITLED, INTERNAL_ERROR]
        correlation_id: { type: string }

    ResolvedTenantRegion:
      type: object
      properties:
        tenant_id:   { type: string, format: uuid }
        region_code: { type: string }
        region_name: { type: string }

    # ── ORG-02 §4.2: named commands, defaults, host bindings ─────────────────

    RequestEntityVerificationRequest:
      type: object
      required: [verification_evidence_ref, expected_version]
      properties:
        verification_evidence_ref: { type: string }
        reason:                    { type: string }
        expected_version:          { type: integer, format: int64 }
        correlation_id:            { type: string }

    ActivateLegalEntityRequest:
      type: object
      required: [expected_version]
      properties:
        reason:           { type: string }
        expected_version: { type: integer, format: int64 }
        correlation_id:   { type: string }

    MergeDuplicateCandidateRequest:
      type: object
      required: [survivor_legal_entity_id, reason, expected_version]
      properties:
        survivor_legal_entity_id: { type: string, format: uuid }
        reason:                   { type: string }
        evidence_ref:             { type: string }
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    UnmergeEntityRequest:
      type: object
      required: [reason, expected_version]
      properties:
        reason:           { type: string }
        expected_version: { type: integer, format: int64 }
        correlation_id:   { type: string }

    EntityMergeRecord:
      type: object
      properties:
        merge_record_id:           { type: string, format: uuid }
        tenant_id:                 { type: string, format: uuid }
        duplicate_legal_entity_id: { type: string, format: uuid }
        survivor_legal_entity_id:  { type: string, format: uuid }
        prior_entity_status:       { type: string }
        reason:                    { type: string }
        evidence_ref:              { type: string, nullable: true }
        merged_by_principal_id:          { type: string }
        merge_approved_by_principal_id:  { type: string }
        merge_approval_request_id:       { type: string, format: uuid }
        merged_at:                       { type: string, format: date-time }
        unmerged_by_principal_id:         { type: string, nullable: true }
        unmerge_approved_by_principal_id: { type: string, nullable: true }
        unmerge_approval_request_id:      { type: string, format: uuid, nullable: true }
        unmerged_at:                      { type: string, format: date-time, nullable: true }
        unmerge_reason:                   { type: string, nullable: true }

    OwnershipRelationship:
      type: object
      required: [relationship_id, tenant_id, parent_legal_entity_id, child_legal_entity_id, relationship_kind, valid_from, status, evidence_ref, reason, proposed_by_principal_id, record_version]
      properties:
        relationship_id:          { type: string, format: uuid }
        tenant_id:                { type: string }
        parent_legal_entity_id:   { type: string }
        child_legal_entity_id:    { type: string }
        relationship_kind:        { type: string, enum: [OWNERSHIP, CONTROL] }
        ownership_pct:            { type: number, exclusiveMinimum: 0, maximum: 100 }
        voting_pct:               { type: number, exclusiveMinimum: 0, maximum: 100 }
        control_type:             { type: string, enum: [VOTING, BOARD, CONTRACTUAL, OTHER] }
        beneficial_notes:         { type: string }
        valid_from:               { type: string, format: date-time }
        valid_to:                 { type: string, format: date-time, nullable: true }
        recorded_at:              { type: string, format: date-time }
        status:                   { type: string, enum: [PROPOSED, ACTIVE, SUPERSEDED, ENDED, REJECTED] }
        evidence_ref:             { type: string }
        reason:                   { type: string }
        proposed_by_principal_id: { type: string }
        proposed_at:              { type: string, format: date-time }
        decided_by_principal_id:  { type: string }
        decided_at:               { type: string, format: date-time }
        decision_note:            { type: string }
        correlation_id:           { type: string }
        record_version:           { type: integer, format: int64, minimum: 1 }
        supersedes_relationship_id: { type: string, format: uuid, description: "The ACTIVE relationship this one replaces once approved." }
        ended_by_principal_id:    { type: string }
        ended_at:                 { type: string, format: date-time }
        end_reason:               { type: string }
        end_evidence_ref:         { type: string }

    ProposeOwnershipRequest:
      type: object
      required: [parent_legal_entity_id, child_legal_entity_id, relationship_kind, valid_from, evidence_ref, reason]
      description: |
        An OWNERSHIP relationship requires ownership_pct; a CONTROL relationship
        requires control_type. evidence_ref (the source filing or contract) and
        reason are always required.
      properties:
        parent_legal_entity_id: { type: string }
        child_legal_entity_id:  { type: string }
        relationship_kind:      { type: string, enum: [OWNERSHIP, CONTROL] }
        ownership_pct:          { type: number, exclusiveMinimum: 0, maximum: 100 }
        voting_pct:             { type: number, exclusiveMinimum: 0, maximum: 100 }
        control_type:           { type: string, enum: [VOTING, BOARD, CONTRACTUAL, OTHER] }
        beneficial_notes:       { type: string }
        valid_from:             { type: string, format: date-time }
        valid_to:               { type: string, format: date-time }
        evidence_ref:           { type: string }
        reason:                 { type: string }
        correlation_id:         { type: string }

    SupersedeOwnershipRequest:
      type: object
      required: [expected_version, valid_from, evidence_ref, reason]
      description: |
        New terms for the relationship named in the path. expected_version is the
        record_version of THAT (current) relationship.
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        ownership_pct:    { type: number, exclusiveMinimum: 0, maximum: 100 }
        voting_pct:       { type: number, exclusiveMinimum: 0, maximum: 100 }
        control_type:     { type: string, enum: [VOTING, BOARD, CONTRACTUAL, OTHER] }
        beneficial_notes: { type: string }
        valid_from:       { type: string, format: date-time }
        valid_to:         { type: string, format: date-time }
        evidence_ref:     { type: string }
        reason:           { type: string }
        correlation_id:   { type: string }

    EndOwnershipRequest:
      type: object
      required: [expected_version, end_date, evidence_ref, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        end_date:         { type: string, format: date-time }
        evidence_ref:     { type: string }
        reason:           { type: string }
        correlation_id:   { type: string }

    OwnershipGraph:
      type: object
      required: [as_of, entities, relationships]
      properties:
        as_of:                  { type: string, format: date-time }
        root_legal_entity_id:   { type: string }
        entities:               { type: array, items: { type: string } }
        relationships:          { type: array, items: { $ref: "#/components/schemas/OwnershipRelationship" } }

    OwnershipGroup:
      type: object
      required: [as_of, legal_entity_id, ultimate_parents, members, relationships]
      properties:
        as_of:             { type: string, format: date-time }
        legal_entity_id:   { type: string }
        ultimate_parents:  { type: array, items: { type: string } }
        members:           { type: array, items: { type: string } }
        relationships:     { type: array, items: { $ref: "#/components/schemas/OwnershipRelationship" } }

    EntityParents:
      type: object
      required: [as_of, legal_entity_id, parents]
      properties:
        as_of:            { type: string, format: date-time }
        legal_entity_id:  { type: string }
        parents:          { type: array, items: { $ref: "#/components/schemas/OwnershipRelationship" } }

    ChainLink:
      type: object
      required: [relationship_id, parent_legal_entity_id, child_legal_entity_id, relationship_kind, controlling, evidence_ref]
      properties:
        relationship_id:         { type: string, format: uuid }
        parent_legal_entity_id:  { type: string }
        child_legal_entity_id:   { type: string }
        relationship_kind:       { type: string, enum: [OWNERSHIP, CONTROL] }
        ownership_pct:           { type: number }
        voting_pct:              { type: number }
        control_type:            { type: string, enum: [VOTING, BOARD, CONTRACTUAL, OTHER] }
        controlling:             { type: boolean }
        evidence_ref:            { type: string }

    ControlPath:
      type: object
      required: [links, effective_ownership_pct, controls]
      properties:
        links:                   { type: array, items: { $ref: "#/components/schemas/ChainLink" }, description: "Top-down: from the ultimate parent to the entity." }
        effective_ownership_pct: { type: number, nullable: true }
        controls:                { type: boolean }

    ControlChain:
      type: object
      required: [as_of, legal_entity_id, chains]
      properties:
        as_of:            { type: string, format: date-time }
        legal_entity_id:  { type: string }
        chains:
          type: array
          items:
            type: object
            required: [ultimate_parent_legal_entity_id, effective_ownership_pct, controls, paths]
            properties:
              ultimate_parent_legal_entity_id: { type: string }
              effective_ownership_pct:         { type: number, maximum: 100 }
              controls:                        { type: boolean }
              paths:                           { type: array, items: { $ref: "#/components/schemas/ControlPath" } }

    OwnershipDecisionRequest:
      type: object
      required: [expected_version]
      description: The decider is the verified caller and is never named in the body.
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        decision_note:    { type: string }
        correlation_id:   { type: string }

    ApprovalRequest:
      type: object
      required: [expected_version]
      properties:
        approval_request_id: { type: string, format: uuid }
        tenant_id:           { type: string, format: uuid }
        subject_type:
          type: string
          enum: [TENANT_CREATION, TENANT_COMMAND, LEGAL_PROFILE_AMENDMENT, REGISTRY_CONFLICT_RESOLUTION, LEGAL_ENTITY_VERIFICATION, LEGAL_ENTITY_MERGE, LEGAL_ENTITY_UNMERGE]
        subject_id:          { type: string, format: uuid }
        command_name:        { type: string }
        payload:
          type: object
          additionalProperties: true
          description: The command exactly as proposed, and exactly what runs on approval.
        expected_version:    { type: integer, format: int64 }
        payload_fingerprint:
          type: string
          description: SHA-256 of subject, command, version and payload. Must be presented on /approve.
        reason:                    { type: string }
        requested_by_principal_id: { type: string }
        requested_at:              { type: string, format: date-time }
        expires_at:                { type: string, format: date-time }
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, STALE, EXPIRED]
        decided_by_principal_id:   { type: string, nullable: true }
        decided_at:                { type: string, format: date-time, nullable: true }
        decision_note:             { type: string, nullable: true }
        correlation_id:            { type: string, nullable: true }

    PendingApproval:
      type: object
      properties:
        status: { type: string, enum: [PENDING_APPROVAL] }
        approval_request:
          $ref: "#/components/schemas/ApprovalRequest"

    ApproveRequestBody:
      type: object
      required: [payload_fingerprint]
      properties:
        payload_fingerprint: { type: string }
        note:                { type: string }
        correlation_id:      { type: string }

    RejectRequestBody:
      type: object
      required: [note]
      properties:
        note:           { type: string }
        correlation_id: { type: string }

    ApprovalOutcome:
      type: object
      properties:
        approval_request:
          $ref: "#/components/schemas/ApprovalRequest"
        result:
          description: The released command's result (a TenantCommandResult or LegalEntityProfileVersion), absent where it has none.
          type: object
          additionalProperties: true

    ExecuteTenantCommandRequest:
      type: object
      required: [reason, expected_version]
      properties:
        reason:
          type: string
          description: |
            Mandatory. §4.2 requires the lifecycle actor and reason as
            evidence, and a history whose reason column is empty answers
            "why is this tenant suspended?" with silence.
        expected_version:
          type: integer
          format: int64
          description: |
            The tenant's record_version as the caller last saw it. Omitting it
            is accepted and does NOT skip the guard: the service substitutes
            the version it reads, turning its own read-then-write into a
            compare-and-swap. Supplying it gives the stronger guarantee that
            nothing moved since the CALLER read.
        approved_by_principal_id:
          type: string
          deprecated: true
          description: |
            REFUSED (422) since migration 000007. The maker used to name their
            own approver here, which made every maker-checker control
            satisfiable by one person. The approver is now the verified caller
            of POST /v1/approval-requests/{id}/approve.
        correlation_id: { type: string }

    TenantCommandResult:
      type: object
      properties:
        from_state:     { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        to_state:       { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        record_version: { type: integer, format: int64 }
        status:         { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }

    ChangeHomeRegionRequest:
      type: object
      required: [residency_region_id, home_region_decision_ref, reason, expected_version]
      properties:
        residency_region_id: { type: string, format: uuid, description: The new home region (a residency region). }
        home_region_decision_ref:
          type: string
          description: §4.2 evidence — the residency decision this change implements.
        reason: { type: string }
        expected_version: { type: integer, format: int64 }
        correlation_id: { type: string }

    ChangeDefaultLocaleRequest:
      type: object
      required: [reason, expected_version]
      properties:
        primary_locale:   { type: string }
        primary_timezone: { type: string }
        reason:           { type: string }
        expected_version: { type: integer, format: int64 }
        correlation_id:   { type: string }

    TenantDefaults:
      type: object
      properties:
        tenant_id:             { type: string, format: uuid }
        default_currency_code: { type: string }
        primary_timezone:      { type: string }
        primary_locale:        { type: string }
        default_data_residency_policy_id: { type: string, format: uuid }
        record_version:        { type: integer, format: int64 }

    TenantLifecycleEvent:
      type: object
      properties:
        home_region_decision_ref: { type: string, nullable: true, description: "ChangeHomeRegion rows: the residency decision (§4.2 evidence)." }
        from_region_id:           { type: string, format: uuid, nullable: true }
        to_region_id:             { type: string, format: uuid, nullable: true }
        lifecycle_event_id: { type: string, format: uuid }
        tenant_id:          { type: string, format: uuid }
        from_state:         { type: string, nullable: true }
        to_state:           { type: string }
        command_name:
          type: string
          description: |
            The ORG-02 named command that caused the transition. Stored rather
            than inferred from the state pair: SuspendTenant followed by
            ResumeTenant is otherwise indistinguishable from the correction of
            a mistaken suspension.
          enum: [CreateTenant, ActivateTenant, SuspendTenant, ResumeTenant, InitiateTermination, CompleteTermination, ChangeDefaultLocale, RetryProvisioning, AbandonProvisioning, ChangeHomeRegion]
        reason:                   { type: string }
        actor_principal_id:       { type: string }
        approved_by_principal_id: { type: string, nullable: true }
        approval_request_id:      { type: string, format: uuid, nullable: true }
        correlation_id:           { type: string, nullable: true }
        occurred_at:              { type: string, format: date-time }
        onboarding_request_ref:
          type: string
          nullable: true
          description: The onboarding request this tenant was provisioned under (§4.2 evidence lineage).
        external_customer_key:
          type: string
          nullable: true
          description: The external customer key the tenant was provisioned under (§4.2 evidence lineage).

    TenantHostBinding:
      type: object
      properties:
        host_binding_id:          { type: string, format: uuid }
        hostname:                 { type: string }
        tenant_id:                { type: string, format: uuid }
        is_primary:               { type: boolean }
        active_flag:              { type: boolean }
        created_at:               { type: string, format: date-time }
        created_by_principal_id:  { type: string }

    BindTenantHostRequest:
      type: object
      required: [hostname]
      properties:
        hostname:
          type: string
          description: Lowercased on write; case is not meaningful in a hostname.
        is_primary:     { type: boolean }
        correlation_id: { type: string }

    ResolvedTenantByHost:
      type: object
      description: |
        Carries the tenant's status and lifecycle state alongside its id,
        because the caller is an ingress layer deciding whether to admit a
        request — handing it only an id would force a second round trip to
        learn the tenant is suspended.
      properties:
        hostname:        { type: string }
        tenant_id:       { type: string, format: uuid }
        tenant_code:     { type: string }
        status:          { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        lifecycle_state: { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        is_primary:      { type: boolean }

    # ── ORG-03 §4.3: bitemporal profile versions ─────────────────────────────

    LegalEntityProfileVersion:
      type: object
      description: |
        One effective-dated version of an entity's legal profile.

        effective_from/effective_to are BUSINESS time — when the fact was true
        in the world. recorded_at is RECORD time — when this platform learned
        it. The two differ whenever a change is backdated, which is exactly
        the case §9.2 requires as-of retrieval to be verified against.

        superseded_at marks a version replaced by a later one. The row is never
        rewritten or deleted: §8 NP6 requires history to resolve the ORIGINAL
        version, which is impossible if a correction overwrites what it
        corrects.
      properties:
        profile_version_id: { type: string, format: uuid }
        tenant_id:          { type: string, format: uuid }
        legal_entity_id:    { type: string, format: uuid }
        version_number:     { type: integer }
        legal_name:         { type: string }
        trading_name:       { type: string, nullable: true }
        legal_form_code:    { type: string, nullable: true }
        legal_form_source:  { type: string, nullable: true }
        legal_form_local_text: { type: string, nullable: true }
        registration_number:   { type: string, nullable: true }
        registry_authority:    { type: string, nullable: true }
        registered_office:     { type: string, nullable: true, description: Opaque structured JSON; ORG-08 owns address normalization. }
        incorporation_jurisdiction_id: { type: string, nullable: true }
        default_currency_code: { type: string, nullable: true }
        effective_from:  { type: string, format: date-time }
        effective_to:    { type: string, format: date-time, nullable: true }
        recorded_at:     { type: string, format: date-time }
        superseded_at:   { type: string, format: date-time, nullable: true }
        change_reason:
          type: string
          enum: [INITIAL, INITIAL_BACKFILL, LEGAL_NAME_CHANGE, REGISTERED_OFFICE_CHANGE, AMENDMENT, CORRECTION]
          description: |
            CORRECTION and AMENDMENT are not interchangeable: a correction
            means the prior version was WRONG, so reports already issued
            against it were misstated. INITIAL and INITIAL_BACKFILL are
            service-assigned and refused if a caller supplies them.
        source_evidence_ref:      { type: string, nullable: true }
        created_by_principal_id:  { type: string }
        approved_by_principal_id: { type: string, nullable: true }
        approval_request_id:      { type: string, format: uuid, nullable: true }
        lei:
          type: string
          nullable: true
          description: ISO 17442 LEI (20 chars, MOD 97-10). An external identifier, never the internal key.
        lei_source:      { type: string, nullable: true, description: "Where the LEI came from, e.g. GLEIF. Required with an LEI." }
        lei_status:
          type: string
          nullable: true
          enum: [ISSUED, LAPSED, PENDING_TRANSFER, PENDING_ARCHIVAL, MERGED, RETIRED, ANNULLED, DUPLICATE, TRANSFERRED, CANCELLED]
        lei_verified_at: { type: string, format: date-time, nullable: true }

    AmendLegalProfileRequest:
      type: object
      required: [expected_version]
      description: |
        Every profile field is optional. An omitted field is CARRIED FORWARD
        from the version in force at effective_from — which is what makes this
        an amendment rather than a replacement.
      properties:
        legal_name:            { type: string }
        trading_name:          { type: string }
        legal_form_code:       { type: string }
        legal_form_source:     { type: string }
        legal_form_local_text: { type: string }
        registration_number:   { type: string }
        registry_authority:    { type: string }
        registered_office:     { type: string }
        incorporation_jurisdiction_id: { type: string }
        default_currency_code: { type: string }
        effective_from:
          type: string
          format: date-time
          description: Business time. May be in the past. Defaults to now.
        change_reason:
          type: string
          enum: [LEGAL_NAME_CHANGE, REGISTERED_OFFICE_CHANGE, AMENDMENT, CORRECTION]
        source_evidence_ref:      { type: string }
        lei:
          type: string
          description: ISO 17442 LEI (20 chars, MOD 97-10). An external identifier, never the internal key.
        lei_source:      { type: string, description: "Where the LEI came from, e.g. GLEIF. Required with an LEI." }
        lei_status:
          type: string
          enum: [ISSUED, LAPSED, PENDING_TRANSFER, PENDING_ARCHIVAL, MERGED, RETIRED, ANNULLED, DUPLICATE, TRANSFERRED, CANCELLED]
        lei_verified_at: { type: string, format: date-time }
        approved_by_principal_id:
          type: string
          deprecated: true
          description: |
            REFUSED (422) since migration 000007. The maker used to name their
            own approver here, which made every maker-checker control
            satisfiable by one person. The approver is now the verified caller
            of POST /v1/approval-requests/{id}/approve.
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    ChangeLegalNameRequest:
      type: object
      required: [legal_name, expected_version]
      properties:
        legal_name:               { type: string }
        effective_from:           { type: string, format: date-time }
        source_evidence_ref:      { type: string }
        approved_by_principal_id:
          type: string
          deprecated: true
          description: |
            REFUSED (422) since migration 000007. The maker used to name their
            own approver here, which made every maker-checker control
            satisfiable by one person. The approver is now the verified caller
            of POST /v1/approval-requests/{id}/approve.
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    ChangeRegisteredOfficeRequest:
      type: object
      required: [registered_office, expected_version]
      properties:
        registered_office:        { type: string }
        effective_from:           { type: string, format: date-time }
        source_evidence_ref:      { type: string }
        approved_by_principal_id:
          type: string
          deprecated: true
          description: |
            REFUSED (422) since migration 000007. The maker used to name their
            own approver here, which made every maker-checker control
            satisfiable by one person. The approver is now the verified caller
            of POST /v1/approval-requests/{id}/approve.
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    EntityAsOf:
      type: object
      description: |
        The entity's unchanging identifiers paired with the profile version in
        force at the requested instant. Both are returned because a caller
        reconstructing a historical report needs both: the entity carries
        identifiers that do not change, the profile carries the facts that do.
      properties:
        legal_entity_id: { type: string, format: uuid }
        tenant_id:       { type: string, format: uuid }
        entity_code:     { type: string }
        entity_type:     { type: string }
        entity_status:   { type: string }
        as_of:           { type: string, format: date-time }
        profile:
          allOf:
            - $ref: "#/components/schemas/LegalEntityProfileVersion"
          nullable: true

    # ── ORG-03 §8 NP5: registry conflict quarantine ──────────────────────────

    EntityRegistryConflict:
      type: object
      properties:
        conflict_id:         { type: string, format: uuid }
        tenant_id:           { type: string, format: uuid }
        registration_number: { type: string }
        jurisdiction_id:     { type: string, format: uuid }
        existing_legal_entity_id: { type: string, format: uuid }
        attempted_payload:
          type: object
          additionalProperties: true
          description: |
            The rejected claim, kept whole. There is no row to point at,
            because the point is that it was not written.
        status:
          type: string
          enum: [OPEN, RESOLVED_DISTINCT, RESOLVED_DUPLICATE, DISMISSED]
          description: |
            RESOLVED_DISTINCT means a human confirmed the two are genuinely
            different entities sharing a registry number, which happens across
            registry authorities within one jurisdiction. RESOLVED_DUPLICATE
            records the opposite conclusion; it does not itself merge anything.
        resolution_note:          { type: string, nullable: true }
        resolved_by_principal_id: { type: string, nullable: true }
        approved_by_principal_id:
          type: string
          nullable: true
          description: The independent approver — never the resolver, never the detected-by principal.
        approval_request_id:      { type: string, format: uuid, nullable: true }
        resolved_at:              { type: string, format: date-time, nullable: true }
        detected_at:              { type: string, format: date-time }
        detected_by_principal_id: { type: string }
        correlation_id:           { type: string, nullable: true }

    ResolveRegistryConflictRequest:
      type: object
      required: [status, resolution_note]
      properties:
        status:
          type: string
          enum: [RESOLVED_DISTINCT, RESOLVED_DUPLICATE, DISMISSED]
        resolution_note:
          type: string
          description: Mandatory — a resolution nobody can audit is not one.
        correlation_id: { type: string }

    # ── Workspaces ───────────────────────────────────────────────────────────

    Workspace:
      type: object
      properties:
        record_version: { type: integer, format: int64, description: "Optimistic-concurrency version (migration 000011); carried as object_version on its events." }
        workspace_id:    { type: string, format: uuid }
        tenant_id:       { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid, nullable: true }
        name:            { type: string }
        business_unit:   { type: string, nullable: true }
        billing_classification:
          type: string
          enum: [COMMERCIAL_STANDALONE, COMMERCIAL_ZOIKO_ONE, LEGACY_MIGRATION, PILOT_NON_BILLABLE, INTERNAL, DEMO, SANDBOX, QA_AUTOMATION]
        billing_source:  { type: string, enum: [NONE, DIRECT, ZOIKO_ONE_BUNDLE] }
        commercial_account_id: { type: string, format: uuid, nullable: true }
        status:          { type: string, enum: [ACTIVE, ARCHIVED] }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }
        created_by_principal_id: { type: string }
        updated_by_principal_id: { type: string }

    CreateWorkspaceRequest:
      type: object
      required: [tenant_id, name, billing_classification]
      properties:
        tenant_id:       { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        name:            { type: string }
        business_unit:   { type: string }
        billing_classification: { type: string }
        billing_source:  { type: string }
        commercial_account_id:  { type: string, format: uuid }
        correlation_id:  { type: string }

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:            { type: string }
        business_unit:   { type: string }
        billing_classification: { type: string }
        billing_source:  { type: string }
        commercial_account_id:  { type: string, format: uuid }
        correlation_id:  { type: string }

    TransitionWorkspaceStatusRequest:
      type: object
      required: [new_status]
      properties:
        new_status:     { type: string, enum: [ACTIVE, ARCHIVED] }
        correlation_id: { type: string }

  responses:
    BadRequest:
      description: Invalid request body or missing required fields
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authorization denied
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Invalid state transition
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Upstream service (AuthZ or Jurisdiction Rules) unreachable — request rejected fail-closed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
