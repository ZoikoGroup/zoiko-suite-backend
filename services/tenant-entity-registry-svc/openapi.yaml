        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionWorkspaceStatusRequest"
      responses:
        "204": { description: Transition applied }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }


  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      tags: [Health]
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      description: Returns 200 only if the DB pool is reachable.
      tags: [Health]
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: DB unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

# ── Components ────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        IdentityContextEnvelope JWT issued by identity-context-svc.
        Verified by the Authorization Service on every material action.

  parameters:
    ApprovalRequestID:
      name: approvalRequestID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantID:
      name: tenantID
      in: path
      required: true
      schema:
        type: string
    EntityID:
      name: entityID
      in: path
      required: true
      schema:
        type: string
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema:
        type: string
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: |
        Propagated through every request for evidence and distributed tracing.
        If absent, the service generates one from the request ID.

  schemas:

    # ── Tenant ────────────────────────────────────────────────────────────────

    Tenant:
      type: object
      properties:
        tenant_id:           { type: string }
        tenant_code:         { type: string }
        legal_name:          { type: string }
        trading_name:        { type: string, nullable: true }
        status:              { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        default_currency_code: { type: string }
        primary_timezone:    { type: string }
        primary_locale:      { type: string }
        default_data_residency_policy_id: { type: string }
        lifecycle_state:     { type: string, enum: [ONBOARDING, FAILED_PROVISIONING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        created_at:          { type: string, format: date-time }
        created_by:          { type: string }
        record_version:      { type: integer, format: int64 }
        external_customer_key:  { type: string, nullable: true }
        onboarding_request_ref: { type: string, nullable: true, description: "ORG-02 onboarding-request evidence." }
        provisioning_failure_reason: { type: string, nullable: true }
        provisioning_failed_at:      { type: string, format: date-time, nullable: true }
        idempotent_replay:
          type: boolean
          description: Present and true only on a provisionTenant 200 replay.
        creation_approval_request_id:
          type: string
          format: uuid
          description: Set on the provisionTenant response only. The pending creation approval a principal other than the creator must approve before the tenant can be activated.

    ProvisionTenantRequest:
      type: object
      required: [tenant_code, legal_name, default_currency_code, primary_timezone, primary_locale, external_customer_key]
      properties:
        external_customer_key:
          type: string
          description: The approved onboarding correlation / external customer key. The idempotency key for tenant creation.
        onboarding_request_ref:
          type: string
          description: Reference to the onboarding request the tenant is created from (evidence).
        tenant_code:         { type: string }
        legal_name:          { type: string }
        trading_name:        { type: string }
        default_currency_code: { type: string }
        primary_timezone:    { type: string }
        primary_locale:      { type: string }
        default_data_residency_policy_id:
          type: string
          deprecated: true
          description: Ignored; the service always generates the default policy.

    TransitionTenantLifecycleRequest:
      type: object
      required: [target_state, correlation_id]
      properties:
        target_state:
          type: string
          enum: [ACTIVE, SUSPENDED, OFFBOARDING]
        correlation_id: { type: string }

    # ── LegalEntity ───────────────────────────────────────────────────────────

    LegalEntity:
      type: object
      properties:
        legal_entity_id:        { type: string }
        tenant_id:              { type: string }
        entity_code:            { type: string }
        legal_name:             { type: string }
        trading_name:           { type: string, nullable: true }
        registration_number:    { type: string, nullable: true }
        tax_identity_bundle_id: { type: string, nullable: true }
        entity_type:            { type: string, enum: [SUBSIDIARY, BRANCH, HOLDING, OPERATIONAL] }
        incorporation_date:     { type: string, format: date, nullable: true }
        default_currency_code:  { type: string }
        fiscal_calendar_id:     { type: string }
        parent_legal_entity_id: { type: string, nullable: true }
        entity_status:
          type: string
          enum: [DRAFT, VERIFIED, ACTIVE, DORMANT, SUSPENDED, DISSOLVED]
          description: |
            ORG-03 §4.3 Draft → Verified → Active. New entities are DRAFT;
            DRAFT and VERIFIED entities cannot be transacted against.
        primary_jurisdiction_id: { type: string }
        data_residency_policy_id: { type: string }
        record_version:         { type: integer, format: int64 }
        created_at:             { type: string, format: date-time }
        created_by_principal_id: { type: string }
        verified_by_principal_id:  { type: string, nullable: true }
        verified_at:               { type: string, format: date-time, nullable: true }
        verification_evidence_ref: { type: string, nullable: true }
        merged_into_legal_entity_id:
          type: string
          nullable: true
          description: Set on a DORMANT duplicate merged (non-destructively) into another entity.
        merged_at:                 { type: string, format: date-time, nullable: true }

    CreateEntityRequest:
      type: object
      required: [tenant_id, entity_code, legal_name, entity_type, default_currency_code, fiscal_calendar_id, primary_jurisdiction_id, data_residency_policy_id, correlation_id]
      properties:
        tenant_id:              { type: string }
        entity_code:            { type: string }
        legal_name:             { type: string }
        trading_name:           { type: string }
        entity_type:            { type: string, enum: [SUBSIDIARY, BRANCH, HOLDING, OPERATIONAL] }
        default_currency_code:  { type: string }
        fiscal_calendar_id:     { type: string }
        primary_jurisdiction_id:
          type: string
          description: Validated synchronously against Jurisdiction Rules Service (fail-closed).
        data_residency_policy_id: { type: string }
        correlation_id:         { type: string }
        registration_number:    { type: string }
        lei:
          type: string
          description: ISO 17442 LEI (20 chars, MOD 97-10). An external identifier, never the internal key.
        lei_source:      { type: string, description: "Where the LEI came from, e.g. GLEIF. Required with an LEI." }
        lei_status:
          type: string
          enum: [ISSUED, LAPSED, PENDING_TRANSFER, PENDING_ARCHIVAL, MERGED, RETIRED, ANNULLED, DUPLICATE, TRANSFERRED, CANCELLED]
        lei_verified_at: { type: string, format: date-time }

    UpdateEntityRequest:
      type: object
      properties:
        legal_name:           { type: string }
        trading_name:         { type: string }
        default_currency_code: { type: string }
        correlation_id:       { type: string }

    EntityStatusResponse:
      type: object
      description: Lightweight status probe response — no full entity payload.
      properties:
        entity_id:     { type: string }
        tenant_id:     { type: string }
        entity_status: { type: string, enum: [DRAFT, VERIFIED, ACTIVE, DORMANT, SUSPENDED, DISSOLVED] }

    TransitionEntityStatusRequest:
      type: object
      required: [new_status, correlation_id]
      description: |
        Publishes entity.status.changed on success.
        Idempotent — same target status is a no-op.
      properties:
        new_status:
          type: string
          enum: [ACTIVE, DORMANT, SUSPENDED, DISSOLVED]
        correlation_id: { type: string }

    # ── EntityHierarchy ───────────────────────────────────────────────────────

    EntityHierarchy:
      type: object
      properties:
        hierarchy_id:           { type: string }
        tenant_id:              { type: string }
        parent_legal_entity_id: { type: string }
        child_legal_entity_id:  { type: string }
        relationship_type:      { type: string, enum: [OWNERSHIP, REPORTING, OPERATIONAL] }
        effective_from:         { type: string, format: date-time }
        effective_to:           { type: string, format: date-time, nullable: true }

    CreateHierarchyRequest:
      type: object
      required: [tenant_id, parent_legal_entity_id, child_legal_entity_id, relationship_type, effective_from, correlation_id]
      properties:
        tenant_id:              { type: string }
        parent_legal_entity_id: { type: string }
        child_legal_entity_id:  { type: string }
        relationship_type:      { type: string, enum: [OWNERSHIP, REPORTING, OPERATIONAL] }
        effective_from:         { type: string, format: date-time }
        correlation_id:         { type: string }

    # ── EntityJurisdictionAssignment ──────────────────────────────────────────

    EntityJurisdictionAssignment:
      type: object
      properties:
        assignment_id:   { type: string }
        legal_entity_id: { type: string }
        jurisdiction_id: { type: string }
        assignment_type: { type: string, enum: [PRIMARY, SECONDARY, TAX_ONLY, FILING_ONLY] }
        effective_from:  { type: string, format: date-time }
        effective_to:    { type: string, format: date-time, nullable: true }
        source_basis:    { type: string }

    AssignJurisdictionRequest:
      type: object
      required: [jurisdiction_id, assignment_type, effective_from, source_basis, correlation_id]
      properties:
        jurisdiction_id:
          type: string
          description: Validated synchronously against Jurisdiction Rules Service (fail-closed).
        assignment_type: { type: string, enum: [PRIMARY, SECONDARY, TAX_ONLY, FILING_ONLY] }
        effective_from:  { type: string, format: date-time }
        source_basis:    { type: string }
        correlation_id:  { type: string }

    # ── DataResidencyPolicy ───────────────────────────────────────────────────

    DataResidencyPolicy:
      type: object
      properties:
        data_residency_policy_id: { type: string }
        tenant_id:                { type: string }
        policy_name:              { type: string }
        policy_code:              { type: string }
        residency_mode:           { type: string, enum: [STRICT_REGION, PREFERRED_REGION, FOLLOW_ENTITY] }
        conflict_resolution_mode: { type: string, enum: [FAIL_CLOSED, LOG_AND_PROCEED, ESCALATE] }
        active_flag:              { type: boolean }

    CreateResidencyPolicyRequest:
      type: object
      required: [tenant_id, policy_name, policy_code, residency_mode, conflict_resolution_mode, correlation_id]
      properties:
        tenant_id:                { type: string }
        policy_name:              { type: string }
        policy_code:              { type: string }
        residency_mode:           { type: string, enum: [STRICT_REGION, PREFERRED_REGION, FOLLOW_ENTITY] }
        conflict_resolution_mode: { type: string, enum: [FAIL_CLOSED, LOG_AND_PROCEED, ESCALATE] }
        correlation_id:           { type: string }

    # ── ResidencyRegion (IaC-managed — no write schemas exposed) ─────────────

    ResidencyRegion:
      type: object
      description: |
        IaC-provisioned record. No create/update/delete endpoints exist on this service.
        These records are managed exclusively via infrastructure-as-code (Terraform/CDK).
      properties:
        residency_region_id: { type: string }
        region_code:         { type: string }
        region_name:         { type: string }
        cloud_provider:      { type: string }
        country_code:        { type: string }
        sovereign_flag:      { type: boolean }
        active_flag:         { type: boolean }

    # ── TaxIdentityBundle ─────────────────────────────────────────────────────

    TaxIdentityBundle:
      type: object
      description: |
        Structural header only — no tax identifier values stored here.
        Fields: legal_entity_id, jurisdiction_id, effective dates, status.
        The actual tax_registration_number and all evidence artifacts are
        owned by the Tax Service.
      properties:
        tax_identity_bundle_id: { type: string }
        legal_entity_id:        { type: string }
        jurisdiction_id:        { type: string }
        status:                 { type: string, enum: [PENDING, ACTIVE, EXPIRED, SUPERSEDED] }
        effective_from:         { type: string, format: date-time }
        effective_to:           { type: string, format: date-time, nullable: true }

    CreateTaxIdentityBundleRequest:
      type: object
      required: [jurisdiction_id, effective_from, correlation_id]
      description: |
        Creates the structural header only — do NOT include tax identifier values here.
        jurisdiction_id is validated synchronously (fail-closed).
      properties:
        jurisdiction_id:
          type: string
          description: Validated synchronously against Jurisdiction Rules Service (fail-closed).
        effective_from: { type: string, format: date-time }
        effective_to:   { type: string, format: date-time, nullable: true }
        correlation_id: { type: string }

    TransitionTaxIdentityBundleStatusRequest:
      type: object
      required: [new_status, correlation_id]
      properties:
        new_status:
          type: string
          enum: [PENDING, ACTIVE, EXPIRED, SUPERSEDED]
        correlation_id: { type: string }

    # ── Health ────────────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      properties:
        status:    { type: string }
        timestamp: { type: string, format: date-time }
        service:   { type: string }

    # ── Error ─────────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:          { type: string }
        correlation_id: { type: string }

    ResolvedTenantRegion:
      type: object
      properties:
        tenant_id:   { type: string, format: uuid }
        region_code: { type: string }
        region_name: { type: string }

    # ── ORG-02 §4.2: named commands, defaults, host bindings ─────────────────

    RequestEntityVerificationRequest:
      type: object
      required: [verification_evidence_ref]
      properties:
        verification_evidence_ref: { type: string }
        reason:                    { type: string }
        expected_version:          { type: integer, format: int64 }
        correlation_id:            { type: string }

    ActivateLegalEntityRequest:
      type: object
      properties:
        reason:           { type: string }
        expected_version: { type: integer, format: int64 }
        correlation_id:   { type: string }

    MergeDuplicateCandidateRequest:
      type: object
      required: [survivor_legal_entity_id, reason]
      properties:
        survivor_legal_entity_id: { type: string, format: uuid }
        reason:                   { type: string }
        evidence_ref:             { type: string }
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    UnmergeEntityRequest:
      type: object
      required: [reason]
      properties:
        reason:           { type: string }
        expected_version: { type: integer, format: int64 }
        correlation_id:   { type: string }

    EntityMergeRecord:
      type: object
      properties:
        merge_record_id:           { type: string, format: uuid }
        tenant_id:                 { type: string, format: uuid }
        duplicate_legal_entity_id: { type: string, format: uuid }
        survivor_legal_entity_id:  { type: string, format: uuid }
        prior_entity_status:       { type: string }
        reason:                    { type: string }
        evidence_ref:              { type: string, nullable: true }
        merged_by_principal_id:          { type: string }
        merge_approved_by_principal_id:  { type: string }
        merge_approval_request_id:       { type: string, format: uuid }
        merged_at:                       { type: string, format: date-time }
        unmerged_by_principal_id:         { type: string, nullable: true }
        unmerge_approved_by_principal_id: { type: string, nullable: true }
        unmerge_approval_request_id:      { type: string, format: uuid, nullable: true }
        unmerged_at:                      { type: string, format: date-time, nullable: true }
        unmerge_reason:                   { type: string, nullable: true }

    ApprovalRequest:
      type: object
      properties:
        approval_request_id: { type: string, format: uuid }
        tenant_id:           { type: string, format: uuid }
        subject_type:
          type: string
          enum: [TENANT_CREATION, TENANT_COMMAND, LEGAL_PROFILE_AMENDMENT, REGISTRY_CONFLICT_RESOLUTION, LEGAL_ENTITY_VERIFICATION, LEGAL_ENTITY_MERGE, LEGAL_ENTITY_UNMERGE]
        subject_id:          { type: string, format: uuid }
        command_name:        { type: string }
        payload:
          type: object
          additionalProperties: true
          description: The command exactly as proposed, and exactly what runs on approval.
        expected_version:    { type: integer, format: int64 }
        payload_fingerprint:
          type: string
          description: SHA-256 of subject, command, version and payload. Must be presented on /approve.
        reason:                    { type: string }
        requested_by_principal_id: { type: string }
        requested_at:              { type: string, format: date-time }
        expires_at:                { type: string, format: date-time }
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, STALE, EXPIRED]
        decided_by_principal_id:   { type: string, nullable: true }
        decided_at:                { type: string, format: date-time, nullable: true }
        decision_note:             { type: string, nullable: true }
        correlation_id:            { type: string, nullable: true }

    PendingApproval:
      type: object
      properties:
        status: { type: string, enum: [PENDING_APPROVAL] }
        approval_request:
          $ref: "#/components/schemas/ApprovalRequest"

    ApproveRequestBody:
      type: object
      required: [payload_fingerprint]
      properties:
        payload_fingerprint: { type: string }
        note:                { type: string }
        correlation_id:      { type: string }

    RejectRequestBody:
      type: object
      required: [note]
      properties:
        note:           { type: string }
        correlation_id: { type: string }

    ApprovalOutcome:
      type: object
      properties:
        approval_request:
          $ref: "#/components/schemas/ApprovalRequest"
        result:
          description: The released command's result (a TenantCommandResult or LegalEntityProfileVersion), absent where it has none.
          type: object
          additionalProperties: true

    ExecuteTenantCommandRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: |
            Mandatory. §4.2 requires the lifecycle actor and reason as
            evidence, and a history whose reason column is empty answers
            "why is this tenant suspended?" with silence.
        expected_version:
          type: integer
          format: int64
          description: |
            The tenant's record_version as the caller last saw it. Omitting it
            is accepted and does NOT skip the guard: the service substitutes
            the version it reads, turning its own read-then-write into a
            compare-and-swap. Supplying it gives the stronger guarantee that
            nothing moved since the CALLER read.
        approved_by_principal_id:
          type: string
          deprecated: true
          description: |
            REFUSED (422) since migration 000007. The maker used to name their
            own approver here, which made every maker-checker control
            satisfiable by one person. The approver is now the verified caller
            of POST /v1/approval-requests/{id}/approve.
        correlation_id: { type: string }

    TenantCommandResult:
      type: object
      properties:
        from_state:     { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        to_state:       { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        record_version: { type: integer, format: int64 }
        status:         { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }

    ChangeDefaultLocaleRequest:
      type: object
      required: [reason]
      properties:
        primary_locale:   { type: string }
        primary_timezone: { type: string }
        reason:           { type: string }
        expected_version: { type: integer, format: int64 }
        correlation_id:   { type: string }

    TenantDefaults:
      type: object
      properties:
        tenant_id:             { type: string, format: uuid }
        default_currency_code: { type: string }
        primary_timezone:      { type: string }
        primary_locale:        { type: string }
        default_data_residency_policy_id: { type: string, format: uuid }
        record_version:        { type: integer, format: int64 }

    TenantLifecycleEvent:
      type: object
      properties:
        lifecycle_event_id: { type: string, format: uuid }
        tenant_id:          { type: string, format: uuid }
        from_state:         { type: string, nullable: true }
        to_state:           { type: string }
        command_name:
          type: string
          description: |
            The ORG-02 named command that caused the transition. Stored rather
            than inferred from the state pair: SuspendTenant followed by
            ResumeTenant is otherwise indistinguishable from the correction of
            a mistaken suspension.
          enum: [CreateTenant, ActivateTenant, SuspendTenant, ResumeTenant, InitiateTermination, CompleteTermination, ChangeDefaultLocale, RetryProvisioning, AbandonProvisioning]
        reason:                   { type: string }
        actor_principal_id:       { type: string }
        approved_by_principal_id: { type: string, nullable: true }
        approval_request_id:      { type: string, format: uuid, nullable: true }
        correlation_id:           { type: string, nullable: true }
        occurred_at:              { type: string, format: date-time }
        onboarding_request_ref:
          type: string
          nullable: true
          description: The onboarding request this tenant was provisioned under (§4.2 evidence lineage).
        external_customer_key:
          type: string
          nullable: true
          description: The external customer key the tenant was provisioned under (§4.2 evidence lineage).

    TenantHostBinding:
      type: object
      properties:
        host_binding_id:          { type: string, format: uuid }
        hostname:                 { type: string }
        tenant_id:                { type: string, format: uuid }
        is_primary:               { type: boolean }
        active_flag:              { type: boolean }
        created_at:               { type: string, format: date-time }
        created_by_principal_id:  { type: string }

    BindTenantHostRequest:
      type: object
      required: [hostname]
      properties:
        hostname:
          type: string
          description: Lowercased on write; case is not meaningful in a hostname.
        is_primary:     { type: boolean }
        correlation_id: { type: string }

    ResolvedTenantByHost:
      type: object
      description: |
        Carries the tenant's status and lifecycle state alongside its id,
        because the caller is an ingress layer deciding whether to admit a
        request — handing it only an id would force a second round trip to
        learn the tenant is suspended.
      properties:
        hostname:        { type: string }
        tenant_id:       { type: string, format: uuid }
        tenant_code:     { type: string }
        status:          { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        lifecycle_state: { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDING, TERMINATED] }
        is_primary:      { type: boolean }

    # ── ORG-03 §4.3: bitemporal profile versions ─────────────────────────────

    LegalEntityProfileVersion:
      type: object
      description: |
        One effective-dated version of an entity's legal profile.

        effective_from/effective_to are BUSINESS time — when the fact was true
        in the world. recorded_at is RECORD time — when this platform learned
        it. The two differ whenever a change is backdated, which is exactly
        the case §9.2 requires as-of retrieval to be verified against.

        superseded_at marks a version replaced by a later one. The row is never
        rewritten or deleted: §8 NP6 requires history to resolve the ORIGINAL
        version, which is impossible if a correction overwrites what it
        corrects.
      properties:
        profile_version_id: { type: string, format: uuid }
        tenant_id:          { type: string, format: uuid }
        legal_entity_id:    { type: string, format: uuid }
        version_number:     { type: integer }
        legal_name:         { type: string }
        trading_name:       { type: string, nullable: true }
        legal_form_code:    { type: string, nullable: true }
        legal_form_source:  { type: string, nullable: true }
        legal_form_local_text: { type: string, nullable: true }
        registration_number:   { type: string, nullable: true }
        registry_authority:    { type: string, nullable: true }
        registered_office:     { type: string, nullable: true, description: Opaque structured JSON; ORG-08 owns address normalization. }
        incorporation_jurisdiction_id: { type: string, nullable: true }
        default_currency_code: { type: string, nullable: true }
        effective_from:  { type: string, format: date-time }
        effective_to:    { type: string, format: date-time, nullable: true }
        recorded_at:     { type: string, format: date-time }
        superseded_at:   { type: string, format: date-time, nullable: true }
        change_reason:
          type: string
          enum: [INITIAL, INITIAL_BACKFILL, LEGAL_NAME_CHANGE, REGISTERED_OFFICE_CHANGE, AMENDMENT, CORRECTION]
          description: |
            CORRECTION and AMENDMENT are not interchangeable: a correction
            means the prior version was WRONG, so reports already issued
            against it were misstated. INITIAL and INITIAL_BACKFILL are
            service-assigned and refused if a caller supplies them.
        source_evidence_ref:      { type: string, nullable: true }
        created_by_principal_id:  { type: string }
        approved_by_principal_id: { type: string, nullable: true }
        approval_request_id:      { type: string, format: uuid, nullable: true }
        lei:
          type: string
          nullable: true
          description: ISO 17442 LEI (20 chars, MOD 97-10). An external identifier, never the internal key.
        lei_source:      { type: string, nullable: true, description: "Where the LEI came from, e.g. GLEIF. Required with an LEI." }
        lei_status:
          type: string
          nullable: true
          enum: [ISSUED, LAPSED, PENDING_TRANSFER, PENDING_ARCHIVAL, MERGED, RETIRED, ANNULLED, DUPLICATE, TRANSFERRED, CANCELLED]
        lei_verified_at: { type: string, format: date-time, nullable: true }

    AmendLegalProfileRequest:
      type: object
      description: |
        Every profile field is optional. An omitted field is CARRIED FORWARD
        from the version in force at effective_from — which is what makes this
        an amendment rather than a replacement.
      properties:
        legal_name:            { type: string }
        trading_name:          { type: string }
        legal_form_code:       { type: string }
        legal_form_source:     { type: string }
        legal_form_local_text: { type: string }
        registration_number:   { type: string }
        registry_authority:    { type: string }
        registered_office:     { type: string }
        incorporation_jurisdiction_id: { type: string }
        default_currency_code: { type: string }
        effective_from:
          type: string
          format: date-time
          description: Business time. May be in the past. Defaults to now.
        change_reason:
          type: string
          enum: [LEGAL_NAME_CHANGE, REGISTERED_OFFICE_CHANGE, AMENDMENT, CORRECTION]
        source_evidence_ref:      { type: string }
        lei:
          type: string
          description: ISO 17442 LEI (20 chars, MOD 97-10). An external identifier, never the internal key.
        lei_source:      { type: string, description: "Where the LEI came from, e.g. GLEIF. Required with an LEI." }
        lei_status:
          type: string
          enum: [ISSUED, LAPSED, PENDING_TRANSFER, PENDING_ARCHIVAL, MERGED, RETIRED, ANNULLED, DUPLICATE, TRANSFERRED, CANCELLED]
        lei_verified_at: { type: string, format: date-time }
        approved_by_principal_id:
          type: string
          deprecated: true
          description: |
            REFUSED (422) since migration 000007. The maker used to name their
            own approver here, which made every maker-checker control
            satisfiable by one person. The approver is now the verified caller
            of POST /v1/approval-requests/{id}/approve.
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    ChangeLegalNameRequest:
      type: object
      required: [legal_name]
      properties:
        legal_name:               { type: string }
        effective_from:           { type: string, format: date-time }
        source_evidence_ref:      { type: string }
        approved_by_principal_id:
          type: string
          deprecated: true
          description: |
            REFUSED (422) since migration 000007. The maker used to name their
            own approver here, which made every maker-checker control
            satisfiable by one person. The approver is now the verified caller
            of POST /v1/approval-requests/{id}/approve.
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    ChangeRegisteredOfficeRequest:
      type: object
      required: [registered_office]
      properties:
        registered_office:        { type: string }
        effective_from:           { type: string, format: date-time }
        source_evidence_ref:      { type: string }
        approved_by_principal_id:
          type: string
          deprecated: true
          description: |
            REFUSED (422) since migration 000007. The maker used to name their
            own approver here, which made every maker-checker control
            satisfiable by one person. The approver is now the verified caller
            of POST /v1/approval-requests/{id}/approve.
        expected_version:         { type: integer, format: int64 }
        correlation_id:           { type: string }

    EntityAsOf:
      type: object
      description: |
        The entity's unchanging identifiers paired with the profile version in
        force at the requested instant. Both are returned because a caller
        reconstructing a historical report needs both: the entity carries
        identifiers that do not change, the profile carries the facts that do.
      properties:
        legal_entity_id: { type: string, format: uuid }
        tenant_id:       { type: string, format: uuid }
        entity_code:     { type: string }
        entity_type:     { type: string }
        entity_status:   { type: string }
        as_of:           { type: string, format: date-time }
        profile:
          allOf:
            - $ref: "#/components/schemas/LegalEntityProfileVersion"
          nullable: true

    # ── ORG-03 §8 NP5: registry conflict quarantine ──────────────────────────

    EntityRegistryConflict:
      type: object
      properties:
        conflict_id:         { type: string, format: uuid }
        tenant_id:           { type: string, format: uuid }
        registration_number: { type: string }
        jurisdiction_id:     { type: string, format: uuid }
        existing_legal_entity_id: { type: string, format: uuid }
        attempted_payload:
          type: object
          additionalProperties: true
          description: |
            The rejected claim, kept whole. There is no row to point at,
            because the point is that it was not written.
        status:
          type: string
          enum: [OPEN, RESOLVED_DISTINCT, RESOLVED_DUPLICATE, DISMISSED]
          description: |
            RESOLVED_DISTINCT means a human confirmed the two are genuinely
            different entities sharing a registry number, which happens across
            registry authorities within one jurisdiction. RESOLVED_DUPLICATE
            records the opposite conclusion; it does not itself merge anything.
        resolution_note:          { type: string, nullable: true }
        resolved_by_principal_id: { type: string, nullable: true }
        approved_by_principal_id:
          type: string
          nullable: true
          description: The independent approver — never the resolver, never the detected-by principal.
        approval_request_id:      { type: string, format: uuid, nullable: true }
        resolved_at:              { type: string, format: date-time, nullable: true }
        detected_at:              { type: string, format: date-time }
        detected_by_principal_id: { type: string }
        correlation_id:           { type: string, nullable: true }

    ResolveRegistryConflictRequest:
      type: object
      required: [status, resolution_note]
      properties:
        status:
          type: string
          enum: [RESOLVED_DISTINCT, RESOLVED_DUPLICATE, DISMISSED]
        resolution_note:
          type: string
          description: Mandatory — a resolution nobody can audit is not one.
        correlation_id: { type: string }

    # ── Workspaces ───────────────────────────────────────────────────────────

    Workspace:
      type: object
      properties:
        workspace_id:    { type: string, format: uuid }
        tenant_id:       { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid, nullable: true }
        name:            { type: string }
        business_unit:   { type: string, nullable: true }
        billing_classification:
          type: string
          enum: [COMMERCIAL_STANDALONE, COMMERCIAL_ZOIKO_ONE, LEGACY_MIGRATION, PILOT_NON_BILLABLE, INTERNAL, DEMO, SANDBOX, QA_AUTOMATION]
        billing_source:  { type: string, enum: [NONE, DIRECT, ZOIKO_ONE_BUNDLE] }
        commercial_account_id: { type: string, format: uuid, nullable: true }
        status:          { type: string, enum: [ACTIVE, ARCHIVED] }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }
        created_by_principal_id: { type: string }
        updated_by_principal_id: { type: string }

    CreateWorkspaceRequest:
      type: object
      required: [tenant_id, name, billing_classification]
      properties:
        tenant_id:       { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        name:            { type: string }
        business_unit:   { type: string }
        billing_classification: { type: string }
        billing_source:  { type: string }
        commercial_account_id:  { type: string, format: uuid }
        correlation_id:  { type: string }

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:            { type: string }
        business_unit:   { type: string }
        billing_classification: { type: string }
        billing_source:  { type: string }
        commercial_account_id:  { type: string, format: uuid }
        correlation_id:  { type: string }

    TransitionWorkspaceStatusRequest:
      type: object
      required: [new_status]
      properties:
        new_status:     { type: string, enum: [ACTIVE, ARCHIVED] }
        correlation_id: { type: string }

  responses:
    BadRequest:
      description: Invalid request body or missing required fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authorization denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Upstream service (AuthZ or Jurisdiction Rules) unreachable — request rejected fail-closed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
