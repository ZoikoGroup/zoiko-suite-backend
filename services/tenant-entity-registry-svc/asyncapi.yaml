asyncapi: "2.6.0"

info:
  title: Tenant & Entity Registry Service — Event Contract
  version: "1.0.0"
  description: |
    The events tenant-entity-registry-svc publishes, and the ORG-02 / ORG-03
    spec events each one satisfies.

    ORG §9.2's first Definition-of-Done gate requires the AsyncAPI contract to
    pass compatibility gates. Before this file existed there was no machine
    contract for this service's events at all: a consumer learned the event
    names by reading internal/events/publisher.go.

    ## Spec names are not wire names

    The specification names events in PascalCase — TenantActivated,
    LegalEntityProfileAmended. Those are SPEC names. This estate's wire
    convention is lower.dotted, already established by `tenant.created` and
    `entity.status.changed` before this work, and consumers subscribe to the
    wire name.

    Every message below records both, in `x-spec-event`. The mapping is
    asserted against the Go constants by internal/events/contract_test.go, so
    the two cannot drift silently — which is the failure this file exists to
    make impossible, not merely unlikely.

    ## Delivery

    Every event is written to the `event_outbox` table inside the SAME
    transaction as the fact it attests, and delivered by a relay. Delivery is
    therefore AT-LEAST-ONCE: every consumer must dedupe on `event_id`.

    Until 28 Sep 2026 the pre-existing write paths (entity create/update/status,
    workspaces, hierarchies, jurisdiction assignments) published directly to
    Kafka after commit. That path lost an event on any crash between commit and
    publish and, because it ran on the request context, most events outright.
    It has been removed; there is no direct path.

    ## Versions (ORG §7)

    Every envelope carries `object_id`, `object_version`, `effective_at` and
    `recorded_at`. `object_version` is the aggregate version the write left
    behind — the value `GET` returns as `record_version` — so a consumer can pin
    exactly the version it was told about. Schema version 1.1.

defaultContentType: application/json

servers:
  local:
    url: localhost:9092
    protocol: kafka
    description: Local development broker (deployments/docker-compose.yml).

channels:
  zoiko.entity.events:
    description: |
      Every event this service publishes, on one topic.

      The message KEY is the aggregate id — the tenant id for tenant events,
      the legal entity id for entity events. Kafka guarantees ordering only
      within a partition, so keying by aggregate is what stops a consumer
      seeing an entity's profile amendment before its creation.
    subscribe:
      summary: Consume tenant and legal-entity domain events.
      operationId: consumeRegistryEvents
      message:
        oneOf:
          # ── ORG-02 §4.2 ──────────────────────────────────────────────────
          - $ref: "#/components/messages/TenantCreated"
          - $ref: "#/components/messages/TenantActivated"
          - $ref: "#/components/messages/TenantSuspended"
          - $ref: "#/components/messages/TenantResumed"
          - $ref: "#/components/messages/TenantTerminationInitiated"
          - $ref: "#/components/messages/TenantTerminated"
          - $ref: "#/components/messages/TenantDefaultsChanged"
          - $ref: "#/components/messages/TenantHomeRegionChanged"
          # ── ORG-03 §4.3 ──────────────────────────────────────────────────
          - $ref: "#/components/messages/LegalEntityCreated"
          - $ref: "#/components/messages/LegalEntityUpdated"
          - $ref: "#/components/messages/LegalEntityProfileAmended"
          - $ref: "#/components/messages/LegalEntityNameChanged"
          - $ref: "#/components/messages/RegisteredOfficeChanged"
          - $ref: "#/components/messages/LegalEntityStatusChanged"
          # ── Structure ────────────────────────────────────────────────────
          - $ref: "#/components/messages/EntityHierarchyChanged"
          - $ref: "#/components/messages/EntityJurisdictionChanged"
          # ── ORG-04 §4.4 ──────────────────────────────────────────────────
          - $ref: "#/components/messages/OwnershipRelationshipProposed"
          - $ref: "#/components/messages/OwnershipRelationshipActivated"
          - $ref: "#/components/messages/OwnershipRelationshipSuperseded"
          - $ref: "#/components/messages/OwnershipRelationshipEnded"
          - $ref: "#/components/messages/OwnershipRelationshipRejected"
          - $ref: "#/components/messages/ControlRelationshipChanged"
          # ── ORG-07 / MDM-01 parties ───────────────────────────────────────
          - $ref: "#/components/messages/PartyCreated"
          - $ref: "#/components/messages/PartyProfileAmended"
          - $ref: "#/components/messages/PartyFactPublished"
          - $ref: "#/components/messages/PartyRoleAdded"
          - $ref: "#/components/messages/PartyRoleRemoved"
          - $ref: "#/components/messages/PartyIdentifierLinked"
          - $ref: "#/components/messages/PartyIdentifierVerified"
          - $ref: "#/components/messages/MasterConflictOpened"
          - $ref: "#/components/messages/PartiesMerged"
          - $ref: "#/components/messages/PartySplit"
          - $ref: "#/components/messages/MasterConflictResolved"
          # ── ORG-08 addresses ─────────────────────────────────────────────
          - $ref: "#/components/messages/AddressCreated"
          - $ref: "#/components/messages/AddressVerified"
          - $ref: "#/components/messages/AddressSuperseded"
          - $ref: "#/components/messages/AddressLinked"
          # ── ORG-08 establishments ────────────────────────────────────────
          - $ref: "#/components/messages/EstablishmentCreated"
          - $ref: "#/components/messages/EstablishmentActivated"
          - $ref: "#/components/messages/EstablishmentDeactivated"
          - $ref: "#/components/messages/EstablishmentClosed"
          # ── ORG-09 registrations ─────────────────────────────────────────
          - $ref: "#/components/messages/RegistrationCreated"
          - $ref: "#/components/messages/RegistrationVerified"
          - $ref: "#/components/messages/RegistrationRenewed"
          - $ref: "#/components/messages/RegistrationSuspended"
          - $ref: "#/components/messages/RegistrationExpiring"
          - $ref: "#/components/messages/RegistrationExpired"
          - $ref: "#/components/messages/RegistrationRevoked"
          - $ref: "#/components/messages/RegistrationSuperseded"
          # ── REF-03 exchange rates ─────────────────────────────────────────
          - $ref: "#/components/messages/FXRateObserved"
          - $ref: "#/components/messages/FXRateApproved"
          - $ref: "#/components/messages/FXRateSetClosed"
          - $ref: "#/components/messages/FXRateSetSuperseded"
          - $ref: "#/components/messages/FXRateSuperseded"
          # ── REF-06 accounting books ───────────────────────────────────────
          - $ref: "#/components/messages/AccountingBookCreated"
          - $ref: "#/components/messages/AccountingBookActivated"
          - $ref: "#/components/messages/AccountingBookBasisChanged"
          - $ref: "#/components/messages/AccountingBookPostingSuspended"
          - $ref: "#/components/messages/AccountingBookRetired"
          # ── REF-08 financial dimensions ───────────────────────────────────
          - $ref: "#/components/messages/DimensionTypeCreated"
          - $ref: "#/components/messages/DimensionValueCreated"
          - $ref: "#/components/messages/DimensionValueActivated"
          - $ref: "#/components/messages/DimensionValueDeactivated"
          - $ref: "#/components/messages/DimensionHierarchyProposed"
          - $ref: "#/components/messages/DimensionHierarchyChanged"
          - $ref: "#/components/messages/DimensionSourceMapped"
          # ── REF-09 units of measure ───────────────────────────────────────
          - $ref: "#/components/messages/QuantityDimensionCreated"
          - $ref: "#/components/messages/UnitCreated"
          - $ref: "#/components/messages/UnitConversionProposed"
          - $ref: "#/components/messages/UnitConversionActivated"
          - $ref: "#/components/messages/UnitConversionSuperseded"
          - $ref: "#/components/messages/UnitRetired"
          # ── MDM-04 reference releases ─────────────────────────────────────
          - $ref: "#/components/messages/ReferenceSetCreated"
          - $ref: "#/components/messages/ReferenceReleaseStaged"
          - $ref: "#/components/messages/ReferenceReleasePublished"
          # ── ORG-9 master imports ──────────────────────────────────────────
          - $ref: "#/components/messages/MasterImportUploaded"
          - $ref: "#/components/messages/MasterImportValidated"
          - $ref: "#/components/messages/MasterImportApproved"
          - $ref: "#/components/messages/MasterImportCompleted"
          - $ref: "#/components/messages/MasterImportCancelled"
          # ── §8 NP5 ───────────────────────────────────────────────────────
          - $ref: "#/components/messages/RegistryConflictQuarantined"
          - $ref: "#/components/messages/RegistryConflictResolved"
          # ── Workspaces ───────────────────────────────────────────────────
          - $ref: "#/components/messages/WorkspaceCreated"
          - $ref: "#/components/messages/WorkspaceUpdated"
          - $ref: "#/components/messages/WorkspaceStatusChanged"

components:
  messages:
    TenantCreated:
      name: tenant.created
      title: A tenant was provisioned
      x-spec-event: TenantCreated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    TenantActivated:
      name: tenant.activated
      title: ActivateTenant moved a tenant from ONBOARDING to ACTIVE
      x-spec-event: TenantActivated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    TenantSuspended:
      name: tenant.suspended
      title: SuspendTenant moved a tenant out of ACTIVE
      description: |
        A consumer receiving this must stop accepting protected writes for the
        tenant. The registry itself refuses them (§8 NP4), but a consumer
        holding its own copy of tenant state will not.
      x-spec-event: TenantSuspended
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    TenantResumed:
      name: tenant.resumed
      title: ResumeTenant returned a suspended tenant to ACTIVE
      description: |
        No spec name — ORG-02 §4.2 names ResumeTenant as a command but lists no
        corresponding event. Published anyway: a consumer told about the
        suspension and never about its reversal would hold the tenant closed
        indefinitely.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    TenantTerminationInitiated:
      name: tenant.termination.initiated
      title: InitiateTermination moved a tenant to OFFBOARDING
      x-spec-event: TenantTerminationInitiated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    TenantTerminated:
      name: tenant.terminated
      title: CompleteTermination moved a tenant to TERMINATED
      description: |
        Terminal. §4.2 requires that termination preserve governed retained
        records, so this is not a signal to delete the tenant's data.
      x-spec-event: TenantTerminated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    TenantDefaultsChanged:
      name: tenant.defaults.changed
      title: ChangeDefaultLocale changed baseline tenancy configuration
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    TenantHomeRegionChanged:
      name: tenant.home_region.changed
      title: An approved ChangeHomeRegion re-pointed the tenant's home region
      description: |
        No spec name — §4.2 requires maker-checker on home-region changes but
        lists no event. Published because every consumer that routes data by
        region must learn of the move. Payload carries from_region_id,
        to_region_id and the home_region_decision_ref.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    LegalEntityCreated:
      name: entity.created
      title: A legal entity was created
      x-spec-event: LegalEntityCreated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    LegalEntityUpdated:
      name: entity.updated
      title: A legal entity's non-governed fields were patched
      description: |
        The pre-ORG in-place update path. A change to legal name, registry
        identity or jurisdiction produces entity.profile.amended (or one of its
        narrowings) instead, because those are effective-dated.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    LegalEntityProfileAmended:
      name: entity.profile.amended
      title: A new effective-dated profile version was created
      description: |
        Carries `effective_from`, which may be in the PAST. A consumer must not
        assume this event means "the entity's identity changed now" — a
        backdated amendment corrects a closed period and leaves the entity's
        present-day identity untouched.
      x-spec-event: LegalEntityProfileAmended
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    LegalEntityNameChanged:
      name: entity.legal_name.changed
      title: ChangeLegalName created a profile version
      description: |
        A narrowing of entity.profile.amended, published instead of it when the
        change_reason is LEGAL_NAME_CHANGE, so a consumer can react to a rename
        specifically rather than to any amendment.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegisteredOfficeChanged:
      name: entity.registered_office.changed
      title: ChangeRegisteredOffice created a profile version
      x-spec-event: RegisteredOfficeChanged
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    LegalEntityStatusChanged:
      name: entity.status.changed
      title: An entity moved through its status state machine
      x-spec-event: LegalEntityStatusChanged
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    EntityHierarchyChanged:
      name: entity.hierarchy.changed
      title: A parent/child relationship was created or end-dated
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    EntityJurisdictionChanged:
      name: entity.jurisdiction.changed
      title: A jurisdiction assignment was created or end-dated
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    # ── ORG-04 §4.4 ────────────────────────────────────────────────────────
    #
    # Every ORG-04 payload carries: tenant_id, relationship_id,
    # parent_legal_entity_id, child_legal_entity_id, relationship_kind
    # (OWNERSHIP | CONTROL), ownership_pct, voting_pct, control_type, status,
    # change_type (PROPOSED | ACTIVATED | SUPERSEDED | ENDED | REJECTED),
    # valid_from, valid_to and, where they apply, supersedes_relationship_id
    # and replaced_by_relationship_id. Beneficial notes are NEVER in an event.
    # The envelope's object_id is the relationship id and its entity is the CHILD.
    # A CONTROL relationship's activation, supersession and end are all
    # control.relationship.changed; an OWNERSHIP relationship's have their own names.

    # ── ORG-07 / MDM-01 parties ─────────────────────────────────────────────
    # No party event carries a name, an identifier value or evidence text: a natural person's name is personal data
    # and an identifier may be sensitive, and an event reaches every subscriber. A consumer reads the value through
    # the permissioned API.
    PartyCreated:
      name: party.created
      title: A new party was created
      description: |
        Emitted once, in the create transaction. A create that matched an existing party or opened a stewardship
        case emits no party.created. Consumers create references and projections only, never a second master.
      x-spec-event: PartyCreated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    PartyProfileAmended:
      name: party.profile.amended
      title: A fact about a party was recorded
      description: |
        One per proposed fact, whether it was verified or held PROPOSED. `quality_state` says which.
      x-spec-event: PartyProfileAmended
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    PartyFactPublished:
      name: party.fact.published
      title: A fact about a party became VERIFIED
      description: |
        Consumers decide prospective adoption; historical artifacts are untouched. Carries fact_type,
        valid_from/valid_to, source_class and quality_state.
      x-spec-event: party_fact_published
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    PartyRoleAdded:
      name: party.role.added
      title: A party was given a role
      x-spec-event: PartyRoleAdded
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    PartyRoleRemoved:
      name: party.role.removed
      title: A party's role was ended
      description: The spec names no event for removing a role. `effective_at` is the end date.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    PartyIdentifierLinked:
      name: party.identifier.linked
      title: An external identifier was linked to a party
      description: Carries the scheme, scope and verification status, never the value.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    MasterConflictOpened:
      name: master.conflict.opened
      title: A stewardship case was opened
      description: |
        An ambiguous create, an identifier claimed by two parties, or a fact that contradicts a verified one.
        Carries conflict_type, the case id and the candidate party ids. No consumer receives a conflicted fact as
        VERIFIED.
      x-spec-event: master_conflict_opened
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    PartiesMerged:
      name: party.merged
      title: Parties were merged; the survivor keeps its id and the others resolve to it
      description: |
        Emitted in the merge transaction. `survivor_id`, `alias_ids`, `decision_ref` (the stewardship case) and
        `remediation_scope`: the domains that hold references to an alias re-point them prospectively through the
        alias, and never rewrite a historical snapshot. Merged ids are never reused and still resolve.
      x-spec-event: PartiesMerged
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    PartySplit:
      name: party.split
      title: A merge was corrected; the party is distinct again
      description: |
        Carries `restored_party_id`, `survivor_id`, `decision_ref` and `remediation_scope`. The merge stays in the
        lineage; domains re-resolve live references and open their own exceptions.
      x-spec-event: PartySplit
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    MasterConflictResolved:
      name: master.conflict.resolved
      title: A stewardship case was decided
      description: Carries the case id, conflict_type, decision and the party the decision settled on.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    AddressCreated:
      name: address.created
      title: An address was recorded
      description: Carries identifiers, the address type, country and source class, never the address itself.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    AddressVerified:
      name: address.verified
      title: An address version passed a verification observation
      description: |
        Emitted only when a version reaches VERIFIED. It says an observation passed, not that the address is
        a legal registered office or still current. Carries verifier, result and confidence.
      x-spec-event: AddressVerified
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    AddressSuperseded:
      name: address.superseded
      title: An address version was replaced by a newer one
      description: Carries superseded_version_no and the new version's valid_from. Historical versions stay readable.
      x-spec-event: AddressSuperseded
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    AddressLinked:
      name: address.linked
      title: An address was linked to a party
      description: Carries party_id, link_id, link_type and valid_from.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    EstablishmentCreated:
      name: establishment.created
      title: An establishment was proposed
      description: Carries identifiers, type, address id and status, never the name or the address.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    EstablishmentActivated:
      name: establishment.activated
      title: An establishment became ACTIVE
      description: |
        A recorded presence fact, not a tax or registration conclusion; those are decided by their own domains.
        `effective_date` is the date it took effect, which can precede the time it was recorded.
      x-spec-event: EstablishmentActivated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    EstablishmentDeactivated:
      name: establishment.deactivated
      title: An establishment became INACTIVE
      description: The spec names no event for deactivation. It can be activated again.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    EstablishmentClosed:
      name: establishment.closed
      title: An establishment was closed
      description: Final. `effective_date` is the end of the presence; history stays readable.
      x-spec-event: EstablishmentClosed
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistrationCreated:
      name: registration.created
      title: A registration or licence was recorded, unverified
      description: Carries identifiers, type, jurisdiction, holder and dates, never the number.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistrationVerified:
      name: registration.verified
      title: A registration became ACTIVE on evidence
      description: |
        Records what an authority was shown to say; it concludes nothing about tax or legal sufficiency. Never carries the number.
      x-spec-event: RegistrationVerified
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistrationRenewed:
      name: registration.renewed
      title: A registration was renewed to a later expiry date
      description: Carries the new `expiry_date`. An expired registration renewed is ACTIVE again (`to_status`).
      x-spec-event: RegistrationRenewed
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistrationSuspended:
      name: registration.suspended
      title: A registration was suspended
      description: The spec names no event for suspension.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistrationExpiring:
      name: registration.expiring
      title: An active registration expires soon
      description: |
        From the expiry sweep, once per expiry date, `days_left` days ahead (30 by default). A renewal to a new date
        warns again in its own window.
      x-spec-event: RegistrationExpiring
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistrationExpired:
      name: registration.expired
      title: A registration expired
      description: |
        From the sweep (actor system:expiry-sweep) or ExpireRegistration. `effective_date` is the first day it was no
        longer valid. Consumers should not rely on this alone: reads compute in_force from the dates.
      x-spec-event: RegistrationExpired
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistrationRevoked:
      name: registration.revoked
      title: A registration was revoked
      description: Final.
      x-spec-event: RegistrationRevoked
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistrationSuperseded:
      name: registration.superseded
      title: A registration was replaced by a verified successor
      description: The spec names no event for supersession. The successor's own registration.verified precedes it.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    PartyIdentifierVerified:
      name: party.identifier.verified
      title: An external identifier was verified, or verified by a higher authority
      description: |
        Published only when an observation passed the acceptance rules (`effect` VERIFIED or SOURCE_UPGRADED). Carries the
        scheme, scope, source class and reference, source version, observation id and observed_at, never the value.
        A dispute by a higher authority is published as master.conflict.opened instead.
      x-spec-event: identifier_verified
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    FXRateObserved:
      name: fx.rate.observed
      title: An exchange-rate observation was recorded
      description: |
        Carries the pair, rate type, rate (an exact decimal string), market date, source, status and outlier/manual flags,
        and the reference and hash of the raw payload, never the payload. VALIDATED means it passed its checks; OBSERVED
        means it is manual or outlying and needs independent approval before use.
      x-spec-event: FXRateObserved
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    FXRateApproved:
      name: fx.rate.approved
      title: A rate set was approved
      description: |
        Carries the set, its version, rate type, market date and every member's pair and rate. A superseding set names
        `supersedes_set_id`: a consumer that read the old set re-reads.
      x-spec-event: FXRateApproved
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    FXRateSetClosed:
      name: fx.rate_set.closed
      title: A rate set was certified and is now immutable
      description: A certified set is never edited; a correction is a superseding set.
      x-spec-event: FXRateSetClosed
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    FXRateSetSuperseded:
      name: fx.rate_set.superseded
      title: A rate set was corrected by a superseding set
      description: Carries `superseded_by_set_id`. The old set stays readable as of the time before the correction.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    FXRateSuperseded:
      name: fx.rate.superseded
      title: An exchange-rate observation was superseded
      description: |
        Replaced by another observation (`superseded_by_id`), or dropped by a superseding set (empty). Carries the reason.
        The superseded observation stays readable.
      x-spec-event: FXRateSuperseded
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    AccountingBookCreated:
      name: accounting.book.created
      title: An accounting book was opened as a draft
      description: Carries the book's type, owner, status, basis version, framework and currencies.
      x-spec-event: AccountingBookCreated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    AccountingBookActivated:
      name: accounting.book.activated
      title: An accounting book became ACTIVE and may take postings
      description: |
        Also published when a book whose posting was suspended is activated again. `effective_date` is when it took effect,
        which can precede the time it was recorded.
      x-spec-event: AccountingBookActivated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    AccountingBookBasisChanged:
      name: accounting.book.basis_changed
      title: A book's basis changed from its effective date
      description: |
        Carries the new framework and currencies, the previous ones, and `effective_date`, the day the new basis starts.
        A change is prospective: how earlier periods were booked is unchanged, and the previous basis stays retrievable.
      x-spec-event: BookBasisChanged
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    AccountingBookPostingSuspended:
      name: accounting.book.posting_suspended
      title: Posting to a book was suspended
      description: A posting service must stop posting to this book from `effective_date` until it is activated again.
      x-spec-event: BookPostingSuspended
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    AccountingBookRetired:
      name: accounting.book.retired
      title: An accounting book was retired
      description: Final. No new postings; history, basis versions and report lineage stay retrievable.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    DimensionTypeCreated:
      name: dimension.type.created
      title: A dimension type was defined
      description: Carries the type code, whether it is hierarchical and controlled, and its source domain.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    DimensionValueCreated:
      name: dimension.value.created
      title: A dimension value was created as a draft
      description: Carries the type and value codes, the owning entity when any, the first parent and the label.
      x-spec-event: DimensionValueCreated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    DimensionValueActivated:
      name: dimension.value.activated
      title: A dimension value became ACTIVE and can take postings
      description: "`effective_date` is when it took effect."
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    DimensionValueDeactivated:
      name: dimension.value.deactivated
      title: A dimension value became INACTIVE and rejects new postings
      description: |
        Remains valid for history. `posting_exception_until` is set when an explicit controlled exception keeps new postings
        acceptable until that date; a posting service must honour it and nothing else.
      x-spec-event: DimensionValueDeactivated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    DimensionHierarchyProposed:
      name: dimension.hierarchy.proposed
      title: A hierarchy change of a controlled type awaits independent approval
      description: Nothing is in force yet. Carries the proposed parent and label and the proposer.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    DimensionHierarchyChanged:
      name: dimension.hierarchy.changed
      title: A value's parent or label changes from its effective date
      description: |
        Carries the new and previous parent and label and `effective_date`. A change is prospective: roll-ups for earlier
        dates are unchanged and stay reconstructable. Consumers holding their own copy of the hierarchy apply it from that date.
      x-spec-event: DimensionHierarchyChanged
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    DimensionSourceMapped:
      name: dimension.source.mapped
      title: An operational source object was mapped to a dimension value
      description: Carries the source domain and object, the mapping version, and the previous value when it replaced a mapping.
      x-spec-event: SourceDimensionMapped
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    QuantityDimensionCreated:
      name: unit.dimension.created
      title: A quantity dimension was defined with its base unit
      description: Carries the dimension code and the base unit code.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    UnitCreated:
      name: unit.created
      title: A unit of measure was created
      description: A base unit is ACTIVE at once; any other unit is a DRAFT until a conversion takes effect.
      x-spec-event: UnitCreated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    UnitConversionProposed:
      name: unit.conversion.proposed
      title: A non-standard conversion awaits independent approval
      description: Nothing is in force yet. Carries the exact factor, its source class and reference, and the proposer.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    UnitConversionActivated:
      name: unit.conversion.activated
      title: A conversion version took effect
      description: Carries the version number, the exact factor as a fraction and its validity start. A previous version, when replaced, is named.
      x-spec-event: ConversionRuleActivated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    UnitConversionSuperseded:
      name: unit.conversion.superseded
      title: A conversion version was replaced from a later date
      description: Carries the superseded version with its end date. Results it produced stay reproducible from that version.
      x-spec-event: ConversionRuleSuperseded
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    UnitRetired:
      name: unit.retired
      title: A unit was retired and rejects new use
      description: Carries the retirement date and reason. History is kept.
      x-spec-event: UnitRetired
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    ReferenceSetCreated:
      name: reference.set.created
      title: A governed reference set was defined
      description: Carries the set code, its source authority and whether it takes user-assigned codes.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    ReferenceReleaseStaged:
      name: reference.release.staged
      title: A reference release awaits independent publication
      description: Nothing is in force yet. Carries the release version, effective date, compatibility and the count of changes by type.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    ReferenceReleasePublished:
      name: reference.release.published
      title: A reference release was published and governs from its effective date
      description: |
        Carries `reference_set_id`, `release_version`, `effective_from` and `compatibility`, which tells a consumer whether it
        may adopt the release automatically, must migrate, or must preserve the old version for historical processing. The
        changed codes are read from the registry at the release.
      x-spec-event: reference_release_published
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    MasterImportUploaded:
      name: master_import.uploaded
      title: A master import file was uploaded and awaits validation
      description: Carries the import id, source name and version, the content hash, the row count and the uploader. Never a row.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    MasterImportValidated:
      name: master_import.validated
      title: A master import was validated and is previewable or blocked
      description: "`status` is PREVIEW_READY, or BLOCKED when any row is invalid; the counts say how many rows are valid and invalid."
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    MasterImportApproved:
      name: master_import.approved
      title: A master import was approved, by someone other than its uploader, and is starting
      description: Carries the approver and the evidence reference.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    MasterImportCompleted:
      name: master_import.completed
      title: A master import ended, reconciled or failed
      description: |
        `status` is COMPLETED when every row received is accounted for exactly once, FAILED when not or when the work could not
        be carried out. Carries the counts and the reconciliation. Outcomes per row are read from the registry.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    MasterImportCancelled:
      name: master_import.cancelled
      title: A master import was cancelled before it started importing
      description: Nothing was created.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    OwnershipRelationshipProposed:
      name: ownership.relationship.proposed
      title: An ownership or control relationship was proposed, awaiting a different principal's approval
      description: |
        Not a change to the group structure: nothing takes effect until approval.
        Emitted for both OWNERSHIP and CONTROL relationships.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    OwnershipRelationshipActivated:
      name: ownership.relationship.activated
      title: An OWNERSHIP relationship was approved and is now part of the group structure
      description: |
        Consolidation and any consumer holding its own copy of the group graph
        must apply it from `effective_at` (the relationship's valid_from). When
        the relationship replaced another, `supersedes_relationship_id` names it.
      x-spec-event: OwnershipRelationshipActivated
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    OwnershipRelationshipSuperseded:
      name: ownership.relationship.superseded
      title: An OWNERSHIP relationship was replaced by new terms
      description: |
        `effective_at` is when the original stops applying, which is when its
        replacement starts; `replaced_by_relationship_id` names the replacement.
        The original stays retrievable, so history before `effective_at` is unchanged.
      x-spec-event: OwnershipRelationshipSuperseded
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    OwnershipRelationshipEnded:
      name: ownership.relationship.ended
      title: An OWNERSHIP relationship was ended
      description: |
        `effective_at` is the end date. `evidence_ref` is the evidence for the end.
        The spec names no event for an end; this is the OWNERSHIP counterpart of
        control.relationship.changed with change_type ENDED.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    OwnershipRelationshipRejected:
      name: ownership.relationship.rejected
      title: A proposed ownership or control relationship was refused
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    ControlRelationshipChanged:
      name: control.relationship.changed
      title: A CONTROL relationship was activated, superseded or ended
      description: |
        The `change_type` says which. A CONTROL relationship carries no equity,
        so ownership_pct is null unless a figure was recorded alongside it.
      x-spec-event: ControlRelationshipChanged
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistryConflictQuarantined:
      name: entity.registry_conflict.quarantined
      title: A duplicate registry-identity claim was refused and quarantined
      description: |
        §8 NP5 requires the quarantine; this event is what makes it actionable.
        A quarantine nobody is told about is one nobody resolves.

        The entity named in the payload as `existing_legal_entity_id` is the
        incumbent. The rejected claim was NOT written and has no id.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    RegistryConflictResolved:
      name: entity.registry_conflict.resolved
      title: A human recorded a conclusion about a quarantined conflict
      description: |
        Records a finding only. RESOLVED_DUPLICATE does not mean anything was
        merged — §1 prohibits destructive merge, so acting on the conclusion is
        a separate governed operation.
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    WorkspaceCreated:
      name: workspace.created
      title: A workspace was created beneath a tenant
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    WorkspaceUpdated:
      name: workspace.updated
      title: A workspace was reclassified or renamed
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

    WorkspaceStatusChanged:
      name: workspace.status.changed
      title: A workspace was archived or restored
      x-spec-event: null
      x-delivery: outbox
      payload:
        $ref: "#/components/schemas/Envelope"

  schemas:
    Envelope:
      type: object
      description: |
        The platform event envelope (Doc 03 §19) plus the ORG §7 minimum
        payload: tenant, object identity and version, business and record time,
        actor, correlation and — for material changes — evidence.
      required: [event_id, event_type, event_version, emitted_at, schema_version, source_service, correlation_id, object_id, object_version, effective_at, recorded_at, payload]
      properties:
        event_id:
          type: string
          description: |
            Prefixed `evt-` followed by a UUID. Delivery is at-least-once, so
            this is the key every consumer must dedupe on. The outbox row keys
            on the bare UUID — the same identity, spelled for two different
            consumers.
        event_type:      { type: string, description: The wire name, e.g. tenant.suspended. }
        event_version:   { type: string }
        emitted_at:      { type: string, format: date-time }
        schema_version:  { type: string }
        source_service:  { type: string, enum: [tenant-entity-registry-svc] }
        tenant_id:       { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        jurisdiction:    { type: string }
        actor_id:
          type: string
          description: |
            The gateway-verified acting principal. Never a value the caller
            supplied — an unverified actor would make the audit trail name
            whoever the caller claimed to be.
        correlation_id:  { type: string }
        object_id:
          type: string
          description: The aggregate this event attests (tenant, entity, workspace, hierarchy, assignment or conflict id).
        object_version:
          type: integer
          minimum: 1
          description: The aggregate's record_version after the write. Consumers persist it to reconstruct outcomes (ORG §3 "Historical use").
        effective_at:
          type: string
          format: date-time
          description: Business time — when the fact takes effect, which for a backdated amendment is in the past.
        recorded_at:
          type: string
          format: date-time
          description: Record time — when this service recorded the fact.
        evidence_ref:
          type: string
          description: Source evidence for a material change (registry extract, onboarding request, approval request). Omitted when not material.
        payload:
          type: object
          additionalProperties: true
          description: Event-specific body; see each message's title.
