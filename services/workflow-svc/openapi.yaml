                assignee_principal_id: {type: string}
      responses:
        '200': {$ref: '#/components/responses/WorkItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/work-items/{work_item_id}/release:
    post:
      tags: [work-items]
      operationId: releaseWorkItem
      parameters: [{$ref: '#/components/parameters/WorkItemID'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CorrelationID'}]
      responses:
        '200': {$ref: '#/components/responses/WorkItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/work-items/{work_item_id}/complete:
    post:
      tags: [work-items]
      operationId: completeWorkItem
      parameters: [{$ref: '#/components/parameters/WorkItemID'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CorrelationID'}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                completion_data:
                  type: object
      responses:
        '200': {$ref: '#/components/responses/WorkItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/work-items/{work_item_id}/reassign:
    post:
      tags: [work-items]
      operationId: reassignWorkItem
      parameters: [{$ref: '#/components/parameters/WorkItemID'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CorrelationID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_assignee_principal_id, reason]
              properties:
                new_assignee_principal_id: {type: string}
                reason: {type: string}
      responses:
        '200': {$ref: '#/components/responses/WorkItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/work-items/{work_item_id}/cancel:
    post:
      tags: [work-items]
      operationId: cancelWorkItem
