      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CorrelationID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_item_ids]
              properties:
                work_item_ids:
                  type: array
                  items: {type: string}
      responses:
        '200':
          description: Bulk completion results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/WorkItem'}
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/WorkItemResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/work-items/{work_item_id}:
    get:
      tags: [work-items]
      operationId: getWorkItem
      parameters: [{$ref: '#/components/parameters/WorkItemID'}]
      responses:
        '200': {$ref: '#/components/responses/WorkItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/work-items/{work_item_id}/claim:
    post:
      tags: [work-items]
