      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CorrelationID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkItem'}
      responses:
        '201': {$ref: '#/components/responses/WorkItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    get:
      tags: [work-items]
      operationId: listWorkItems
      description: Lists work items with filters and cursor paging (API-4).
      parameters:
        - {name: legal_entity_id, in: query, schema: {type: string}}
        - {name: case_id, in: query, schema: {type: string}}
        - {name: workflow_instance_id, in: query, schema: {type: string}}
        - {name: item_type, in: query, schema: {type: string}}
        - {name: queue, in: query, schema: {type: string}}
        - {name: assignee_principal_id, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: mandatory, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/CorrelationID'}
      responses:
        '200':
          description: Work items
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: {$ref: '#/components/schemas/WorkItem'}
                  next_cursor:
                    type: string
                  watermark:
                    type: string
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/work-items/bulk-complete:
    post:
      tags: [work-items]
      operationId: bulkCompleteWorkItems
