openapi: 3.0.3
info:
  title: Workflow Service API
  version: v1
  description: |
    Approval workflow engine with quorum voting, case management, work items,
    audit engagements, and form submissions.
servers:
  - url: /api/v1
paths:
  /v1/workflows:
    get:
      tags: [instances]
      operationId: listWorkflows
      description: List all workflow instances with optional filters. Supports cursor paging (API-4).
      parameters:
        - {name: legal_entity_id, in: query, schema: {type: string}}
        - {name: workflow_type, in: query, schema: {type: string}}
        - {name: workflow_status, in: query, schema: {type: string}}
        - {name: subject_type, in: query, schema: {type: string}}
        - {name: subject_id, in: query, schema: {type: string}}
        - {name: workflow_definition_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/CorrelationID'}
      responses:
        '200':
          description: Workflow instances
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowInstance'}
                  next_cursor:
                    type: string
                  watermark:
                    type: string
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [instances]
      operationId: createWorkflow
      description: |
        Starts a workflow. With `workflow_definition_id` and no `stages`, the instance follows the
        definition's route (including ROLE stages, stage deadlines, expiry and escalation target).
        Every named approver is checked for WORKFLOW_APPROVE; the legal entity must exist in the
        caller's tenant (tenant-entity-registry-svc).
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationID'}
        - {name: X-Legal-Entity-Id, in: header, required: false, description: "When sent, must equal the body's legal_entity_id", schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkflow'}
      responses:
        '201': {$ref: '#/components/responses/WorkflowWithStages'}
        '200': {$ref: '#/components/responses/WorkflowWithStages'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/pending:
    get:
      tags: [instances]
      operationId: listPendingApprovals
      description: Lists workflow instances pending the caller's approval. Supports cursor paging (API-4).
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/CorrelationID'}
      responses:
        '200':
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowInstance'}
                  next_cursor:
                    type: string
                  watermark:
                    type: string
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}:
    get:
      tags: [instances]
      operationId: getWorkflow
      parameters: [{$ref: '#/components/parameters/WorkflowInstanceID'}]
      responses:
        '200': {$ref: '#/components/responses/WorkflowWithStages'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/actions:
    post:
      tags: [lifecycle]
      operationId: submitAction
      description: |
        Approve or reject the current stage. Reject must include rationale.
        Approve may include rationale. WORKFLOW_APPROVE on the specific approver.
      parameters:
        - {$ref: '#/components/parameters/WorkflowInstanceID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationID'}
        - {name: X-Expected-Version, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [APPROVE, REJECT]}
                rationale: {type: string, description: Required for REJECT}
                causation_id: {type: string}
                document_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$', description: Signature workflows only. Must equal the bound document hash}
      responses:
        '200': {$ref: '#/components/responses/Workflow'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/quorum-votes:
    post:
      tags: [lifecycle]
      operationId: submitQuorumVote
      description: Submit a vote on a QUORUM stage. WORKFLOW_APPROVE on the specific approver.
      parameters:
        - {$ref: '#/components/parameters/WorkflowInstanceID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationID'}
        - {name: X-Expected-Version, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [APPROVE, REJECT]}
                rationale: {type: string}
                causation_id: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Workflow'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/escalate:
    post:
      tags: [lifecycle]
      operationId: escalateWorkflow
      description: Escalates the current stage to its configured escalation target. WORKFLOW_ADMINISTER.
      parameters:
        - {$ref: '#/components/parameters/WorkflowInstanceID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationID'}
        - {name: X-Expected-Version, in: header, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Workflow'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/cancel:
    post:
      tags: [lifecycle]
      operationId: cancelWorkflow
      description: Cancels a PENDING or ESCALATED instance. WORKFLOW_ADMINISTER.
      parameters:
        - {$ref: '#/components/parameters/WorkflowInstanceID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationID'}
        - {name: X-Expected-Version, in: header, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Workflow'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/request-changes:
    post:
      tags: [lifecycle]
      operationId: requestChanges
      description: Reopens a REJECTED or PENDING instance for a new review cycle (workflow.reopened). WORKFLOW_ADMINISTER.
      parameters:
        - {$ref: '#/components/parameters/WorkflowInstanceID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationID'}
        - {name: X-Expected-Version, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rationale]
              properties:
                rationale: {type: string}
                causation_id: {type: string}
      responses:
        '200':
          description: Changes requested
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, enum: [changes_requested]}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/invalidate:
    post:
      tags: [lifecycle]
      operationId: invalidateWorkflow
      description: |
        PENDING/APPROVED/ESCALATED → INVALIDATED when the bound subject changes (ZS-STATE-001 §6.1).
        Re-invalidating is an idempotent 200.
      parameters:
        - {$ref: '#/components/parameters/WorkflowInstanceID'}
        - {name: X-Expected-Version, in: header, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: {type: string, description: A ZS-STATE-001 Appendix B code}
                narrative: {type: string}
                evidence_refs: {type: array, items: {type: string}}
                causation_id: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Workflow'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/available-actions:
    get:
      tags: [instances]
      operationId: getAvailableActions
      description: Returns the actions available for the current principal on this workflow (ST-2).
      parameters: [{$ref: '#/components/parameters/WorkflowInstanceID'}]
      responses:
        '200':
          description: Available actions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailableActions'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/transition-history:
    get:
      tags: [instances]
      operationId: getTransitionHistory
      description: Returns the complete transition history for a workflow (ST-3).
      parameters: [{$ref: '#/components/parameters/WorkflowInstanceID'}]
      responses:
        '200':
          description: Transition history
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TransitionHistoryEntry'}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/verify-release:
    post:
      tags: [lifecycle]
      operationId: verifyRelease
      description: Critical Release Rule (ZS-STATE-001 §6.1). 409 with can_release=false when the approval does not cover the current subject. It changes nothing, so If-Match is optional; when sent, a stale version is 412.
      parameters: [{$ref: '#/components/parameters/WorkflowInstanceID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_subject_fingerprint]
              properties:
                expected_subject_version: {type: integer, minimum: 0}
                current_subject_fingerprint: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                current_signatory_decision_id: {type: string, format: uuid, description: Signature workflows only. A fresh policy-svc decision}
      responses:
        '200': {$ref: '#/components/responses/ReleaseVerification'}
        '409': {$ref: '#/components/responses/ReleaseVerification'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/summary:
    get:
      tags: [instances]
      operationId: getInstanceSummary
      description: Returns a summary view of a workflow instance including its stages.
      parameters: [{$ref: '#/components/parameters/WorkflowInstanceID'}]
      responses:
        '200':
          description: Instance summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstanceSummary'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/next-approver:
    get:
      tags: [instances]
      operationId: getNextApprover
      description: Returns the next approver for the current stage of a workflow instance.
      parameters: [{$ref: '#/components/parameters/WorkflowInstanceID'}]
      responses:
        '200':
          description: Next approver
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_instance_id: {type: string}
                  current_stage: {type: integer}
                  stage_type: {type: string}
                  approver_principal_id: {type: string, nullable: true}
                  approver_role: {type: string, nullable: true}
                  required_approvals: {type: integer, nullable: true}
                  quorum_approvers:
                    type: array
                    items: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/evidence:
    get:
      tags: [instances]
      operationId: getApprovalEvidence
      description: Returns the approval evidence (transition log) for a workflow instance.
      parameters: [{$ref: '#/components/parameters/WorkflowInstanceID'}]
      responses:
        '200':
          description: Approval evidence
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/WorkflowTransition'}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflows/{workflow_instance_id}/escalate-to:
    post:
      tags: [lifecycle]
      operationId: escalateToWorkflow
      description: |
        Escalates the current stage to a named target with custom narrative. WORKFLOW_ADMINISTER.
        Per ZS-STATE-001 §4.2; the new target must hold the relevant approval authority.
      parameters:
        - {$ref: '#/components/parameters/WorkflowInstanceID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationID'}
        - {name: X-Expected-Version, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [escalation_target]
              properties:
                escalation_target: {type: string}
                narrative: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Workflow'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions:
    get:
      tags: [definitions]
      operationId: listWorkflowDefinitions
      description: Lists workflow definitions with cursor paging (API-4).
      parameters:
        - {name: workflow_type, in: query, schema: {type: string}}
        - {name: is_active, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/CorrelationID'}
      responses:
        '200':
          description: Workflow definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowDefinition'}
                  next_cursor:
                    type: string
                  watermark:
                    type: string
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [definitions]
      operationId: createWorkflowDefinition
      description: Creates a new versioned workflow definition.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkflowDefinition'}
      responses:
        '201': {$ref: '#/components/responses/WorkflowDefinition'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions/{workflow_definition_id}:
    get:
      tags: [definitions]
      operationId: getWorkflowDefinition
      parameters: [{$ref: '#/components/parameters/WorkflowDefinitionID'}]
      responses:
        '200': {$ref: '#/components/responses/WorkflowDefinition'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions/{workflow_definition_id}/supersede:
    post:
      tags: [definitions]
      operationId: supersedeWorkflowDefinition
      parameters:
        - {$ref: '#/components/parameters/WorkflowDefinitionID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_definition_id]
              properties:
                new_definition_id: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/DefinitionStatus'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions/{workflow_definition_id}/activate:
    post:
      tags: [definitions]
      operationId: activateWorkflowDefinition
      parameters: [{$ref: '#/components/parameters/WorkflowDefinitionID'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionStatus'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions/{workflow_definition_id}/suspend:
    post:
      tags: [definitions]
      operationId: suspendWorkflowDefinition
      parameters: [{$ref: '#/components/parameters/WorkflowDefinitionID'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionStatus'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions/{workflow_definition_id}/retire:
    post:
      tags: [definitions]
      operationId: retireWorkflowDefinition
      parameters: [{$ref: '#/components/parameters/WorkflowDefinitionID'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionStatus'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions/{workflow_definition_id}/validate:
    post:
      tags: [definitions]
      operationId: validateDefinition
      description: Transitions DRAFT → VALIDATION_PENDING. Validates stage shapes, quorum pool, due hours, escalation target.
      parameters: [{$ref: '#/components/parameters/WorkflowDefinitionID'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionStatus'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions/{workflow_definition_id}/submit-approval:
    post:
      tags: [definitions]
      operationId: submitDefinitionApproval
      description: Transitions VALIDATION_PENDING → APPROVAL_PENDING. Submits the definition for approval.
      parameters: [{$ref: '#/components/parameters/WorkflowDefinitionID'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionStatus'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions/{workflow_definition_id}/approve:
    post:
      tags: [definitions]
      operationId: approveDefinition
      description: Transitions VALIDATED → APPROVAL_PENDING (or APPROVAL_PENDING → PUBLISHED). Maker ≠ checker enforced.
      parameters: [{$ref: '#/components/parameters/WorkflowDefinitionID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: {type: string}
                narrative: {type: string}
      responses:
        '200': {$ref: '#/components/responses/DefinitionStatus'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/workflow-definitions/{workflow_definition_id}/reject:
    post:
      tags: [definitions]
