      responses:
        '200': {$ref: '#/components/responses/WorkItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/work-items/{work_item_id}/escalate:
    post:
      tags: [work-items]
      operationId: escalateWorkItem
      parameters: [{$ref: '#/components/parameters/WorkItemID'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CorrelationID'}]
      responses:
        '200': {$ref: '#/components/responses/WorkItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    identityEnvelope: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, description: Strongly recommended; a retry with the same key and body replays, schema: {type: string}}
    CorrelationID: {name: X-Correlation-ID, in: header, required: true, schema: {type: string}}
    WorkflowInstanceID: {name: workflow_instance_id, in: path, required: true, schema: {type: string, format: uuid}}
    WorkflowDefinitionID: {name: workflow_definition_id, in: path, required: true, schema: {type: string, format: uuid}}
    WorkItemID: {name: work_item_id, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    Decision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action]
            properties:
              action: {type: string, enum: [APPROVE, REJECT]}
              rationale: {type: string, description: Required for REJECT}
              causation_id: {type: string}
              document_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$', description: Signature workflows only. Must equal the bound document hash}
  responses:
    Problem:
      description: RFC 9457 problem document
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Workflow:
      description: The workflow instance
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkflowInstance'}
    WorkflowWithStages:
      description: The workflow instance and its stages
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkflowWithStages'}
    Decision:
      description: The instance after the decision, the decided stage, and the ledger decision id (absent on an idempotent replay)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkflowWithStages'}
    WorkItem:
      description: The work item
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkItem'}
    WorkflowDefinition:
      description: The workflow definition
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkflowDefinition'}
    ReleaseVerification:
      description: Release verification result
      content:
        application/json:
          schema:
            type: object
            properties:
              workflow_instance_id: {type: string}
              can_release: {type: boolean}
              status: {type: string}
              reason: {type: string}
              workflow_status: {type: string}
              subject_fingerprint: {type: string}
    DefinitionStatus:
      description: The definition's new status
      content:
        application/json:
          schema: {type: object, properties: {status: {type: string}}}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { type: string }
        correlation_id: { type: string }
        retryable: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              pointer: { type: string }
              code: { type: string }
              detail: { type: string }
        current_version: { type: integer, format: int64 }
        decision_id: { type: string }
    StageInput:
      type: object
      properties:
        stage_type: {type: string, enum: [SINGLE, QUORUM, ROLE], default: SINGLE}
        approver_principal_id: {type: string, description: SINGLE}
        quorum_approvers: {type: array, items: {type: string}, description: QUORUM}
        required_approvals: {type: integer, minimum: 1, description: QUORUM}
        approver_role: {type: string, description: ROLE}
        due_at_hours: {type: integer, minimum: 1, description: The stage's deadline once it becomes current}
    CreateWorkflow:
      type: object
      required: [tenant_id, legal_entity_id, workflow_type]
      properties:
        tenant_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        workflow_type: {type: string}
        subject_type: {type: string}
        subject_id: {type: string}
        subject_version: {type: integer, minimum: 0}
        subject_fingerprint: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        escalation_target: {type: string}
        workflow_definition_id: {type: string, format: uuid}
        workflow_definition_version: {type: integer}
        stages: {type: array, items: {$ref: '#/components/schemas/StageInput'}, description: Required unless workflow_definition_id supplies the route}
        signatory_decision_id: {type: string, format: uuid, description: A policy-svc SIGNATURE_REQUIRED decision; makes this a signature workflow}
    SignatoryBinding:
      type: object
      properties:
        workflow_instance_id: {type: string}
        tenant_id: {type: string}
        signatory_decision_id: {type: string}
        signatory_policy_version_id: {type: string}
        signatory_rule_id: {type: string}
        document_hash: {type: string}
        requirement: {type: object, additionalProperties: true, description: The SIGNATURE_QUORUM required action as verified}
        bound_at: {type: string, format: date-time}
    WorkflowInstance:
      type: object
      properties:
        workflow_instance_id: {type: string}
        tenant_id: {type: string}
        legal_entity_id: {type: string}
        workflow_type: {type: string}
        workflow_status: {type: string, enum: [PENDING, ESCALATED, APPROVED, REJECTED, CANCELLED, INVALIDATED, EXPIRED]}
        current_stage: {type: integer}
        review_cycle: {type: integer}
        initiated_by: {type: string}
        created_by: {type: string}
        correlation_id: {type: string}
        due_at: {type: string, nullable: true, format: date-time}
        next_action_at: {type: string, nullable: true, format: date-time}
        escalation_target: {type: string, nullable: true}
        escalated_at: {type: string, nullable: true, format: date-time}
        workflow_definition_id: {type: string, nullable: true}
        workflow_definition_version: {type: integer, nullable: true}
        row_version: {type: integer}
      additionalProperties: true
    WorkflowStage:
      type: object
      properties:
        workflow_stage_id: {type: string}
        workflow_instance_id: {type: string}
        stage_order: {type: integer}
        stage_type: {type: string}
        approver_principal_id: {type: string}
        approver_role: {type: string, nullable: true}
        required_approvals: {type: integer, nullable: true}
        stage_status: {type: string}
        due_at: {type: string, nullable: true, format: date-time}
        acted_at: {type: string, nullable: true, format: date-time}
        acted_by: {type: string, nullable: true}
        rationale: {type: string, nullable: true}
      additionalProperties: true
    WorkflowWithStages:
      type: object
      properties:
        instance: {$ref: '#/components/schemas/WorkflowInstance'}
        stages: {type: array, items: {$ref: '#/components/schemas/WorkflowStage'}}
        ledger_decision_id: {type: string, nullable: true}
    WorkflowDefinition:
      type: object
      properties:
        workflow_definition_id: {type: string}
        tenant_id: {type: string}
        workflow_type: {type: string}
        version: {type: integer}
        stages_json: {type: string}
        name: {type: string, nullable: true}
        description: {type: string, nullable: true}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        superseded_by: {type: string, nullable: true}
        is_active: {type: boolean}
        row_version: {type: integer}
        updated_at: {type: string, format: date-time}
        plane: {type: string}
        data_class: {type: string}
        residency_region: {type: string}
        expiry_hours: {type: integer, nullable: true}
        escalation_target: {type: string, nullable: true}
      additionalProperties: true
    WorkflowTransition:
      type: object
      properties:
        workflow_transition_id: {type: string}
        workflow_instance_id: {type: string}
        from_state: {type: string}
        to_state: {type: string}
        acted_by: {type: string}
        rationale: {type: string, nullable: true}
        correlation_id: {type: string, nullable: true}
        causation_id: {type: string, nullable: true}
        stage_order: {type: integer, nullable: true}
        review_cycle: {type: integer, nullable: true}
        workflow_definition_version: {type: integer, nullable: true}
        idempotency_key: {type: string, nullable: true}
        request_hash: {type: string, nullable: true}
        access_decision_id: {type: string, nullable: true}
        authority_basis: {type: string, nullable: true}
        delegation_id: {type: string, nullable: true}
        decision_id: {type: string, nullable: true}
        occurred_at: {type: string, format: date-time}
    AvailableActions:
      type: object
      properties:
        workflow_instance_id: {type: string}
        current_stage: {type: integer}
        current_status: {type: string}
        actions: {type: array, items: {type: string}}
        principal_id: {type: string}
        can_act: {type: boolean}
        reason: {type: string}
    TransitionHistoryEntry:
      type: object
      properties:
        transition_id: {type: string}
        workflow_instance_id: {type: string}
        from_stage: {type: integer}
        to_stage: {type: integer}
        from_status: {type: string}
        to_status: {type: string}
        actor_principal_id: {type: string}
        action_type: {type: string}
        rationale: {type: string}
        decision_id: {type: string, nullable: true}
        quorum: {type: 'object'}
        occurred_at: {type: string, format: date-time}
    InstanceSummary:
      type: object
      properties:
        workflow_instance_id: {type: string}
        workflow_type: {type: string}
        workflow_status: {type: string}
        current_stage: {type: integer}
        initiated_by: {type: string}
        subject_type: {type: string, nullable: true}
        subject_id: {type: string, nullable: true}
        subject_version: {type: integer, nullable: true}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, nullable: true, format: date-time}
        due_at: {type: string, nullable: true, format: date-time}
        next_action_at: {type: string, nullable: true, format: date-time}
        escalation_target: {type: string, nullable: true}
        review_cycle: {type: integer}
        stages_summary:
          type: array
          items: {$ref: '#/components/schemas/StageSummary'}
    StageSummary:
      type: object
      properties:
        stage_order: {type: integer}
        stage_type: {type: string}
        stage_status: {type: string}
        approver_principal_id: {type: string, nullable: true}
        required_approvals: {type: integer, nullable: true}
        quorum_approvers:
          type: array
          items: {type: string}
        acted_at: {type: string, nullable: true, format: date-time}
        acted_by: {type: string, nullable: true}
        rationale: {type: string, nullable: true}
    WorkItem:
      type: object
      properties:
        work_item_id: {type: string}
        tenant_id: {type: string}
        legal_entity_id: {type: string}
        case_id: {type: string, nullable: true}
        workflow_instance_id: {type: string, nullable: true}
        item_type: {type: string}
        queue: {type: string, nullable: true}
        role: {type: string, nullable: true}
        assignee_principal_id: {type: string, nullable: true}
        state: {type: string, enum: [UNASSIGNED, CLAIMED, COMPLETED, CANCELLED]}
        mandatory: {type: boolean}
        completion_schema: {type: object}
        due_at: {type: string, nullable: true, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        row_version: {type: integer}
    CreateWorkflowDefinition:
      type: object
      required: [tenant_id, legal_entity_id, workflow_type]
      properties:
        tenant_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        workflow_type: {type: string}
        subject_type: {type: string}
        subject_id: {type: string}
        subject_version: {type: integer, minimum: 0}
        subject_fingerprint: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        escalation_target: {type: string}
        workflow_definition_id: {type: string, format: uuid}
        workflow_definition_version: {type: integer}
        stages: {type: array, items: {$ref: '#/components/schemas/StageInput'}, description: Required unless workflow_definition_id supplies the route}
        signatory_decision_id: {type: string, format: uuid, description: A policy-svc SIGNATURE_REQUIRED decision; makes this a signature workflow}
    WorkItemResult:
      type: object
      properties:
        work_item_id: {type: string}
        success: {type: boolean}
        error: {type: string, nullable: true}
    CreateWorkItem:
      type: object
      required: [tenant_id, legal_entity_id, item_type]
      properties:
        tenant_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        case_id: {type: string, nullable: true, format: uuid}
        workflow_instance_id: {type: string, nullable: true, format: uuid}
        item_type: {type: string}
        queue: {type: string, nullable: true}
        role: {type: string, nullable: true}
        assignee_principal_id: {type: string, nullable: true}
        mandatory: {type: boolean, nullable: true}
        completion_schema: {type: object, nullable: true}
        due_at: {type: string, nullable: true, format: date-time}
        bulk_safe: {type: boolean, nullable: true}