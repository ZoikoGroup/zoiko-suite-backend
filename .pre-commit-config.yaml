# Security Standard §13: secret scanning in pre-commit (the CI half is
# .github/workflows/secret-scan.yml).
#
# One-time setup per clone:
#   pip install pre-commit && pre-commit install
# Scans only what is staged, so it costs nothing on a clean commit. A
# genuine throwaway (test vector, dev-only key refused in production) is
# allowlisted on its own line with `# gitleaks:allow` and a comment saying why.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
