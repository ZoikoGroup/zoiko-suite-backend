name: Secret scan

# Security Standard §13: secret scanning in pre-commit and CI. The pre-commit
# half is .pre-commit-config.yaml at the repo root; this is the CI half.
#
# Scans only the commits a push or PR introduces, not all of history: a full
# history scan (gitleaks git) currently reports findings in files this job
# should not silently fail every PR over. Those are tracked and cleaned up
# separately; new ones are stopped here. A finding that is a genuine
# throwaway (a published test vector, a dev-only key the service refuses in
# production) is allowlisted on its line with `# gitleaks:allow` and a
# comment saying why — never by widening this job.
#
# Runs the gitleaks CLI in its container rather than gitleaks-action, which
# needs a licence key for organisation repositories.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks — new commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # First push of a branch: no "before" to diff against.
            echo "opts=-1 ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "opts=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            git /repo --no-banner --redact --verbose \
            --log-opts="${{ steps.range.outputs.opts }}"
