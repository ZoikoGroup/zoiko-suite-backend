name: CI

# push on "main" catches direct pushes (rare, but not every change goes
# through a PR — e.g. an emergency hotfix). Feature branches are covered by
# pull_request instead of push: once a PR exists, push+pull_request on the
# same branch would run this entire ~25-service matrix twice for the
# identical commit, doubling compute cost and doubling exposure to any
# transient flake (this already caused a false-negative on PR #58's
# embedded-postgres download step). The concurrency group below is a second
# layer of protection — if anything still fires twice for the same ref, the
# older run is cancelled rather than both racing to completion.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ─── Go services ─────────────────────────────────────────────────────────────
  go-services:
    name: "${{ matrix.service }} — build · vet · test"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false          # show all failures, not just the first
      matrix:
        service:
          - audit-event-store-svc
          - identity-context-svc
          - tenant-entity-registry-svc
          - jurisdiction-rules-svc
          - governance-decision-log-svc
          - policy-svc
          - configuration-feature-flag-svc
          - obligations-svc
          - secret-vault-integration-svc
          - authorization-svc
          # access-control-svc is the governed authoring layer in front of
          # authorization-svc's admin API, and until now CI never built, vetted
          # or tested it at all -- it is wired into compose and Traefik but was
          # absent from this matrix, so nothing checked it on any PR.
          - access-control-svc
          # retention-registry-svc answers "is it safe to delete this yet" for
          # every service that owns deletable data, and an active legal hold
          # overrides every retention policy. It was absent from this matrix, so
          # nothing built or tested it on any PR.
          - retention-registry-svc
          # These four were in compose and in Traefik but absent from this
          # matrix, so nothing had ever built, vetted or tested them on any PR
          # — despite all four being wired to live console pages.
          - spend-controls-svc
          - vendor-due-diligence-svc
          - delegated-authority-svc
          - notification-svc
          - workflow-svc
          - workflow-history-svc
          - gateway-auth-svc
          # connectivity-api-bridge-svc is the connector registry (ZS-SVC-M-001
          # INT-05). It adopted the shared outbox and a Postgres-enforced approval
          # lifecycle, so its store tests need the database service below.
          - connectivity-api-bridge-svc
          - data-ingestion-svc
          # INT-07 banking adapter: the live provider engine, and the callback receiver that owns finality.
          - payment-initiation-adapter-svc
          - payment-status-svc
          # INT-08 tax authority adapter (live authority engine, callbacks, deadline-aware polling).
          - tax-authority-interface-svc
          - schema-registry-svc
          - document-vault-svc
          - evidence-manifest-svc
          - search-client
          # eventing is the shared event envelope + transactional outbox module
          # (ZS-EVENT-001); every producer that adopts it depends on its tests.
          - eventing
          - search-indexer-svc
          - general-ledger-svc
          - accounts-payable-svc
          - accounts-receivable-svc
          - purchase-request-svc
          - purchase-order-svc
          - treasury-svc
          - financial-close-svc
          - bank-reconciliation-svc
          - intercompany-accounting-svc
          - consolidation-svc
          - invoice-approval-svc
          - employee-master-svc
          - employment-contracts-svc
          - payroll-run-svc
          - compensation-svc
          - benefits-svc
          - payroll-tax-svc
          - payroll-exceptions-svc
          - leave-absence-svc
          - org-structure-svc
          - offboarding-severance-svc
          - workforce-compliance-svc
          # ── Phase 5 ────────────────────────────────────
          - contract-lifecycle-svc
          - clause-template-svc
          - obligation-tracking-svc
          - board-resolutions-svc
          - corporate-actions-svc
          - counterparty-management-svc
          - tax-rules-svc
          - tax-determination-svc
          - vat-gst-svc
          - corporate-tax-svc
          - evidence-requirements-svc
          # Suivo public chatbot (R0). Store tests use the database service below.
          - public-ai-svc

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Read the Go version from the service's own go.mod so the matrix
          # is self-describing and we never silently test against the wrong toolchain.
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      # go.sum MUST exist in the repo and be current.
      # If it is missing or stale this step will fail — which is the
      # correct behavior: a missing go.sum means CI was not verifying
      # the module graph integrity.
      - name: Verify module graph (go mod verify)
        working-directory: services/${{ matrix.service }}
        run: go mod verify

      - name: Build
        working-directory: services/${{ matrix.service }}
        run: go build ./...

      - name: Vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

      - name: Test (with race detector)
        working-directory: services/${{ matrix.service }}
        env:
          TEST_DATABASE_URL: ${{ (matrix.service == 'eventing' || matrix.service == 'jurisdiction-rules-svc' || matrix.service == 'identity-context-svc' || matrix.service == 'governance-decision-log-svc' || matrix.service == 'tenant-entity-registry-svc' || matrix.service == 'policy-svc' || matrix.service == 'configuration-feature-flag-svc' || matrix.service == 'obligations-svc' || matrix.service == 'secret-vault-integration-svc' || matrix.service == 'authorization-svc' || matrix.service == 'workflow-svc' || matrix.service == 'schema-registry-svc' || matrix.service == 'document-vault-svc' || matrix.service == 'evidence-manifest-svc' || matrix.service == 'spend-controls-svc' || matrix.service == 'vendor-due-diligence-svc' || matrix.service == 'notification-svc' || matrix.service == 'general-ledger-svc' || matrix.service == 'accounts-payable-svc' || matrix.service == 'accounts-receivable-svc' || matrix.service == 'purchase-request-svc' || matrix.service == 'purchase-order-svc' || matrix.service == 'treasury-svc' || matrix.service == 'financial-close-svc' || matrix.service == 'bank-reconciliation-svc' || matrix.service == 'intercompany-accounting-svc' || matrix.service == 'consolidation-svc' || matrix.service == 'invoice-approval-svc' || matrix.service == 'employee-master-svc' || matrix.service == 'employment-contracts-svc' || matrix.service == 'payroll-run-svc' || matrix.service == 'compensation-svc' || matrix.service == 'benefits-svc' || matrix.service == 'payroll-tax-svc' || matrix.service == 'payroll-exceptions-svc' || matrix.service == 'leave-absence-svc' || matrix.service == 'org-structure-svc' || matrix.service == 'offboarding-severance-svc' || matrix.service == 'workforce-compliance-svc' || matrix.service == 'contract-lifecycle-svc' || matrix.service == 'clause-template-svc' || matrix.service == 'obligation-tracking-svc' || matrix.service == 'board-resolutions-svc' || matrix.service == 'corporate-actions-svc' || matrix.service == 'counterparty-management-svc' || matrix.service == 'tax-rules-svc' || matrix.service == 'tax-determination-svc' || matrix.service == 'vat-gst-svc' || matrix.service == 'corporate-tax-svc' || matrix.service == 'delegated-authority-svc' || matrix.service == 'connectivity-api-bridge-svc' || matrix.service == 'data-ingestion-svc' || matrix.service == 'public-ai-svc') &&'postgres://postgres:secretpassword@localhost:5432/testdb?sslmode=disable' || '' }}

        # go list ./... pre-enumerates packages, excluding the bare module
        # root which has no .go files (verified: this causes "no Go files
        # in root directory" only with `go test -list=...`, not with plain
        # ./... or with -race). Whether ./... alone has any failure mode on
        # the GitHub Actions Ubuntu runner under -race has not been directly
        # observed — this enumeration approach is used regardless because it
        # removes that ambiguity entirely rather than relying on ./...'s
        # implicit skip behavior.
        run: |
          pkgs=$(go list ./... 2>/dev/null | tr '\n' ' ')
          if [ -n "$pkgs" ]; then
            go test -race -v -count=1 -timeout=600s $pkgs
          else
            echo "No packages to test"
          fi

      # Suivo Doc 07 release gates for the public assistant: no test skipped
      # without an allowlisted reason (§10), and the golden set must PASS
      # (P0 failure, flaky P0 or high-risk false permit = BLOCK_RELEASE;
      # unwaived P1 failure = NO_GO). The eval report is the evidence.
      - name: Doc 07 gates (public-ai-svc)
        if: matrix.service == 'public-ai-svc'
        working-directory: services/${{ matrix.service }}
        env:
          TEST_DATABASE_URL: postgres://postgres:secretpassword@localhost:5432/testdb?sslmode=disable
        run: |
          go test -json -count=1 ./... | tee test.json | go run ./cmd/skipcheck -allowlist testdata/skip-allowlist.txt
          # Doc 06 §26, Doc 07 §34: every P0 test ID mapped to Go tests passed.
          go run ./cmd/traceability -csv ../../docs/suivo/sec-t-traceability.csv -json test.json
          # Doc 07 §37: a regression against the approved baseline is NO_GO.
          go run ./cmd/evalrun -repeats 3 -sha "${{ github.sha }}" -baseline testdata/golden/baseline.json -out eval-report.json

      - name: Upload eval report (public-ai-svc)
        if: always() && matrix.service == 'public-ai-svc'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-ai-eval-report
          path: services/public-ai-svc/eval-report.json
          if-no-files-found: ignore

      # Doc 08 App. C operational drills (DR-01..DR-07) on the in-memory
      # store; the report is release evidence (kbctl manifest -drill).
      # cmd/canary needs a running server, so it is not run here.
      - name: Operational drills (public-ai-svc)
        if: matrix.service == 'public-ai-svc'
        working-directory: services/${{ matrix.service }}
        run: go run ./cmd/drill -out drill-report.json

      - name: Upload drill report (public-ai-svc)
        if: always() && matrix.service == 'public-ai-svc'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-ai-drill-report
          path: services/public-ai-svc/drill-report.json
          if-no-files-found: ignore

      # Doc 08 §13: alert rules are validated and unit-tested (burn-rate
      # replays, absent data). promtool comes from a pinned Prometheus
      # release checked against a pinned SHA-256, like Trivy below.
      - name: Install promtool (public-ai-svc)
        if: matrix.service == 'public-ai-svc'
        env:
          PROM_VERSION: "3.15.0"
          PROM_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
        run: |
          cd "$RUNNER_TEMP"
          tarball="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -sSfLO "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${tarball}"
          echo "${PROM_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          sudo install -m 0755 "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: Alert rules check and unit tests (public-ai-svc)
        if: matrix.service == 'public-ai-svc'
        run: |
          promtool check rules deployments/prometheus-rules-public-ai.yml
          promtool check config --syntax-only deployments/prometheus-public-ai.yml
          promtool test rules deployments/prometheus-rules-public-ai.test.yml

      - name: Integration test — health probes with embedded Postgres
        if: matrix.service == 'audit-event-store-svc' || matrix.service == 'workflow-history-svc'
        working-directory: services/${{ matrix.service }}
        # Uses embedded-postgres (downloads real Postgres binaries automatically).
        # No separate Postgres service container is needed.
        # Proves /healthz and /readyz return 200 against a real DB.
        run: go test -v -tags=integration -count=1 -timeout=600s ./cmd/server/

      - name: Integration test — jurisdiction-rules registry suite with embedded Postgres
        if: matrix.service == 'jurisdiction-rules-svc'
        working-directory: services/${{ matrix.service }}
        # ZS-JUR-001: every database guard (append-only evidence, status edges, independence, rollout gates)
        # is proved only here, against a real Postgres. embedded-postgres downloads the binaries, so no
        # service container is needed.
        run: go test -v -tags=integration -count=1 -timeout=900s ./internal/registryit/

      - name: Integration test — store isolation/pipeline (PgStore → DB)
        if: matrix.service == 'access-control-svc' || matrix.service == 'workflow-history-svc' || matrix.service == 'tenant-entity-registry-svc' || matrix.service == 'accounts-receivable-svc' || matrix.service == 'purchase-request-svc' || matrix.service == 'purchase-order-svc' || matrix.service == 'treasury-svc' || matrix.service == 'financial-close-svc' || matrix.service == 'bank-reconciliation-svc' || matrix.service == 'intercompany-accounting-svc' || matrix.service == 'consolidation-svc' || matrix.service == 'invoice-approval-svc' || matrix.service == 'employee-master-svc' || matrix.service == 'employment-contracts-svc' || matrix.service == 'payroll-run-svc' || matrix.service == 'compensation-svc' || matrix.service == 'benefits-svc' || matrix.service == 'payroll-tax-svc' || matrix.service == 'payroll-exceptions-svc' || matrix.service == 'leave-absence-svc' || matrix.service == 'org-structure-svc' || matrix.service == 'offboarding-severance-svc' || matrix.service == 'workforce-compliance-svc' || matrix.service == 'evidence-requirements-svc' || matrix.service == 'payment-initiation-adapter-svc' || matrix.service == 'payment-status-svc' || matrix.service == 'tax-authority-interface-svc'
        working-directory: services/${{ matrix.service }}
        env:
          TEST_DATABASE_URL: "postgres://postgres:secretpassword@localhost:5432/testdb?sslmode=disable"
        run: |
          # Wait for the service container to become ready
          timeout=60
          while ! pg_isready -U postgres -d testdb -h localhost -p 5432 >/dev/null 2>&1; do
            timeout=$((timeout-1))
            if [ $timeout -le 0 ]; then
              echo "Postgres did not become ready in time"
              exit 1
            fi
            sleep 1
          done

          go test -v -tags=integration -count=1 -timeout=600s ./internal/store/


  # ─── Suivo public assistant: supply chain (Doc 06 §12, §24; Doc 08 §07) ────
  # Reachable dependency and standard-library vulnerabilities fail the build
  # (govulncheck); the module SBOM (CycloneDX) is kept as evidence; the image
  # is scanned and fails on fixable HIGH/CRITICAL findings. Image signing and
  # provenance need a registry and a signing key (not configured yet).
  public-ai-supply-chain:
    name: "public-ai-svc — vulnerabilities · SBOM · image scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/public-ai-svc/go.mod
          cache-dependency-path: services/public-ai-svc/go.sum

      - name: govulncheck
        working-directory: services/public-ai-svc
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # Static analysis (Doc 08 §07): HIGH-severity findings fail the build.
      - name: gosec (HIGH)
        working-directory: services/public-ai-svc
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -severity high -confidence medium -exclude-dir=testdata ./...

      # Dependency licences (Doc 08 §07). Report-only until the allowed
      # licence policy is approved; the report is kept as evidence.
      - name: go-licenses report (report-only)
        working-directory: services/public-ai-svc
        continue-on-error: true
        run: |
          go run github.com/google/go-licenses/v2@v2.0.1 report ./... > licenses.csv
          go run github.com/google/go-licenses/v2@v2.0.1 check ./... --disallowed_types=forbidden,restricted,unknown

      - name: CycloneDX SBOM
        working-directory: services/public-ai-svc
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 app -json -main cmd/server -output sbom.cdx.json

      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t public-ai-svc:ci services/public-ai-svc

      # Trivy is installed from a pinned release and checked against a pinned
      # SHA-256. trivy-action fetches its install script from Trivy's main
      # branch at run time, so a change there broke the scan without any change here.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          cd "$RUNNER_TEMP"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy image scan
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress public-ai-svc:ci

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-ai-sbom
          path: |
            services/public-ai-svc/sbom.cdx.json
            services/public-ai-svc/licenses.csv
          if-no-files-found: ignore

  # ─── INT certification (ZS-SVC-M-001) ────────────────────────────────────────
  # The ledger is checked against the tree on every change (a cited test that is renamed or deleted fails here), and
  # intcert then executes every cited test and publishes the certificate. It reports only while items remain open
  # (PARTIAL, or a deviation nobody accepted); remove --report-only once the ledger has nothing open.
  int-certification:
    name: "INT certification — ledger · cited tests · certificate"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/_certification/go.mod
          cache: false

      - name: Ledger is well formed and every cited test exists
        working-directory: services/_certification
        run: go vet ./... && go test -count=1 ./...

      - name: Run every cited test and write the certificate
        working-directory: services/_certification
        env:
          TEST_DATABASE_URL: "postgres://postgres:secretpassword@localhost:5432/testdb?sslmode=disable"
        run: go run ./cmd/intcert -services .. -out certificate.json --report-only

      - name: Upload certificate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: int-certificate
          path: services/_certification/certificate.json
          if-no-files-found: ignore
